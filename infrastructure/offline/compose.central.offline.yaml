services:
  mqtt:
    image: ${OFFLINE_MQTT_IMAGE:?OFFLINE_MQTT_IMAGE is required}
    pull_policy: never

  postgres:
    image: ${OFFLINE_POSTGRES_IMAGE:?OFFLINE_POSTGRES_IMAGE is required}
    pull_policy: never

  minio:
    image: ${OFFLINE_MINIO_IMAGE:?OFFLINE_MINIO_IMAGE is required}
    pull_policy: never

  minio-init:
    image: ${OFFLINE_MINIO_CLIENT_IMAGE:?OFFLINE_MINIO_CLIENT_IMAGE is required}
    pull_policy: never

  telemetry-migrate:
    image: ${OFFLINE_TELEMETRY_IMAGE:?OFFLINE_TELEMETRY_IMAGE is required}
    pull_policy: never
    build: !reset null

  telemetry-service:
    image: ${OFFLINE_TELEMETRY_IMAGE:?OFFLINE_TELEMETRY_IMAGE is required}
    pull_policy: never
    build: !reset null

  dashboard:
    image: ${OFFLINE_DASHBOARD_IMAGE:?OFFLINE_DASHBOARD_IMAGE is required}
    pull_policy: never
    restart: unless-stopped
    init: true
    ports:
      - "${DASHBOARD_BIND_ADDRESS:-127.0.0.1}:${DASHBOARD_PORT:-3000}:3000"
    depends_on:
      telemetry-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - central
