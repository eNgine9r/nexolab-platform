apiVersion: 1

deleteDatasources:
  - name: NEXOLAB Prometheus
    orgId: 1

datasources:
  - name: NEXOLAB Prometheus
    uid: nexolab-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      manageAlerts: false
      prometheusType: Prometheus
      prometheusVersion: 3.13.0
      timeInterval: 5s
