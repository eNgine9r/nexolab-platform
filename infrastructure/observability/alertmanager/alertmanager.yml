global:
  resolve_timeout: 1m

route:
  receiver: nexolab-local-audit
  group_by:
    - alertname
    - service
    - severity
  group_wait: 5s
  group_interval: 30s
  repeat_interval: 4h

receivers:
  - name: nexolab-local-audit
    webhook_configs:
      - url: http://observability-alert-sink:8080/alerts
        send_resolved: true
        max_alerts: 0

inhibit_rules:
  - source_matchers:
      - alertname="NexolabIngestionQueuePressureCritical"
    target_matchers:
      - alertname="NexolabIngestionQueuePressureWarning"
    equal:
      - service
  - source_matchers:
      - alertname="NexolabIngestionLagCritical"
    target_matchers:
      - alertname="NexolabIngestionLagWarning"
    equal:
      - service
  - source_matchers:
      - alertname="NexolabPersistenceFailuresSustained"
    target_matchers:
      - alertname="NexolabPersistenceFailures"
    equal:
      - service
  - source_matchers:
      - alertname="NexolabVerifiedBackupStaleCritical"
    target_matchers:
      - alertname="NexolabVerifiedBackupStaleWarning"
    equal:
      - service
