# NEXOLAB external HTTPS gateway — STAGING TEMPLATE ONLY
#
# IMPORTANT: Does NOT expose NEXOLAB by itself. Bind to localhost and keep
# Tailscale Funnel DISABLED until staged acceptance and explicit operator approval.
# This gateway deliberately FAILS CLOSED if oauth2-proxy is unavailable.
# NEXT_PUBLIC_NEXOLAB_API_BASE_URL and NEXT_PUBLIC_NEXOLAB_WEBSOCKET_URL must
# be rebuilt for the EXACT HTTPS host before serving this candidate.
#
# The template is rendered only after replacing EXAMPLE host and trusted origins
# with approved values. Never share the MQTT/S3/Device Agent/admin ports.
worker_processes 1;
pid /tmp/nexolab-external-https-stage-nginx.pid;
error_log stderr warn;

events { worker_connections 512; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    access_log off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        # No external listener, no firewall changes, no WAN forwarding.
        listen 127.0.0.1:18790;
        server_name nexolab-edge-01.example.ts.net;
        client_max_body_size 8m;
        if ($host != "nexolab-edge-01.example.ts.net") { return 421; }

        # OAuth2 Proxy must be configured for named users + MFA at the IdP.
        # Failure to connect to the identity service yields 5xx, NOT a bypass.
        location = /_nexolab_external_auth {
            internal;
            proxy_pass http://127.0.0.1:4180/oauth2/auth;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Host $host;
            proxy_set_header Cookie $http_cookie;
        }

        # Login and OIDC callback only; do NOT treat the callback as application
        # authorization. Every application/API route independently uses auth_request.
        location ^~ /oauth2/ {
            proxy_pass http://127.0.0.1:4180;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            add_header Cache-Control "no-store" always;
        }

        # REST API and authenticated WebSocket MUST use the same HTTPS host.
        # Never proxy /api/v1/ requests to Next.js; it is owned by Telemetry API.
        location ^~ /api/v1/ {
            auth_request /_nexolab_external_auth;
            proxy_pass http://127.0.0.1:8082;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 150s;
            proxy_send_timeout 150s;
            proxy_buffering off;
            add_header Cache-Control "no-store, private" always;
        }

        # Next.js server-side routes, including /api/device-agent/*, MUST retain
        # their own JWT+RBAC checks; front-door MFA alone is insufficient.
        location / {
            auth_request /_nexolab_external_auth;
            error_page 401 = @nexolab_sign_in;
            proxy_pass http://127.0.0.1:3100;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 150s;
        }

        location @nexolab_sign_in {
            return 302 /oauth2/start?rd=$request_uri;
        }
    }
}
