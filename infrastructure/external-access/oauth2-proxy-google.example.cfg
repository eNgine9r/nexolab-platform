# NEXOLAB Google OAuth2 Proxy — INERT STAGING TEMPLATE
#
# This template MUST NOT be started until:
# - a dedicated Tailscale HTTPS hostname actually exists and is approved;
# - a Google OAuth WEB client has the EXACT HTTPS /oauth2/callback URI;
# - client ID/secret and cookie secret are placed in an operator secrets store;
# - allowed-emails.txt exists OUTSIDE Git and contains exactly the approved user;
# - Google Account 2-Step Verification/passkey and explicit final owner approval are verified;
# - the external NEXOLAB JWT/RBAC, WebSocket and image tests all pass.
#
# No actual Google client credentials, email or session secret are included.
# In the isolated systemd design, LoadCredential reads the root-only secrets
# and launch-google-oauth.py provides --client-secret-file and
# --cookie-secret-file from a private ephemeral runtime directory.
# Do NOT pass OAuth secrets in process arguments or environment variables.
# The actual approved single-user allowlist path is provided via systemd
# --authenticated-emails-file override from a private LoadCredential file.
# OAuth2 Proxy validates Google identity; it does NOT independently enforce
# that a Google account recently performed MFA. This is a release hard gate.
provider = "google"
http_address = "127.0.0.1:4180"
redirect_url = "https://nexolab-edge-01.tail7f9b04.ts.net/oauth2/callback"
upstreams = ["static://202"]

reverse_proxy = true
trusted_proxy_ips = ["127.0.0.1/32"]
real_client_ip_header = "X-Real-IP"
# HTTPS is terminated at the dedicated Tailscale origin.
# OAuth2 Proxy accepts only loopback HTTP requests from NGINX and must not
# force its own TLS listener. HTTPS redirect URL and Secure cookies remain.
force_https = false

# MUST be exactly one email on the on-device private allowlist.
authenticated_emails_file = "/etc/nexolab-external/allowed-emails.txt"
# No email_domains='*'; DO NOT authorize an entire Gmail domain.
# No trusted_ips or skip_auth_routes or skip_jwt_bearer_tokens.

scope = "openid email profile"
skip_provider_button = true
cookie_name = "__Host-nexolab_gateway"
cookie_path = "/"
cookie_secure = true
cookie_httponly = true
cookie_samesite = "lax"
cookie_expire = "2h"
cookie_refresh = "15m"
ssl_insecure_skip_verify = false
skip_auth_preflight = false
pass_access_token = false
pass_authorization_header = false
pass_user_headers = false
set_xauthrequest = false
api_routes = ["^/api/"]

# Avoid potentially sensitive query/cookie/IP logging in the initial stage;
# access control incidents are recorded separately via authenticated IdP
# and NEXOLAB audit logs. Configure bounded privacy-safe audit before go-live.
request_logging = false
auth_logging = false
