services:
  restore-migrate:
    image: ${DR_TELEMETRY_IMAGE:-nexolab-telemetry-service:disaster-recovery-browser}
    build:
      context: ../../services/telemetry-service
    restart: "no"
    environment:
      DATABASE_URL: postgresql+psycopg://${DR_POSTGRES_USER:-nexolab}:${DR_POSTGRES_PASSWORD:?DR_POSTGRES_PASSWORD is required}@restore-postgres:5432/${DR_POSTGRES_DB:-nexolab}
      MQTT_ENABLED: "false"
      BROKER_CONTROL_ENABLED: "false"
      OBJECT_STORAGE_BACKEND: disabled
      RETENTION_ENABLED: "false"
    command: ["alembic", "upgrade", "head"]
    depends_on:
      restore-postgres:
        condition: service_healthy
    networks: [dr]

  restore-telemetry-service:
    environment:
      MQTT_ENABLED: "false"
      MQTT_AUTH_REQUIRED: "false"
      MQTT_TLS_REQUIRED: "false"
      BROKER_CONTROL_ENABLED: "false"
      AUTH_MODE: disabled
      AUTH_DEFAULT_ORGANIZATION_ID: ${DR_BROWSER_ORGANIZATION_ID:-00000000-0000-0000-0000-000000000099}
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:${DR_BROWSER_FRONTEND_PORT:-3114}
      OBJECT_STORAGE_BACKEND: s3
      OBJECT_STORAGE_BUCKET: nexolab-equipment-images
      OBJECT_STORAGE_ENDPOINT_URL: http://restore-minio:9000
      OBJECT_STORAGE_PUBLIC_ENDPOINT_URL: http://127.0.0.1:${DR_BROWSER_MINIO_PORT:-9014}
      OBJECT_STORAGE_REGION: us-east-1
      OBJECT_STORAGE_ACCESS_KEY_ID: ${DR_MINIO_ROOT_USER:?DR_MINIO_ROOT_USER is required}
      OBJECT_STORAGE_SECRET_ACCESS_KEY: ${DR_MINIO_ROOT_PASSWORD:?DR_MINIO_ROOT_PASSWORD is required}
      OBJECT_STORAGE_FORCE_PATH_STYLE: "true"
      RETENTION_ENABLED: "false"
    ports:
      - "127.0.0.1:${DR_BROWSER_API_PORT:-8098}:8082"
    depends_on:
      restore-postgres:
        condition: service_healthy
      restore-minio:
        condition: service_healthy

  restore-minio:
    ports:
      - "127.0.0.1:${DR_BROWSER_MINIO_PORT:-9014}:9000"
