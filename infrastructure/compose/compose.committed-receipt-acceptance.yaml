# #1762 slice 3: isolated committed-receipt end-to-end acceptance.
# Overlay for compose.broker-control-acceptance.yaml. Disposable CI fixture
# only: synthetic identities, runtime-generated throwaway secrets, simulator
# acquisition (no Modbus, no serial, no hardware). Never a site deployment.
services:
  mqtt:
    volumes:
      # Generated by scripts/run-committed-receipt-acceptance.sh from the
      # production broker config with a deliberately tiny max_queued_messages.
      - ${RECEIPT_E2E_MOSQUITTO_CONFIG:?RECEIPT_E2E_MOSQUITTO_CONFIG is required}:/mosquitto/config/mosquitto.conf:ro

  telemetry-service:
    environment:
      NEXOLAB_COMMITTED_RECEIPTS: enabled
      NEXOLAB_RECEIPT_PUBLISHER_USERNAME: ${RECEIPT_E2E_PUBLISHER_USERNAME:?RECEIPT_E2E_PUBLISHER_USERNAME is required}
      NEXOLAB_RECEIPT_PUBLISHER_CLIENT_ID: ${RECEIPT_E2E_PUBLISHER_USERNAME:?RECEIPT_E2E_PUBLISHER_USERNAME is required}
      NEXOLAB_RECEIPT_PUBLISHER_PASSWORD_FILE: /run/secrets/nexolab/receipt-publisher-password

  device-agent:
    image: ${RECEIPT_E2E_DEVICE_AGENT_IMAGE:-nexolab-device-agent:committed-receipt-acceptance}
    build:
      context: ../../services/device-agent
    restart: unless-stopped
    init: true
    environment:
      NEXOLAB_NODE_ID: edge-01
      NEXOLAB_ORGANIZATION_ID: ${BROKER_CONTROL_ORGANIZATION_A:-00000000-0000-0000-0000-000000000001}
      NEXOLAB_DEVICE_AGENT_VERSION: committed-receipt-acceptance
      DEVICE_MODE: simulator
      MQTT_HOST: mqtt
      MQTT_PORT: "1883"
      MQTT_AUTH_REQUIRED: "true"
      MQTT_USERNAME: node:${BROKER_CONTROL_ORGANIZATION_A:-00000000-0000-0000-0000-000000000001}:edge-01
      MQTT_CLIENT_ID: nexolab-${BROKER_CONTROL_ORGANIZATION_A:-00000000-0000-0000-0000-000000000001}-edge-01
      MQTT_PASSWORD_FILE: /run/secrets/nexolab/edge-01-password
      SAMPLE_INTERVAL_SECONDS: ${RECEIPT_E2E_SAMPLE_INTERVAL_SECONDS:-0.5}
      NODE_HEALTH_INTERVAL_SECONDS: "5"
      DATABASE_PATH: /var/lib/nexolab/edge.db
      HEALTH_PORT: "8081"
      LOG_LEVEL: INFO
      DEVICE_AGENT_COMMITTED_RECEIPTS: enabled
      DEVICE_AGENT_RECEIPT_MQTT_USERNAME: receipts:${BROKER_CONTROL_ORGANIZATION_A:-00000000-0000-0000-0000-000000000001}:edge-01
      DEVICE_AGENT_RECEIPT_MQTT_PASSWORD_FILE: /run/secrets/nexolab/edge-01-receipt-password
      DEVICE_AGENT_RECEIPT_PUBLISHER_USERNAME: ${RECEIPT_E2E_PUBLISHER_USERNAME:?RECEIPT_E2E_PUBLISHER_USERNAME is required}
      DEVICE_AGENT_RECEIPT_BROKER_ACL: broker-enforced
      DEVICE_AGENT_RECEIPT_REPLAY_AFTER_SECONDS: ${RECEIPT_E2E_REPLAY_AFTER_SECONDS:-5}
    volumes:
      - receipt-edge:/var/lib/nexolab
      - ${BROKER_CONTROL_SECRETS_DIR:?BROKER_CONTROL_SECRETS_DIR is required}:/run/secrets/nexolab:ro
    depends_on:
      mqtt:
        condition: service_healthy
      telemetry-service:
        condition: service_healthy
    networks:
      - broker-control

volumes:
  receipt-edge:
    name: ${RECEIPT_E2E_EDGE_VOLUME:-nexolab-committed-receipt-acceptance-edge}
