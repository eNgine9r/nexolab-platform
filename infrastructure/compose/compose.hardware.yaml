services:
  device-agent:
    environment:
      DEVICE_MODE: ${HARDWARE_DEVICE_MODE:-xjp60d}
      SERIAL_DEVICE: /dev/rs485
      SERIAL_BAUDRATE: 9600
      SERIAL_PARITY: N
      SERIAL_STOPBITS: 1
      SERIAL_TIMEOUT_SECONDS: ${SERIAL_TIMEOUT_SECONDS:-0.30}
      SERIAL_RETRIES: ${SERIAL_RETRIES:-1}
      # Poll all six inputs of every catalogued KK2 (101-114) and KK1
      # (126-138) controller. XJP60D_POLL_POINTS remains an explicit escape
      # hatch for commissioning, while legacy XJP60D_POINTS no longer limits
      # production discovery to the two originally profiled probes.
      XJP60D_POINTS: ${XJP60D_POLL_POINTS:-101:1,101:2,101:3,101:4,101:5,101:6,102:1,102:2,102:3,102:4,102:5,102:6,103:1,103:2,103:3,103:4,103:5,103:6,104:1,104:2,104:3,104:4,104:5,104:6,105:1,105:2,105:3,105:4,105:5,105:6,106:1,106:2,106:3,106:4,106:5,106:6,107:1,107:2,107:3,107:4,107:5,107:6,108:1,108:2,108:3,108:4,108:5,108:6,109:1,109:2,109:3,109:4,109:5,109:6,110:1,110:2,110:3,110:4,110:5,110:6,111:1,111:2,111:3,111:4,111:5,111:6,112:1,112:2,112:3,112:4,112:5,112:6,113:1,113:2,113:3,113:4,113:5,113:6,114:1,114:2,114:3,114:4,114:5,114:6,126:1,126:2,126:3,126:4,126:5,126:6,127:1,127:2,127:3,127:4,127:5,127:6,128:1,128:2,128:3,128:4,128:5,128:6,129:1,129:2,129:3,129:4,129:5,129:6,130:1,130:2,130:3,130:4,130:5,130:6,131:1,131:2,131:3,131:4,131:5,131:6,132:1,132:2,132:3,132:4,132:5,132:6,133:1,133:2,133:3,133:4,133:5,133:6,134:1,134:2,134:3,134:4,134:5,134:6,135:1,135:2,135:3,135:4,135:5,135:6,136:1,136:2,136:3,136:4,136:5,136:6,137:1,137:2,137:3,137:4,137:5,137:6,138:1,138:2,138:3,138:4,138:5,138:6}
      XJP60D_SCALE: ${XJP60D_SCALE:-0.1}
      LE01MP_UNIT_IDS: ${LE01MP_UNIT_IDS:-200,201,202,203}
    devices:
      - "${RS485_HOST_DEVICE:?Set RS485_HOST_DEVICE to the stable /dev/serial/by-id path}:/dev/rs485"
    group_add:
      - "${RS485_GROUP_GID:-20}"
