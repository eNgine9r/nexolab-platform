services:
  nexolab-mcp:
    image: nexolab-mcp:local
    pull_policy: never
    build:
      context: ..
      dockerfile: Dockerfile
    network_mode: host
    env_file:
      - ${NEXOLAB_MCP_ENV_FILE:-/etc/nexolab/nexolab-mcp.env}
    volumes:
      - ${NEXOLAB_MCP_BACKEND_PASSWORD_HOST_FILE:-/etc/nexolab/nexolab-mcp-backend-password}:/run/secrets/nexolab-mcp-backend-password:ro
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 256m
