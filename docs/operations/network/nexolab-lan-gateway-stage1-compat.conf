# WP2c Stage 1 drop-in (interim, #1734): /etc/systemd/system/nexolab-lan-gateway.service.d/10-stage1-compat.conf
# Upstreams on the compatibility address until WP2c phase 3 moves the backend to loopback.
# Remove this file (and daemon-reload, restart) at phase 3; the unit then uses loopback upstreams.
[Service]
Environment=NEXOLAB_LAN_GATEWAY_ALLOW_COMPAT=172.18.48.66
Environment=NEXOLAB_LAN_GATEWAY_API=http://172.18.48.66:8082/
Environment=NEXOLAB_LAN_GATEWAY_DASHBOARD=http://172.18.48.66:3000/
