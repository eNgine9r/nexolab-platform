name: Device Agent Fleet Acceptance

on:
  push:
    branches: [main]
    paths:
      - "services/device-agent/**"
      - "services/telemetry-service/**"
      - "infrastructure/mqtt/dynamic-security/**"
      - "infrastructure/compose/compose.broker-control-acceptance.yaml"
      - "infrastructure/compose/compose.device-agent-fleet-acceptance.yaml"
      - "scripts/run-device-agent-fleet-acceptance.sh"
      - "e2e/device-agent-fleet.production.e2e.ts"
      - "playwright.device-agent-fleet.config.ts"
      - ".github/workflows/device-agent-fleet-acceptance.yml"
  pull_request:
    branches: [main]
    paths:
      - "services/device-agent/**"
      - "services/telemetry-service/**"
      - "infrastructure/mqtt/dynamic-security/**"
      - "infrastructure/compose/compose.broker-control-acceptance.yaml"
      - "infrastructure/compose/compose.device-agent-fleet-acceptance.yaml"
      - "scripts/run-device-agent-fleet-acceptance.sh"
      - "e2e/device-agent-fleet.production.e2e.ts"
      - "playwright.device-agent-fleet.config.ts"
      - ".github/workflows/device-agent-fleet-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: device-agent-fleet-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    name: Two secure agents outage rotation and browser gate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Format secure edge runbook
        if: github.event_name == 'pull_request'
        run: |
          npx prettier --write docs/operations/device-agent-secure-bootstrap.md
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/operations/device-agent-secure-bootstrap.md
            git commit -m "docs: format secure Device Agent runbook"
            git push origin "HEAD:${{ github.head_ref }}"
          fi

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Validate acceptance contracts
        env:
          POSTGRES_PASSWORD: preflight-postgres
          NEXOLAB_MQTT_ADMIN_USERNAME: preflight-admin
          BROKER_CONTROL_JWT_SECRET: preflight-jwt-secret-with-at-least-thirty-two-bytes
          BROKER_CONTROL_JWT_ISSUER: https://auth.nexolab.local/preflight
          BROKER_CONTROL_JWT_AUDIENCE: nexolab-preflight
          BROKER_CONTROL_SECRETS_DIR: /tmp/nexolab-preflight-secrets
        run: |
          bash -n scripts/run-device-agent-fleet-acceptance.sh
          docker compose \
            -f infrastructure/compose/compose.broker-control-acceptance.yaml \
            -f infrastructure/compose/compose.device-agent-fleet-acceptance.yaml \
            config --quiet

      - name: Run secure Device Agent fleet acceptance
        run: bash scripts/run-device-agent-fleet-acceptance.sh

      - name: Upload fleet evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-agent-fleet-acceptance-evidence
          path: |
            test-results-device-agent-fleet
            playwright-report-device-agent-fleet
          if-no-files-found: warn
          retention-days: 14
