name: Use runtime dashboard credentials

on:
  push:
    branches: [feat/authenticated-live-dashboard]

permissions:
  contents: write

concurrency:
  group: use-runtime-dashboard-credentials
  cancel-in-progress: false

jobs:
  apply:
    if: "${{ !contains(github.event.head_commit.message, 'fix: use runtime dashboard credentials') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/authenticated-live-dashboard

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Apply migration
        run: python .github/scripts/use-runtime-dashboard-credentials.py

      - name: Remove temporary automation
        run: |
          rm .github/scripts/use-runtime-dashboard-credentials.py
          rm .github/workflows/use-runtime-dashboard-credentials.yml

      - name: Install dependencies
        env:
          HUSKY: 0
        run: npm install --no-audit

      - name: Format
        run: npm run format

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: use runtime dashboard credentials"
          git push origin HEAD:feat/authenticated-live-dashboard
