name: Issue 484 Lint Helper

on:
  push:
    branches:
      - fix/484-energy-history-warm-route-cache

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: fix/484-energy-history-warm-route-cache
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install dependencies
        env:
          HUSKY: "0"
        run: npm install --no-audit

      - name: Move retained-state setters out of effect body
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/hooks/use-energy-telemetry.ts")
          text = path.read_text()
          old = '''      historySamplesRef.current = retainedSamples;
              setActiveHistoryKey(historyKey);
              setHistoryWindow(requestedWindow);
              setHistorySamples(retainedSamples);
              setHistoryStatus("ready");
              setHistoryError(null);
          '''
          new = '''      historySamplesRef.current = retainedSamples;
              void Promise.resolve().then(() => {
                if (disposed) return;
                setActiveHistoryKey(historyKey);
                setHistoryWindow(requestedWindow);
                setHistorySamples(retainedSamples);
                setHistoryStatus("ready");
                setHistoryError(null);
              });
          '''
          if old not in text:
              raise SystemExit("Expected retained setter block was not found")
          path.write_text(text.replace(old, new, 1))
          PY

          npx prettier --write src/hooks/use-energy-telemetry.ts
          npm run lint -- --no-cache

      - name: Commit focused lint correction
        run: |
          if git diff --quiet -- src/hooks/use-energy-telemetry.ts; then
            echo "No patch required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/hooks/use-energy-telemetry.ts
          git commit -m "fix: defer retained Energy state commit"
          git push origin HEAD:fix/484-energy-history-warm-route-cache
