name: Issue 484 Lint Helper

on:
  push:
    branches:
      - fix/484-energy-history-warm-route-cache

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: fix/484-energy-history-warm-route-cache
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install dependencies
        env:
          HUSKY: "0"
        run: npm install --no-audit

      - name: Move retained-state setters out of effect body
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("src/hooks/use-energy-telemetry.ts")
          text = path.read_text()
          pattern = re.compile(
              r'(?P<indent>\s*)historySamplesRef\.current = retainedSamples;\n'
              r'(?P=indent)setActiveHistoryKey\(historyKey\);\n'
              r'(?P=indent)setHistoryWindow\(requestedWindow\);\n'
              r'(?P=indent)setHistorySamples\(retainedSamples\);\n'
              r'(?P=indent)setHistoryStatus\("ready"\);\n'
              r'(?P=indent)setHistoryError\(null\);'
          )

          def replacement(match):
              indent = match.group("indent")
              inner = indent + "  "
              return (
                  f"{indent}historySamplesRef.current = retainedSamples;\n"
                  f"{indent}void Promise.resolve().then(() => {{\n"
                  f"{inner}if (disposed) return;\n"
                  f"{inner}setActiveHistoryKey(historyKey);\n"
                  f"{inner}setHistoryWindow(requestedWindow);\n"
                  f"{inner}setHistorySamples(retainedSamples);\n"
                  f"{inner}setHistoryStatus(\"ready\");\n"
                  f"{inner}setHistoryError(null);\n"
                  f"{indent}}});"
              )

          updated, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f"Expected one retained setter block, found {count}")
          path.write_text(updated)
          PY

          npx prettier --write src/hooks/use-energy-telemetry.ts
          npm run lint -- --no-cache

      - name: Commit focused lint correction
        run: |
          if git diff --quiet -- src/hooks/use-energy-telemetry.ts; then
            echo "No patch required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/hooks/use-energy-telemetry.ts
          git commit -m "fix: defer retained Energy state commit"
          git push origin HEAD:fix/484-energy-history-warm-route-cache
