name: Patch DR Failure Line

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/patch-dr-failure-line.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m7-disaster-recovery-gate
          fetch-depth: 0

      - name: Add sanitized failure location evidence
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/run-disaster-recovery-acceptance.sh")
          content = path.read_text(encoding="utf-8")
          old = 'trap cleanup EXIT\n\nfor command in docker python3 git sha256sum stat; do'
          new = '''trap cleanup EXIT

record_failure_line() {
  local status=$?
  printf 'line=%s\\nstatus=%s\\n' "${BASH_LINENO[0]}" "$status" \\
    >"$EVIDENCE_DIR/failure-location.txt"
  return "$status"
}
trap record_failure_line ERR

for command in docker python3 git sha256sum stat; do'''
          if content.count(old) != 1:
              raise SystemExit("Expected failure instrumentation anchor exactly once")
          path.write_text(content.replace(old, new), encoding="utf-8")
          PY

      - name: Validate shell
        run: bash -n scripts/run-disaster-recovery-acceptance.sh

      - name: Commit instrumentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/run-disaster-recovery-acceptance.sh
          git commit -m "test: record sanitized DR failure location"
          git push origin HEAD:feat/m7-disaster-recovery-gate
