name: Rendered Reports Browser Acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/rendered-reports-browser-acceptance.yml"
      - "e2e/rendered-reports.production.e2e.ts"
      - "playwright.rendered-reports.config.ts"
      - "scripts/run-rendered-reports-browser-acceptance.sh"
      - "scripts/run-reports-browser-acceptance.sh"
      - "package.json"
      - "package-lock.json"
      - "src/app/reports/**"
      - "src/components/reports/**"
      - "src/features/security/**"
      - "src/lib/reports/**"
      - "services/telemetry-service/app/reports/**"
      - "services/telemetry-service/app/security/**"
      - "services/telemetry-service/app/main.py"
      - "services/telemetry-service/app/model_registry.py"
      - "services/telemetry-service/migrations/versions/20260726_0012_add_test_reports.py"
      - "services/telemetry-service/migrations/versions/20260726_0013_add_rendered_reports.py"
      - "infrastructure/compose/compose.central.yaml"
      - "infrastructure/compose/compose.browser-acceptance.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rendered-reports-browser-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rendered-reports-browser-acceptance:
    name: Next.js + FastAPI + PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install frontend dependencies
        env:
          HUSKY: 0
        run: npm install --no-audit

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run rendered reports browser acceptance
        run: |
          chmod +x scripts/run-rendered-reports-browser-acceptance.sh
          scripts/run-rendered-reports-browser-acceptance.sh

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rendered-reports-browser-acceptance-evidence
          path: |
            test-results-rendered-reports
            playwright-report-rendered-reports
            test-results-reports
            /tmp/nexolab-reports-acceptance-frontend.log
            /tmp/nexolab-reports-acceptance-services.log
          if-no-files-found: warn
          retention-days: 14
