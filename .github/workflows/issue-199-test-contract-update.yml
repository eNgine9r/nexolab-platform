name: Issue 199 Test Contract Artifact

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/issue-199-test-contract-update.yml
      - src/lib/telemetry/websocket-client.test.ts

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Update legacy WebSocket lifecycle assertions
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/lib/telemetry/websocket-client.test.ts")
          text = path.read_text()

          old_disabled = '''    expect(credentials).not.toHaveBeenCalled();
    expect(sockets[0].send).not.toHaveBeenCalled();
    expect(states.at(-1)).toBe("connected");'''
          new_disabled = '''    expect(credentials).not.toHaveBeenCalled();
    expect(sockets[0].send).not.toHaveBeenCalled();
    expect(states.at(-1)).toBe("connecting");

    sockets[0].message({ type: "heartbeat", server_time: "2026-08-01T12:00:01Z" });
    expect(states.at(-1)).toBe("connected");'''

          old_reconnect = '''    sockets[1].open();
    expect(states.at(-1)).toBe("connected");'''
          new_reconnect = '''    sockets[1].open();
    expect(states.at(-1)).toBe("reconnecting");
    sockets[1].message({ type: "heartbeat", server_time: "2026-08-01T12:00:02Z" });
    expect(states.at(-1)).toBe("connected");'''

          if text.count(old_disabled) != 1:
              raise SystemExit("disabled-auth assertion block not found exactly once")
          if text.count(old_reconnect) != 1:
              raise SystemExit("reconnect assertion block not found exactly once")

          path.write_text(text.replace(old_disabled, new_disabled).replace(old_reconnect, new_reconnect))
          PY
          npx prettier --write src/lib/telemetry/websocket-client.test.ts
      - name: Upload updated test contract
        uses: actions/upload-artifact@v4
        with:
          name: issue-199-test-contract-${{ github.sha }}
          path: src/lib/telemetry/websocket-client.test.ts
          retention-days: 3
