name: Node Health UI Wiring

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/node-health-ui-wiring.yml"

permissions:
  contents: write

jobs:
  wire-ui:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply checked workspace patch
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          path = Path("src/components/nodes/nodes-workspace.tsx")
          content = path.read_text()

          def replace(pattern: str, target: str, label: str, *, flags: int = 0) -> None:
              global content
              content, count = re.subn(pattern, target, content, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f"{label}: expected one structural match, found {count}")

          replace(
              r'import \{ createNodeApiClient, createNodeIdempotencyKey \} from "@/lib/nodes/api-client";\nimport type \{ CentralNode, NodeClockStatus, NodeLifecycleState \} from "@/lib/nodes/types";',
              '''import { createNodeApiClient, createNodeIdempotencyKey } from "@/lib/nodes/api-client";
          import type {
            CentralNode,
            NodeClockStatus,
            NodeLifecycleState,
            NodeOperationalState,
          } from "@/lib/nodes/types";

          import { NodeOperationalPanel } from "./node-operational-panel";''',
              "imports",
          )
          replace(
              r'  const \[nodes, setNodes\] = useState<CentralNode\[\]>\(\[\]\);\n',
              '''  const [nodes, setNodes] = useState<CentralNode[]>([]);
          const [operationalStates, setOperationalStates] = useState<
            Record<string, NodeOperationalState | null>
          >({});
          ''',
              "operational state store",
          )
          replace(
              r'(  const selectedNode = useMemo\(\n.*?\n  \);\n)',
              r'''\1  const selectedOperationalState = selectedNodeId
            ? (operationalStates[selectedNodeId] ?? null)
            : null;
          ''',
              "selected operational state",
              flags=re.DOTALL,
          )
          replace(
              r'''    try \{\n      const result = await createNodeApiClient\(\)\.listNodes\(signal\);\n      setNodes\(result\);''',
              '''    try {
            const client = createNodeApiClient();
            const result = await client.listNodes(signal);
            const operationalEntries = await Promise.all(
              result.map(async (node) => {
                try {
                  const state = await client.getOperationalState(node.node_id, signal);
                  return [node.node_id, state] as const;
                } catch (operationalError) {
                  if (signal?.aborted) throw operationalError;
                  return [node.node_id, null] as const;
                }
              }),
            );
            setNodes(result);
            setOperationalStates(Object.fromEntries(operationalEntries));''',
              "parallel operational load",
          )
          replace(
              r'  const counts = useMemo\(.*?\n  \);\n\n  return \(',
              '''  const counts = useMemo(
            () => ({
              active: nodes.filter((node) => node.state === "active").length,
              attention: nodes.filter((node) => {
                const availability = operationalStates[node.node_id]?.availability;
                return (
                  node.state === "suspended" ||
                  node.clock_status === "warning" ||
                  node.clock_status === "critical" ||
                  availability === "offline" ||
                  availability === "stale"
                );
              }).length,
              total: nodes.length,
            }),
            [nodes, operationalStates],
          );

          return (''',
              "attention KPI",
              flags=re.DOTALL,
          )
          replace(
              r'                  <p className="mt-3 text-\[9px\] text-slate-500">Last seen: \{formatDate\(node\.last_seen_at\)\}</p>',
              '''                  <div className="mt-3 flex items-center justify-between gap-2 text-[9px] text-slate-500">
                    <span>Last seen: {formatDate(node.last_seen_at)}</span>
                    <span
                      className={
                        operationalStates[node.node_id]?.availability === "online"
                          ? "text-emerald-300"
                          : operationalStates[node.node_id]?.availability === "offline"
                            ? "text-red-300"
                            : operationalStates[node.node_id]?.availability === "stale"
                              ? "text-amber-300"
                              : "text-slate-600"
                      }
                      data-testid={`node-row-availability-${node.node_id}`}
                    >
                      {operationalStates[node.node_id]?.availability ?? "unknown"}
                    </span>
                  </div>''',
              "inventory availability",
          )
          replace(
              r'(                  node=\{selectedNode\}\n)',
              r'''\1                  operationalState={selectedOperationalState}
          ''',
              "detail property",
          )
          replace(
              r'function NodeDetail\(\{\n  node,\n',
              '''function NodeDetail({
            node,
            operationalState,
          ''',
              "detail argument",
          )
          replace(
              r'\}: \{\n  node: CentralNode;\n',
              '''}: {
            node: CentralNode;
            operationalState: NodeOperationalState | null;
          ''',
              "detail type",
          )
          replace(
              r'''      <div className="rounded-2xl border border-white/\[0\.06\] bg-white/\[0\.018\] p-4">\n        <p className="text-\[10px\] font-semibold text-slate-200">Owned MQTT namespace</p>\n        <code className="mt-2 block overflow-x-auto text-\[10px\] text-cyan-200">\n          nexolab/v1/\{node\.organization_id\}/\{node\.node_id\}/telemetry\n        </code>\n      </div>''',
              '''      <NodeOperationalPanel state={operationalState} />

            <div className="rounded-2xl border border-white/[0.06] bg-white/[0.018] p-4">
              <p className="text-[10px] font-semibold text-slate-200">Owned MQTT namespaces</p>
              <div className="mt-2 space-y-1 overflow-x-auto font-mono text-[10px] text-cyan-200">
                <p>nexolab/v1/{node.organization_id}/{node.node_id}/telemetry</p>
                <p>nexolab/v1/{node.organization_id}/{node.node_id}/health</p>
                <p>nexolab/v1/{node.organization_id}/{node.node_id}/status</p>
              </div>
            </div>''',
              "operational panel",
          )

          path.write_text(content)
          PY

      - name: Install and verify frontend
        env:
          HUSKY: 0
        run: |
          npm ci --no-audit
          npx prettier --write src/components/nodes/nodes-workspace.tsx src/components/nodes/node-operational-panel.tsx src/lib/nodes/api-client.ts src/lib/nodes/types.ts
          npm run lint
          npm run typecheck
          npm test

      - name: Commit verified UI wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/nodes/nodes-workspace.tsx src/components/nodes/node-operational-panel.tsx src/lib/nodes/api-client.ts src/lib/nodes/types.ts
          git -c core.hooksPath=/dev/null commit -m "feat(nodes): show health and retained status state"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
