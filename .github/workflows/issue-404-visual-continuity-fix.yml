name: Issue 404 visual continuity fix

on:
  push:
    branches:
      - feat/404-saved-live-dashboard-chart-system

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/404-saved-live-dashboard-chart-system
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Add Saved Dashboard live-point regression
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("e2e/live.production.e2e.ts")
          text = path.read_text(encoding="utf-8")

          api_anchor = 'const apiBaseUrl = requiredEnvironment("NEXT_PUBLIC_NEXOLAB_API_BASE_URL");\n'
          if 'const mqttTopic = process.env.MQTT_TOPIC' not in text:
              if api_anchor not in text:
                  raise SystemExit("apiBaseUrl anchor not found")
              text = text.replace(
                  api_anchor,
                  api_anchor + 'const mqttTopic = process.env.MQTT_TOPIC ?? "nexolab/telemetry";\n',
                  1,
              )

          if 'function publishSavedDashboardSample(' not in text:
              seed_anchor = 'function seedNoSampleChannel(): string {'
              if seed_anchor not in text:
                  raise SystemExit("seedNoSampleChannel anchor not found")
              helper = '''function publishSavedDashboardSample(
            dashboardId: string,
            channelId: string,
            value: number,
          ): void {
            const selection = postgres(`
          SELECT metric || '|' || native_unit
          FROM live_dashboard_items
          WHERE dashboard_id = ${sqlString(dashboardId)}
            AND channel_id = ${sqlString(channelId)}
          ORDER BY position
          LIMIT 1;
          `).trim();
            const [metric, unit] = selection.split("|");
            if (!metric || !unit) throw new Error("Saved Dashboard live-point identity was not found");

            const payload = JSON.stringify({
              event_id: randomUUID(),
              node_id: "edge-chart-404",
              captured_at: new Date().toISOString(),
              metric,
              value,
              unit,
              quality: "valid",
              source: "issue-404-visual-continuity-regression",
              equipment_id: "saved-dashboard-e2e",
              channel_id: channelId,
              alarm: null,
              raw_value: Math.round(value * 10),
              raw_status: null,
            });

            execFileSync(
              "docker",
              [
                "compose",
                "--project-name",
                composeProject,
                "--file",
                baseCompose,
                "--file",
                acceptanceCompose,
                "exec",
                "-T",
                "mqtt",
                "mosquitto_pub",
                "-h",
                "127.0.0.1",
                "-t",
                mqttTopic,
                "-m",
                payload,
              ],
              { stdio: "pipe" },
            );
          }

          '''
              text = text.replace(seed_anchor, helper + seed_anchor, 1)

          if 'issue-404-stable-host' not in text:
              history_anchor = 'const historyRequestsBeforeInteraction = requests.telemetry.filter('
              start = text.find(history_anchor)
              if start < 0:
                  raise SystemExit("history request anchor not found")
              insert_at = text.find('const dashboardMutationsBeforeInteraction', start)
              if insert_at < 0:
                  raise SystemExit("dashboard mutation anchor not found")
              line_start = text.rfind('\n', 0, insert_at) + 1
              indentation = text[line_start:insert_at]
              block = f'''{indentation}const hostBeforeLivePoint = panel.getByTestId("chart-renderer-host");
          {indentation}await hostBeforeLivePoint.evaluate((element) => {{
          {indentation}  element.setAttribute("data-continuity-token", "issue-404-stable-host");
          {indentation}}});
          {indentation}const canvasBeforeLivePoint = panel.locator("canvas").first();
          {indentation}await canvasBeforeLivePoint.evaluate((element) => {{
          {indentation}  element.setAttribute("data-canvas-continuity-token", "issue-404-stable-canvas");
          {indentation}}});
          {indentation}publishSavedDashboardSample(fixture.dashboardId, fixture.plottedChannels[0], 19.75);
          {indentation}await page.waitForTimeout(2_500);
          {indentation}await expect(panel).toHaveCount(1);
          {indentation}await expect(hostBeforeLivePoint).toBeVisible();
          {indentation}await expect(hostBeforeLivePoint).toHaveAttribute(
          {indentation}  "data-continuity-token",
          {indentation}  "issue-404-stable-host",
          {indentation});
          {indentation}await expect(canvasBeforeLivePoint).toHaveAttribute(
          {indentation}  "data-canvas-continuity-token",
          {indentation}  "issue-404-stable-canvas",
          {indentation});
          {indentation}await expect.poll(() => panel.locator("canvas").count()).toBeGreaterThan(0);
          {indentation}expect(requests.telemetry.filter((item) => item.url.includes("/history")).length).toBe(
          {indentation}  historyRequestsBeforeInteraction,
          {indentation});

          '''
              text = text[:line_start] + block + text[line_start:]

          path.write_text(text, encoding="utf-8")
          PY

      - name: Install dependencies
        run: HUSKY=0 npm ci --no-audit

      - name: Format and verify focused slice
        run: |
          npx prettier --write \
            src/components/live-dashboards/dashboard-chart-panel.tsx \
            e2e/live.production.e2e.ts
          npm run typecheck
          npm test -- \
            src/features/live-dashboards/chart.test.ts \
            src/features/charts/area-rendering.test.ts
          git diff --check

      - name: Commit verified fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/components/live-dashboards/dashboard-chart-panel.tsx \
            e2e/live.production.e2e.ts
          if git diff --cached --quiet; then
            echo "No product/test changes to commit"
            exit 0
          fi
          git commit -m "test(live-dashboards): cover visual continuity on live points"
          git push origin HEAD:feat/404-saved-live-dashboard-chart-system
