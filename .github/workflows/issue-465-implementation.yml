name: Issue 465 implementation helper

on:
  push:
    branches:
      - feat/465-live-dashboard-telemetry-selector
    paths:
      - .github/workflows/issue-465-implementation.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/465-live-dashboard-telemetry-selector
          fetch-depth: 0
      - name: Apply focused implementation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, count: int = 1) -> None:
              p = Path(path)
              text = p.read_text()
              if text.count(old) < count:
                  raise SystemExit(f"missing replacement anchor in {path}: {old[:120]!r}")
              text = text.replace(old, new, count)
              p.write_text(text)

          # Backend inventory read model: enrich the existing query only.
          replace(
              "services/telemetry-service/app/live_dashboard/inventory.py",
              "from sqlalchemy import func, select",
              "from sqlalchemy import case, func, select",
          )
          replace(
              "services/telemetry-service/app/live_dashboard/inventory.py",
              "from app.nodes.models import CentralNode\n",
              "from app.nodes.models import CentralNode\nfrom app.refrigeration.models import RefrigerationEquipmentRecord\n",
          )
          replace(
              "services/telemetry-service/app/live_dashboard/inventory.py",
              "    equipment_name: str\n    channel_id: str\n",
              "    equipment_name: str\n    climate_chamber_id: str\n    climate_chamber_code: str\n    climate_chamber_name: str\n    equipment_type: str\n    laboratory: str | None\n    zone: str | None\n    channel_id: str\n",
          )
          replace(
              "services/telemetry-service/app/live_dashboard/inventory.py",
              "                    equipment_name=mapping[\"equipment_name\"],\n                    channel_id=mapping[\"channel_id\"],\n",
              "                    equipment_name=mapping[\"equipment_name\"],\n                    climate_chamber_id=mapping[\"climate_chamber_id\"],\n                    climate_chamber_code=mapping[\"climate_chamber_code\"],\n                    climate_chamber_name=mapping[\"climate_chamber_name\"],\n                    equipment_type=mapping[\"equipment_type\"],\n                    laboratory=mapping[\"laboratory\"],\n                    zone=mapping[\"zone\"],\n                    channel_id=mapping[\"channel_id\"],\n",
          )
          replace(
              "services/telemetry-service/app/live_dashboard/inventory.py",
              "    return (\n        _eligible_catalog_select(organization_id)\n        .with_only_columns(\n",
              "    taxonomy = _equipment_taxonomy_subquery(organization_id)\n    return (\n        _eligible_catalog_select(organization_id)\n        .outerjoin(\n            taxonomy,\n            (taxonomy.c.organization_id == MeasurementChannel.organization_id)\n            & (taxonomy.c.climate_chamber_id == MeasurementChannel.climate_chamber_id),\n        )\n        .with_only_columns(\n",
          )
          replace(
              "services/telemetry-service/app/live_dashboard/inventory.py",
              "            MeasurementDevice.display_name.label(\"equipment_name\"),\n            MeasurementChannel.channel_id.label(\"channel_id\"),\n",
              "            MeasurementDevice.display_name.label(\"equipment_name\"),\n            ClimateChamber.id.label(\"climate_chamber_id\"),\n            ClimateChamber.code.label(\"climate_chamber_code\"),\n            ClimateChamber.name.label(\"climate_chamber_name\"),\n            MeasurementDevice.device_type.label(\"equipment_type\"),\n            taxonomy.c.laboratory.label(\"laboratory\"),\n            taxonomy.c.zone.label(\"zone\"),\n            MeasurementChannel.channel_id.label(\"channel_id\"),\n",
          )
          taxonomy_helper = '''\n\ndef _equipment_taxonomy_subquery(organization_id: str):\n    """Return only unambiguous chamber-level operator taxonomy.\n\n    Multiple active/maintenance equipment records may share a climate chamber.\n    A laboratory or zone is exposed only when all known values agree. Missing or\n    conflicting metadata remains NULL so the frontend can present it truthfully.\n    """\n\n    return (\n        select(\n            RefrigerationEquipmentRecord.organization_id.label("organization_id"),\n            RefrigerationEquipmentRecord.climate_chamber_id.label("climate_chamber_id"),\n            case(\n                (\n                    func.count(func.distinct(RefrigerationEquipmentRecord.laboratory)) == 1,\n                    func.min(RefrigerationEquipmentRecord.laboratory),\n                ),\n                else_=None,\n            ).label("laboratory"),\n            case(\n                (\n                    func.count(func.distinct(RefrigerationEquipmentRecord.zone)) == 1,\n                    func.min(RefrigerationEquipmentRecord.zone),\n                ),\n                else_=None,\n            ).label("zone"),\n        )\n        .where(\n            RefrigerationEquipmentRecord.organization_id == organization_id,\n            RefrigerationEquipmentRecord.deleted_at.is_(None),\n            RefrigerationEquipmentRecord.lifecycle_status != "retired",\n            RefrigerationEquipmentRecord.climate_chamber_id.is_not(None),\n        )\n        .group_by(\n            RefrigerationEquipmentRecord.organization_id,\n            RefrigerationEquipmentRecord.climate_chamber_id,\n        )\n        .subquery("live_dashboard_equipment_taxonomy")\n    )\n'''
          replace(
              "services/telemetry-service/app/live_dashboard/inventory.py",
              "\n\ndef _eligible_catalog_select(organization_id: str):\n",
              taxonomy_helper + "\n\ndef _eligible_catalog_select(organization_id: str):\n",
          )

          # API response contract.
          replace(
              "services/telemetry-service/app/live_dashboard/schemas.py",
              "    equipment_name: str\n    channel_id: str\n",
              "    equipment_name: str\n    climate_chamber_id: str\n    climate_chamber_code: str\n    climate_chamber_name: str\n    equipment_type: str\n    laboratory: str | None\n    zone: str | None\n    channel_id: str\n",
          )
          replace(
              "services/telemetry-service/app/live_dashboard/api.py",
              "                    equipment_name=item.equipment_name,\n                    channel_id=item.channel_id,\n",
              "                    equipment_name=item.equipment_name,\n                    climate_chamber_id=item.climate_chamber_id,\n                    climate_chamber_code=item.climate_chamber_code,\n                    climate_chamber_name=item.climate_chamber_name,\n                    equipment_type=item.equipment_type,\n                    laboratory=item.laboratory,\n                    zone=item.zone,\n                    channel_id=item.channel_id,\n",
          )

          # Frontend typed inventory contract.
          replace(
              "src/features/live-dashboards/types.ts",
              "  equipment_name: string;\n  channel_id: string;\n",
              "  equipment_name: string;\n  climate_chamber_id: string;\n  climate_chamber_code: string;\n  climate_chamber_name: string;\n  equipment_type: string;\n  laboratory: string | null;\n  zone: string | null;\n  channel_id: string;\n",
          )
          replace(
              "src/features/live-dashboards/inventory-client.ts",
              "function numberValue(value: unknown, field: string): number {\n",
              "function nullableStringValue(value: unknown, field: string): string | null {\n  if (value === null) return null;\n  return stringValue(value, field);\n}\n\nfunction numberValue(value: unknown, field: string): number {\n",
          )
          replace(
              "src/features/live-dashboards/inventory-client.ts",
              "    equipment_name: stringValue(value.equipment_name, \"Inventory equipment name\"),\n    channel_id: channelId,\n",
              "    equipment_name: stringValue(value.equipment_name, \"Inventory equipment name\"),\n    climate_chamber_id: stringValue(value.climate_chamber_id, \"Inventory climate chamber id\"),\n    climate_chamber_code: stringValue(value.climate_chamber_code, \"Inventory climate chamber code\"),\n    climate_chamber_name: stringValue(value.climate_chamber_name, \"Inventory climate chamber name\"),\n    equipment_type: stringValue(value.equipment_type, \"Inventory equipment type\"),\n    laboratory: nullableStringValue(value.laboratory, \"Inventory laboratory\"),\n    zone: nullableStringValue(value.zone, \"Inventory zone\"),\n    channel_id: channelId,\n",
          )

          # New consumer adapter: one mapping layer, no route-local selection engine.
          Path("src/features/live-dashboards/telemetry-selection-adapter.ts").write_text(r'''import {
            buildTelemetryPointHierarchy,
            telemetryPointSelectionKey,
            type TelemetryPointDescriptor,
            type TelemetryPointHierarchy,
          } from "@/features/telemetry-selection/hierarchy";

          import { addDashboardDraftItem, dashboardItemIdentity } from "./model";
          import type {
            LiveDashboardDraft,
            LiveDashboardDraftItem,
            LiveDashboardInventoryItem,
          } from "./types";

          const UNCLASSIFIED_LABORATORY_ID = "__unclassified_laboratory__";
          const UNCLASSIFIED_ZONE_PREFIX = "__unclassified_zone__";

          const EQUIPMENT_TYPE_LABELS: Readonly<Record<string, string>> = {
            temperature_controller: "Температурний контролер",
            energy_meter: "Лічильник енергії",
          };

          export type LiveDashboardTelemetrySelectionModel = {
            hierarchy: TelemetryPointHierarchy;
            selectedKeys: string[];
            unresolvedItems: LiveDashboardDraftItem[];
            inventoryIdentities: ReadonlySet<string>;
            inventoryByPointKey: ReadonlyMap<string, LiveDashboardInventoryItem>;
          };

          function textIdentity(value: string): { id: string; label: string } {
            return { id: value, label: value };
          }

          export function liveDashboardInventoryToTelemetryPointDescriptor(
            item: LiveDashboardInventoryItem,
            organizationId: string,
          ): TelemetryPointDescriptor {
            const laboratory = item.laboratory?.trim();
            const zone = item.zone?.trim();
            return {
              organizationId,
              laboratory: laboratory
                ? textIdentity(laboratory)
                : { id: UNCLASSIFIED_LABORATORY_ID, label: "Лабораторія не вказана" },
              zone: zone
                ? textIdentity(zone)
                : {
                    id: `${UNCLASSIFIED_ZONE_PREFIX}:${item.climate_chamber_id}`,
                    label: `Зона не вказана · ${item.climate_chamber_code} · ${item.climate_chamber_name}`,
                  },
              equipmentType: {
                id: item.equipment_type,
                label: EQUIPMENT_TYPE_LABELS[item.equipment_type] ?? item.equipment_type,
              },
              equipment: { id: item.equipment_id, label: item.equipment_name },
              nodeId: item.node_id,
              channelId: item.channel_id,
              channelLabel: item.channel_name,
              metric: item.metric,
              metricLabel: item.metric,
              unit: item.native_unit,
            };
          }

          export function buildLiveDashboardTelemetrySelectionModel(
            organizationId: string,
            inventory: readonly LiveDashboardInventoryItem[],
            draftItems: readonly LiveDashboardDraftItem[],
          ): LiveDashboardTelemetrySelectionModel {
            const descriptors = inventory.map((item) =>
              liveDashboardInventoryToTelemetryPointDescriptor(item, organizationId),
            );
            const hierarchy = buildTelemetryPointHierarchy(descriptors, organizationId);
            const inventoryByIdentity = new Map<string, LiveDashboardInventoryItem>();
            const inventoryByPointKey = new Map<string, LiveDashboardInventoryItem>();

            for (let index = 0; index < inventory.length; index += 1) {
              const item = inventory[index];
              const descriptor = descriptors[index];
              const identity = dashboardItemIdentity(item);
              if (!inventoryByIdentity.has(identity)) inventoryByIdentity.set(identity, item);
              const pointKey = telemetryPointSelectionKey(descriptor);
              if (!inventoryByPointKey.has(pointKey)) inventoryByPointKey.set(pointKey, item);
            }

            const selectedSet = new Set<string>();
            const unresolvedItems: LiveDashboardDraftItem[] = [];
            for (const item of draftItems) {
              const inventoryItem = inventoryByIdentity.get(dashboardItemIdentity(item));
              if (!inventoryItem) {
                unresolvedItems.push(item);
                continue;
              }
              selectedSet.add(
                telemetryPointSelectionKey(
                  liveDashboardInventoryToTelemetryPointDescriptor(inventoryItem, organizationId),
                ),
              );
            }

            return {
              hierarchy,
              selectedKeys: hierarchy.orderedLeafKeys.filter((key) => selectedSet.has(key)),
              unresolvedItems,
              inventoryIdentities: new Set(inventoryByIdentity.keys()),
              inventoryByPointKey,
            };
          }

          export function reconcileLiveDashboardTelemetrySelection(
            draft: LiveDashboardDraft,
            selectedPointKeys: readonly string[],
            organizationId: string,
            inventory: readonly LiveDashboardInventoryItem[],
          ): LiveDashboardDraft {
            const model = buildLiveDashboardTelemetrySelectionModel(organizationId, inventory, draft.items);
            const requested = new Set(selectedPointKeys);
            const selectedInventoryIdentities = new Set<string>();

            for (const pointKey of model.hierarchy.orderedLeafKeys) {
              if (!requested.has(pointKey)) continue;
              const item = model.inventoryByPointKey.get(pointKey);
              if (item) selectedInventoryIdentities.add(dashboardItemIdentity(item));
            }

            let next: LiveDashboardDraft = {
              ...draft,
              items: draft.items.filter((item) => {
                const identity = dashboardItemIdentity(item);
                return !model.inventoryIdentities.has(identity) || selectedInventoryIdentities.has(identity);
              }),
            };
            const existing = new Set(next.items.map(dashboardItemIdentity));

            for (const pointKey of model.hierarchy.orderedLeafKeys) {
              if (!requested.has(pointKey)) continue;
              const item = model.inventoryByPointKey.get(pointKey);
              if (!item) continue;
              const identity = dashboardItemIdentity(item);
              if (existing.has(identity)) continue;
              const result = addDashboardDraftItem(next, item);
              next = result.draft;
              if (result.added) existing.add(identity);
            }

            return next;
          }
          '''.replace("          ", ""))

          Path("src/features/live-dashboards/telemetry-selection-adapter.test.ts").write_text(r'''import { describe, expect, it } from "vitest";

          import { telemetryPointSelectionKey } from "@/features/telemetry-selection/hierarchy";

          import { createEmptyLiveDashboardDraft } from "./model";
          import {
            buildLiveDashboardTelemetrySelectionModel,
            liveDashboardInventoryToTelemetryPointDescriptor,
            reconcileLiveDashboardTelemetrySelection,
          } from "./telemetry-selection-adapter";
          import type { LiveDashboardDraftItem, LiveDashboardInventoryItem } from "./types";

          const organizationId = "organization-1";

          function inventoryItem(
            channelId: string,
            overrides: Partial<LiveDashboardInventoryItem> = {},
          ): LiveDashboardInventoryItem {
            return {
              key: `${channelId}|temperature`,
              channel_ref_id: `ref-${channelId}`,
              node_id: "edge-01",
              equipment_id: "controller-1",
              equipment_name: "Controller 1",
              climate_chamber_id: "chamber-1",
              climate_chamber_code: "KK1",
              climate_chamber_name: "Кліматична камера 1",
              equipment_type: "temperature_controller",
              laboratory: "Лабораторія А",
              zone: "Зона 1",
              channel_id: channelId,
              channel_name: `Канал ${channelId}`,
              metric: "temperature",
              native_unit: "°C",
              source: "temperature_controller",
              quality: "valid",
              alarm: null,
              latest: null,
              ...overrides,
            };
          }

          function draftItem(channelId: string, overrides: Partial<LiveDashboardDraftItem> = {}): LiveDashboardDraftItem {
            return {
              channel_id: channelId,
              metric: "temperature",
              visualization: "area",
              color: "#00C6E0",
              display_unit: "°C",
              native_unit: "°C",
              node_id: null,
              equipment_id: null,
              source: null,
              ...overrides,
            };
          }

          describe("Live Dashboard TelemetryPointSelector adapter", () => {
            it("maps canonical inventory identity without drifting the selector leaf key", () => {
              const item = inventoryItem("106-03");
              const descriptor = liveDashboardInventoryToTelemetryPointDescriptor(item, organizationId);

              expect(descriptor).toMatchObject({
                organizationId,
                laboratory: { id: "Лабораторія А", label: "Лабораторія А" },
                zone: { id: "Зона 1", label: "Зона 1" },
                equipmentType: { id: "temperature_controller", label: "Температурний контролер" },
                equipment: { id: "controller-1", label: "Controller 1" },
                nodeId: "edge-01",
                channelId: "106-03",
                metric: "temperature",
                unit: "°C",
              });
              expect(telemetryPointSelectionKey(descriptor)).toBe(
                ["edge-01", "controller-1", "106-03", "temperature", "°C"]
                  .map(encodeURIComponent)
                  .join("|"),
              );
            });

            it("represents missing taxonomy explicitly instead of inventing a laboratory or zone", () => {
              const model = buildLiveDashboardTelemetrySelectionModel(
                organizationId,
                [inventoryItem("106-03", { laboratory: null, zone: null })],
                [],
              );

              expect(model.hierarchy.roots[0]?.label).toBe("Лабораторія не вказана");
              expect(model.hierarchy.roots[0]?.children[0]?.label).toBe(
                "Зона не вказана · KK1 · Кліматична камера 1",
              );
            });

            it("preserves unresolved items and retained metadata while appending new selected points deterministically", () => {
              const first = inventoryItem("106-03");
              const second = inventoryItem("106-04");
              const unresolved = draftItem("retired-99", { color: "#AA0000" });
              const retained = draftItem("106-03", { visualization: "gauge", color: "#123456" });
              const draft = {
                ...createEmptyLiveDashboardDraft(),
                name: "Selection reconciliation",
                items: [unresolved, retained],
              };
              const model = buildLiveDashboardTelemetrySelectionModel(
                organizationId,
                [second, first],
                draft.items,
              );
              const secondKey = telemetryPointSelectionKey(
                liveDashboardInventoryToTelemetryPointDescriptor(second, organizationId),
              );

              const reconciled = reconcileLiveDashboardTelemetrySelection(
                draft,
                [...model.selectedKeys, secondKey],
                organizationId,
                [second, first],
              );

              expect(reconciled.items.map((item) => item.channel_id)).toEqual([
                "retired-99",
                "106-03",
                "106-04",
              ]);
              expect(reconciled.items[1]).toMatchObject({ visualization: "gauge", color: "#123456" });
              expect(reconciled.items[2]).toMatchObject({
                visualization: "line",
                native_unit: "°C",
                node_id: "edge-01",
                equipment_id: "controller-1",
              });
            });

            it("removes only explicitly deselected available points and never removes unresolved saved items", () => {
              const first = inventoryItem("106-03");
              const unresolved = draftItem("missing-01");
              const draft = {
                ...createEmptyLiveDashboardDraft(),
                items: [draftItem("106-03"), unresolved],
              };

              const reconciled = reconcileLiveDashboardTelemetrySelection(
                draft,
                [],
                organizationId,
                [first],
              );

              expect(reconciled.items.map((item) => item.channel_id)).toEqual(["missing-01"]);
            });
          });
          '''.replace("          ", ""))

          # Dashboard editor: replace flat selection UI with canonical selector.
          path = Path("src/components/live-dashboards/dashboard-editor.tsx")
          text = path.read_text()
          text = text.replace("  Plus,\n", "").replace("  Search,\n", "")
          text = text.replace(
              'import {\n  addDashboardDraftItem,\n  dashboardItemIdentity,\n  defaultLiveDashboardInventoryFilters,\n  filterLiveDashboardInventory,\n  moveDashboardDraftItem,\n  removeDashboardDraftItem,\n} from "@/features/live-dashboards/model";\n',
              'import { dashboardItemIdentity, moveDashboardDraftItem, removeDashboardDraftItem } from "@/features/live-dashboards/model";\nimport {\n  buildLiveDashboardTelemetrySelectionModel,\n  reconcileLiveDashboardTelemetrySelection,\n} from "@/features/live-dashboards/telemetry-selection-adapter";\n',
          )
          text = text.replace(
              '  LIVE_DASHBOARD_REFRESH_SECONDS,\n',
              '  LIVE_DASHBOARD_MAX_ITEMS,\n  LIVE_DASHBOARD_REFRESH_SECONDS,\n',
          ).replace('  type LiveDashboardInventoryFilters,\n', '')
          text = text.replace(
              'import type { LiveDashboardInventoryModel } from "@/hooks/use-live-dashboard-inventory";\n',
              'import type { LiveDashboardInventoryModel } from "@/hooks/use-live-dashboard-inventory";\n\nimport { TelemetryPointSelector } from "@/components/telemetry-selection/telemetry-point-selector";\n',
          )
          helper_start = text.index('function sortedUnique(')
          helper_end = text.index('\nexport function DashboardEditor', helper_start)
          text = text[:helper_start] + text[helper_end + 1:]
          text = text.replace(
              'export function DashboardEditor({\n  draft,\n',
              'export function DashboardEditor({\n  organizationId,\n  draft,\n',
          )
          text = text.replace(
              '}: {\n  draft: LiveDashboardDraft;\n',
              '}: {\n  organizationId: string;\n  draft: LiveDashboardDraft;\n',
              1,
          )
          old_state_start = text.index('  const [filters, setFilters]')
          old_state_end = text.index('\n\n  return (', old_state_start)
          new_state = '''  const [selectionNotice, setSelectionNotice] = useState<string | null>(null);\n  const selectionModel = useMemo(\n    () => buildLiveDashboardTelemetrySelectionModel(organizationId, inventory.items, draft.items),\n    [draft.items, inventory.items, organizationId],\n  );\n  const availableKeys = selectionModel.inventoryIdentities;\n  const unavailableItems = selectionModel.unresolvedItems;\n  const availableSelectionLimit = Math.max(0, LIVE_DASHBOARD_MAX_ITEMS - unavailableItems.length);'''
          text = text[:old_state_start] + new_state + text[old_state_end:]
          text = text.replace('Виберіть канали з inventory праворуч.', 'Виберіть точки телеметрії в ієрархії праворуч.')
          marker = text.index('Canonical channel inventory')
          section_start = text.rfind('\n        <section className="rounded-3xl', 0, marker)
          section_end = text.index('\n        </section>', marker) + len('\n        </section>')
          replacement = r'''
        <section className="min-w-0 space-y-4">
          <div className="flex flex-col gap-3 rounded-3xl border border-white/[0.08] bg-[#091a31]/90 p-5 sm:flex-row sm:items-end sm:justify-between">
            <div>
              <h2 className="text-lg font-semibold text-white">Ієрархічний вибір телеметрії</h2>
              <p className="mt-1 max-w-2xl text-xs leading-5 text-slate-500">
                Один read-only inventory: лабораторія / зона → тип обладнання → обладнання → канал і метрика.
                Непідтверджені зміни не змінюють Dashboard.
              </p>
            </div>
            <button
              type="button"
              onClick={inventory.retry}
              className="inline-flex h-10 shrink-0 items-center justify-center gap-2 rounded-xl border border-white/10 px-3 text-sm text-slate-300 hover:border-cyan-300/30"
            >
              <RefreshCw
                className={`h-4 w-4 ${inventory.status === "loading" ? "animate-spin" : ""}`}
                aria-hidden="true"
              />
              Оновити inventory
            </button>
          </div>

          {selectionNotice ? (
            <p className="rounded-xl border border-cyan-300/10 bg-cyan-400/[0.05] px-3 py-2 text-xs text-cyan-100" role="status">
              {selectionNotice}
            </p>
          ) : null}

          {inventory.status === "loading" ? (
            <div className="grid min-h-64 place-items-center rounded-3xl border border-white/[0.08] bg-[#091a31]/90 text-sm text-cyan-100">
              <span className="inline-flex items-center gap-2">
                <RefreshCw className="h-4 w-4 animate-spin" aria-hidden="true" />
                Читання canonical inventory…
              </span>
            </div>
          ) : null}

          {inventory.status === "error" ? (
            <div className="rounded-2xl border border-red-300/15 bg-red-400/[0.06] p-4 text-sm text-red-100" role="alert">
              {inventory.error?.message ?? "Inventory недоступний."}
            </div>
          ) : null}

          {inventory.status === "ready" && inventory.items.length === 0 ? (
            <div className="grid min-h-56 place-items-center rounded-3xl border border-dashed border-white/10 bg-[#091a31]/70 p-5 text-center text-sm text-slate-500">
              <p>У canonical inventory немає доступних точок телеметрії.</p>
            </div>
          ) : null}

          {inventory.status === "ready" && inventory.items.length > 0 ? (
            <TelemetryPointSelector
              hierarchy={selectionModel.hierarchy}
              value={selectionModel.selectedKeys}
              maxSelection={availableSelectionLimit}
              title="Канали Live Dashboard"
              onConfirm={(selected) => {
                setDraft((current) =>
                  reconcileLiveDashboardTelemetrySelection(
                    current,
                    selected,
                    organizationId,
                    inventory.items,
                  ),
                );
                setSelectionNotice("Підтверджений вибір застосовано до чернетки Dashboard.");
              }}
              onCancel={() => setSelectionNotice("Непідтверджені зміни селектора скасовано.")}
            />
          ) : null}
        </section>'''
          text = text[:section_start] + replacement + text[section_end:]
