name: Issue 465 implementation helper

on:
  push:
    branches:
      - feat/465-live-dashboard-telemetry-selector
    paths:
      - .github/workflows/issue-465-implementation.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/465-live-dashboard-telemetry-selector
          fetch-depth: 0
      - name: Apply focused implementation
        run: python .github/issue-465-patch.py
      - name: Install frontend dependencies
        run: npm ci
      - name: Format touched frontend and docs
        run: npx prettier --write src/components/live-dashboards/dashboard-editor.tsx src/components/live-dashboards/dashboard-editor-162.test.tsx src/components/live-dashboards/live-dashboard-workspace.tsx src/features/live-dashboards/types.ts src/features/live-dashboards/inventory-client.ts src/features/live-dashboards/inventory-client.test.ts src/features/live-dashboards/model.test.ts src/features/live-dashboards/inventory.test.ts src/features/live-dashboards/telemetry-selection-adapter.ts src/features/live-dashboards/telemetry-selection-adapter.test.ts docs/audits/issue-465-live-dashboard-telemetry-selector.md
      - name: Targeted frontend tests
        run: npx vitest run src/features/live-dashboards/telemetry-selection-adapter.test.ts src/features/live-dashboards/inventory-client.test.ts src/features/live-dashboards/model.test.ts src/features/live-dashboards/inventory.test.ts src/components/live-dashboards/dashboard-editor-162.test.tsx
      - name: Typecheck
        run: npm run typecheck
      - name: Publish focused implementation and remove helpers
        if: success()
        shell: bash
        run: |
          rm .github/workflows/issue-465-implementation.yml .github/issue-465-patch.py
          git config user.name "nexolab-automation"
          git config user.email "actions@users.noreply.github.com"
          git add src services/telemetry-service/app/live_dashboard services/telemetry-service/tests/test_live_dashboard_inventory_api.py services/telemetry-service/tests/test_live_dashboard_inventory_postgres.py docs/audits/issue-465-live-dashboard-telemetry-selector.md .github/workflows/issue-465-implementation.yml .github/issue-465-patch.py
          git diff --cached --check
          git commit -m "feat: integrate telemetry selector into Live Dashboard editor (#465)"
          git push origin HEAD:feat/465-live-dashboard-telemetry-selector
