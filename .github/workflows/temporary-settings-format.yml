name: Temporary Settings Format

on:
  pull_request:

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.ref == 'feat/269-operator-safe-settings'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feat/269-operator-safe-settings

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install dependencies
        env:
          HUSKY: 0
        run: npm install --no-audit --no-fund

      - name: Format focused Settings files and remove workflow
        run: |
          npx prettier --write \
            e2e/settings.production.e2e.ts \
            src/components/settings/settings-screen.tsx \
            src/components/settings/settings-workspace.test.tsx \
            src/components/settings/settings-workspace.tsx \
            src/features/settings/preferences.test.ts \
            src/features/settings/runtime-diagnostics.test.ts \
            src/features/settings/runtime-diagnostics.ts \
            src/hooks/use-settings-preferences.ts
          rm .github/workflows/temporary-settings-format.yml

      - name: Commit focused formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            e2e/settings.production.e2e.ts \
            src/components/settings/settings-screen.tsx \
            src/components/settings/settings-workspace.test.tsx \
            src/components/settings/settings-workspace.tsx \
            src/features/settings/preferences.test.ts \
            src/features/settings/runtime-diagnostics.test.ts \
            src/features/settings/runtime-diagnostics.ts \
            src/hooks/use-settings-preferences.ts \
            .github/workflows/temporary-settings-format.yml
          git commit -m "style(settings): apply focused formatting"
          git push origin HEAD:feat/269-operator-safe-settings
