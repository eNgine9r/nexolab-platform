name: Temporary Equipment Layouts Formatter

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: equipment-layouts-formatter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Format focused equipment layouts files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          package-manager-cache: false
          node-version-file: .nvmrc

      - name: Install dependencies
        env:
          HUSKY: 0
        run: npm install --no-audit

      - name: Format focused files
        run: |
          npx prettier --write \
            src/components/equipment-layouts/equipment-layouts-catalog.tsx \
            src/features/equipment-layouts/layout-catalog.test.ts \
            src/features/equipment-layouts/layout-catalog.ts \
            src/features/equipment-layouts/runtime.ts \
            src/hooks/use-equipment-layouts-catalog.ts

      - name: Upload formatted files
        uses: actions/upload-artifact@v7
        with:
          name: formatted-equipment-layouts-${{ github.sha }}
          path: |
            src/components/equipment-layouts/equipment-layouts-catalog.tsx
            src/features/equipment-layouts/layout-catalog.test.ts
            src/features/equipment-layouts/layout-catalog.ts
            src/features/equipment-layouts/runtime.ts
            src/hooks/use-equipment-layouts-catalog.ts
          if-no-files-found: error
          retention-days: 1
