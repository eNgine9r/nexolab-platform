name: Container Supply Chain

on:
  pull_request:
    branches: [main]
    paths:
      - "security/container-images.json"
      - "security/vulnerability-exceptions.json"
      - "scripts/validate-container-supply-chain.py"
      - "scripts/evaluate-container-vulnerabilities.py"
      - "scripts/generate-container-release-manifest.py"
      - "scripts/aggregate-container-release-manifests.py"
      - "tests/test_container_supply_chain_policy.py"
      - "tests/test_container_vulnerability_policy.py"
      - "tests/test_container_release_manifest.py"
      - "tests/test_container_release_aggregate.py"
      - "services/device-agent/**"
      - "services/telemetry-service/**"
      - "services/telegram-gateway/**"
      - "infrastructure/mqtt/dynamic-security/**"
      - "infrastructure/object-storage/**"
      - ".github/workflows/container-supply-chain.yml"
  push:
    branches: [main]
    tags: ["v*", "edge-v*", "telemetry-v*", "mqtt-v*"]
    paths:
      - "security/container-images.json"
      - "security/vulnerability-exceptions.json"
      - "scripts/validate-container-supply-chain.py"
      - "scripts/evaluate-container-vulnerabilities.py"
      - "scripts/generate-container-release-manifest.py"
      - "scripts/aggregate-container-release-manifests.py"
      - "tests/test_container_supply_chain_policy.py"
      - "tests/test_container_vulnerability_policy.py"
      - "tests/test_container_release_manifest.py"
      - "tests/test_container_release_aggregate.py"
      - "services/device-agent/**"
      - "services/telemetry-service/**"
      - "services/telegram-gateway/**"
      - "infrastructure/mqtt/dynamic-security/**"
      - "infrastructure/object-storage/**"
      - ".github/workflows/container-supply-chain.yml"
  workflow_dispatch:

concurrency:
  group: container-supply-chain-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  inventory:
    name: Resolve controlled image inventory
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ env.SOURCE_SHA }}

      - name: Validate controlled image inventory
        run: |
          python - <<'PY_INVENTORY'
          import importlib.util
          from pathlib import Path

          module_path = Path("scripts/validate-container-supply-chain.py")
          spec = importlib.util.spec_from_file_location("container_supply_chain_validator", module_path)
          if spec is None or spec.loader is None:
              raise SystemExit("Cannot load container supply-chain validator")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          root = Path.cwd().resolve()
          module.validate_inventory(root / "security/container-images.json", root)
          print("Container image inventory validation passed.")
          PY_INVENTORY

      - name: Build image matrix from inventory
        id: matrix
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          inventory = json.loads(
              Path("security/container-images.json").read_text(encoding="utf-8")
          )
          images = inventory.get("images")
          if inventory.get("schema_version") != 1 or not isinstance(images, list) or not images:
              raise SystemExit("Container image inventory must be schema v1 with a non-empty images array")

          include = []
          for image in images:
              required = {"id", "image", "context", "dockerfile", "platforms"}
              missing = sorted(required - set(image))
              if missing:
                  raise SystemExit(
                      f"Container image inventory entry is missing fields: {', '.join(missing)}"
                  )
              include.append(
                  {
                      "id": image["id"],
                      "image": image["image"],
                      "context": image["context"],
                      "dockerfile": image["dockerfile"],
                      "platform": "linux/amd64",
                      "platforms": image["platforms"],
                      "cache_scope": (
                          "supply-chain-v2-device-agent"
                          if image["id"] == "device-agent"
                          else f"supply-chain-{image['id']}"
                      ),
                  }
              )
          matrix = json.dumps({"include": include}, separators=(",", ":"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"matrix={matrix}\n")
          PY

      - name: Reject secret-like material
        run: |
          ! grep -ER --exclude='*.pyc' \
            'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|ghp_[A-Za-z0-9]{20,}|sk-[A-Za-z0-9]{20,}' \
            security scripts tests/test_container_*.py

  evidence:
    name: Build and scan ${{ matrix.id }}
    needs: inventory
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.inventory.outputs.matrix) }}
    env:
      LOCAL_IMAGE: local/nexolab-${{ matrix.id }}:${{ github.event.pull_request.head.sha || github.sha }}
      EVIDENCE_DIR: evidence
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ env.SOURCE_SHA }}

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build exact-commit image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          pull: true
          no-cache: true
          tags: ${{ env.LOCAL_IMAGE }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
            org.opencontainers.image.title=${{ matrix.id }}
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache_scope }}

      - name: Verify immutable OCI labels and capture image digest
        id: image
        run: |
          revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$LOCAL_IMAGE")"
          source="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.source" }}' "$LOCAL_IMAGE")"
          image_digest="$(docker image inspect --format '{{.Id}}' "$LOCAL_IMAGE")"
          test "$revision" = "$SOURCE_SHA"
          test "$source" = "https://github.com/$GITHUB_REPOSITORY"
          case "$image_digest" in
            sha256:????????????????????????????????????????????????????????????????) ;;
            *) echo "Unexpected image digest: $image_digest" >&2; exit 1 ;;
          esac
          echo "digest=$image_digest" >> "$GITHUB_OUTPUT"

      - name: Prepare evidence directory
        run: mkdir -p "$EVIDENCE_DIR"

      - name: Generate CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: image
          image-ref: ${{ env.LOCAL_IMAGE }}
          format: cyclonedx
          output: evidence/${{ matrix.id }}.cdx.json
          exit-code: "0"

      - name: Generate SPDX JSON SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: image
          image-ref: ${{ env.LOCAL_IMAGE }}
          format: spdx-json
          output: evidence/${{ matrix.id }}.spdx.json
          exit-code: "0"

      - name: Generate vulnerability report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: image
          image-ref: ${{ env.LOCAL_IMAGE }}
          format: json
          output: evidence/${{ matrix.id }}.trivy.json
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "0"

      - name: Generate digest-bound candidate manifest
        run: |
          python scripts/generate-container-release-manifest.py \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$SOURCE_SHA" \
            --image-id "${{ matrix.id }}" \
            --image-name "${{ matrix.image }}" \
            --platform "${{ matrix.platform }}" \
            --image-digest "${{ steps.image.outputs.digest }}" \
            --dockerfile "${{ matrix.dockerfile }}" \
            --cyclonedx "evidence/${{ matrix.id }}.cdx.json" \
            --spdx "evidence/${{ matrix.id }}.spdx.json" \
            --vulnerabilities "evidence/${{ matrix.id }}.trivy.json" \
            --output "evidence/${{ matrix.id }}.manifest.json"

      - name: Reject secrets and private keys in evidence
        run: |
          ! grep -ER \
            'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|ghp_[A-Za-z0-9]{20,}|sk-[A-Za-z0-9]{20,}|MQTT_PASSWORD=|BROKER_CONTROL_ADMIN_PASSWORD=' \
            "$EVIDENCE_DIR"

      - name: Upload raw image evidence for policy review
        uses: actions/upload-artifact@v7
        with:
          name: container-evidence-${{ matrix.id }}
          path: evidence
          if-no-files-found: error
          retention-days: 14

  policy:
    name: Enforce vulnerability acceptance policy
    needs: [inventory, evidence]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ env.SOURCE_SHA }}

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install test dependency
        run: python -m pip install pytest==8.4.2

      - name: Download fresh image evidence
        uses: actions/download-artifact@v8
        with:
          pattern: container-evidence-*
          path: evidence
          merge-multiple: true

      - name: Validate supply-chain policy
        run: python scripts/validate-container-supply-chain.py

      - name: Run policy and manifest regression tests
        run: |
          python -m pytest -q \
            tests/test_container_supply_chain_policy.py \
            tests/test_container_vulnerability_policy.py \
            tests/test_container_release_manifest.py \
            tests/test_container_release_aggregate.py

      - name: Enforce vulnerability policy against fresh reports
        run: |
          python - <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path

          inventory = json.loads(
              Path("security/container-images.json").read_text(encoding="utf-8")
          )
          for image in inventory["images"]:
              image_id = image["id"]
              report = Path("evidence") / f"{image_id}.trivy.json"
              if not report.is_file():
                  raise SystemExit(f"Missing fresh vulnerability report for {image_id}")
              subprocess.run(
                  [
                      sys.executable,
                      "scripts/evaluate-container-vulnerabilities.py",
                      "--image-id",
                      image_id,
                      "--report",
                      str(report),
                  ],
                  check=True,
              )
          PY

  aggregate:
    name: Verify aggregate release manifest
    needs: [policy, evidence]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ env.SOURCE_SHA }}

      - name: Download accepted image evidence
        uses: actions/download-artifact@v8
        with:
          pattern: container-evidence-*
          path: evidence
          merge-multiple: true

      - name: Aggregate exact-commit manifests
        run: |
          python scripts/aggregate-container-release-manifests.py \
            --inventory security/container-images.json \
            --manifests-dir evidence \
            --output evidence/release-manifest.json

      - name: Reject secrets and private keys in aggregate evidence
        run: |
          ! grep -ER \
            'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|ghp_[A-Za-z0-9]{20,}|sk-[A-Za-z0-9]{20,}|MQTT_PASSWORD=|BROKER_CONTROL_ADMIN_PASSWORD=' \
            evidence

      - name: Upload aggregate release evidence
        uses: actions/upload-artifact@v7
        with:
          name: container-release-evidence-${{ env.SOURCE_SHA }}
          path: evidence
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish attested ${{ matrix.id }}
    if: github.event_name == 'push'
    needs: [inventory, policy]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.inventory.outputs.matrix) }}
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ env.SOURCE_SHA }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract immutable image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ matrix.image }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
            org.opencontainers.image.title=${{ matrix.id }}

      - name: Build and publish multi-platform image with attestations
        id: publish
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ join(matrix.platforms, ',') }}
          push: true
          pull: true
          no-cache: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache_scope }}

      - name: Record published registry digest
        run: |
          mkdir -p published
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = {
              "schema_version": 1,
              "repository": os.environ["GITHUB_REPOSITORY"],
              "commit": os.environ["SOURCE_SHA"],
              "image_id": "${{ matrix.id }}",
              "image": "${{ matrix.image }}",
              "digest": "${{ steps.publish.outputs.digest }}",
              "platforms": ${{ toJSON(matrix.platforms) }},
              "sbom_attestation": True,
              "provenance_attestation": "mode=max",
          }
          Path("published/${{ matrix.id }}.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload publication record
        uses: actions/upload-artifact@v7
        with:
          name: published-container-${{ matrix.id }}-${{ env.SOURCE_SHA }}
          path: published/${{ matrix.id }}.json
          if-no-files-found: error
          retention-days: 90
