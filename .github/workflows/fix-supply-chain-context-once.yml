name: Fix supply chain expression context once

on:
  push:
    branches:
      - fix/327-revalidate-cjson-exception
    paths:
      - ".github/workflows/fix-supply-chain-context-once.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout security branch
        uses: actions/checkout@v6
        with:
          ref: fix/327-revalidate-cjson-exception
          fetch-depth: 0

      - name: Remove job-env self reference
        run: |
          python - <<'PY'
          from pathlib import Path

          def gh(expression: str) -> str:
              return "$" + "{{ " + expression + " }}"

          matrix_expression = gh("matrix.id")
          env_expression = gh("env.SOURCE_SHA")
          source_expression = gh(
              "github.event.pull_request.head.sha || github.sha"
          )

          workflow_path = Path(".github/workflows/container-supply-chain.yml")
          workflow = workflow_path.read_text(encoding="utf-8")
          old = (
              "      LOCAL_IMAGE: local/nexolab-"
              + matrix_expression
              + ":"
              + env_expression
          )
          new = (
              "      LOCAL_IMAGE: local/nexolab-"
              + matrix_expression
              + ":"
              + source_expression
          )
          if workflow.count(old) != 1:
              raise SystemExit("Unexpected LOCAL_IMAGE source expression")
          workflow = workflow.replace(old, new)
          workflow_path.write_text(workflow, encoding="utf-8")

          test_path = Path("tests/test_container_supply_chain_policy.py")
          tests = test_path.read_text(encoding="utf-8")
          old_test = (
              '        "LOCAL_IMAGE: local/nexolab-'
              + matrix_expression
              + ":"
              + env_expression
              + '"\n'
              + "        in workflow\n"
          )
          new_test = (
              '        "LOCAL_IMAGE: local/nexolab-'
              + matrix_expression
              + ":"
              + source_expression
              + '"\n'
              + "        in workflow\n"
          )
          if tests.count(old_test) != 1:
              raise SystemExit("Unexpected LOCAL_IMAGE regression assertion")
          tests = tests.replace(old_test, new_test)
          count_assertion = '    assert workflow.count("github.sha") == 1\n'
          if tests.count(count_assertion) != 1:
              raise SystemExit("Unexpected github.sha regression assertion")
          tests = tests.replace(
              count_assertion,
              '    assert workflow.count("github.sha") == 2\n',
          )
          test_path.write_text(tests, encoding="utf-8")
          PY

      - name: Remove temporary workflow and publish
        run: |
          rm .github/workflows/fix-supply-chain-context-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/container-supply-chain.yml \
            tests/test_container_supply_chain_policy.py \
            .github/workflows/fix-supply-chain-context-once.yml
          git commit -m "fix(security): use valid exact-head contexts"
          git push origin HEAD:fix/327-revalidate-cjson-exception
