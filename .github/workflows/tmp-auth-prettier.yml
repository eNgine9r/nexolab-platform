name: Temporary Auth Prettier

on:
  push:
    branches:
      - feat/188-offline-operator-auth
    paths:
      - .github/workflows/tmp-auth-prettier.yml
      - e2e/local-auth.production.e2e.ts
      - playwright.local-auth.config.ts

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/188-offline-operator-auth
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --no-audit
        env:
          HUSKY: "0"
      - run: npm exec prettier -- --write e2e/local-auth.production.e2e.ts playwright.local-auth.config.ts
      - name: Commit exact formatter result
        shell: bash
        run: |
          set -Eeuo pipefail
          if git diff --quiet -- e2e/local-auth.production.e2e.ts playwright.local-auth.config.ts; then
            echo "Exact Prettier output already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/local-auth.production.e2e.ts playwright.local-auth.config.ts
          git commit -m "style(auth): apply exact prettier output"
          git push origin HEAD:feat/188-offline-operator-auth
