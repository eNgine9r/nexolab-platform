name: Temporary Auth Prettier

on:
  push:
    branches:
      - feat/188-offline-operator-auth
    paths:
      - .github/workflows/tmp-auth-prettier.yml
      - e2e/local-auth.production.e2e.ts
      - playwright.local-auth.config.ts

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --no-audit
        env:
          HUSKY: "0"
      - run: npm exec prettier -- --write e2e/local-auth.production.e2e.ts playwright.local-auth.config.ts
      - uses: actions/upload-artifact@v4
        with:
          name: auth-prettier-output-${{ github.sha }}
          path: |
            e2e/local-auth.production.e2e.ts
            playwright.local-auth.config.ts
          if-no-files-found: error
          retention-days: 1
