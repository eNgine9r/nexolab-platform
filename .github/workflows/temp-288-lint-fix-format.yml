name: Temporary Issue 288 Lint Fix Formatter

on:
  push:
    branches:
      - feat/288-live-dashboard-workspace
    paths:
      - .github/workflows/temp-288-lint-fix-format.yml

permissions:
  contents: write

jobs:
  format-and-self-delete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/288-live-dashboard-workspace
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Format lint-fixed files
        run: >-
          npx prettier --write
          src/components/live-dashboards/dashboard-live-view.tsx
          src/hooks/use-live-dashboard-inventory.ts
          src/hooks/use-live-dashboard-library.ts
          src/hooks/use-live-dashboard-telemetry.ts
      - name: Remove temporary workflow and publish
        run: |
          rm .github/workflows/temp-288-lint-fix-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/live-dashboards/dashboard-live-view.tsx src/hooks/use-live-dashboard-inventory.ts src/hooks/use-live-dashboard-library.ts src/hooks/use-live-dashboard-telemetry.ts .github/workflows/temp-288-lint-fix-format.yml
          git commit -m "style(live-dashboards): format lint fixes"
          git push origin HEAD:feat/288-live-dashboard-workspace
