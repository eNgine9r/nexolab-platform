name: Fix history lint

on:
  push:
    branches: [feat/authenticated-live-dashboard]

permissions:
  contents: write

concurrency:
  group: fix-history-lint
  cancel-in-progress: false

jobs:
  fix:
    if: "${{ !contains(github.event.head_commit.message, 'fix: resolve history chart hook dependency') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/authenticated-live-dashboard

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Apply fix
        run: python .github/scripts/fix-history-lint.py

      - name: Remove temporary automation
        run: |
          rm .github/scripts/fix-history-lint.py
          rm .github/workflows/fix-history-lint.yml
          rm .github/workflows/diagnose-history-lint.yml

      - name: Install dependencies
        env:
          HUSKY: 0
        run: npm install --no-audit

      - name: Format
        run: npm run format

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: resolve history chart hook dependency"
          git push origin HEAD:feat/authenticated-live-dashboard
