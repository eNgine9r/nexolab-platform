name: Format Playwright invariant once

on:
  push:
    branches:
      - maint/254-playwright-1-62
    paths:
      - .github/workflows/format-playwright-invariant-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: maint/254-playwright-1-62
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          package-manager-cache: false
          node-version-file: .nvmrc
      - env:
          HUSKY: 0
        run: npm install --no-audit
      - shell: bash
        run: |
          set -euo pipefail
          npx prettier --write e2e/telemetry-acquisition-invariant.production.e2e.ts
          rm .github/workflows/format-playwright-invariant-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            e2e/telemetry-acquisition-invariant.production.e2e.ts \
            .github/workflows/format-playwright-invariant-once.yml
          git commit -m "style(playwright): format acquisition invariant"
          git push origin HEAD:maint/254-playwright-1-62
