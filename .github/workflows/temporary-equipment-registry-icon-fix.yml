name: Temporary Equipment Registry Icon Fix

on:
  push:
    branches:
      - feat/267-equipment-metrology-registry
    paths:
      - ".github/workflows/temporary-equipment-registry-icon-fix.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feat/267-equipment-metrology-registry
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Apply static icon rendering fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          details = Path("src/components/equipment/equipment-asset-details.tsx")
          text = details.read_text()
          text = text.replace('  const CategoryIcon = categoryIcon(asset.category);\n\n', '')
          text = text.replace(
              '<CategoryIcon className="h-6 w-6 text-cyan-300" />',
              '{renderCategoryIcon(asset.category, "h-6 w-6 text-cyan-300")}',
          )
          old = '''function categoryIcon(category: EquipmentRegistryAsset["category"]) {
            return {
              "refrigeration-equipment": Refrigerator,
              "temperature-controller": Cpu,
              "energy-meter": Gauge,
              "physical-sensor": Thermometer,
            }[category];
          }
          '''
          new = '''function renderCategoryIcon(
            category: EquipmentRegistryAsset["category"],
            className: string,
          ) {
            switch (category) {
              case "refrigeration-equipment":
                return <Refrigerator className={className} />;
              case "temperature-controller":
                return <Cpu className={className} />;
              case "energy-meter":
                return <Gauge className={className} />;
              case "physical-sensor":
                return <Thermometer className={className} />;
            }
          }
          '''
          if old not in text:
              raise SystemExit("details icon helper pattern not found")
          details.write_text(text.replace(old, new))

          catalog = Path("src/components/equipment/equipment-registry-catalog.tsx")
          text = catalog.read_text()
          text = text.replace('  const CategoryIcon = assetIcon(asset.category);\n', '')
          text = text.replace(
              '<CategoryIcon className="h-4 w-4 text-cyan-300" />',
              '{renderAssetIcon(asset.category, "h-4 w-4 text-cyan-300")}',
          )
          old = '''function assetIcon(category: EquipmentRegistryAsset["category"]) {
            return {
              "refrigeration-equipment": Refrigerator,
              "temperature-controller": Cpu,
              "energy-meter": Gauge,
              "physical-sensor": Thermometer,
            }[category];
          }
          '''
          new = '''function renderAssetIcon(
            category: EquipmentRegistryAsset["category"],
            className: string,
          ) {
            switch (category) {
              case "refrigeration-equipment":
                return <Refrigerator className={className} />;
              case "temperature-controller":
                return <Cpu className={className} />;
              case "energy-meter":
                return <Gauge className={className} />;
              case "physical-sensor":
                return <Thermometer className={className} />;
            }
          }
          '''
          if old not in text:
              raise SystemExit("catalog icon helper pattern not found")
          catalog.write_text(text.replace(old, new))
          PY
          npm ci --ignore-scripts
          npx prettier --write \
            src/components/equipment/equipment-asset-details.tsx \
            src/components/equipment/equipment-registry-catalog.tsx
          rm .github/workflows/temporary-equipment-registry-icon-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/components/equipment/equipment-asset-details.tsx \
            src/components/equipment/equipment-registry-catalog.tsx \
            .github/workflows/temporary-equipment-registry-icon-fix.yml
          git commit -m "fix(equipment): render category icons statically"
          git push origin HEAD:feat/267-equipment-metrology-registry
