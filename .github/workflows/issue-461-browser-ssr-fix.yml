name: Issue 461 browser SSR harness fix

on:
  push:
    branches:
      - feat/461-hierarchical-telemetry-point-selector

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/461-hierarchical-telemetry-point-selector
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          HUSKY: '0'

      - name: Replace Playwright-transformed React SSR with isolated Node SSR
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("e2e/telemetry-acquisition-invariant.production.e2e.ts")
          text = path.read_text()
          text = text.replace('import { createElement } from "react";\nimport { renderToStaticMarkup } from "react-dom/server";\n\n', '', 1)
          text = text.replace('import { TelemetryPointSelector } from "../src/components/telemetry-selection/telemetry-point-selector";\n', '', 1)

          anchor = 'test("hierarchical telemetry selector stays bounded and side-effect free in production CSS", async ({\n'
          if anchor not in text:
              raise SystemExit("selector browser test anchor not found")

          helper = r'''
          type SelectorSsrResult = {
            markup: string;
            nodeCount: number;
            leafCount: number;
          };

          function renderSelectorMarkup(
            descriptors: TelemetryPointDescriptor[],
            selected: string[],
            expandedNodeIds: string[],
          ): SelectorSsrResult {
            const script = String.raw`
          const fs = require("node:fs");
          const path = require("node:path");
          const ts = require("typescript");
          const React = require("react");
          const { renderToStaticMarkup } = require("react-dom/server");

          const root = process.cwd();
          const temp = fs.mkdtempSync(path.join(root, ".tmp-selector-ssr-"));
          try {
            const hierarchySource = fs.readFileSync(
              path.join(root, "src/features/telemetry-selection/hierarchy.ts"),
              "utf8",
            );
            const selectorSource = fs
              .readFileSync(
                path.join(root, "src/components/telemetry-selection/telemetry-point-selector.tsx"),
                "utf8",
              )
              .replace(
                "@/features/telemetry-selection/hierarchy",
                "./hierarchy.js",
              );
            const compilerOptions = {
              module: ts.ModuleKind.CommonJS,
              target: ts.ScriptTarget.ES2022,
              jsx: ts.JsxEmit.ReactJSX,
              esModuleInterop: true,
            };
            const hierarchyOutput = ts.transpileModule(hierarchySource, { compilerOptions }).outputText;
            const selectorOutput = ts.transpileModule(selectorSource, { compilerOptions }).outputText;
            fs.writeFileSync(path.join(temp, "hierarchy.js"), hierarchyOutput);
            fs.writeFileSync(path.join(temp, "selector.js"), selectorOutput);

            const hierarchyModule = require(path.join(temp, "hierarchy.js"));
            const selectorModule = require(path.join(temp, "selector.js"));
            const input = JSON.parse(fs.readFileSync(0, "utf8"));
            const hierarchy = hierarchyModule.buildTelemetryPointHierarchy(
              input.descriptors,
              input.organizationId,
            );
            const markup = renderToStaticMarkup(
              React.createElement(selectorModule.TelemetryPointSelector, {
                hierarchy,
                value: input.selected,
                maxSelection: 8,
                maxVisibleNodes: 200,
                initialExpandedNodeIds: input.expandedNodeIds,
                onConfirm: () => undefined,
              }),
            );
            process.stdout.write(
              JSON.stringify({
                markup,
                nodeCount: hierarchy.nodeCount,
                leafCount: hierarchy.leafCount,
              }),
            );
          } finally {
            fs.rmSync(temp, { recursive: true, force: true });
          }
          `;
            const output = execFileSync(process.execPath, ["-e", script], {
              cwd: process.cwd(),
              encoding: "utf8",
              input: JSON.stringify({
                descriptors,
                organizationId: selectorOrganizationId,
                selected,
                expandedNodeIds,
              }),
              env: { ...process.env, NODE_ENV: "production" },
              maxBuffer: 10 * 1024 * 1024,
            });
            return JSON.parse(output) as SelectorSsrResult;
          }

          '''
          text = text.replace(anchor, helper + anchor, 1)

          old = '''  const hierarchy = buildTelemetryPointHierarchy(selectorInventory(), selectorOrganizationId);\n  const markup = renderToStaticMarkup(\n    createElement(TelemetryPointSelector, {\n      hierarchy,\n      value: [hierarchy.orderedLeafKeys[0]],\n      maxSelection: 8,\n      maxVisibleNodes: 200,\n      initialExpandedNodeIds: collectTelemetryPointBranchIds(hierarchy),\n      onConfirm: () => undefined,\n    }),\n  );\n'''
          new = '''  const inventory = selectorInventory();\n  const hierarchy = buildTelemetryPointHierarchy(inventory, selectorOrganizationId);\n  const selectorRender = renderSelectorMarkup(\n    inventory,\n    [hierarchy.orderedLeafKeys[0]],\n    collectTelemetryPointBranchIds(hierarchy),\n  );\n  expect(selectorRender.nodeCount, "SSR hierarchy node count").toBe(hierarchy.nodeCount);\n  expect(selectorRender.leafCount, "SSR hierarchy leaf count").toBe(hierarchy.leafCount);\n  const markup = selectorRender.markup;\n'''
          if old not in text:
              raise SystemExit("direct React SSR block not found")
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY

      - name: Format and verify corrected browser harness
        run: |
          npx prettier --write e2e/telemetry-acquisition-invariant.production.e2e.ts
          npx eslint e2e/telemetry-acquisition-invariant.production.e2e.ts --max-warnings=0
          npm run typecheck

      - name: Publish corrected browser harness
        run: |
          rm .github/workflows/issue-461-browser-ssr-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: isolate selector SSR from Playwright transform"
          git push origin HEAD:feat/461-hierarchical-telemetry-point-selector
