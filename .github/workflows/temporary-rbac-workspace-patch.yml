name: Temporary RBAC workspace patch

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'feat/production-auth-rbac-audit' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Apply permission-aware workspace patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/components/refrigeration/refrigeration-layout-workspace.tsx')
          text = path.read_text()

          replacements = [
              (
                  '  runtimeMode?: "demo" | "live";\n};',
                  '  runtimeMode?: "demo" | "live";\n  canWrite?: boolean;\n  canPublish?: boolean;\n  authenticationReady?: boolean;\n  authenticationMessage?: string | null;\n};',
              ),
              (
                  '  actorId: actorIdOverride,\n  runtimeMode,\n}: RefrigerationLayoutWorkspaceProps) {',
                  '  actorId: actorIdOverride,\n  runtimeMode,\n  canWrite = true,\n  canPublish = true,\n  authenticationReady = true,\n  authenticationMessage = null,\n}: RefrigerationLayoutWorkspaceProps) {',
              ),
              (
                  '  const loadWorkspace = useCallback(async () => {\n    if (!baseRepository) {',
                  '  const loadWorkspace = useCallback(async () => {\n    if (!authenticationReady) {\n      setWorkspaceState("ready");\n      setErrorMessage(\n        authenticationMessage ?? "Для production-схеми потрібна авторизована операторська сесія.",\n      );\n      return;\n    }\n\n    if (!baseRepository) {',
              ),
              (
                  '  }, [baseRepository, equipment.id, runtime.error]);',
                  '  }, [\n    authenticationMessage,\n    authenticationReady,\n    baseRepository,\n    equipment.id,\n    runtime.error,\n  ]);',
              ),
              (
                  '    if (!repository || !draft) return;\n\n    setActionState("attaching");',
                  '    if (!canWrite || !repository || !draft) return;\n\n    setActionState("attaching");',
              ),
              (
                  '    if (!file || !repository || !draft) return;',
                  '    if (!canWrite || !file || !repository || !draft) return;',
              ),
              (
                  '    if (!repository || !draft || actionState !== "idle") return;\n    clearFeedback();\n    if (mode === "edit") {',
                  '    if (!canPublish || !repository || !draft || actionState !== "idle") return;\n    clearFeedback();\n    if (mode === "edit") {',
              ),
              (
                  '  const handleRestore = async (revision: PublishedLayoutRevision) => {\n    if (!repository || !draft || actionState !== "idle") return;',
                  '  const handleRestore = async (revision: PublishedLayoutRevision) => {\n    if (!canPublish || !repository || !draft || actionState !== "idle") return;',
              ),
              (
                  '          mode={mode}\n          onModeChange={onModeChange}',
                  '          mode={canWrite ? mode : "view"}\n          onModeChange={(nextMode) => onModeChange(canWrite ? nextMode : "view")}',
              ),
              (
                  '          pendingImage={pendingImage}\n          inputRef={photoInputRef}',
                  '          pendingImage={pendingImage}\n          canWrite={canWrite}\n          inputRef={photoInputRef}',
              ),
              (
                  '          mode={mode}\n          onPublish={() => void handlePublish()}',
                  '          mode={mode}\n          canPublish={canPublish}\n          onPublish={() => void handlePublish()}',
              ),
              (
                  '          mode={mode}\n          onRestore={(revision) => void handleRestore(revision)}',
                  '          mode={mode}\n          canRestore={canPublish}\n          onRestore={(revision) => void handleRestore(revision)}',
              ),
              (
                  '  pendingImage,\n  inputRef,',
                  '  pendingImage,\n  canWrite,\n  inputRef,',
              ),
              (
                  '  pendingImage: EquipmentImageMetadata | null;\n  inputRef:',
                  '  pendingImage: EquipmentImageMetadata | null;\n  canWrite: boolean;\n  inputRef:',
              ),
              (
                  '  const disabled = mode === "edit" || actionState !== "idle";',
                  '  const disabled = !canWrite || mode === "edit" || actionState !== "idle";',
              ),
              (
                  '        aria-label="Вибрати production-фото обладнання"\n        onChange={onChange}',
                  '        aria-label="Вибрати production-фото обладнання"\n        disabled={!canWrite}\n        onChange={onChange}',
              ),
              (
                  '      {mode === "edit" ? (\n        <p className="mt-2 text-[9px] text-amber-300">Збережіть позиції датчиків перед заміною фото.</p>\n      ) : null}',
                  '      {!canWrite ? (\n        <p className="mt-2 text-[9px] text-slate-500">Потрібен дозвіл layouts.write.</p>\n      ) : mode === "edit" ? (\n        <p className="mt-2 text-[9px] text-amber-300">Збережіть позиції датчиків перед заміною фото.</p>\n      ) : null}',
              ),
              (
                  '  mode,\n  onPublish,\n}: {\n  draft:',
                  '  mode,\n  canPublish,\n  onPublish,\n}: {\n  draft:',
              ),
              (
                  '  mode: LayoutEditorMode;\n  onPublish: () => void;',
                  '  mode: LayoutEditorMode;\n  canPublish: boolean;\n  onPublish: () => void;',
              ),
              (
                  '        disabled={busy || mode === "edit" || !draft.imageId}',
                  '        disabled={!canPublish || busy || mode === "edit" || !draft.imageId}',
              ),
              (
                  '  mode,\n  onRestore,\n}: {\n  items:',
                  '  mode,\n  canRestore,\n  onRestore,\n}: {\n  items:',
              ),
              (
                  '  mode: LayoutEditorMode;\n  onRestore: (revision: PublishedLayoutRevision) => void;',
                  '  mode: LayoutEditorMode;\n  canRestore: boolean;\n  onRestore: (revision: PublishedLayoutRevision) => void;',
              ),
              (
                  '                disabled={busy || mode === "edit"}',
                  '                disabled={!canRestore || busy || mode === "edit"}',
              ),
          ]

          changed = False
          for old, new in replacements:
              if old in text:
                  text = text.replace(old, new, 1)
                  changed = True
              elif new not in text:
                  raise SystemExit(f'missing expected pattern: {old[:100]!r}')

          if changed:
              path.write_text(text)
          PY

          npx prettier --write src/components/refrigeration/refrigeration-layout-workspace.tsx

      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo 'No workspace patch required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/refrigeration/refrigeration-layout-workspace.tsx
          git commit -m 'feat(auth): enforce refrigeration layout permissions'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
