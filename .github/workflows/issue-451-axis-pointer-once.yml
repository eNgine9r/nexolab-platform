name: Issue 451 AxisPointer Once

on:
  push:
    branches:
      - fix/451-chart-integrity-alarm-provenance

permissions:
  contents: write

jobs:
  patch-once:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - name: Register ECharts AxisPointer component and retire workflow
        shell: python
        run: |
          from pathlib import Path
          path = Path("src/features/charts/echarts-adapter.ts")
          text = path.read_text()
          text = text.replace(
              '  AriaComponent,\n  DataZoomComponent,',
              '  AriaComponent,\n  AxisPointerComponent,\n  DataZoomComponent,',
              1,
          )
          text = text.replace(
              '  AriaComponent,\n  DataZoomComponent,',
              '  AriaComponent,\n  AxisPointerComponent,\n  DataZoomComponent,',
              1,
          )
          path.write_text(text)
      - name: Commit focused product patch
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/issue-451-axis-pointer-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/charts/echarts-adapter.ts
          git diff --cached --check
          git commit -m "fix(charts): register ECharts AxisPointer interaction"
          git push origin HEAD:fix/451-chart-integrity-alarm-provenance
