name: Nodes Browser Acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - "src/features/display-time/**"
      - "src/hooks/use-display-time-zone*"
      - "src/hooks/use-settings-preferences*"
      - ".github/workflows/nodes-browser-acceptance.yml"
      - "e2e/nodes.production.e2e.ts"
      - "playwright.nodes.config.ts"
      - "scripts/resolve-playwright-browser.sh"
      - "scripts/run-nodes-browser-acceptance.sh"
      - "package.json"
      - "package-lock.json"
      - "src/app/nodes/**"
      - "src/components/nodes/**"
      - "src/components/dashboard/sidebar.tsx"
      - "src/features/security/**"
      - "src/hooks/use-dashboard-security.ts"
      - "src/lib/nodes/**"
      - "services/telemetry-service/app/nodes/**"
      - "services/telemetry-service/app/security/**"
      - "services/telemetry-service/app/ingestion.py"
      - "services/telemetry-service/app/main.py"
      - "services/telemetry-service/app/model_registry.py"
      - "services/telemetry-service/migrations/versions/20260726_0014_add_central_node_registry.py"
      - "infrastructure/compose/compose.central.yaml"
      - "infrastructure/object-storage/**"
      - "scripts/object-storage-s3.py"
      - "infrastructure/compose/compose.browser-acceptance.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nodes-browser-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nodes-browser-acceptance:
    name: Next.js + FastAPI + PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        env:
          HUSKY: 0
        run: npm ci --no-audit --fund=false

      - name: Resolve preinstalled Chrome
        shell: bash
        run: |
          browser_path="$(bash scripts/resolve-playwright-browser.sh)"
          printf 'PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=%s\n' "$browser_path" >> "$GITHUB_ENV"
          "$browser_path" --version
          npx playwright install ffmpeg

      - name: Run nodes browser acceptance
        run: |
          chmod +x scripts/run-nodes-browser-acceptance.sh
          scripts/run-nodes-browser-acceptance.sh

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nodes-browser-acceptance-evidence
          path: |
            test-results-nodes
            playwright-report-nodes
            /tmp/nexolab-nodes-acceptance-frontend.log
            /tmp/nexolab-nodes-acceptance-services.log
          if-no-files-found: warn
          retention-days: 14
