name: Finalize broker control MQTT TLS

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/finalize-broker-control-mqtt-tls.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Apply deterministic production patch and tests
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          workflow = Path(".github/workflows/patch-broker-control-mqtt-tls.yml")
          source = workflow.read_text(encoding="utf-8")

          def extract_run(step_name: str, next_step_name: str) -> str:
              step_marker = f"      - name: {step_name}\n"
              next_marker = f"      - name: {next_step_name}\n"
              start = source.index(step_marker)
              start = source.index("        run: |\n", start) + len("        run: |\n")
              end = source.index(next_marker, start)
              block = source[start:end]
              return "\n".join(
                  line[10:] if line.startswith("          ") else line
                  for line in block.splitlines()
              ) + "\n"

          for name, next_name in (
              (
                  "Wire broker-control TLS production code",
                  "Add broker-control TLS tests",
              ),
              (
                  "Add broker-control TLS tests",
                  "Validate broker-control TLS wiring",
              ),
          ):
              subprocess.run(
                  ["bash", "-Eeuo", "pipefail", "-c", extract_run(name, next_name)],
                  check=True,
              )

          adapter_path = Path(
              "services/telemetry-service/app/nodes/broker_adapter.py"
          )
          adapter = adapter_path.read_text(encoding="utf-8")
          marker = "self._tls_config = tls_config or MQTTTLSConfig(enabled=False)"
          marker_index = adapter.index(marker)
          block_start = adapter.rfind("\n", 0, marker_index) + 1
          block_end = adapter.index("    def apply(", marker_index)
          tls_block = '''        self._tls_config = tls_config or MQTTTLSConfig(enabled=False)
          self._environment["NEXOLAB_MQTT_TLS_REQUIRED"] = (
              "true" if self._tls_config.enabled else "false"
          )
          if self._tls_config.enabled:
              if self._tls_config.ca_file is None:
                  raise BrokerControlAdapterError(
                      "broker_admin_tls_invalid",
                      "broker administrator TLS CA is unavailable",
                      retryable=False,
                  )
              certificate_file = self._tls_config.client_certificate_file
              key_file = self._tls_config.client_key_file
              if (certificate_file is None) != (key_file is None):
                  raise BrokerControlAdapterError(
                      "broker_admin_tls_invalid",
                      "broker administrator TLS client identity is incomplete",
                      retryable=False,
                  )
              self._environment["NEXOLAB_MQTT_TLS_CA_FILE"] = str(
                  self._tls_config.ca_file
              )
              if certificate_file is not None and key_file is not None:
                  self._environment["NEXOLAB_MQTT_TLS_CERT_FILE"] = str(
                      certificate_file
                  )
                  self._environment["NEXOLAB_MQTT_TLS_KEY_FILE"] = str(key_file)

          '''
          adapter_path.write_text(
              adapter[:block_start] + tls_block + adapter[block_end:],
              encoding="utf-8",
          )

          test_path = Path(
              "services/telemetry-service/tests/test_node_broker_adapter_tls.py"
          )
          tests = test_path.read_text(encoding="utf-8")
          anchor = ") -> tuple[subprocess.CompletedProcess[str], Path]:\n    root = Path(__file__).resolve().parents[3]\n"
          replacement = (
              ") -> tuple[subprocess.CompletedProcess[str], Path]:\n"
              "    tmp_path.mkdir(parents=True, exist_ok=True)\n"
              "    root = Path(__file__).resolve().parents[3]\n"
          )
          if anchor not in tests:
              raise SystemExit("broker-control TLS test harness anchor not found")
          test_path.write_text(tests.replace(anchor, replacement, 1), encoding="utf-8")
          PY

      - name: Validate broker-control TLS wiring
        working-directory: services/telemetry-service
        run: |
          set -o pipefail
          {
            python -m pip install -r requirements-dev.txt
            python -m compileall -q app tests
            sh -n ../../infrastructure/mqtt/dynamic-security/dynsec-admin.sh
            sh -n bin/nexolab-dynsec-admin
            cmp ../../infrastructure/mqtt/dynamic-security/dynsec-admin.sh \
              bin/nexolab-dynsec-admin
            python -m pytest -q \
              tests/test_node_broker_adapter.py \
              tests/test_node_broker_adapter_tls.py \
              tests/test_mqtt_tls.py \
              tests/test_mqtt_tls_integration.py
          } 2>&1 | tee /tmp/broker-control-tls-validation.log

      - name: Upload broker-control TLS diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: broker-control-tls-validation
          path: /tmp/broker-control-tls-validation.log
          if-no-files-found: error
          retention-days: 7

      - name: Commit broker-control TLS wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            services/telemetry-service/app/main.py \
            services/telemetry-service/app/nodes/broker_adapter.py \
            services/telemetry-service/bin/nexolab-dynsec-admin \
            services/telemetry-service/tests/test_node_broker_adapter_tls.py \
            infrastructure/mqtt/dynamic-security/dynsec-admin.sh
          git commit -m "feat: enforce TLS for broker control administration"
          git push origin "HEAD:${{ github.head_ref }}"
