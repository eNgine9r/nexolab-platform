name: Temporary Issue 606 finalization

on:
  push:
    branches:
      - tmp/606-finalization-20260821

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconcile Issue 606 state
        shell: bash
        run: |
          python3 - <<'PY'
          from __future__ import annotations

          import json
          from datetime import UTC, datetime
          from pathlib import Path

          MAIN = "aab4b1e805507be05e90eb19766bd176a4000828"
          HARDWARE = "804d0b44045a5099c59149c87b70cbf63ca047f8"
          PRE_FINAL_GREEN = "69a9ae0072cd279ff905a1a4e918b0a1efa041a1"
          SOFTWARE = "e94f140906589c8f23ae3c1d915fa709c50acc6f"

          current_path = Path(".project/CURRENT_STATE.md")
          current = current_path.read_text(encoding="utf-8")
          old_baseline = (
              "Exact repository `main` and `origin/main` are now "
              "`bf9105cbdef6f614d50d8bff60d245980b89c100`, the GREEN merge of PR #638 / Issue #637 "
              "restoring the telemetry Debian security baseline."
          )
          new_baseline = (
              "Exact repository `main` and `origin/main` are now "
              f"`{MAIN}`, the GREEN merge of PR #640 / Issue #639 stabilizing the Offline Auth "
              "PostgreSQL startup gate on top of the PR #638 / Issue #637 security baseline."
          )
          assert old_baseline in current
          current = current.replace(old_baseline, new_baseline, 1)

          old_issue_intro = (
              "Issue #606 remains the active Work Package only for final state reconciliation\n"
              "and merge. PR #632 product implementation head `804d0b44045a5099c59149c87b70cbf63ca047f8` is software\n"
              "verified and real Raspberry Pi / LOCAL_LAN verified."
          )
          new_issue_intro = (
              "Issue #606 remains the active Work Package only for the final PR merge gate.\n"
              f"Hardware/LAN acceptance remains anchored to product head `{HARDWARE}`. Post-acceptance\n"
              f"review hardening is complete at software head `{SOFTWARE}`; this later head changes only\n"
              "software failure/cancellation handling and does not add application payload, Modbus access,\n"
              "hardware writes, broader discovery scope, or production cutover behavior. A repeat physical\n"
              "LAN scan is therefore neither required nor authorized by this reconciliation."
          )
          assert old_issue_intro in current
          current = current.replace(old_issue_intro, new_issue_intro, 1)

          old_remaining = (
              "The remaining #606 path is state-only: publish this reconciliation, resolve\n"
              "the stale sprint-state review thread, verify the final state head checks, then\n"
              "merge PR #632. Production remains on `6e387485b68fb862d9f82ae7f6000b1f5b672764` until a separate\n"
              "authorized deployment/cutover."
          )
          new_remaining = (
              f"The pre-final software head `{PRE_FINAL_GREEN}` completed all 22 pull-request workflows GREEN.\n"
              f"The final software hardening head is `{SOFTWARE}`. The only remaining #606 path is to publish\n"
              "the reconciled final branch head once, run its exact-head required checks, confirm review is clean,\n"
              "then merge PR #632 and close Issue #606. Production remains on\n"
              "`6e387485b68fb862d9f82ae7f6000b1f5b672764` until a separately authorized deployment/cutover."
          )
          assert old_remaining in current
          current = current.replace(old_remaining, new_remaining, 1)

          old_boundary = (
              "Current product Work Package: **Issue #606 — LOCAL_LAN discovery/adoption inbox, PR #632 implementation head `628e34725fe116c4f38e2b0862769d296afa3666` with exact-head CI in progress**.\n\n"
              "Next action: complete final exact-head PR #632 CI/review, then obtain Product Owner approval for the exact LAN CIDR(s) and TCP port(s) before any real discovery scan. Run bounded Raspberry Pi/LAN acceptance only inside that approved scope, prove acquisition invariance/offline behavior, and merge only when required checks and runtime evidence are GREEN."
          )
          new_boundary = (
              f"Current product Work Package: **Issue #606 — LOCAL_LAN discovery/adoption inbox, PR #632 final software hardening head `{SOFTWARE}`**. Real Product Owner-authorized Raspberry Pi/LAN acceptance is already complete on hardware-accepted head `{HARDWARE}`; pre-final software head `{PRE_FINAL_GREEN}` is 22/22 GREEN.\n\n"
              "Next action: publish the single reconciled final PR #632 branch head, run its exact-head required checks, resolve only genuinely fixed review threads, confirm no new P1/P2 blocker, then squash-merge PR #632 and close Issue #606. Do **not** repeat the completed LAN acceptance for this software-only hardening."
          )
          assert old_boundary in current
          current = current.replace(old_boundary, new_boundary, 1)
          current_path.write_text(current, encoding="utf-8")

          blockers_path = Path(".project/BLOCKERS.md")
          blockers = blockers_path.read_text(encoding="utf-8")
          old_blocker = '''## Issue #606 — GREEN; state reconciliation and merge only

PR #632 product head `804d0b44045a5099c59149c87b70cbf63ca047f8` is GREEN in all 22 pull-request
workflows. Real Product Owner-authorized bounded Raspberry Pi / LOCAL_LAN
acceptance is PASS: five explicit hosts, two allowed TCP ports, 10 connect
attempts, zero application payload, production healthy before/after and no
increase in physical acquisition cadence. Raspberry Pi boot continuity also
passed.

There is no remaining product, software, LAN or hardware-acceptance blocker
for #606. Remaining work is state-only: commit reconciliation, resolve the
stale sprint-state review thread, verify the resulting state-head checks and
merge PR #632.

No Modbus read/write command, hardware write, unrestricted scan, credential
attempt, production deployment or site cutover was performed.'''
          new_blocker = f'''## Issue #606 — final software hardening complete; merge gate only

PR #632 hardware/LAN-accepted product head `{HARDWARE}` remains fully accepted:
five explicit hosts, two allowed TCP ports, 10 connect attempts, zero application
payload, production healthy before/after, unchanged Raspberry Pi boot identity and
no increase in physical acquisition cadence. Pre-final software head
`{PRE_FINAL_GREEN}` completed all 22 pull-request workflows GREEN.

Post-acceptance review hardening is complete at software head `{SOFTWARE}`. The
latest change bounds cancellation by total probe count and checks cancellation
between bounded port batches; it does not add application payload, Modbus access,
hardware writes, broader scan scope or deployment behavior. No repeat physical LAN
acceptance is required for this software-only correction.

There is no product, LAN or hardware blocker for #606. Remaining work is the single
final state-head CI/review merge gate for PR #632, followed by Issue #606 closure.

No Modbus read/write command, hardware write, unrestricted scan, credential
attempt, production deployment or site cutover was performed.'''
          assert old_blocker in blockers
          blockers = blockers.replace(old_blocker, new_blocker, 1)
          blockers_path.write_text(blockers, encoding="utf-8")

          active_path = Path(".project/ACTIVE_SPRINT.json")
          active = json.loads(active_path.read_text(encoding="utf-8"))
          active["last_reconciled_repository_sha"] = MAIN
          selection = active["selection_state"]
          selection["selection_status"] = "pr_632_final_software_hardening_state_and_merge_gate"
          selection["reason"] = (
              f"Issue #606 hardware/LAN acceptance remains PASS at {HARDWARE}. "
              f"Pre-final software head {PRE_FINAL_GREEN} is 22/22 GREEN and post-acceptance "
              f"review hardening is complete at {SOFTWARE}. The remaining gate is one reconciled "
              "final PR head CI/review pass and merge; no repeat LAN scan is required. Issue #633 is next."
          )
          task606 = next(task for task in active["tasks"] if task.get("issue") == 606)
          task606["status"] = "pr_632_final_software_hardening_state_and_merge_gate"
          task606["checkpoint_sha"] = SOFTWARE
          task606["exact_head_sha"] = SOFTWARE
          task606["hardware_accepted_head_sha"] = HARDWARE
          task606["pre_final_green_head_sha"] = PRE_FINAL_GREEN
          task606["pre_final_software_workflows"] = "PASS_22_OF_22"
          task606["real_pi_lan_acceptance"] = "PASS_BOUNDED_ZERO_PAYLOAD_AT_804D0B44"

          awp = active["active_work_package"]
          awp["status"] = "pr_632_final_software_hardening_state_and_merge_gate"
          awp["exact_head_sha"] = SOFTWARE
          awp["hardware_accepted_head_sha"] = HARDWARE
          awp["pre_final_green_head_sha"] = PRE_FINAL_GREEN

          verification = active["verification"]
          verification["issue_606_exact_head_sha"] = SOFTWARE
          verification["issue_606_real_pi_lan_acceptance"] = "PASS_BOUNDED_ZERO_PAYLOAD_AT_804D0B44"
          verification["issue_606_hardware_accepted_head_sha"] = HARDWARE
          verification["issue_606_pre_final_green_head_sha"] = PRE_FINAL_GREEN
          verification["issue_606_pre_final_all_workflows"] = "PASS_22_OF_22"
          verification["issue_606_final_state_head_workflows"] = "PENDING_SINGLE_BRANCH_REF_MOVE"
          for lane in active["independent_pending_lanes"]:
              if lane.get("issue") == 606:
                  lane["status"] = "active_pr_632_final_software_and_lan_acceptance_green_merge_gate"
                  break
          active_path.write_text(json.dumps(active, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          checkpoint_path = Path(".project/LAST_CHECKPOINT.json")
          checkpoint = json.loads(checkpoint_path.read_text(encoding="utf-8"))
          checkpoint["timestamp"] = datetime.now(UTC).isoformat().replace("+00:00", "Z")
          checkpoint["event"] = "issue_606_final_software_hardening_state_merge_gate"
          checkpoint["repository_main_sha"] = MAIN
          boundary = checkpoint["current_boundary"]
          boundary["status"] = "PR_632_FINAL_SOFTWARE_HARDENING_STATE_MERGE_GATE"
          boundary["implementation_head_sha"] = SOFTWARE
          boundary["hardware_accepted_head_sha"] = HARDWARE
          boundary["pre_final_green_head_sha"] = PRE_FINAL_GREEN
          checkpoint["next_action"] = (
              "Publish the single reconciled final PR #632 branch head, verify exact-head required checks "
              "and clean review, squash-merge PR #632, close Issue #606, then perform the Ready audit with "
              "Issue #633 expected next. Do not repeat the completed physical LAN acceptance."
          )
          progress = checkpoint["in_progress_work"]["issue_606"]
          progress["implementation_head_sha"] = SOFTWARE
          progress["hardware_accepted_head_sha"] = HARDWARE
          progress["pre_final_green_head_sha"] = PRE_FINAL_GREEN
          progress["status"] = "FINAL_SOFTWARE_HARDENING_STATE_MERGE_GATE"
          active_work = checkpoint["active_work"]["issue_606"]
          active_work["implementation_head_sha"] = SOFTWARE
          active_work["hardware_accepted_head_sha"] = HARDWARE
          active_work["pre_final_green_head_sha"] = PRE_FINAL_GREEN
          active_work["status"] = "FINAL_SOFTWARE_HARDENING_STATE_MERGE_GATE"
          checkpoint["issue_606_ci"] = {
              "pre_final_green_head_sha": PRE_FINAL_GREEN,
              "core_ci": "PASS_32482107239",
              "authenticated_dashboard_acceptance": "PASS_32482107160",
              "offline_bundle": "PASS_32482107009",
              "telemetry_service": "PASS_32482106996",
              "acquisition_scale": "PASS_32482106997",
              "device_agent_fleet": "PASS_32482107182",
              "container_supply_chain": "PASS_32482107003",
              "offline_auth": "PASS_32482107028",
              "all_pre_final_head_workflows": "PASS_22_OF_22",
              "final_software_head_sha": SOFTWARE,
              "final_state_head_workflows": "PENDING_SINGLE_BRANCH_REF_MOVE",
          }
          checkpoint_path.write_text(
              json.dumps(checkpoint, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )
          PY

          python3 -m json.tool .project/ACTIVE_SPRINT.json >/dev/null
          python3 -m json.tool .project/LAST_CHECKPOINT.json >/dev/null
          git diff --check

          git config user.name "nexolab-state-bot"
          git config user.email "noreply@github.com"
          git rm .github/workflows/tmp-issue-606-finalize.yml
          git add .project/CURRENT_STATE.md .project/ACTIVE_SPRINT.json .project/BLOCKERS.md .project/LAST_CHECKPOINT.json
          git commit -m "chore: reconcile Issue 606 final merge gate"
          git push origin HEAD:tmp/606-finalization-20260821
