name: Node Health Format

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/node-health-format.yml"

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Install dependencies
        env:
          HUSKY: 0
        run: npm ci --no-audit

      - name: Format and verify
        env:
          HUSKY: 0
        run: |
          npx prettier --write \
            e2e/nodes.production.e2e.ts \
            infrastructure/compose/compose.central.yaml \
            src/components/nodes/node-operational-panel.tsx \
            src/components/nodes/nodes-workspace.tsx \
            src/lib/nodes/api-client.ts \
            src/lib/nodes/types.ts
          npm run format:check
          npm run lint
          npm run typecheck
          npm test

      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            e2e/nodes.production.e2e.ts \
            infrastructure/compose/compose.central.yaml \
            src/components/nodes/node-operational-panel.tsx \
            src/components/nodes/nodes-workspace.tsx \
            src/lib/nodes/api-client.ts \
            src/lib/nodes/types.ts
          git diff --cached --quiet && exit 0
          git -c core.hooksPath=/dev/null commit -m "style: format node health acceptance changes"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
