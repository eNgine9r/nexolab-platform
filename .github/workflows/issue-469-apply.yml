name: Temporary Issue 469 implementation helper

on:
  push:
    branches:
      - fix/469-raspberry-pi-deployment-evidence-capacity

permissions:
  contents: write

jobs:
  implement-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply focused deployment-capacity implementation
        shell: bash
        run: |
          set -Eeuo pipefail

          cat > scripts/deploy-capacity-guard.sh <<'EOF_HELPER'
          #!/usr/bin/env bash

          nexolab_capacity_uint() {
            local name=$1
            local value=$2
            local default_value=$3
            if [[ -z "$value" ]]; then
              value=$default_value
            fi
            if [[ ! "$value" =~ ^[0-9]+$ ]]; then
              printf 'ERROR: %s must be a non-negative integer, got %q\n' "$name" "$value" >&2
              return 64
            fi
            printf '%s\n' "$value"
          }

          nexolab_capacity_path_bytes() {
            local path=$1
            if [[ ! -e "$path" ]]; then
              printf '0\n'
              return 0
            fi
            du -sb -- "$path" | awk '{print $1}'
          }

          nexolab_capacity_free_bytes() {
            local path=$1
            df -PB1 -- "$path" | awk 'NR == 2 {print $4}'
          }

          nexolab_capacity_scaled_bytes() {
            local bytes=$1
            local percent=$2
            local fixed_overhead=$3
            printf '%s\n' "$(( (bytes * percent + 99) / 100 + fixed_overhead ))"
          }

          nexolab_capacity_deployment_bytes() {
            local deployments_dir=$1
            local total=0
            local dir base bytes
            [[ -d "$deployments_dir" ]] || {
              printf '0\n'
              return 0
            }
            while IFS= read -r dir; do
              base="$(basename "$dir")"
              [[ "$base" =~ ^[0-9]{8}T[0-9]{6}Z$ ]] || continue
              [[ ! -L "$dir" ]] || continue
              bytes="$(nexolab_capacity_path_bytes "$dir")"
              total=$((total + bytes))
            done < <(find "$deployments_dir" -mindepth 1 -maxdepth 1 -type d -print | LC_ALL=C sort)
            printf '%s\n' "$total"
          }

          nexolab_prune_deployment_evidence() {
            local deployments_dir=$1
            local current_audit_dir=$2
            local protected_count max_count max_age_days max_bytes
            protected_count="$(nexolab_capacity_uint NEXOLAB_DEPLOY_EVIDENCE_PROTECTED_COUNT "${NEXOLAB_DEPLOY_EVIDENCE_PROTECTED_COUNT:-}" 3)" || return $?
            max_count="$(nexolab_capacity_uint NEXOLAB_DEPLOY_EVIDENCE_MAX_COUNT "${NEXOLAB_DEPLOY_EVIDENCE_MAX_COUNT:-}" 12)" || return $?
            max_age_days="$(nexolab_capacity_uint NEXOLAB_DEPLOY_EVIDENCE_MAX_AGE_DAYS "${NEXOLAB_DEPLOY_EVIDENCE_MAX_AGE_DAYS:-}" 30)" || return $?
            max_bytes="$(nexolab_capacity_uint NEXOLAB_DEPLOY_EVIDENCE_MAX_BYTES "${NEXOLAB_DEPLOY_EVIDENCE_MAX_BYTES:-}" 3221225472)" || return $?

            (( max_count >= protected_count )) || {
              printf 'ERROR: deployment evidence max count must be >= protected count\n' >&2
              return 64
            }
            [[ -d "$deployments_dir" ]] || return 0

            local -a dirs=()
            local dir base
            while IFS= read -r dir; do
              base="$(basename "$dir")"
              [[ "$base" =~ ^[0-9]{8}T[0-9]{6}Z$ ]] || continue
              [[ ! -L "$dir" ]] || continue
              dirs+=("$dir")
            done < <(find "$deployments_dir" -mindepth 1 -maxdepth 1 -type d -print | LC_ALL=C sort)

            local count=${#dirs[@]}
            (( count > 0 )) || return 0

            local total=0
            local -a sizes=()
            local bytes
            for dir in "${dirs[@]}"; do
              bytes="$(nexolab_capacity_path_bytes "$dir")"
              sizes+=("$bytes")
              total=$((total + bytes))
            done

            local now
            now="$(date +%s)"
            local protected_from=$((count - protected_count))
            (( protected_from < 0 )) && protected_from=0
            local max_count_from=$((count - max_count))
            (( max_count_from < 0 )) && max_count_from=0

            local index mtime age_expired count_expired size_exceeded reason
            for ((index = 0; index < count; index += 1)); do
              dir="${dirs[$index]}"
              [[ "$dir" != "$current_audit_dir" ]] || continue
              [[ ! -e "$dir/.nexolab-preserve" ]] || continue
              (( index < protected_from )) || continue

              mtime="$(stat -c %Y -- "$dir")"
              age_expired=false
              count_expired=false
              size_exceeded=false
              if (( max_age_days > 0 && now - mtime > max_age_days * 86400 )); then
                age_expired=true
              fi
              if (( max_count > 0 && index < max_count_from )); then
                count_expired=true
              fi
              if (( max_bytes > 0 && total > max_bytes )); then
                size_exceeded=true
              fi
              if [[ "$age_expired" != true && "$count_expired" != true && "$size_exceeded" != true ]]; then
                continue
              fi

              base="$(basename "$dir")"
              [[ "$base" =~ ^[0-9]{8}T[0-9]{6}Z$ ]] || {
                printf 'ERROR: refusing to prune non-deployment path: %s\n' "$dir" >&2
                return 70
              }
              [[ "$(dirname "$dir")" == "$deployments_dir" ]] || {
                printf 'ERROR: refusing to prune path outside deployment evidence root: %s\n' "$dir" >&2
                return 70
              }

              reason=""
              [[ "$age_expired" == true ]] && reason="${reason}age,"
              [[ "$count_expired" == true ]] && reason="${reason}count,"
              [[ "$size_exceeded" == true ]] && reason="${reason}size,"
              reason="${reason%,}"
              bytes="${sizes[$index]}"
              rm -rf -- "$dir"
              total=$((total - bytes))
              printf 'Pruned deployment evidence: %s bytes=%s reason=%s\n' "$dir" "$bytes" "$reason"
            done
          }

          NEXOLAB_CAPACITY_PG_SOURCE=none
          NEXOLAB_CAPACITY_PG_BYTES=0

          nexolab_capacity_measure_postgres() {
            local pg_container=$1
            local fallback_bytes=$2
            NEXOLAB_CAPACITY_PG_SOURCE=none
            NEXOLAB_CAPACITY_PG_BYTES=0
            [[ -n "$pg_container" ]] || return 0

            local measured
            measured="$(docker exec "$pg_container" sh -ec \
              'psql -At -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "SELECT pg_database_size(current_database());"' \
              2>/dev/null || true)"
            measured="${measured//$'\r'/}"
            measured="${measured//$'\n'/}"
            if [[ "$measured" =~ ^[0-9]+$ ]]; then
              NEXOLAB_CAPACITY_PG_SOURCE=live
              NEXOLAB_CAPACITY_PG_BYTES=$measured
            else
              NEXOLAB_CAPACITY_PG_SOURCE=fallback
              NEXOLAB_CAPACITY_PG_BYTES=$fallback_bytes
            fi
          }

          nexolab_capacity_preflight() {
            local repo=$1
            local audit_dir=$2
            local pg_container=${3:-}
            local report=$4

            local reserve_bytes build_headroom_bytes metadata_headroom_bytes
            local archive_percent archive_fixed_bytes pg_fallback_bytes pg_percent pg_fixed_bytes
            reserve_bytes="$(nexolab_capacity_uint NEXOLAB_DEPLOY_MIN_FREE_RESERVE_BYTES "${NEXOLAB_DEPLOY_MIN_FREE_RESERVE_BYTES:-}" 2147483648)" || return $?
            build_headroom_bytes="$(nexolab_capacity_uint NEXOLAB_DEPLOY_BUILD_HEADROOM_BYTES "${NEXOLAB_DEPLOY_BUILD_HEADROOM_BYTES:-}" 4294967296)" || return $?
            metadata_headroom_bytes="$(nexolab_capacity_uint NEXOLAB_DEPLOY_METADATA_HEADROOM_BYTES "${NEXOLAB_DEPLOY_METADATA_HEADROOM_BYTES:-}" 268435456)" || return $?
            archive_percent="$(nexolab_capacity_uint NEXOLAB_DEPLOY_ARCHIVE_ESTIMATE_PERCENT "${NEXOLAB_DEPLOY_ARCHIVE_ESTIMATE_PERCENT:-}" 110)" || return $?
            archive_fixed_bytes="$(nexolab_capacity_uint NEXOLAB_DEPLOY_ARCHIVE_FIXED_OVERHEAD_BYTES "${NEXOLAB_DEPLOY_ARCHIVE_FIXED_OVERHEAD_BYTES:-}" 67108864)" || return $?
            pg_fallback_bytes="$(nexolab_capacity_uint NEXOLAB_DEPLOY_POSTGRES_FALLBACK_BYTES "${NEXOLAB_DEPLOY_POSTGRES_FALLBACK_BYTES:-}" 1073741824)" || return $?
            pg_percent="$(nexolab_capacity_uint NEXOLAB_DEPLOY_POSTGRES_ESTIMATE_PERCENT "${NEXOLAB_DEPLOY_POSTGRES_ESTIMATE_PERCENT:-}" 110)" || return $?
            pg_fixed_bytes="$(nexolab_capacity_uint NEXOLAB_DEPLOY_POSTGRES_FIXED_OVERHEAD_BYTES "${NEXOLAB_DEPLOY_POSTGRES_FIXED_OVERHEAD_BYTES:-}" 67108864)" || return $?

            local evidence_bytes=0 archive_estimate=0
            if [[ -d "$repo/runtime/evidence" ]]; then
              evidence_bytes="$(nexolab_capacity_path_bytes "$repo/runtime/evidence")"
              archive_estimate="$(nexolab_capacity_scaled_bytes "$evidence_bytes" "$archive_percent" "$archive_fixed_bytes")"
            fi

            nexolab_capacity_measure_postgres "$pg_container" "$pg_fallback_bytes"
            local pg_estimate=0
            if (( NEXOLAB_CAPACITY_PG_BYTES > 0 )); then
              pg_estimate="$(nexolab_capacity_scaled_bytes "$NEXOLAB_CAPACITY_PG_BYTES" "$pg_percent" "$pg_fixed_bytes")"
            fi

            local free_bytes required_bytes deployment_bytes npm_cache_bytes=0 npm_cache_path=""
            free_bytes="$(nexolab_capacity_free_bytes "$repo")"
            [[ "$free_bytes" =~ ^[0-9]+$ ]] || {
              printf 'ERROR: could not determine free bytes for %s\n' "$repo" >&2
              return 70
            }
            required_bytes=$((reserve_bytes + build_headroom_bytes + metadata_headroom_bytes + archive_estimate + pg_estimate))
            deployment_bytes="$(nexolab_capacity_deployment_bytes "$repo/runtime/deployments")"

            if command -v npm >/dev/null 2>&1; then
              npm_cache_path="$(npm config get cache 2>/dev/null || true)"
              if [[ -n "$npm_cache_path" && -d "$npm_cache_path" ]]; then
                npm_cache_bytes="$(nexolab_capacity_path_bytes "$npm_cache_path")"
              fi
            fi

            local status=PASS
            (( free_bytes >= required_bytes )) || status=FAIL
            mkdir -p "$(dirname "$report")"
            {
              printf 'status=%s\n' "$status"
              printf 'free_bytes=%s\n' "$free_bytes"
              printf 'required_bytes=%s\n' "$required_bytes"
              printf 'reserve_bytes=%s\n' "$reserve_bytes"
              printf 'build_headroom_bytes=%s\n' "$build_headroom_bytes"
              printf 'metadata_headroom_bytes=%s\n' "$metadata_headroom_bytes"
              printf 'runtime_evidence_bytes=%s\n' "$evidence_bytes"
              printf 'runtime_evidence_archive_estimate_bytes=%s\n' "$archive_estimate"
              printf 'postgresql_estimate_source=%s\n' "$NEXOLAB_CAPACITY_PG_SOURCE"
              printf 'postgresql_database_bytes=%s\n' "$NEXOLAB_CAPACITY_PG_BYTES"
              printf 'postgresql_backup_estimate_bytes=%s\n' "$pg_estimate"
              printf 'deployment_evidence_bytes=%s\n' "$deployment_bytes"
              printf 'npm_cache_bytes=%s\n' "$npm_cache_bytes"
              printf 'npm_cache_path=%s\n' "$npm_cache_path"
              printf 'automatic_cleanup=runtime/deployments/<timestamp> only\n'
              printf 'protected=runtime/evidence,PostgreSQL,edge-SQLite,MQTT,MinIO,Docker-named-volumes,current-deployment,newest-deployments,.nexolab-preserve\n'
              printf 'manual_review_cache=docker-build-cache,npm-cache\n'
            } > "$report"

            if [[ "$status" != PASS ]]; then
              printf 'ERROR: insufficient deployment capacity: free_bytes=%s required_bytes=%s reserve_bytes=%s report=%s\n' \
                "$free_bytes" "$required_bytes" "$reserve_bytes" "$report" >&2
              return 75
            fi
            printf 'Capacity preflight PASS: free_bytes=%s required_bytes=%s reserve_bytes=%s\n' \
              "$free_bytes" "$required_bytes" "$reserve_bytes"
          }

          nexolab_capacity_guard_main() {
            set -Eeuo pipefail
            local repo="${NEXOLAB_REPO:-$HOME/nexolab-platform}"
            local audit_dir=""
            local report=""
            local do_prune=false
            while (($# > 0)); do
              case "$1" in
                --repo)
                  repo=$2
                  shift 2
                  ;;
                --audit-dir)
                  audit_dir=$2
                  shift 2
                  ;;
                --report)
                  report=$2
                  shift 2
                  ;;
                --prune)
                  do_prune=true
                  shift
                  ;;
                --help|-h)
                  cat <<'EOF_USAGE'
          Usage: deploy-capacity-guard.sh --repo PATH --audit-dir PATH [--report PATH] [--prune]
          Performs read-only capacity estimation and optional bounded cleanup of old deployment-generated evidence only.
          EOF_USAGE
                  return 0
                  ;;
                *)
                  printf 'ERROR: unknown argument: %s\n' "$1" >&2
                  return 64
                  ;;
              esac
            done
            [[ -n "$audit_dir" ]] || {
              printf 'ERROR: --audit-dir is required\n' >&2
              return 64
            }
            mkdir -p "$audit_dir"
            [[ -n "$report" ]] || report="$audit_dir/capacity-preflight.txt"
            if [[ "$do_prune" == true ]]; then
              nexolab_prune_deployment_evidence "$repo/runtime/deployments" "$audit_dir"
            fi
            local pg_container=""
            if command -v docker >/dev/null 2>&1; then
              pg_container="$(docker ps -q \
                --filter label=com.docker.compose.project=nexolab-central \
                --filter label=com.docker.compose.service=postgres \
                | head -n 1 || true)"
            fi
            nexolab_capacity_preflight "$repo" "$audit_dir" "$pg_container" "$report"
          }

          if [[ "${BASH_SOURCE[0]}" == "$0" ]]; then
            nexolab_capacity_guard_main "$@"
          fi
          EOF_HELPER
          chmod 0755 scripts/deploy-capacity-guard.sh

          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/deploy-current-head-raspberry-pi.sh")
          text = path.read_text(encoding="utf-8")

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one match, found {count}: {old[:80]!r}")
              text = text.replace(old, new, 1)

          replace_once(
              '# shellcheck source=lib/raspberry-pi-runtime-mode.sh\nsource "$SCRIPT_DIR/lib/raspberry-pi-runtime-mode.sh"\n',
              '# shellcheck source=lib/raspberry-pi-runtime-mode.sh\nsource "$SCRIPT_DIR/lib/raspberry-pi-runtime-mode.sh"\n# shellcheck source=deploy-capacity-guard.sh\nsource "$SCRIPT_DIR/deploy-capacity-guard.sh"\n',
          )

          replace_once(
              'for command in git docker curl python3 openssl npm node flock ip sudo tar; do\n',
              'for command in git docker curl python3 openssl npm node flock ip sudo tar du df find sort stat mv rm; do\n',
          )

          replace_once(
              'log "Evidence: $AUDIT_DIR"\n\n{\n',
              '''log "Evidence: $AUDIT_DIR"\n\nPG_CONTAINER="$(docker ps -q \\\n  --filter label=com.docker.compose.project=nexolab-central \\\n  --filter label=com.docker.compose.service=postgres \\\n  | head -n 1)"\n\nlog "Applying bounded deployment-evidence retention"\nif ! nexolab_prune_deployment_evidence "$REPO/runtime/deployments" "$AUDIT_DIR"; then\n  fail "deployment evidence retention failed before runtime mutation"\nfi\nlog "Running deployment capacity preflight before evidence capture"\nif ! nexolab_capacity_preflight "$REPO" "$AUDIT_DIR" "$PG_CONTAINER" "$AUDIT_DIR/capacity-preflight.txt"; then\n  fail "deployment capacity preflight failed before runtime mutation; see $AUDIT_DIR/capacity-preflight.txt"\nfi\n\n{\n''',
          )

          replace_once(
              'git ls-files --others --exclude-standard > "$AUDIT_DIR/untracked-files.txt"\n\nif [[ -d "$REPO/runtime/evidence" ]]; then\n',
              '''git ls-files --others --exclude-standard > "$AUDIT_DIR/untracked-files.txt"\n\nlog "Rechecking deployment capacity immediately before large evidence writes"\nif ! nexolab_capacity_preflight "$REPO" "$AUDIT_DIR" "$PG_CONTAINER" "$AUDIT_DIR/capacity-preflight.txt"; then\n  fail "deployment capacity recheck failed before large writes; see $AUDIT_DIR/capacity-preflight.txt"\nfi\n\nif [[ -d "$REPO/runtime/evidence" ]]; then\n''',
          )

          replace_once(
              'if [[ -d "$REPO/runtime/evidence" ]]; then\n  tar -C "$REPO" -czf "$AUDIT_DIR/runtime-evidence.tar.gz" runtime/evidence\nfi\n',
              '''if [[ -d "$REPO/runtime/evidence" ]]; then\n  RUNTIME_ARCHIVE_TMP="$AUDIT_DIR/.runtime-evidence.tar.gz.partial"\n  rm -f -- "$RUNTIME_ARCHIVE_TMP"\n  if ! tar -C "$REPO" -czf "$RUNTIME_ARCHIVE_TMP" runtime/evidence; then\n    rm -f -- "$RUNTIME_ARCHIVE_TMP"\n    fail "runtime evidence archive failed; partial archive was removed"\n  fi\n  mv -- "$RUNTIME_ARCHIVE_TMP" "$AUDIT_DIR/runtime-evidence.tar.gz"\nfi\n''',
          )

          replace_once(
              '''PG_CONTAINER="$(docker ps -q \\\n  --filter label=com.docker.compose.project=nexolab-central \\\n  --filter label=com.docker.compose.service=postgres \\\n  | head -n 1)"\nif [[ -n "$PG_CONTAINER" ]]; then\n''',
              'if [[ -n "$PG_CONTAINER" ]]; then\n',
          )

          replace_once(
              '''if [[ -n "$PG_CONTAINER" ]]; then\n  log "Creating PostgreSQL pre-upgrade backup"\n  docker exec "$PG_CONTAINER" sh -ec \\\n    'pg_dump -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Fc' \\\n    > "$AUDIT_DIR/postgresql-pre-upgrade.dump"\n  [[ -s "$AUDIT_DIR/postgresql-pre-upgrade.dump" ]] \\\n    || fail "PostgreSQL backup is empty"\nelse\n''',
              '''if [[ -n "$PG_CONTAINER" ]]; then\n  log "Creating PostgreSQL pre-upgrade backup"\n  PG_DUMP_TMP="$AUDIT_DIR/.postgresql-pre-upgrade.dump.partial"\n  rm -f -- "$PG_DUMP_TMP"\n  if ! docker exec "$PG_CONTAINER" sh -ec \\\n    'pg_dump -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Fc' \\\n    > "$PG_DUMP_TMP"; then\n    rm -f -- "$PG_DUMP_TMP"\n    fail "PostgreSQL backup failed; partial dump was removed"\n  fi\n  if [[ ! -s "$PG_DUMP_TMP" ]]; then\n    rm -f -- "$PG_DUMP_TMP"\n    fail "PostgreSQL backup is empty; partial dump was removed"\n  fi\n  mv -- "$PG_DUMP_TMP" "$AUDIT_DIR/postgresql-pre-upgrade.dump"\nelse\n''',
          )

          path.write_text(text, encoding="utf-8")
          PY

          cat > scripts/tests/test_deploy_current_head_raspberry_pi_capacity.py <<'EOF_TEST'
          from __future__ import annotations

          import os
          from pathlib import Path
          import subprocess
          import tempfile
          import time
          import unittest


          ROOT = Path(__file__).resolve().parents[2]
          HELPER = ROOT / "scripts" / "deploy-capacity-guard.sh"
          DEPLOY = ROOT / "scripts" / "deploy-current-head-raspberry-pi.sh"


          def run_bash(script: str, *, env: dict[str, str] | None = None) -> subprocess.CompletedProcess[str]:
              merged = os.environ.copy()
              if env:
                  merged.update(env)
              return subprocess.run(
                  ["bash", "-c", script],
                  cwd=ROOT,
                  env=merged,
                  check=False,
                  capture_output=True,
                  text=True,
              )


          class DeploymentCapacityTests(unittest.TestCase):
              def test_shell_scripts_parse(self) -> None:
                  for path in (HELPER, DEPLOY):
                      result = subprocess.run(["bash", "-n", str(path)], capture_output=True, text=True)
                      self.assertEqual(result.returncode, 0, result.stderr)

              def test_capacity_sufficient_and_insufficient_branches(self) -> None:
                  with tempfile.TemporaryDirectory() as temp:
                      repo = Path(temp) / "repo"
                      audit = repo / "runtime" / "deployments" / "20260815T210000Z"
                      audit.mkdir(parents=True)
                      report = audit / "capacity-preflight.txt"
                      common_env = {
                          "NEXOLAB_DEPLOY_MIN_FREE_RESERVE_BYTES": "100",
                          "NEXOLAB_DEPLOY_BUILD_HEADROOM_BYTES": "200",
                          "NEXOLAB_DEPLOY_METADATA_HEADROOM_BYTES": "300",
                          "NEXOLAB_DEPLOY_ARCHIVE_FIXED_OVERHEAD_BYTES": "0",
                          "NEXOLAB_DEPLOY_POSTGRES_FIXED_OVERHEAD_BYTES": "0",
                      }
                      quoted_helper = subprocess.list2cmdline([str(HELPER)])
                      quoted_repo = subprocess.list2cmdline([str(repo)])
                      quoted_audit = subprocess.list2cmdline([str(audit)])
                      quoted_report = subprocess.list2cmdline([str(report)])

                      sufficient = run_bash(
                          f'''source {quoted_helper}\n'''
                          '''nexolab_capacity_free_bytes() { printf '1000\\n'; }\n'''
                          f'''nexolab_capacity_preflight {quoted_repo} {quoted_audit} '' {quoted_report}\n''',
                          env=common_env,
                      )
                      self.assertEqual(sufficient.returncode, 0, sufficient.stderr)
                      content = report.read_text(encoding="utf-8")
                      self.assertIn("status=PASS", content)
                      self.assertIn("required_bytes=600", content)

                      insufficient = run_bash(
                          f'''source {quoted_helper}\n'''
                          '''nexolab_capacity_free_bytes() { printf '599\\n'; }\n'''
                          f'''nexolab_capacity_preflight {quoted_repo} {quoted_audit} '' {quoted_report}\n''',
                          env=common_env,
                      )
                      self.assertEqual(insufficient.returncode, 75)
                      content = report.read_text(encoding="utf-8")
                      self.assertIn("status=FAIL", content)
                      self.assertIn("free_bytes=599", content)
                      self.assertIn("required_bytes=600", content)
                      self.assertIn("reserve_bytes=100", content)
                      self.assertIn("insufficient deployment capacity", insufficient.stderr)

              def test_retention_preserves_current_newest_marker_and_product_evidence(self) -> None:
                  with tempfile.TemporaryDirectory() as temp:
                      repo = Path(temp) / "repo"
                      deployments = repo / "runtime" / "deployments"
                      product_evidence = repo / "runtime" / "evidence"
                      product_evidence.mkdir(parents=True)
                      (product_evidence / "must-survive.txt").write_text("protected", encoding="utf-8")

                      stamps = [f"2026010{day}T000000Z" for day in range(1, 7)]
                      dirs: list[Path] = []
                      old = time.time() - 40 * 86400
                      for stamp in stamps:
                          path = deployments / stamp
                          path.mkdir(parents=True)
                          (path / "payload.bin").write_bytes(b"x" * 1024)
                          os.utime(path, (old, old))
                          dirs.append(path)
                      (dirs[1] / ".nexolab-preserve").write_text("acceptance evidence\n", encoding="utf-8")
                      current = dirs[-1]

                      result = run_bash(
                          f'''source {subprocess.list2cmdline([str(HELPER)])}\n'''
                          f'''nexolab_prune_deployment_evidence {subprocess.list2cmdline([str(deployments)])} {subprocess.list2cmdline([str(current)])}\n''',
                          env={
                              "NEXOLAB_DEPLOY_EVIDENCE_PROTECTED_COUNT": "2",
                              "NEXOLAB_DEPLOY_EVIDENCE_MAX_COUNT": "6",
                              "NEXOLAB_DEPLOY_EVIDENCE_MAX_AGE_DAYS": "30",
                              "NEXOLAB_DEPLOY_EVIDENCE_MAX_BYTES": "99999999",
                          },
                      )
                      self.assertEqual(result.returncode, 0, result.stderr)
                      self.assertFalse(dirs[0].exists())
                      self.assertTrue(dirs[1].exists(), "explicitly preserved acceptance evidence must survive")
                      self.assertFalse(dirs[2].exists())
                      self.assertFalse(dirs[3].exists())
                      self.assertTrue(dirs[4].exists(), "newest protected deployment must survive")
                      self.assertTrue(current.exists(), "current deployment must survive")
                      self.assertEqual((product_evidence / "must-survive.txt").read_text(), "protected")

              def test_count_retention_is_deterministic_oldest_first(self) -> None:
                  with tempfile.TemporaryDirectory() as temp:
                      deployments = Path(temp) / "deployments"
                      dirs: list[Path] = []
                      for day in range(1, 7):
                          path = deployments / f"2026080{day}T000000Z"
                          path.mkdir(parents=True)
                          (path / "payload.bin").write_bytes(bytes([day]) * 128)
                          dirs.append(path)
                      current = dirs[-1]

                      result = run_bash(
                          f'''source {subprocess.list2cmdline([str(HELPER)])}\n'''
                          f'''nexolab_prune_deployment_evidence {subprocess.list2cmdline([str(deployments)])} {subprocess.list2cmdline([str(current)])}\n''',
                          env={
                              "NEXOLAB_DEPLOY_EVIDENCE_PROTECTED_COUNT": "2",
                              "NEXOLAB_DEPLOY_EVIDENCE_MAX_COUNT": "3",
                              "NEXOLAB_DEPLOY_EVIDENCE_MAX_AGE_DAYS": "0",
                              "NEXOLAB_DEPLOY_EVIDENCE_MAX_BYTES": "0",
                          },
                      )
                      self.assertEqual(result.returncode, 0, result.stderr)
                      remaining = sorted(path.name for path in deployments.iterdir() if path.is_dir())
                      self.assertEqual(remaining, [dirs[3].name, dirs[4].name, dirs[5].name])

              def test_deployment_orders_capacity_gate_before_mutation_and_uses_atomic_large_files(self) -> None:
                  text = DEPLOY.read_text(encoding="utf-8")
                  first_gate = text.index('log "Running deployment capacity preflight before evidence capture"')
                  inventory = text.index("echo '=== host ==='")
                  fetch = text.index('git fetch --prune origin main')
                  build = text.index('docker build --pull -t nexolab-device-agent:local')
                  recreate = text.index('up -d --force-recreate mqtt device-agent')
                  self.assertLess(first_gate, inventory)
                  self.assertLess(first_gate, fetch)
                  self.assertLess(first_gate, build)
                  self.assertLess(first_gate, recreate)
                  self.assertGreaterEqual(text.count("nexolab_capacity_preflight"), 2)
                  self.assertIn(".runtime-evidence.tar.gz.partial", text)
                  self.assertIn(".postgresql-pre-upgrade.dump.partial", text)
                  self.assertNotIn("docker volume rm", text)
                  self.assertNotIn("docker compose down -v", text)


          if __name__ == "__main__":
              unittest.main()
          EOF_TEST

          cat > docs/operations/raspberry-pi-deployment-capacity.md <<'EOF_DOC'
          # Raspberry Pi deployment capacity and evidence retention

          The controlled NEXOLAB Raspberry Pi deployment must preserve product data and fail before runtime mutation when the filesystem cannot safely hold deployment evidence, a PostgreSQL backup, and the build working set.

          ## Safety boundary

          Automated capacity cleanup is limited to direct child directories of `runtime/deployments/` whose names exactly match `YYYYMMDDTHHMMSSZ`. The current deployment directory, the newest protected deployments, symlinks, and any deployment containing `.nexolab-preserve` are never removed.

          The capacity guard never deletes or truncates:

          - `runtime/evidence`;
          - edge SQLite data;
          - PostgreSQL data;
          - MQTT data;
          - MinIO/object-storage data;
          - Docker named volumes;
          - controller/device configuration.

          `docker compose down -v`, `docker volume rm`, telemetry deletion, and Modbus/hardware writes are outside this workflow.

          ## Default retention policy

          `scripts/deploy-capacity-guard.sh` applies deterministic limits before a controlled deployment:

          - always protect the newest 3 timestamped deployment directories;
          - retain at most 12 unmarked timestamped deployments before count pruning applies;
          - prune unprotected deployment evidence older than 30 days;
          - prune oldest unprotected deployment evidence while timestamped deployment evidence exceeds 3 GiB;
          - preserve any directory containing `.nexolab-preserve` regardless of age/count/size pressure.

          If protected evidence alone exceeds a limit, it is not deleted. The capacity preflight can fail and require operator review instead.

          ## Capacity gate

          Before pre-deployment inventory, evidence archive creation, PostgreSQL dump, `git fetch/switch/pull`, builds, or container recreation, the deployment calculates a conservative requirement containing:

          - minimum free-space reserve: 2 GiB;
          - build working-set headroom: 4 GiB;
          - metadata/log headroom: 256 MiB;
          - `runtime/evidence` archive estimate: 110% of current bytes plus 64 MiB;
          - PostgreSQL dump estimate: 110% of `pg_database_size()` plus 64 MiB, or a conservative 1 GiB fallback if a running PostgreSQL container cannot report its size.

          The gate is repeated immediately before the large evidence writes. If `free_bytes < required_bytes`, deployment stops before Git/runtime mutation and writes `capacity-preflight.txt` in the current deployment evidence directory.

          The report includes free, required, reserve, build, runtime-evidence, PostgreSQL, deployment-evidence and npm-cache byte counts. Docker build cache and npm cache are diagnostic/manual-review categories only; they are not automatically deleted.

          ## Atomic evidence writes

          `runtime-evidence.tar.gz` and `postgresql-pre-upgrade.dump` are first written to hidden `.partial` files. A failed archive/dump removes its partial file. The final evidence filename appears only after a successful write and atomic rename within the same deployment directory.

          ## Operator recovery from a low-space preflight

          1. Read the current `runtime/deployments/<timestamp>/capacity-preflight.txt` and `summary.txt`.
          2. Do not delete PostgreSQL, edge SQLite, MQTT, MinIO, `runtime/evidence`, or Docker named volumes.
          3. Mark deployment evidence that must be retained for an active acceptance package with:

             ```bash
             touch runtime/deployments/<timestamp>/.nexolab-preserve
             ```

          4. Re-run the capacity guard with bounded deployment-evidence pruning if needed:

             ```bash
             cd ~/nexolab-platform
             STAMP="$(date -u +%Y%m%dT%H%M%SZ)"
             AUDIT="$PWD/runtime/deployments/$STAMP"
             mkdir -p "$AUDIT"
             scripts/deploy-capacity-guard.sh \
               --repo "$PWD" \
               --audit-dir "$AUDIT" \
               --report "$AUDIT/capacity-preflight.txt" \
               --prune
             ```

          5. If capacity still fails, review the reported npm cache and Docker build cache separately. Cleanup of those caches is an explicit operator action and must not include Docker named volumes.
          6. Re-run `scripts/deploy-current-head-raspberry-pi.sh --runtime-mode lan` only after the capacity gate passes.

          ## Tunable thresholds

          Thresholds can be made more conservative with environment variables; values are bytes unless noted:

          - `NEXOLAB_DEPLOY_MIN_FREE_RESERVE_BYTES`;
          - `NEXOLAB_DEPLOY_BUILD_HEADROOM_BYTES`;
          - `NEXOLAB_DEPLOY_METADATA_HEADROOM_BYTES`;
          - `NEXOLAB_DEPLOY_ARCHIVE_ESTIMATE_PERCENT`;
          - `NEXOLAB_DEPLOY_ARCHIVE_FIXED_OVERHEAD_BYTES`;
          - `NEXOLAB_DEPLOY_POSTGRES_FALLBACK_BYTES`;
          - `NEXOLAB_DEPLOY_POSTGRES_ESTIMATE_PERCENT`;
          - `NEXOLAB_DEPLOY_POSTGRES_FIXED_OVERHEAD_BYTES`;
          - `NEXOLAB_DEPLOY_EVIDENCE_PROTECTED_COUNT`;
          - `NEXOLAB_DEPLOY_EVIDENCE_MAX_COUNT`;
          - `NEXOLAB_DEPLOY_EVIDENCE_MAX_AGE_DAYS`;
          - `NEXOLAB_DEPLOY_EVIDENCE_MAX_BYTES`.

          Invalid/non-numeric settings fail closed rather than silently weakening the capacity policy.
          EOF_DOC

      - name: Targeted verification
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n scripts/deploy-capacity-guard.sh
          bash -n scripts/deploy-current-head-raspberry-pi.sh
          python3 scripts/tests/test_deploy_current_head_raspberry_pi_capacity.py

