name: Patch DR Application Gate

on:
  push:
    branches:
      - feat/m7-disaster-recovery-gate
    paths:
      - ".github/workflows/patch-dr-application-gate.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m7-disaster-recovery-gate
          fetch-depth: 0

      - name: Add restored application verification
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/run-disaster-recovery-acceptance.sh")
          content = path.read_text(encoding="utf-8")

          replacements = []
          replacements.append((
              'BUCKET="nexolab-equipment-images"\nREPOSITORY="eNgine9r/nexolab-platform"',
              'BUCKET="nexolab-equipment-images"\nRESTORE_API_PORT="${DR_RESTORE_API_PORT:-8094}"\nRESTORE_API_BASE_URL="http://127.0.0.1:${RESTORE_API_PORT}"\nREPOSITORY="eNgine9r/nexolab-platform"',
          ))
          replacements.append((
              'export DR_MQTT_ADMIN_USERNAME="nexolab-dr-admin"\nexport DR_SECRETS_DIR="$SECRETS_DIR"',
              'export DR_MQTT_ADMIN_USERNAME="nexolab-dr-admin"\nexport DR_RESTORE_API_PORT="$RESTORE_API_PORT"\nexport DR_SECRETS_DIR="$SECRETS_DIR"',
          ))
          replacements.append((
              'source-mqtt restore-mqtt >"$EVIDENCE_DIR/services.log" 2>&1 || true',
              'source-mqtt restore-mqtt restore-telemetry-service >"$EVIDENCE_DIR/services.log" 2>&1 || true',
          ))
          replacements.append((
              'for command in docker python3 git sha256sum stat; do',
              'for command in curl docker python3 git sha256sum stat; do',
          ))

          application_block = r'''compose up -d --wait restore-telemetry-service
curl --fail-with-body --silent --show-error \
  "$RESTORE_API_BASE_URL/health/ready" \
  >"$EVIDENCE_DIR/restored-ready.json"
python3 -m json.tool "$EVIDENCE_DIR/restored-ready.json" >/dev/null

curl --fail-with-body --silent --show-error \
  "$RESTORE_API_BASE_URL/api/v1/telemetry/latest?limit=20" \
  >"$EVIDENCE_DIR/restored-latest.json"
curl --fail-with-body --silent --show-error \
  "$RESTORE_API_BASE_URL/api/v1/telemetry/history?from=2026-07-28T00%3A00%3A00%2B00%3A00&to=2026-07-29T00%3A00%3A00%2B00%3A00&limit=20" \
  >"$EVIDENCE_DIR/restored-history.json"
python3 - "$EVIDENCE_DIR/restored-latest.json" "$EVIDENCE_DIR/restored-history.json" <<'PYAPP'
from pathlib import Path
import json
import sys
expected = {
    "20000000-0000-0000-0000-000000000001",
    "20000000-0000-0000-0000-000000000002",
}
for path in map(Path, sys.argv[1:]):
    payload = json.loads(path.read_text(encoding="utf-8"))
    found = {item["event_id"] for item in payload["items"]}
    if not expected.issubset(found):
        raise SystemExit(f"Restored telemetry is missing from {path}: {expected - found}")
PYAPP

compose exec -T restore-telemetry-service python - <<'PYAPP'
from __future__ import annotations

import asyncio
import websockets


async def main() -> None:
    uri = "ws://127.0.0.1:8082/api/v1/telemetry/live?node_id=edge-01"
    async with websockets.connect(uri, open_timeout=5, close_timeout=5):
        return


asyncio.run(main())
PYAPP

POST_RESTORE_EVENT_ID="30000000-0000-0000-0000-000000000001"
compose exec -T restore-telemetry-service python - \
  "$ORGANIZATION_ID" "$EDGE_01_USERNAME" "$EDGE_01_CLIENT_ID" \
  "$POST_RESTORE_EVENT_ID" <<'PYAPP'
from __future__ import annotations

from datetime import UTC, datetime
from pathlib import Path
import json
import sys
import threading

import paho.mqtt.client as mqtt

organization_id, username, client_id, event_id = sys.argv[1:]
password = Path("/run/secrets/nexolab/edge-01-password").read_text(encoding="utf-8").strip()
connected = threading.Event()
errors: list[str] = []

client = mqtt.Client(mqtt.CallbackAPIVersion.VERSION2, client_id=client_id)
client.username_pw_set(username, password)
del password


def on_connect(client, userdata, flags, reason_code, properties):
    if reason_code == 0:
        connected.set()
    else:
        errors.append(str(reason_code))
        connected.set()


client.on_connect = on_connect
client.connect("restore-mqtt", 1883, keepalive=30)
client.loop_start()
if not connected.wait(10) or errors:
    raise SystemExit(f"Restored node identity could not connect: {errors}")

payload = {
    "event_id": event_id,
    "node_id": "edge-01",
    "captured_at": datetime.now(UTC).isoformat(),
    "metric": "temperature.air",
    "value": 5.25,
    "unit": "degC",
    "quality": "valid",
    "source": "disaster-recovery-acceptance",
    "equipment_id": "SIM-DR-POST-RESTORE",
    "channel_id": "ambient-temperature",
    "alarm": None,
    "raw_value": 525,
    "raw_status": 0,
    "node_sequence": 2,
}
body = json.dumps(payload, separators=(",", ":"), sort_keys=True)
topic = f"nexolab/v1/{organization_id}/edge-01/telemetry"
for _ in range(2):
    result = client.publish(topic, body, qos=1)
    result.wait_for_publish(timeout=10)
    if result.rc != mqtt.MQTT_ERR_SUCCESS or not result.is_published():
        raise SystemExit("Post-restore QoS 1 publish was not acknowledged")
client.disconnect()
client.loop_stop()
PYAPP

POST_RESTORE_ROW_COUNT=0
for _ in $(seq 1 80); do
  POST_RESTORE_ROW_COUNT="$(compose exec -T restore-postgres \
    psql -U "$DR_POSTGRES_USER" -d "$DR_POSTGRES_DB" -Atc \
    "SELECT COUNT(*) FROM telemetry_samples WHERE event_id = '$POST_RESTORE_EVENT_ID'")"
  if [[ "$POST_RESTORE_ROW_COUNT" = "1" ]]; then
    break
  fi
  sleep 0.25
done
test "$POST_RESTORE_ROW_COUNT" = "1"

curl --fail-with-body --silent --show-error \
  "$RESTORE_API_BASE_URL/api/v1/telemetry/latest?node_id=edge-01&equipment_id=SIM-DR-POST-RESTORE&limit=5" \
  >"$EVIDENCE_DIR/post-restore-latest.json"
python3 - "$EVIDENCE_DIR/post-restore-latest.json" "$POST_RESTORE_EVENT_ID" <<'PYAPP'
from pathlib import Path
import json
import sys
payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
if payload["count"] != 1 or payload["items"][0]["event_id"] != sys.argv[2]:
    raise SystemExit("Post-restore telemetry is not visible exactly once through REST")
PYAPP
'''

          marker = '''test "$SOURCE_MQTT_SHA" = "$(sha256sum "$WORK_DIR/source-mqtt-state-after.txt" | awk '{print $1}')"\n\nRESTORE_SECONDS='''
          replacement = '''test "$SOURCE_MQTT_SHA" = "$(sha256sum "$WORK_DIR/source-mqtt-state-after.txt" | awk '{print $1}')"\n\n''' + application_block + '''\nRESTORE_SECONDS='''
          replacements.append((marker, replacement))

          replacements.append((
              '    "negative_tests": {"wrong_key": "rejected", "ciphertext_tamper": "rejected"},\n    "source_volumes_mutated": False,',
              '    "negative_tests": {"wrong_key": "rejected", "ciphertext_tamper": "rejected"},\n    "application": {"ready": True, "restored_rest_rows": 2, "websocket_handshake": True, "post_restore_event_id": "$POST_RESTORE_EVENT_ID", "post_restore_exactly_once_rows": int("$POST_RESTORE_ROW_COUNT")},\n    "source_volumes_mutated": False,',
          ))
          replacements.append((
              'echo "Disaster-recovery component acceptance passed."',
              'echo "Disaster-recovery platform acceptance passed."',
          ))

          for old, new in replacements:
              if content.count(old) != 1:
                  raise SystemExit(f"Expected patch anchor exactly once: {old[:100]!r}")
              content = content.replace(old, new)

          path.write_text(content, encoding="utf-8")
          PY

      - name: Validate patched shell
        run: bash -n scripts/run-disaster-recovery-acceptance.sh

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/run-disaster-recovery-acceptance.sh
          git commit -m "feat: verify restored telemetry application flows"
          git push origin HEAD:feat/m7-disaster-recovery-gate
