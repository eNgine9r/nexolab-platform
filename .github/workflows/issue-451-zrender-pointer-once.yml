name: Issue 451 ZRender Pointer Once

on:
  push:
    branches:
      - fix/451-chart-integrity-alarm-provenance

permissions:
  contents: write

jobs:
  patch-once:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Patch canonical renderer pointer bridge
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/features/charts/echarts-adapter.ts")
          text = path.read_text()
          text = text.replace(
              "  dispatchAction(action: object): void;\n  resize(): void;",
              "  dispatchAction(action: object): void;\n  containPixel(finder: object, value: [number, number]): boolean;\n  convertFromPixel(finder: object, value: [number, number]): unknown;\n  getZr(): {\n    on(eventName: string, handler: (event: unknown) => void): void;\n    off(eventName: string, handler?: (event: unknown) => void): void;\n  };\n  resize(): void;",
              1,
          )
          text = text.replace(
              "interface DataZoomEvent {\n",
              "interface ZRenderPointerEvent {\n  offsetX?: number;\n  offsetY?: number;\n}\n\ninterface DataZoomEvent {\n",
              1,
          )
          marker = "  private readonly handleAxisPointer = (event: unknown) => {\n"
          bridge = """  private readonly handleZRenderPointer = (event: unknown) => {\n    if (!this.scene || !this.instance || !event || typeof event !== \"object\") return;\n    const { offsetX, offsetY } = event as ZRenderPointerEvent;\n    if (!Number.isFinite(offsetX) || !Number.isFinite(offsetY)) return;\n    const pixel: [number, number] = [offsetX!, offsetY!];\n    if (!this.instance.containPixel({ gridIndex: 0 }, pixel)) {\n      this.options?.onCursor(null);\n      return;\n    }\n    const converted = this.instance.convertFromPixel({ xAxisIndex: 0 }, pixel);\n    const timestampMs = Array.isArray(converted) ? Number(converted[0]) : Number.NaN;\n    if (!Number.isFinite(timestampMs)) return;\n    this.options?.onCursor(sharedInspection(this.scene, timestampMs));\n  };\n\n"""
          if marker not in text:
              raise SystemExit("axis pointer marker not found")
          text = text.replace(marker, bridge + marker, 1)
          text = text.replace(
              '    this.instance.on("updateAxisPointer", this.handleAxisPointer);\n    this.instance.on("dataZoom", this.handleDataZoom);',
              '    this.instance.on("updateAxisPointer", this.handleAxisPointer);\n    this.instance.on("dataZoom", this.handleDataZoom);\n    this.instance.getZr().on("mousemove", this.handleZRenderPointer);',
              1,
          )
          text = text.replace(
              '    this.instance.off("updateAxisPointer", this.handleAxisPointer);\n    this.instance.off("dataZoom", this.handleDataZoom);',
              '    this.instance.off("updateAxisPointer", this.handleAxisPointer);\n    this.instance.off("dataZoom", this.handleDataZoom);\n    this.instance.getZr().off("mousemove", this.handleZRenderPointer);',
              1,
          )
          path.write_text(text)

          test_path = Path("src/features/charts/echarts-adapter.test.ts")
          test = test_path.read_text()
          test = test.replace(
              "  handlers = new Map<string, (event: unknown) => void>();\n  resizeCount = 0;",
              "  handlers = new Map<string, (event: unknown) => void>();\n  zrHandlers = new Map<string, (event: unknown) => void>();\n  resizeCount = 0;",
              1,
          )
          test = test.replace(
              "  dispatchAction(action: object) {\n    this.actions.push(action);\n  }\n\n  resize() {",
              "  dispatchAction(action: object) {\n    this.actions.push(action);\n  }\n\n  containPixel() {\n    return true;\n  }\n\n  convertFromPixel(_finder: object, value: [number, number]) {\n    return [BENCHMARK_START_MS + value[0], value[1]];\n  }\n\n  getZr() {\n    return {\n      on: (eventName: string, handler: (event: unknown) => void) => this.zrHandlers.set(eventName, handler),\n      off: (eventName: string) => this.zrHandlers.delete(eventName),\n    };\n  }\n\n  resize() {",
              1,
          )
          test = test.replace(
              '    instance.handlers.get("updateAxisPointer")?.({ axesInfo: [{ value: BENCHMARK_START_MS }] });\n    expect(onCursor).toHaveBeenCalledWith({',
              '    instance.zrHandlers.get("mousemove")?.({ offsetX: 0, offsetY: 120 });\n    expect(onCursor).toHaveBeenCalledWith({',
              1,
          )
          test = test.replace(
              "    expect(instance.handlers).toHaveLength(0);\n    expect(instance.disposeCount).toBe(1);",
              "    expect(instance.handlers).toHaveLength(0);\n    expect(instance.zrHandlers).toHaveLength(0);\n    expect(instance.disposeCount).toBe(1);",
              1,
          )
          test_path.write_text(test)
      - name: Install and verify focused files
        env:
          HUSKY: 0
        run: |
          npm install --no-audit
          npx prettier --write src/features/charts/echarts-adapter.ts src/features/charts/echarts-adapter.test.ts
          npx vitest run src/features/charts/echarts-adapter.test.ts
          npm run typecheck
      - name: Commit focused product patch and retire workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/issue-451-zrender-pointer-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/charts/echarts-adapter.ts src/features/charts/echarts-adapter.test.ts
          git diff --cached --check
          git commit -m "fix(charts): drive shared cursor from plot pointer coordinates"
          git push origin HEAD:fix/451-chart-integrity-alarm-provenance
