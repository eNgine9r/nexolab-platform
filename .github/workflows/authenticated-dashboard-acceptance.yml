name: Authenticated Dashboard Acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/authenticated-dashboard-acceptance.yml"
      - "docs/authenticated-live-telemetry.md"
      - "e2e/authenticated-dashboard.production.e2e.ts"
      - "e2e/energy.production.e2e.ts"
      - "e2e/equipment-discovery.production.e2e.ts"
      - "e2e/equipment-layouts.production.e2e.ts"
      - "e2e/equipment-multi-axis-chart.production.e2e.ts"
      - "e2e/live.production.e2e.ts"
      - "e2e/live-terminal-offline-retry.production.e2e.ts"
      - "e2e/live-chart-system.production.e2e.ts"
      - "e2e/settings.production.e2e.ts"
      - "e2e/telemetry-acquisition-invariant.production.e2e.ts"
      - "e2e/telemetry-navigation.production.e2e.ts"
      - "infrastructure/compose/compose.browser-acceptance.yaml"
      - "infrastructure/compose/compose.central.yaml"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - "playwright.dashboard.config.ts"
      - "scripts/acquisition-invariant-fixture.py"
      - "scripts/classify-ci-impact.py"
      - "scripts/run-acquisition-invariant-browser-acceptance.sh"
      - "scripts/run-authenticated-dashboard-acceptance.sh"
      - "services/device-agent/**"
      - "services/telemetry-service/app/**"
      - "services/telemetry-service/migrations/**"
      - "services/telemetry-service/requirements.txt"
      - "src/app/api/device-agent/acquisition-cadence/**"
      - "src/app/energy/**"
      - "src/app/equipment/**"
      - "src/app/equipment-layouts/**"
      - "src/app/live/**"
      - "src/app/settings/**"
      - "src/components/charts/**"
      - "src/components/dashboard/**"
      - "src/components/energy/**"
      - "src/components/equipment/**"
      - "src/components/equipment-layouts/**"
      - "src/components/live/**"
      - "src/components/live-dashboards/**"
      - "src/components/settings/**"
      - "src/features/acquisition/**"
      - "src/features/charts/**"
      - "src/features/energy/**"
      - "src/features/equipment/**"
      - "src/features/equipment-layouts/**"
      - "src/features/live/**"
      - "src/features/live-dashboards/**"
      - "src/features/security/**"
      - "src/hooks/use-dashboard-security*"
      - "src/hooks/use-dashboard-telemetry*"
      - "src/hooks/use-energy-telemetry*"
      - "src/hooks/use-equipment-layouts-catalog*"
      - "src/hooks/use-equipment-registry*"
      - "src/hooks/use-live-dashboard-*"
      - "src/hooks/use-live-telemetry*"
      - "src/lib/telemetry/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: authenticated-dashboard-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  route:
    name: Resolve dashboard verification route
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.route.outputs.mode }}
      test_match: ${{ steps.route.outputs.test_match }}

    steps:
      - name: Checkout exact PR head with history
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve dashboard verification route
        id: route
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --name-only "$PR_BASE_SHA" "$PR_HEAD_SHA" -- > changed-files.txt
          else
            printf '%s\n' '.github/workflows/authenticated-dashboard-acceptance.yml' > changed-files.txt
          fi
          python3 scripts/classify-ci-impact.py --files-file changed-files.txt > impact.json
          python3 - "$GITHUB_OUTPUT" <<'PY'
          import json
          import sys
          from pathlib import Path

          result = json.loads(Path("impact.json").read_text(encoding="utf-8"))
          verification = result["verification"]
          mode = verification["dashboard_mode"]
          test_match = verification["dashboard_test_match"] or ""
          if mode not in {"none", "focused", "full"}:
              raise SystemExit(f"Unsupported dashboard verification mode: {mode}")
          with open(sys.argv[1], "a", encoding="utf-8") as handle:
              handle.write(f"mode={mode}\n")
              handle.write(f"test_match={test_match}\n")
          print(f"Dashboard verification mode: {mode}; test_match={test_match or '(full/default)'}")
          PY

  acceptance:
    name: JWT REST history WebSocket and acquisition invariant
    needs: route
    if: ${{ needs.route.outputs.mode != 'none' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      COMPOSE_PROJECT_NAME: nexolab-dashboard-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
      NEXOLAB_DASHBOARD_EVIDENCE_DIR: dashboard-acceptance-evidence
      NEXOLAB_DASHBOARD_TEST_MATCH: ${{ needs.route.outputs.test_match }}
      HUSKY: "0"

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          package-manager-cache: false
          node-version-file: .nvmrc

      - name: Resolve preinstalled Chrome
        shell: bash
        run: |
          browser_path="$(bash scripts/resolve-playwright-browser.sh)"
          printf 'PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=%s\n' "$browser_path" >> "$GITHUB_ENV"
          "$browser_path" --version

      - name: Run authenticated dashboard and acquisition invariant acceptance
        run: bash scripts/run-acquisition-invariant-browser-acceptance.sh

      - name: Upload dashboard evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: authenticated-dashboard-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: dashboard-acceptance-evidence
          if-no-files-found: warn
          retention-days: 14
