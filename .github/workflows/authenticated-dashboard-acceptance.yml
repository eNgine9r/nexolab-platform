name: Authenticated Dashboard Acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/authenticated-dashboard-acceptance.yml"
      - "docs/authenticated-live-telemetry.md"
      - "e2e/authenticated-dashboard.production.e2e.ts"
      - "e2e/energy.production.e2e.ts"
      - "e2e/live.production.e2e.ts"
      - "infrastructure/compose/compose.browser-acceptance.yaml"
      - "infrastructure/compose/compose.central.yaml"
      - "package.json"
      - "package-lock.json"
      - "playwright.dashboard.config.ts"
      - "scripts/run-authenticated-dashboard-acceptance.sh"
      - "services/telemetry-service/app/**"
      - "services/telemetry-service/migrations/**"
      - "services/telemetry-service/requirements.txt"
      - "src/app/energy/**"
      - "src/app/live/**"
      - "src/components/dashboard/**"
      - "src/components/energy/**"
      - "src/components/live/**"
      - "src/features/energy/**"
      - "src/features/live/**"
      - "src/features/security/**"
      - "src/hooks/use-dashboard-security*"
      - "src/hooks/use-dashboard-telemetry*"
      - "src/hooks/use-energy-telemetry*"
      - "src/hooks/use-live-telemetry*"
      - "src/lib/telemetry/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: authenticated-dashboard-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    name: JWT REST history and WebSocket dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      COMPOSE_PROJECT_NAME: nexolab-dashboard-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
      NEXOLAB_DASHBOARD_EVIDENCE_DIR: dashboard-acceptance-evidence
      PLAYWRIGHT_INSTALL_WITH_DEPS: "1"
      HUSKY: "0"

    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true

      - name: Correct downsampling fixture cadence once
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("src/features/live/live-history.test.ts")
          content = path.read_text()
          old = "captured_at: new Date(window.from.getTime() + index * 60_000).toISOString(),"
          new = "captured_at: new Date(window.from.getTime() + index * 5_000).toISOString(),"
          if old not in content:
              raise SystemExit("Expected cadence fixture was not found")
          path.write_text(content.replace(old, new, 1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/live/live-history.test.ts
          git commit -m "test(live): avoid synthetic outage in endpoint regression"
          git push origin "HEAD:${HEAD_BRANCH}"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          package-manager-cache: false
          node-version-file: .nvmrc

      - name: Run authenticated dashboard acceptance
        run: bash scripts/run-authenticated-dashboard-acceptance.sh

      - name: Upload dashboard evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: authenticated-dashboard-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: dashboard-acceptance-evidence
          if-no-files-found: warn
          retention-days: 14
