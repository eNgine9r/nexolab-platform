name: Issue 451 Pixel Conversion Once

on:
  push:
    branches:
      - fix/451-chart-integrity-alarm-provenance

permissions:
  contents: write

jobs:
  patch-once:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Patch scalar x-axis pixel conversion
        shell: python
        run: |
          from pathlib import Path

          adapter_path = Path("src/features/charts/echarts-adapter.ts")
          text = adapter_path.read_text()
          old = '  convertFromPixel(finder: object, value: [number, number]): unknown;'
          new = '  convertFromPixel(finder: object, value: [number, number]): number | number[];'
          if old not in text:
              raise SystemExit("runtime port conversion signature not found")
          text = text.replace(old, new, 1)
          old = '    const timestampMs = Array.isArray(converted) ? Number(converted[0]) : Number.NaN;'
          new = '    const timestampMs = Array.isArray(converted) ? Number(converted[0]) : Number(converted);'
          if old not in text:
              raise SystemExit("scalar conversion guard not found")
          text = text.replace(old, new, 1)
          adapter_path.write_text(text)

          test_path = Path("src/features/charts/echarts-adapter.test.ts")
          test = test_path.read_text()
          old = '  convertFromPixel(_finder: object, value: [number, number]) {\n    return [BENCHMARK_START_MS + value[0], value[1]];\n  }'
          new = '  convertFromPixel(_finder: object, value: [number, number]) {\n    return BENCHMARK_START_MS + value[0];\n  }'
          if old not in test:
              raise SystemExit("FakeEChartsInstance conversion implementation not found")
          test = test.replace(old, new, 1)
          test_path.write_text(test)

          area_path = Path("src/features/charts/area-rendering.test.ts")
          area = area_path.read_text()
          old = '  convertFromPixel(_finder: object, value: [number, number]) {\n    return value;\n  }'
          new = '  convertFromPixel(_finder: object, value: [number, number]) {\n    return value[0];\n  }'
          if old not in area:
              raise SystemExit("area-rendering fake conversion implementation not found")
          area = area.replace(old, new, 1)
          area_path.write_text(area)
      - name: Verify focused chart contract
        env:
          HUSKY: 0
        run: |
          npm install --no-audit
          npx prettier --write src/features/charts/echarts-adapter.ts src/features/charts/echarts-adapter.test.ts src/features/charts/area-rendering.test.ts
          npx vitest run src/features/charts/echarts-adapter.test.ts src/features/charts/area-rendering.test.ts
          npm run typecheck
          git diff --check
      - name: Commit product fix and retire workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/issue-451-pixel-conversion-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/charts/echarts-adapter.ts src/features/charts/echarts-adapter.test.ts src/features/charts/area-rendering.test.ts
          git diff --cached --check
          git commit -m "fix(charts): accept scalar x-axis pixel conversion"
          git push origin HEAD:fix/451-chart-integrity-alarm-provenance
