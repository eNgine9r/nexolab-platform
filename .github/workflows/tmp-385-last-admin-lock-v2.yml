name: Temporary Issue 385 last-admin lock hardening v2

on:
  push:
    branches:
      - feat/385-local-user-permissions

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/385-local-user-permissions
      - name: Serialize last-administrator mutations on organization row
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("services/telemetry-service/app/security/local_admin_service.py")
          text = path.read_text()
          method = text.index("    def _assert_not_last_active_administrator(")
          insertion = text.index("        if self._active_admin_count(\n", method)
          lock = '''        organization = session.scalar(
            select(SecurityOrganization)
            .where(SecurityOrganization.id == organization_id)
            .with_for_update()
        )
        if organization is None or not organization.is_active:
            raise LocalUserNotFoundError(
                f"organization {organization_id!r} is not active"
            )
'''
          path.write_text(text[:insertion] + lock + text[insertion:])
          PY
          python -m py_compile services/telemetry-service/app/security/local_admin_service.py
      - name: Run focused last-administrator test
        shell: bash
        working-directory: services/telemetry-service
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt >/dev/null
          pytest -q tests/test_local_user_admin.py -k last_active_local_administrator
      - name: Commit security hardening
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+eNgine9r@users.noreply.github.com"
          git add services/telemetry-service/app/security/local_admin_service.py
          git commit -m "fix(security): serialize last-administrator mutations"
          git push origin HEAD:feat/385-local-user-permissions
