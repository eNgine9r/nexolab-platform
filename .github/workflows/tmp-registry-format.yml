name: Temporary Registry Format

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/tmp-registry-format.yml"
      - "docs/operations/active-acquisition-registry.md"
      - "src/app/api/device-agent/acquisition-registry/**"

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          package-manager-cache: false
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Format registry files
        run: |
          npx prettier --write \
            docs/operations/active-acquisition-registry.md \
            src/app/api/device-agent/acquisition-registry/route.ts \
            src/app/api/device-agent/acquisition-registry/route.test.ts

      - name: Upload formatted files
        uses: actions/upload-artifact@v7
        with:
          name: registry-formatted-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            docs/operations/active-acquisition-registry.md
            src/app/api/device-agent/acquisition-registry/route.ts
            src/app/api/device-agent/acquisition-registry/route.test.ts
          if-no-files-found: error
          retention-days: 1
