name: Format Playwright policy once

on:
  push:
    branches:
      - fix/343-isolate-playwright-dependabot
    paths:
      - .github/workflows/format-playwright-policy-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout policy branch
        uses: actions/checkout@v6
        with:
          ref: fix/343-isolate-playwright-dependabot
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          package-manager-cache: false
          node-version-file: .nvmrc

      - name: Install dependencies
        env:
          HUSKY: 0
        run: npm install --no-audit

      - name: Format policy and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          npx prettier --write docs/maintenance/dependency-update-policy.md
          rm .github/workflows/format-playwright-policy-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/maintenance/dependency-update-policy.md .github/workflows/format-playwright-policy-once.yml
          git commit -m "style(deps): format Playwright policy"
          git push origin HEAD:fix/343-isolate-playwright-dependabot
