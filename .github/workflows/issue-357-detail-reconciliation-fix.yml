name: Issue 357 Detail Reconciliation Fix

on:
  push:
    branches:
      - fix/357-structural-snapshot-acceptance
    paths:
      - .github/workflows/issue-357-detail-reconciliation-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/357-structural-snapshot-acceptance
          fetch-depth: 0
      - name: Apply focused detail reconciliation patch
        run: python3 scripts/issue-357-fix-detail-reconciliation.py
      - name: Format and commit focused fix
        run: |
          npm ci --ignore-scripts
          npx prettier --write src/components/refrigeration/refrigeration-detail-screen.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/refrigeration/refrigeration-detail-screen.tsx scripts/issue-357-fix-detail-reconciliation.py .github/workflows/issue-357-detail-reconciliation-fix.yml
          git commit -m "fix(refrigeration): stop detail reconciliation loop"
          git push origin HEAD:fix/357-structural-snapshot-acceptance
