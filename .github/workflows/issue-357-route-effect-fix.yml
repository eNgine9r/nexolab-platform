name: Issue 357 Route Effect Fix

on:
  push:
    branches:
      - fix/357-structural-snapshot-acceptance
    paths:
      - .github/workflows/issue-357-route-effect-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/357-structural-snapshot-acceptance
          fetch-depth: 0
      - name: Apply focused route effect patch
        run: python3 scripts/issue-357-fix-route-effect.py
      - name: Format and commit focused fix
        run: |
          npm ci --ignore-scripts
          npx prettier --write src/components/refrigeration/refrigeration-equipment-route.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/refrigeration/refrigeration-equipment-route.tsx scripts/issue-357-fix-route-effect.py .github/workflows/issue-357-route-effect-fix.yml
          git commit -m "fix(refrigeration): stop structural route reconciliation loop"
          git push origin HEAD:fix/357-structural-snapshot-acceptance
