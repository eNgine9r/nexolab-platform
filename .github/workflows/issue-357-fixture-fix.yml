name: Issue 357 Fixture Fix

on:
  push:
    branches:
      - fix/357-structural-snapshot-acceptance
    paths:
      - .github/workflows/issue-357-fixture-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/357-structural-snapshot-acceptance
          fetch-depth: 0
      - name: Patch runtime fixture
        shell: bash
        run: |
          python3 -c "from pathlib import Path; p=Path('src/components/refrigeration/refrigeration-catalog-screen.test.tsx'); s=p.read_text(); a='    sensorConfigurationRepository: lifecycleRepository,\n'; r=a+'    structuralSnapshotRepository: null,\n'; assert a in s; p.write_text(s.replace(a,r,1))"
          rm .github/workflows/issue-357-fixture-fix.yml
      - name: Commit focused fixture patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/refrigeration/refrigeration-catalog-screen.test.tsx .github/workflows/issue-357-fixture-fix.yml
          git commit -m "test(refrigeration): include structural snapshot runtime fixture"
          git push origin HEAD:fix/357-structural-snapshot-acceptance
