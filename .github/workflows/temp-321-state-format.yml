name: Temporary Issue 321 State Formatter

on:
  push:
    branches:
      - chore/321-reconcile-live-dashboard-state
    paths:
      - .github/workflows/temp-321-state-format.yml

permissions:
  contents: write

jobs:
  format-and-self-delete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/321-reconcile-live-dashboard-state
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Format project state
        run: >-
          npx prettier --write
          .project/CURRENT_STATE.md
          .project/ACTIVE_SPRINT.json
          .project/BLOCKERS.md
          .project/LAST_CHECKPOINT.json
      - name: Remove temporary workflow and publish
        run: |
          rm .github/workflows/temp-321-state-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .project/CURRENT_STATE.md .project/ACTIVE_SPRINT.json .project/BLOCKERS.md .project/LAST_CHECKPOINT.json .github/workflows/temp-321-state-format.yml
          git commit -m "style(project): format Live Dashboard checkpoint"
          git push origin HEAD:chore/321-reconcile-live-dashboard-state
