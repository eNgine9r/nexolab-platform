name: Issue 199 Prettier Formatter

on:
  push:
    branches:
      - fix/199-websocket-lifecycle
    paths:
      - .github/workflows/issue-199-prettier.yml

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  format-and-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/199-websocket-lifecycle
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format scoped client and remove temporary workflow
        run: |
          npx prettier --write src/lib/telemetry/websocket-client.ts
          git rm .github/workflows/issue-199-prettier.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/telemetry/websocket-client.ts
          git commit -m "style: format websocket lifecycle"
          git push origin HEAD:fix/199-websocket-lifecycle
