name: Prettier E2E Tooling 194

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/prettier-e2e-194.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@v4
        with:
          ref: chore/194-format-e2e-tooling
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply exact formatting scope
        shell: bash
        run: |
          set -Eeuo pipefail
          files=(
            e2e/nodes.production.e2e.ts
            e2e/observability.production.e2e.ts
            e2e/refrigeration-layout.production.e2e.ts
            e2e/security-rbac.production.e2e.ts
            eslint.config.mjs
            playwright.observability.config.ts
          )

          analyze() {
            local output=$1
            shift
            node - "$output" "$@" <<'NODE'
          const crypto = require("node:crypto");
          const fs = require("node:fs");
          const prettier = require("prettier");
          const ts = require("typescript");

          async function main() {
            const [output, ...files] = process.argv.slice(2);
            const analysis = {};
            for (const file of files) {
              const source = fs.readFileSync(file, "utf8");
              const transpiled = ts.transpileModule(source, {
                fileName: file,
                reportDiagnostics: true,
                compilerOptions: {
                  target: ts.ScriptTarget.ES2022,
                  module: ts.ModuleKind.ESNext,
                  jsx: ts.JsxEmit.ReactJSX,
                  isolatedModules: true,
                  removeComments: true,
                },
              });
              const errors = (transpiled.diagnostics ?? []).filter(
                (diagnostic) => diagnostic.category === ts.DiagnosticCategory.Error,
              );
              if (errors.length > 0) {
                throw new Error(
                  `${file} transpile diagnostics: ${errors
                    .map((diagnostic) => ts.flattenDiagnosticMessageText(diagnostic.messageText, "\n"))
                    .join(" | ")}`,
                );
              }
              const canonicalOutput = await prettier.format(transpiled.outputText, {
                parser: "babel",
              });
              const scanner = ts.createScanner(
                ts.ScriptTarget.Latest,
                false,
                ts.LanguageVariant.Standard,
                source,
              );
              const comments = [];
              for (let token = scanner.scan(); token !== ts.SyntaxKind.EndOfFileToken; token = scanner.scan()) {
                if (
                  token === ts.SyntaxKind.SingleLineCommentTrivia ||
                  token === ts.SyntaxKind.MultiLineCommentTrivia
                ) {
                  comments.push(scanner.getTokenText());
                }
              }
              analysis[file] = {
                canonical_transpiled_sha256: crypto
                  .createHash("sha256")
                  .update(canonicalOutput)
                  .digest("hex"),
                comments,
              };
            }
            fs.writeFileSync(output, `${JSON.stringify(analysis, null, 2)}\n`, "utf8");
          }

          main().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
          }

          analyze /tmp/issue-194-before.json "${files[@]}"
          npm exec prettier -- --write "${files[@]}"
          npm exec prettier -- --check "${files[@]}"
          analyze /tmp/issue-194-after.json "${files[@]}"
          cmp /tmp/issue-194-before.json /tmp/issue-194-after.json

          node -e 'import("./eslint.config.mjs").then((module) => { if (!Array.isArray(module.default)) throw new Error("ESLint flat config did not load as an array"); })'
          npm exec playwright -- test --config=playwright.observability.config.ts --list > /tmp/issue-194-playwright-list.txt
          test -s /tmp/issue-194-playwright-list.txt

          mapfile -t changed < <(git diff --name-only)
          for path in "${changed[@]}"; do
            case "$path" in
              e2e/nodes.production.e2e.ts|e2e/observability.production.e2e.ts|e2e/refrigeration-layout.production.e2e.ts|e2e/security-rbac.production.e2e.ts|eslint.config.mjs|playwright.observability.config.ts)
                ;;
              *)
                echo "Unexpected formatted path: $path" >&2
                exit 1
                ;;
            esac
          done

          if [[ ${#changed[@]} -eq 0 ]]; then
            echo "Exact E2E/tooling scope is already Prettier-clean."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${files[@]}"
          git diff --cached --check
          git commit -m "style(test): format E2E and tooling files"
          git push origin HEAD:chore/194-format-e2e-tooling
