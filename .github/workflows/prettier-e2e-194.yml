name: Prettier E2E Tooling 194

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/prettier-e2e-194.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@v4
        with:
          ref: chore/194-format-e2e-tooling
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate exact formatting evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          files=(
            e2e/nodes.production.e2e.ts
            e2e/observability.production.e2e.ts
            e2e/refrigeration-layout.production.e2e.ts
            e2e/security-rbac.production.e2e.ts
            eslint.config.mjs
            playwright.observability.config.ts
          )
          mkdir -p prettier-e2e-194/formatted prettier-e2e-194/patches
          npm exec prettier -- --version > prettier-e2e-194/prettier-version.txt
          cp --parents "${files[@]}" prettier-e2e-194/formatted
          formatted=()
          for path in "${files[@]}"; do
            formatted+=("prettier-e2e-194/formatted/$path")
          done
          npm exec prettier -- --write "${formatted[@]}"
          npm exec prettier -- --check "${formatted[@]}"
          for path in "${files[@]}"; do
            patch_name="${path//\//__}.patch"
            diff -u \
              --label "original/$path" \
              --label "formatted/$path" \
              "$path" "prettier-e2e-194/formatted/$path" \
              > "prettier-e2e-194/patches/$patch_name" || test $? -eq 1
          done
          sha256sum "${formatted[@]}" > prettier-e2e-194/formatted.sha256

      - name: Upload formatting evidence
        uses: actions/upload-artifact@v4
        with:
          name: prettier-e2e-194
          path: prettier-e2e-194
          if-no-files-found: error
          retention-days: 14
