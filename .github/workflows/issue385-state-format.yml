name: Issue 385 state checkpoint formatter

on:
  push:
    branches:
      - feat/385-local-user-permissions
    paths:
      - .github/workflows/issue385-state-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/385-local-user-permissions
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Format checkpoint and remove temporary workflow
        shell: bash
        env:
          HUSKY: "0"
        run: |
          set -Eeuo pipefail
          npm install --no-audit
          npx prettier --write .project/LAST_CHECKPOINT.json
          rm .github/workflows/issue385-state-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .project/LAST_CHECKPOINT.json .github/workflows/issue385-state-format.yml
          git diff --cached --check
          git commit -m "chore(state): format Issue 385 checkpoint"
          git push origin HEAD:feat/385-local-user-permissions
