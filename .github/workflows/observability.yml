name: Observability

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/observability.yml"
      - "infrastructure/compose/compose.central.yaml"
      - "infrastructure/compose/compose.observability.yaml"
      - "infrastructure/observability/**"
      - "scripts/observability-alert-sink.py"
      - "scripts/serve-prometheus-textfile.py"
      - "scripts/validate-observability.py"
      - "services/telemetry-service/app/metrics.py"
      - "services/telemetry-service/tests/test_metrics.py"
      - "tests/test_observability_policy.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/observability.yml"
      - "infrastructure/compose/compose.central.yaml"
      - "infrastructure/compose/compose.observability.yaml"
      - "infrastructure/observability/**"
      - "scripts/observability-alert-sink.py"
      - "scripts/serve-prometheus-textfile.py"
      - "scripts/validate-observability.py"
      - "services/telemetry-service/app/metrics.py"
      - "services/telemetry-service/tests/test_metrics.py"
      - "tests/test_observability_policy.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: observability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Validate observability policy and configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install policy test dependencies
        run: python -m pip install --disable-pip-version-check pytest pyyaml

      - name: Validate repository observability policy
        run: |
          set +e
          {
            python scripts/validate-observability.py
            validator_status=$?
            if [ "$validator_status" -eq 0 ]; then
              python -m pytest -q tests/test_observability_policy.py
              validator_status=$?
            fi
            if [ "$validator_status" -eq 0 ]; then
              python -m py_compile \
                scripts/observability-alert-sink.py \
                scripts/serve-prometheus-textfile.py \
                scripts/validate-observability.py
              validator_status=$?
            fi
            printf 'exit_status=%s\n' "$validator_status"
          } 2>&1 | tee observability-policy-diagnostics.txt
          exit "${validator_status:-1}"

      - name: Upload sanitized policy diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: observability-policy-diagnostics-${{ github.sha }}
          path: observability-policy-diagnostics.txt
          if-no-files-found: error
          retention-days: 3

      - name: Validate Prometheus configuration and rules
        run: |
          docker run --rm \
            --entrypoint /bin/promtool \
            -v "$PWD/infrastructure/observability/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v3.13.0 \
            check config /etc/prometheus/prometheus.yml

      - name: Validate Alertmanager configuration
        run: |
          docker run --rm \
            --entrypoint /bin/amtool \
            -v "$PWD/infrastructure/observability/alertmanager:/etc/alertmanager:ro" \
            prom/alertmanager:v0.32.1 \
            check-config /etc/alertmanager/alertmanager.yml

      - name: Validate Compose topology
        env:
          POSTGRES_PASSWORD: validation
          MINIO_ROOT_USER: validation
          MINIO_ROOT_PASSWORD: validation-password
          GRAFANA_ADMIN_PASSWORD: validation-password
          OBSERVABILITY_TEXTFILE_DIR: /tmp/nexolab-observability
        run: |
          mkdir -p "$OBSERVABILITY_TEXTFILE_DIR"
          touch "$OBSERVABILITY_TEXTFILE_DIR/disaster-recovery.prom"
          docker compose \
            -f infrastructure/compose/compose.central.yaml \
            -f infrastructure/compose/compose.observability.yaml \
            config --quiet

      - name: Reject secret-like versioned material
        run: |
          ! grep -ER \
            'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|ghp_[A-Za-z0-9]{20,}|sk-[A-Za-z0-9]{20,}' \
            infrastructure/observability \
            infrastructure/compose/compose.observability.yaml \
            scripts/observability-alert-sink.py \
            scripts/serve-prometheus-textfile.py \
            scripts/validate-observability.py \
            tests/test_observability_policy.py
