name: Offline Auth State Format

on:
  push:
    branches:
      - feat/188-offline-operator-auth

permissions:
  contents: write

concurrency:
  group: offline-auth-state-format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/188-offline-operator-auth
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        env:
          HUSKY: 0
        run: npm install --no-audit

      - name: Apply locked Prettier formatting
        run: |
          npm exec prettier -- --write \
            .project/CURRENT_STATE.md \
            .project/ACTIVE_SPRINT.json \
            .project/BLOCKERS.md \
            .project/LAST_CHECKPOINT.json

      - name: Commit canonical checkpoint formatting
        run: |
          if git diff --quiet; then
            echo "Checkpoint formatting already canonical."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .project/CURRENT_STATE.md \
            .project/ACTIVE_SPRINT.json \
            .project/BLOCKERS.md \
            .project/LAST_CHECKPOINT.json
          git commit -m "style(auth): format project checkpoint"
          git push origin HEAD:feat/188-offline-operator-auth
