name: Temporary state format probe

on:
  pull_request:
    paths:
      - ".project/ACTIVE_SPRINT.json"
      - ".project/LAST_CHECKPOINT.json"
      - ".github/workflows/temp-format-state.yml"

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
          check-latest: false
      - run: npm install --no-audit
        env:
          HUSKY: 0
      - name: Render canonical state files
        run: |
          npx prettier --write .project/ACTIVE_SPRINT.json .project/LAST_CHECKPOINT.json
          printf 'ACTIVE_BASE64='
          base64 -w0 .project/ACTIVE_SPRINT.json
          printf '\nCHECKPOINT_BASE64='
          base64 -w0 .project/LAST_CHECKPOINT.json
          printf '\n'
