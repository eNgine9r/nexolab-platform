name: Temporary state format probe

on:
  pull_request:
    paths:
      - ".project/ACTIVE_SPRINT.json"
      - ".project/LAST_CHECKPOINT.json"
      - ".github/workflows/temp-format-state.yml"

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
          check-latest: false
      - run: npm install --no-audit
        env:
          HUSKY: 0
      - name: Render canonical state files
        run: npx prettier --write .project/ACTIVE_SPRINT.json .project/LAST_CHECKPOINT.json
      - uses: actions/upload-artifact@v6
        with:
          name: formatted-state
          path: |
            .project/ACTIVE_SPRINT.json
            .project/LAST_CHECKPOINT.json
          if-no-files-found: error
          retention-days: 1
