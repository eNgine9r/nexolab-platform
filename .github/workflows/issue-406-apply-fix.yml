name: Issue 406 apply live chart continuity fix

on:
  push:
    branches:
      - fix/406-live-chart-history-continuity

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/406-live-chart-history-continuity
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Apply final stable-selection correction
        run: |
          python - <<'PY'
          from pathlib import Path

          hook = Path("src/hooks/use-live-telemetry.ts")
          text = hook.read_text()
          history_start = text.index('  useEffect(() => {\n    const config = runtime.config;\n    if (\n      !config ||\n      config.mode === "demo" ||\n      !enabled ||\n      scopeKey === null ||\n      liveCoverageScopeKey !== scopeKey ||\n      selectedIdentitiesRef.current.length === 0')
          history_end = text.index('\n  useEffect(() => {\n    if (\n      !enabled ||', history_start)
          block = text[history_start:history_end]
          before = '    const selected = new Set(reconciledSelectedKeys);\n'
          after = '    const selected = new Set(selectedKey ? selectedKey.split("\\u001f") : []);\n'
          if before not in block:
              raise SystemExit("selected set anchor not found")
          block = block.replace(before, after, 1)
          if '    reconciledSelectedKeys,\n' not in block:
              raise SystemExit("reconciled dependency anchor not found")
          block = block.replace('    reconciledSelectedKeys,\n', '', 1)
          text = text[:history_start] + block + text[history_end:]
          hook.write_text(text)
          PY
      - name: Install dependencies
        run: npm ci --no-audit
        env:
          HUSKY: 0
      - name: Format touched file
        run: npx prettier --write src/hooks/use-live-telemetry.ts
      - name: Targeted verification
        run: |
          npm run typecheck
          npm test -- src/features/live/live-history.test.ts src/features/live/live-chart.test.ts
      - name: Commit focused correction
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+eNgine9r@users.noreply.github.com"
          git add src/hooks/use-live-telemetry.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix(live): stabilize history selection trigger"
          git push origin HEAD:fix/406-live-chart-history-continuity
