name: Issue 406 apply live chart continuity fix

on:
  push:
    branches:
      - fix/406-live-chart-history-continuity

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/406-live-chart-history-continuity
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Apply focused regression fix
        run: |
          python - <<'PY'
          from pathlib import Path

          hook = Path("src/hooks/use-live-telemetry.ts")
          text = hook.read_text()

          needle = '  const selectedKey = reconciledSelectedKeys.join("\\u001f");\n'
          insertion = '''  const historyIdentitySignature = selectedIdentities.map(liveChannelKey).join("\\u001f");
          const historyIdentitiesRef = useRef<TelemetrySample[]>([]);
          const historyIdentitySignatureRef = useRef("");

          if (historyIdentitySignatureRef.current !== historyIdentitySignature) {
            historyIdentitySignatureRef.current = historyIdentitySignature;
            historyIdentitiesRef.current = selectedIdentities;
          }
          '''
          if needle not in text:
              raise SystemExit("selectedKey anchor not found")
          text = text.replace(needle, needle + insertion, 1)

          replacements = [
              ('      selectedIdentities.length === 0\n', '      historyIdentitiesRef.current.length === 0\n'),
              (
                  '    const controller = new AbortController();\n    const adapter = securedAdapter(config, selectedOrganizationId);\n',
                  '    const historyIdentities = historyIdentitiesRef.current;\n    const controller = new AbortController();\n    const adapter = securedAdapter(config, selectedOrganizationId);\n',
              ),
              ('      ...selectedIdentities,\n      ...historySamplesRef.current,\n', '      ...historyIdentities,\n      ...historySamplesRef.current,\n'),
              (
                  '    void loadCompleteLiveHistory(adapter, selectedIdentities, requestedWindow, controller.signal)\n',
                  '    void loadCompleteLiveHistory(adapter, historyIdentities, requestedWindow, controller.signal)\n',
              ),
              (
                  '          orderingStateRef.current = seedLiveHistoryOrderingState([...selectedIdentities, ...next]);\n',
                  '          orderingStateRef.current = seedLiveHistoryOrderingState([...historyIdentities, ...next]);\n',
              ),
              (
                  '    selectedIdentities,\n    selectedKey,\n',
                  '    historyIdentitySignature,\n    selectedKey,\n',
              ),
          ]
          for before, after in replacements:
              if before not in text:
                  raise SystemExit(f"hook anchor not found: {before!r}")
              text = text.replace(before, after, 1)
          hook.write_text(text)

          e2e = Path("e2e/live-chart-system.production.e2e.ts")
          text = e2e.read_text()

          mqtt_anchor = 'const apiBaseUrl = requiredEnvironment("NEXT_PUBLIC_NEXOLAB_API_BASE_URL");\n'
          if mqtt_anchor not in text:
              raise SystemExit("mqtt constant anchor not found")
          text = text.replace(
              mqtt_anchor,
              mqtt_anchor + 'const mqttTopic = process.env.MQTT_TOPIC ?? "nexolab/telemetry";\n',
              1,
          )

          helper_anchor = '''function sqlString(value: string): string {
            return `'${value.replaceAll("'", "''")}'`;
          }

          '''
          helper = '''function publishExplorerSample(equipmentId: string, channelId: string, value: number): void {
            const payload = JSON.stringify({
              event_id: randomUUID(),
              node_id: "edge-live-issue-400",
              captured_at: new Date().toISOString(),
              metric: "temperature.probe",
              value,
              unit: "degC",
              quality: "valid",
              source: "issue-406-regression",
              equipment_id: equipmentId,
              channel_id: channelId,
              alarm: null,
              raw_value: Math.round(value * 10),
              raw_status: null,
            });

            execFileSync(
              "docker",
              [
                "compose",
                "--project-name",
                composeProject,
                "--file",
                baseCompose,
                "--file",
                acceptanceCompose,
                "exec",
                "-T",
                "mqtt",
                "mosquitto_pub",
                "-h",
                "127.0.0.1",
                "-t",
                mqttTopic,
                "-m",
                payload,
              ],
              { stdio: "pipe" },
            );
          }

          '''
          if helper_anchor not in text:
              raise SystemExit("helper anchor not found")
          text = text.replace(helper_anchor, helper_anchor + helper, 1)

          test_anchor = '''    await expect(page.getByTestId("chart-accessible-summary").nth(1)).toContainText("2 series");

            await expect.poll(() => runtime.sockets.maximum).toBe(1);
          '''
          test_insert = '''    await expect(page.getByTestId("chart-accessible-summary").nth(1)).toContainText("2 series");

            const rendererHosts = page.getByTestId("chart-renderer-host");
            await expect(rendererHosts).toHaveCount(2);
            const historyRequestsBeforeLivePoint = runtime.telemetry.filter((request) =>
              request.url.includes("/history"),
            ).length;

            publishExplorerSample(fixture.equipmentId, fixture.channels[0], 9.9);
            await expect(page.getByText(/9[,.]9 degC/).first()).toBeVisible();
            await expect(rendererHosts).toHaveCount(2);
            await expect(page.getByText("Завантаження history window за одним ingestion watermark…")).toHaveCount(0);
            await expect.poll(() => runtime.telemetry.filter((request) => request.url.includes("/history")).length).toBe(
              historyRequestsBeforeLivePoint,
            );

            await expect.poll(() => runtime.sockets.maximum).toBe(1);
          '''
          if test_anchor not in text:
              raise SystemExit("test anchor not found")
          text = text.replace(test_anchor, test_insert, 1)
          e2e.write_text(text)
          PY
      - name: Install dependencies
        run: npm ci --no-audit
        env:
          HUSKY: 0
      - name: Format touched files
        run: npx prettier --write src/hooks/use-live-telemetry.ts e2e/live-chart-system.production.e2e.ts
      - name: Targeted verification
        run: |
          npm run typecheck
          npm test -- src/features/live/live-history.test.ts src/features/live/live-chart.test.ts
      - name: Commit focused fix
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/hooks/use-live-telemetry.ts e2e/live-chart-system.production.e2e.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix(live): keep chart mounted across live samples"
          git push origin HEAD:fix/406-live-chart-history-continuity
