name: PR 174 layout permission fix

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/pr174-layout-permission-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.number == 174
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Separate equipment and layout permissions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/components/refrigeration/refrigeration-detail-screen.tsx")
          text = path.read_text(encoding="utf-8")
          old = "              canManageEquipment={canManageEquipment && !retired}\n"
          new = "              forceReadOnly={retired}\n"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"expected one permission boundary, found {count}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

          npx prettier --write src/components/refrigeration/refrigeration-detail-screen.tsx
          git diff --check

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/refrigeration/refrigeration-detail-screen.tsx
          git commit -m "fix: separate equipment and layout permissions"
          git push origin HEAD:${{ github.head_ref }}
