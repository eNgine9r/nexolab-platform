name: Prettier Inventory

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/prettier-inventory.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact main baseline
        uses: actions/checkout@v4
        with:
          ref: f54cd7b6f6db580f3931a40889f5b4e33af3cc30

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate read-only inventory
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p prettier-inventory
          npm exec prettier -- --version > prettier-inventory/prettier-version.txt
          set +e
          npm exec prettier -- --list-different . > prettier-inventory/paths.txt
          prettier_status=$?
          set -e
          if [[ $prettier_status -ne 0 && $prettier_status -ne 1 ]]; then
            exit "$prettier_status"
          fi
          python3 - <<'PY'
          from __future__ import annotations

          from collections import Counter
          from pathlib import Path
          import json

          root = Path.cwd()
          output = root / "prettier-inventory"
          paths = [
              line.strip()
              for line in output.joinpath("paths.txt").read_text(encoding="utf-8").splitlines()
              if line.strip()
          ]
          records = []
          line_endings = Counter()
          extensions = Counter()
          top_level = Counter()
          for relative in paths:
              path = root / relative
              content = path.read_bytes()
              crlf = content.count(b"\r\n")
              lone_cr = content.count(b"\r") - crlf
              lf = content.count(b"\n") - crlf
              if crlf and (lf or lone_cr):
                  ending = "mixed"
              elif crlf:
                  ending = "crlf"
              elif lone_cr:
                  ending = "cr"
              else:
                  ending = "lf"
              suffix = path.suffix or "[none]"
              first = Path(relative).parts[0]
              line_endings[ending] += 1
              extensions[suffix] += 1
              top_level[first] += 1
              records.append(
                  {
                      "path": relative,
                      "bytes": len(content),
                      "extension": suffix,
                      "top_level": first,
                      "line_ending": ending,
                  }
              )

          prettier_version = output.joinpath("prettier-version.txt").read_text(
              encoding="utf-8"
          ).strip()
          payload = {
              "schema_version": 1,
              "repository": "eNgine9r/nexolab-platform",
              "base_ref": "main",
              "base_sha": "f54cd7b6f6db580f3931a40889f5b4e33af3cc30",
              "prettier_version": prettier_version,
              "command": "npm exec prettier -- --list-different .",
              "count": len(records),
              "line_endings": dict(sorted(line_endings.items())),
              "extensions": dict(sorted(extensions.items())),
              "top_level": dict(sorted(top_level.items())),
              "files": records,
          }
          output.joinpath("inventory.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          markdown = [
              "# Prettier inventory",
              "",
              f"- Base SHA: `{payload['base_sha']}`",
              f"- Prettier: `{prettier_version}`",
              f"- Files: **{len(records)}**",
              "",
              "## Line endings",
              "",
          ]
          markdown.extend(
              f"- {name}: {count}" for name, count in payload["line_endings"].items()
          )
          markdown.extend(["", "## Paths", ""])
          markdown.extend(f"- `{record['path']}`" for record in records)
          output.joinpath("inventory.md").write_text(
              "\n".join(markdown) + "\n", encoding="utf-8"
          )
          print(json.dumps(payload, indent=2, sort_keys=True))
          PY

      - name: Upload inventory evidence
        uses: actions/upload-artifact@v4
        with:
          name: prettier-inventory-f54cd7b6
          path: prettier-inventory
          if-no-files-found: error
          retention-days: 14
