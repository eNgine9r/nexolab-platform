name: Temporary Equipment Registry Visible Status

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/temporary-equipment-registry-visible-status.yml"

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'feat/267-equipment-metrology-registry'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feat/267-equipment-metrology-registry
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Require visible responsive status matches and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("e2e/equipment-registry.production.e2e.ts")
          text = path.read_text()

          statuses = [
              "Підключено",
              "Відключено",
              "Невідомо",
              "Актуальне",
              "Наближається термін",
              "Прострочене",
              "Не відстежується",
          ]
          for status in statuses:
              old = f'      await expect(page.getByText("{status}", {{ exact: true }}).first()).toBeVisible();'
              new = (
                  f'      await expect(page.getByText("{status}", {{ exact: true }}).filter({{ visible: true }}).first()).toBeVisible();'
              )
              if text.count(old) != 1:
                  raise SystemExit(f"status {status!r} matches={text.count(old)}")
              text = text.replace(old, new, 1)

          for identifier in ["MET-SENSOR-EXP", "reg-le01mp:12"]:
              old = f'      await expect(page.getByText("{identifier}", {{ exact: true }})).toBeVisible();'
              new = (
                  f'      await expect(page.getByText("{identifier}", {{ exact: true }}).filter({{ visible: true }}).first()).toBeVisible();'
              )
              if text.count(old) != 1:
                  raise SystemExit(f"filtered identifier {identifier!r} matches={text.count(old)}")
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY
          npm ci --ignore-scripts
          npx prettier --write e2e/equipment-registry.production.e2e.ts
          rm .github/workflows/temporary-equipment-registry-visible-status.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            e2e/equipment-registry.production.e2e.ts \
            .github/workflows/temporary-equipment-registry-visible-status.yml
          git commit -m "test(equipment): require visible responsive statuses"
          git push origin HEAD:feat/267-equipment-metrology-registry
