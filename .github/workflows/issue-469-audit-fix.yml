name: Temporary Issue 469 audit-fix helper

on:
  push:
    branches:
      - fix/469-raspberry-pi-deployment-evidence-capacity

permissions:
  contents: write

jobs:
  harden-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Harden fail-closed capacity behavior
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          helper_path = Path("scripts/deploy-capacity-guard.sh")
          text = helper_path.read_text(encoding="utf-8")

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one helper match, found {count}: {old[:90]!r}")
              text = text.replace(old, new, 1)

          replace_once(
              '''    bytes="${sizes[$index]}"\n    rm -rf -- "$dir"\n    total=$((total - bytes))\n    printf 'Pruned deployment evidence: %s bytes=%s reason=%s\\n' "$dir" "$bytes" "$reason"\n''',
              '''    bytes="${sizes[$index]}"\n    if ! rm -rf -- "$dir"; then\n      printf 'ERROR: failed to prune classified deployment evidence: %s\\n' "$dir" >&2\n      return 70\n    fi\n    if [[ -e "$dir" ]]; then\n      printf 'ERROR: classified deployment evidence still exists after prune: %s\\n' "$dir" >&2\n      return 70\n    fi\n    total=$((total - bytes))\n    printf 'Pruned deployment evidence: %s bytes=%s reason=%s\\n' "$dir" "$bytes" "$reason"\n''',
          )

          replace_once(
              '''nexolab_capacity_measure_postgres() {\n  local pg_container=$1\n  local fallback_bytes=$2\n''',
              '''nexolab_capacity_measure_postgres() {\n  local pg_container=$1\n''',
          )
          replace_once(
              '''  else\n    NEXOLAB_CAPACITY_PG_SOURCE=fallback\n    NEXOLAB_CAPACITY_PG_BYTES=$fallback_bytes\n  fi\n}\n''',
              '''  else\n    NEXOLAB_CAPACITY_PG_SOURCE=unavailable\n    NEXOLAB_CAPACITY_PG_BYTES=0\n  fi\n}\n''',
          )
          replace_once(
              '  local archive_percent archive_fixed_bytes pg_fallback_bytes pg_percent pg_fixed_bytes\n',
              '  local archive_percent archive_fixed_bytes pg_percent pg_fixed_bytes\n',
          )
          replace_once(
              '  pg_fallback_bytes="$(nexolab_capacity_uint NEXOLAB_DEPLOY_POSTGRES_FALLBACK_BYTES "${NEXOLAB_DEPLOY_POSTGRES_FALLBACK_BYTES:-}" 1073741824)" || return $?\n',
              '',
          )
          replace_once(
              '  nexolab_capacity_measure_postgres "$pg_container" "$pg_fallback_bytes"\n  local pg_estimate=0\n',
              '  nexolab_capacity_measure_postgres "$pg_container"\n  local pg_estimate=0 pg_measurement_failed=false\n  [[ "$NEXOLAB_CAPACITY_PG_SOURCE" != unavailable ]] || pg_measurement_failed=true\n',
          )
          replace_once(
              '''  local status=PASS\n  (( free_bytes >= required_bytes )) || status=FAIL\n''',
              '''  local status=PASS required_bytes_is_complete=true error_code=""\n  (( free_bytes >= required_bytes )) || status=FAIL\n  if [[ "$pg_measurement_failed" == true ]]; then\n    status=FAIL\n    required_bytes_is_complete=false\n    error_code=postgresql-size-unavailable\n  fi\n''',
          )
          replace_once(
              '''    printf 'required_bytes=%s\\n' "$required_bytes"\n    printf 'reserve_bytes=%s\\n' "$reserve_bytes"\n''',
              '''    printf 'required_bytes=%s\\n' "$required_bytes"\n    printf 'required_bytes_is_complete=%s\\n' "$required_bytes_is_complete"\n    printf 'error=%s\\n' "$error_code"\n    printf 'reserve_bytes=%s\\n' "$reserve_bytes"\n''',
          )
          replace_once(
              '''  if [[ "$status" != PASS ]]; then\n    printf 'ERROR: insufficient deployment capacity: free_bytes=%s required_bytes=%s reserve_bytes=%s report=%s\\n' \\\n      "$free_bytes" "$required_bytes" "$reserve_bytes" "$report" >&2\n    return 75\n  fi\n''',
              '''  if [[ "$status" != PASS ]]; then\n    if [[ "$pg_measurement_failed" == true ]]; then\n      printf 'ERROR: PostgreSQL size unavailable; refusing deployment: free_bytes=%s required_without_postgresql_bytes=%s reserve_bytes=%s report=%s\\n' \\\n        "$free_bytes" "$required_bytes" "$reserve_bytes" "$report" >&2\n      return 70\n    fi\n    printf 'ERROR: insufficient deployment capacity: free_bytes=%s required_bytes=%s reserve_bytes=%s report=%s\\n' \\\n      "$free_bytes" "$required_bytes" "$reserve_bytes" "$report" >&2\n    return 75\n  fi\n''',
          )
          helper_path.write_text(text, encoding="utf-8")

          docs_path = Path("docs/operations/raspberry-pi-deployment-capacity.md")
          docs = docs_path.read_text(encoding="utf-8")
          old = "- PostgreSQL dump estimate: 110% of `pg_database_size()` plus 64 MiB, or a conservative 1 GiB fallback if a running PostgreSQL container cannot report its size."
          new = "- PostgreSQL dump estimate: 110% of `pg_database_size()` plus 64 MiB; if a running PostgreSQL container cannot report its database size, the deployment fails closed before mutation rather than guessing."
          if docs.count(old) != 1:
              raise SystemExit("PostgreSQL capacity documentation anchor changed")
          docs = docs.replace(old, new, 1)
          docs = docs.replace("- `NEXOLAB_DEPLOY_POSTGRES_FALLBACK_BYTES`;\n", "")
          docs_path.write_text(docs, encoding="utf-8")

          tests_path = Path("scripts/tests/test_deploy_current_head_raspberry_pi_capacity.py")
          tests = tests_path.read_text(encoding="utf-8")
          anchor = '''    def test_deployment_orders_capacity_gate_before_mutation_and_uses_atomic_large_files(self) -> None:\n'''
          if tests.count(anchor) != 1:
              raise SystemExit("test insertion anchor changed")
          additions = r'''    def test_postgres_measurement_failure_is_fail_closed(self) -> None:
        with tempfile.TemporaryDirectory() as temp:
            repo = Path(temp) / "repo"
            audit = repo / "runtime" / "deployments" / "20260815T220000Z"
            audit.mkdir(parents=True)
            report = audit / "capacity-preflight.txt"
            result = run_bash(
                f'''source {subprocess.list2cmdline([str(HELPER)])}\n'''
                '''docker() { return 1; }\n'''
                '''nexolab_capacity_free_bytes() { printf '1000000\\n'; }\n'''
                f'''if nexolab_capacity_preflight {subprocess.list2cmdline([str(repo)])} {subprocess.list2cmdline([str(audit)])} fake-postgres {subprocess.list2cmdline([str(report)])}; then exit 99; else rc=$?; fi\n'''
                '''printf 'rc=%s\\n' "$rc"\n''',
                env={
                    "NEXOLAB_DEPLOY_MIN_FREE_RESERVE_BYTES": "100",
                    "NEXOLAB_DEPLOY_BUILD_HEADROOM_BYTES": "200",
                    "NEXOLAB_DEPLOY_METADATA_HEADROOM_BYTES": "300",
                    "NEXOLAB_DEPLOY_ARCHIVE_FIXED_OVERHEAD_BYTES": "0",
                    "NEXOLAB_DEPLOY_POSTGRES_FIXED_OVERHEAD_BYTES": "0",
                },
            )
            self.assertEqual(result.returncode, 0, result.stderr)
            self.assertIn("rc=70", result.stdout)
            content = report.read_text(encoding="utf-8")
            self.assertIn("status=FAIL", content)
            self.assertIn("postgresql_estimate_source=unavailable", content)
            self.assertIn("required_bytes_is_complete=false", content)
            self.assertIn("error=postgresql-size-unavailable", content)

    def test_retention_fails_closed_when_classified_directory_cannot_be_removed(self) -> None:
        with tempfile.TemporaryDirectory() as temp:
            deployments = Path(temp) / "deployments"
            old_dir = deployments / "20260101T000000Z"
            current = deployments / "20260815T220001Z"
            old_dir.mkdir(parents=True)
            current.mkdir(parents=True)
            result = run_bash(
                f'''source {subprocess.list2cmdline([str(HELPER)])}\n'''
                '''rm() { return 1; }\n'''
                f'''nexolab_prune_deployment_evidence {subprocess.list2cmdline([str(deployments)])} {subprocess.list2cmdline([str(current)])}\n''',
                env={
                    "NEXOLAB_DEPLOY_EVIDENCE_PROTECTED_COUNT": "1",
                    "NEXOLAB_DEPLOY_EVIDENCE_MAX_COUNT": "1",
                    "NEXOLAB_DEPLOY_EVIDENCE_MAX_AGE_DAYS": "0",
                    "NEXOLAB_DEPLOY_EVIDENCE_MAX_BYTES": "0",
                },
            )
            self.assertEqual(result.returncode, 70)
            self.assertTrue(old_dir.exists())
            self.assertIn("failed to prune classified deployment evidence", result.stderr)

'''
          tests = tests.replace(anchor, additions + anchor, 1)
          tests_path.write_text(tests, encoding="utf-8")
          PY

      - name: Targeted verification
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n scripts/deploy-capacity-guard.sh
          bash -n scripts/deploy-current-head-raspberry-pi.sh
          python3 scripts/tests/test_deploy_current_head_raspberry_pi_capacity.py

      - name: Commit audit hardening
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/deploy-capacity-guard.sh \
            scripts/tests/test_deploy_current_head_raspberry_pi_capacity.py \
            docs/operations/raspberry-pi-deployment-capacity.md
          git diff --cached --check
          git commit -m "fix: fail closed on deployment capacity uncertainty"
          git push origin "HEAD:${GITHUB_REF_NAME}"
