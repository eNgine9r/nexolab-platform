name: Issue 400 branch formatter

on:
  push:
    branches:
      - feat/400-live-data-chart-system

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/400-live-data-chart-system
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm install --no-audit
        env:
          HUSKY: 0
      - name: Format focused Issue 400 files
        run: |
          npx prettier --write \
            src/components/live/live-screen.tsx \
            src/components/live/live-telemetry-explorer.tsx \
            src/features/live/live-chart.ts
      - name: Commit focused formatting
        run: |
          set -euo pipefail
          if git diff --quiet -- \
            src/components/live/live-screen.tsx \
            src/components/live/live-telemetry-explorer.tsx \
            src/features/live/live-chart.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/components/live/live-screen.tsx \
            src/components/live/live-telemetry-explorer.tsx \
            src/features/live/live-chart.ts
          git commit -m "style(live): format Issue 400 files"
          git push origin HEAD:feat/400-live-data-chart-system
