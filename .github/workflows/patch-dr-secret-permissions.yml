name: Patch DR Secret Permissions

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/patch-dr-secret-permissions.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m7-disaster-recovery-gate
          fetch-depth: 0

      - name: Allow nonroot containers to read read-only secrets
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/run-disaster-recovery-acceptance.sh")
          content = path.read_text(encoding="utf-8")
          replacements = [
              (
                  'chmod 0700 "$PRIVATE_DIR" "$SECRETS_DIR" "$WORK_DIR"',
                  'chmod 0700 "$PRIVATE_DIR" "$WORK_DIR"\nchmod 0755 "$SECRETS_DIR"',
              ),
              ('path.chmod(0o400)', 'path.chmod(0o444)'),
          ]
          for old, new in replacements:
              if content.count(old) != 1:
                  raise SystemExit(f"Expected one occurrence of {old!r}")
              content = content.replace(old, new)
          path.write_text(content, encoding="utf-8")
          PY

      - name: Validate script
        run: |
          bash -n scripts/run-disaster-recovery-acceptance.sh
          grep -q 'chmod 0755 "$SECRETS_DIR"' scripts/run-disaster-recovery-acceptance.sh
          grep -q 'path.chmod(0o444)' scripts/run-disaster-recovery-acceptance.sh

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/run-disaster-recovery-acceptance.sh
          git commit -m "fix: expose mounted DR secrets to nonroot containers"
          git push origin HEAD:feat/m7-disaster-recovery-gate
