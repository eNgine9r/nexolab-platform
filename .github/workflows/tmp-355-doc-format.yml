name: Temporary Issue 355 Document Formatter

on:
  push:
    branches:
      - fix/355-live-dashboard-channel-inventory
    paths:
      - .github/workflows/tmp-355-doc-format.yml
      - docs/operations/live-dashboard-channel-inventory.md

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          package-manager-cache: false
          node-version-file: .nvmrc
      - run: npm install --no-audit
        env:
          HUSKY: "0"
      - name: Format evidence document
        run: npx prettier --write docs/operations/live-dashboard-channel-inventory.md
      - uses: actions/upload-artifact@v7
        with:
          name: issue-355-formatted-document
          path: docs/operations/live-dashboard-channel-inventory.md
          if-no-files-found: error
          retention-days: 1
