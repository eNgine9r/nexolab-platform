name: Format PR 190 review fixes

on:
  push:
    branches:
      - docs/183-architecture-reconciliation
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: format-pr190-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Apply exact Prettier output
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: docs/183-architecture-reconciliation
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        env:
          HUSKY: 0
        run: npm install --no-audit

      - name: Format scoped files and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail

          npm exec prettier -- --write \
            .project/ACTIVE_SPRINT.json \
            .project/BLOCKERS.md \
            .project/CURRENT_STATE.md \
            .project/LAST_CHECKPOINT.json \
            docs/architecture.md \
            docs/offline-readiness.md \
            docs/roadmap.md

          git rm .github/workflows/format-pr190.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .project/ACTIVE_SPRINT.json \
            .project/BLOCKERS.md \
            .project/CURRENT_STATE.md \
            .project/LAST_CHECKPOINT.json \
            docs/architecture.md \
            docs/offline-readiness.md \
            docs/roadmap.md
          git commit -m "chore: format PR #190 review remediation"
          git push origin HEAD:docs/183-architecture-reconciliation
