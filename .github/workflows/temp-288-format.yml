name: Temporary Issue 288 Formatter

on:
  push:
    branches:
      - feat/288-live-dashboard-workspace
    paths:
      - .github/workflows/temp-288-format.yml

permissions:
  contents: write

jobs:
  format-and-self-delete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/288-live-dashboard-workspace
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Apply exact formatter output
        run: >-
          npx prettier --write
          e2e/live.production.e2e.ts
          src/components/live-dashboards/dashboard-editor.tsx
          src/components/live-dashboards/dashboard-library.tsx
          src/components/live-dashboards/dashboard-live-view.tsx
          src/components/live-dashboards/live-dashboard-workspace.tsx
          src/components/live/live-screen.tsx
          src/features/live-dashboards/api-client.test.ts
          src/features/live-dashboards/api-client.ts
          src/features/live-dashboards/inventory.ts
          src/features/live-dashboards/model.test.ts
          src/features/live-dashboards/model.ts
          src/features/live-dashboards/types.ts
          src/hooks/use-live-dashboard-inventory.ts
          src/hooks/use-live-dashboard-library.ts
          src/hooks/use-live-dashboard-telemetry.ts
      - name: Remove temporary workflow and publish focused commit
        run: |
          rm .github/workflows/temp-288-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/live.production.e2e.ts src/components/live-dashboards src/components/live/live-screen.tsx src/features/live-dashboards src/hooks/use-live-dashboard-inventory.ts src/hooks/use-live-dashboard-library.ts src/hooks/use-live-dashboard-telemetry.ts .github/workflows/temp-288-format.yml
          git commit -m "style(live-dashboards): apply exact formatter output"
          git push origin HEAD:feat/288-live-dashboard-workspace
