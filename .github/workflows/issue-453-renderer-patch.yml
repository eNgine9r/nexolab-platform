name: Issue 453 Renderer Slice

on:
  push:
    branches:
      - feat/453-equipment-centric-multi-axis-charts
    paths:
      - .github/workflows/issue-453-renderer-patch.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/453-equipment-centric-multi-axis-charts
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Apply canonical multi-axis renderer patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/features/charts/echarts-adapter.ts')
          text = path.read_text()

          replacements = [
              (
                  'import type { ChartRendererAdapter, ChartRendererInitOptions, ChartRendererScene } from "./renderer-adapter";\n',
                  'import type { ChartRendererAdapter, ChartRendererInitOptions, ChartRendererScene } from "./renderer-adapter";\nimport { buildChartYAxisModel } from "./units";\n',
              ),
              (
                  '  const visibleSeries = scene.series.filter((series) => series.visible);\n  const legendNames = visibleSeries.map((series) => series.name);',
                  '  const visibleSeries = scene.series.filter((series) => series.visible);\n  const axisModel = buildChartYAxisModel(scene.series);\n  const legendNames = visibleSeries.map((series) => series.name);',
              ),
              (
                  '      type: "line" as const,\n      data: segment.points.map((point) => ({',
                  '      type: "line" as const,\n      yAxisId: axisModel.axisIdBySeriesKey.get(seriesKey),\n      data: segment.points.map((point) => ({',
              ),
              (
                  '    grid: { left: 64, right: 24, top: 28, bottom: 58, containLabel: false },',
                  '    grid: {\n      left: 64 + Math.max(0, ...axisModel.visibleAxes.filter((axis) => axis.position === "left").map((axis) => axis.offset)),\n      right: 40 + Math.max(0, ...axisModel.visibleAxes.filter((axis) => axis.position === "right").map((axis) => axis.offset)),\n      top: 28,\n      bottom: 58,\n      containLabel: false,\n    },',
              ),
              (
                  '    yAxis: {\n      type: "value",\n      scale: true,\n      axisLabel: { color: "#94A3B8" },\n      splitLine: { lineStyle: { color: "rgba(148,163,184,.10)" } },\n    },',
                  '    yAxis: axisModel.visibleAxes.map((axis, visibleIndex) => ({\n      id: axis.id,\n      type: "value" as const,\n      scale: true,\n      position: axis.position,\n      offset: axis.offset,\n      name: axis.nativeUnit,\n      nameLocation: "middle" as const,\n      nameGap: 38,\n      nameTextStyle: { color: "#CBD5E1", fontWeight: 600 },\n      axisLine: { show: true, lineStyle: { color: "rgba(148,163,184,.42)" } },\n      axisTick: { show: true },\n      axisLabel: { color: "#94A3B8", hideOverlap: true },\n      splitLine: {\n        show: visibleIndex === 0,\n        lineStyle: { color: "rgba(148,163,184,.10)" },\n      },\n    })),',
              ),
              ('replaceMerge: ["series"],', 'replaceMerge: ["series", "yAxis"],'),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'missing renderer replacement: {old[:60]!r}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Install dependencies
        env:
          HUSKY: 0
        run: npm install --no-audit
      - name: Format and verify renderer slice
        run: |
          npx prettier --write src/features/charts/units.ts src/features/charts/echarts-adapter.ts
          npx vitest run src/features/charts/units.test.ts src/features/charts/echarts-adapter.test.ts
          npm run typecheck
      - name: Commit product slice and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/issue-453-renderer-patch.yml
          git config user.name "Serhii"
          git config user.email "92324923+eNgine9r@users.noreply.github.com"
          git add src/features/charts/units.ts src/features/charts/echarts-adapter.ts .github/workflows/issue-453-renderer-patch.yml
          git commit -m "feat: add canonical dynamic Y-axis rendering"
          git push origin HEAD:feat/453-equipment-centric-multi-axis-charts
