name: Frontend Release Artifact

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Git ref to build
        required: true
        default: main
      api_base_url:
        description: Public LOCAL_LAN API base URL
        required: true
      websocket_url:
        description: Public LOCAL_LAN telemetry WebSocket URL
        required: true
      auth_provider:
        description: Frontend authentication provider
        required: true
        default: local
      organization_id:
        description: Default organization UUID
        required: true
      external_origin:
        description: Optional existing Google-protected HTTPS origin; builds a second artifact at the same SHA
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: Build verified ARM64 frontend release
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 70

    steps:
      - name: Checkout requested source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false

      - name: Record exact requested source
        id: provenance
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build self-contained ARM64 frontend runtime artifact
        shell: bash
        env:
          API_BASE_URL: ${{ inputs.api_base_url }}
          WEBSOCKET_URL: ${{ inputs.websocket_url }}
          AUTH_PROVIDER: ${{ inputs.auth_provider }}
          ORGANIZATION_ID: ${{ inputs.organization_id }}
        run: |
          set -euo pipefail
          scripts/build-frontend-release-artifact.sh \
            --platform linux/arm64 \
            --api-base-url "$API_BASE_URL" \
            --websocket-url "$WEBSOCKET_URL" \
            --auth-provider "$AUTH_PROVIDER" \
            --organization-id "$ORGANIZATION_ID" \
            --output "${{ runner.temp }}/nexolab-frontend-release"

      - name: Upload verified frontend release
        uses: actions/upload-artifact@v7
        with:
          name: nexolab-frontend-release-${{ steps.provenance.outputs.sha }}-arm64
          path: ${{ runner.temp }}/nexolab-frontend-release
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: Build matching protected HTTPS frontend
        if: inputs.external_origin != ''
        shell: bash
        env:
          EXTERNAL_ORIGIN: ${{ inputs.external_origin }}
          AUTH_PROVIDER: ${{ inputs.auth_provider }}
          ORGANIZATION_ID: ${{ inputs.organization_id }}
        run: |
          set -euo pipefail
          external_websocket="${EXTERNAL_ORIGIN/#https:/wss:}"
          scripts/build-frontend-release-artifact.sh \
            --platform linux/arm64 \
            --api-base-url "$EXTERNAL_ORIGIN" \
            --websocket-url "${external_websocket%/}/api/v1/telemetry/live" \
            --auth-provider "$AUTH_PROVIDER" \
            --organization-id "$ORGANIZATION_ID" \
            --external-https \
            --output "${{ runner.temp }}/nexolab-external-frontend-release"

      - name: Upload matching protected HTTPS frontend
        if: inputs.external_origin != ''
        uses: actions/upload-artifact@v7
        with:
          name: nexolab-external-frontend-release-${{ steps.provenance.outputs.sha }}-arm64
          path: ${{ runner.temp }}/nexolab-external-frontend-release
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
