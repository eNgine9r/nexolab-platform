name: Chart Format Diagnostic

on:
  push:
    branches:
      - fix/451-chart-integrity-alarm-provenance

permissions:
  contents: write

jobs:
  prettier-apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install dependencies
        env:
          HUSKY: 0
        run: npm install --no-audit
      - name: Apply exact formatting and retire diagnostic workflow
        shell: bash
        run: |
          set -euo pipefail
          files=(
            src/components/charts/chart-shell.tsx
            src/features/charts/continuity.test.ts
            src/features/charts/continuity.ts
            src/features/charts/domain.ts
            src/features/charts/echarts-adapter.ts
            src/features/live/live-chart.test.ts
            src/features/live/live-history.ts
          )
          npx prettier --write "${files[@]}"
          git rm .github/workflows/format-diagnostic.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${files[@]}"
          git diff --cached --check
          git commit -m "style(charts): apply exact repository formatting"
          git push origin HEAD:fix/451-chart-integrity-alarm-provenance
