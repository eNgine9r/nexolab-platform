name: Apply device agent backlog ordering patch

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/patch-device-agent-backlog-order.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Preserve FIFO across broker recovery
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("services/device-agent/main.py")
          source = path.read_text(encoding="utf-8")
          source = source.replace(
              '''        topic = self.settings.resolved_telemetry_topic
                  if self.state.mqtt_connected:
                      try:
                          result = self.client.publish(topic, payload, qos=1)
                          result.wait_for_publish(timeout=5)
                          if result.rc == mqtt.MQTT_ERR_SUCCESS:
                              self.state.update(
                                  last_publish_at=datetime.now(timezone.utc).isoformat(),
                              )
                              return True
                      except (RuntimeError, ValueError, OSError) as exc:
                          LOG.warning("MQTT publish failed; queueing event: %s", exc)

                  self.queue.enqueue(topic, payload, record.event_id)
                  return False
          ''',
              '''        topic = self.settings.resolved_telemetry_topic
                  # Once a backlog exists, append every new sample behind it. Publishing a
                  # newer sequence before queued older sequences would violate the central
                  # monotonic replay boundary after broker recovery.
                  if self.queue.size() == 0 and self.state.mqtt_connected:
                      try:
                          result = self.client.publish(topic, payload, qos=1)
                          result.wait_for_publish(timeout=5)
                          if result.rc == mqtt.MQTT_ERR_SUCCESS:
                              self.state.update(
                                  last_publish_at=datetime.now(timezone.utc).isoformat(),
                              )
                              return True
                      except (RuntimeError, ValueError, OSError) as exc:
                          LOG.warning("MQTT publish failed; queueing event: %s", exc)

                  self.queue.enqueue(topic, payload, record.event_id)
                  return False
          ''',
              1,
          )
          source = source.replace(
              '''                    publish_ok = all(publish_results)
                          flush_ok = self.flush_queue()
                          last_error = sample_error
                          if last_error is None and (not publish_ok or not flush_ok):
                              last_error = "MQTT unavailable; telemetry queued locally"
          ''',
              '''                    publish_ok = all(publish_results)
                          flush_ok = self.flush_queue()
                          queue_depth = self.queue.size()
                          last_error = sample_error
                          if last_error is None and queue_depth > 0:
                              last_error = "MQTT unavailable; telemetry queued locally"
                          elif (
                              last_error is None
                              and not publish_ok
                              and not flush_ok
                              and self.state.mqtt_connected
                          ):
                              last_error = "MQTT queue flush deferred"
          ''',
              1,
          )
          if source == path.read_text(encoding="utf-8"):
              raise SystemExit("backlog ordering patch did not change source")
          path.write_text(source, encoding="utf-8")
          PY
      - name: Add FIFO recovery tests
        run: |
          cat > services/device-agent/tests/test_mqtt_backlog_order.py <<'PY'
          from __future__ import annotations

          import json
          import os
          import unittest
          from unittest.mock import Mock, patch

          from main import AgentState, DeviceAgent, Settings, TelemetryRecord


          ORGANIZATION_ID = "00000000-0000-0000-0000-000000000001"


          class MQTTBacklogOrderingTests(unittest.TestCase):
              @staticmethod
              def settings() -> Settings:
                  with patch.dict(
                      os.environ,
                      {
                          "NEXOLAB_NODE_ID": "edge-01",
                          "NEXOLAB_ORGANIZATION_ID": ORGANIZATION_ID,
                      },
                      clear=True,
                  ):
                      return Settings.from_env()

              @staticmethod
              def record(event_id: str) -> TelemetryRecord:
                  return TelemetryRecord(
                      event_id=event_id,
                      node_id="edge-01",
                      captured_at="2026-07-27T00:00:00+00:00",
                      metric="temperature.air",
                      value=4.2,
                      unit="degC",
                      quality="valid",
                      source="simulator",
                  )

              def test_new_sample_is_appended_when_backlog_exists(self) -> None:
                  agent = object.__new__(DeviceAgent)
                  agent.settings = self.settings()
                  agent.state = AgentState()
                  agent.state.update(mqtt_connected=True)
                  agent.client = Mock()
                  agent.queue = Mock()
                  agent.queue.size.return_value = 3
                  agent.queue.next_sequence.return_value = 4

                  published = DeviceAgent.publish_or_queue(agent, self.record("event-4"))

                  self.assertFalse(published)
                  agent.client.publish.assert_not_called()
                  agent.queue.enqueue.assert_called_once()
                  topic, payload, event_id = agent.queue.enqueue.call_args.args
                  self.assertEqual(
                      topic,
                      f"nexolab/v1/{ORGANIZATION_ID}/edge-01/telemetry",
                  )
                  self.assertEqual(event_id, "event-4")
                  self.assertEqual(json.loads(payload)["node_sequence"], 4)

              def test_direct_publish_remains_available_without_backlog(self) -> None:
                  agent = object.__new__(DeviceAgent)
                  agent.settings = self.settings()
                  agent.state = AgentState()
                  agent.state.update(mqtt_connected=True)
                  agent.client = Mock()
                  agent.queue = Mock()
                  agent.queue.size.return_value = 0
                  agent.queue.next_sequence.return_value = 1
                  publish_result = Mock(rc=0)
                  agent.client.publish.return_value = publish_result

                  published = DeviceAgent.publish_or_queue(agent, self.record("event-1"))

                  self.assertTrue(published)
                  agent.queue.enqueue.assert_not_called()
                  publish_result.wait_for_publish.assert_called_once_with(timeout=5)

              def test_flush_uses_sqlite_order_without_resequencing(self) -> None:
                  agent = object.__new__(DeviceAgent)
                  agent.state = AgentState()
                  agent.state.update(mqtt_connected=True)
                  agent.client = Mock()
                  agent.queue = Mock()
                  agent.queue.oldest.return_value = [
                      (11, "topic", '{"node_sequence":11}'),
                      (12, "topic", '{"node_sequence":12}'),
                  ]
                  agent.client.publish.return_value = Mock(rc=0)

                  self.assertTrue(DeviceAgent.flush_queue(agent))

                  payloads = [call.args[1] for call in agent.client.publish.call_args_list]
                  self.assertEqual(
                      [json.loads(payload)["node_sequence"] for payload in payloads],
                      [11, 12],
                  )
                  self.assertEqual(
                      [call.args[0] for call in agent.queue.delete.call_args_list],
                      [11, 12],
                  )


          if __name__ == "__main__":
              unittest.main()
          PY
      - name: Validate patched source
        run: |
          python -m pip install -r services/device-agent/requirements.txt
          python -m compileall -q services/device-agent
          PYTHONPATH=services/device-agent \
            python -m unittest discover -s services/device-agent/tests -v
      - name: Commit FIFO patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/device-agent/main.py \
            services/device-agent/tests/test_mqtt_backlog_order.py
          git commit -m "fix: preserve MQTT backlog sequence ordering"
          git push origin "HEAD:${{ github.head_ref }}"
