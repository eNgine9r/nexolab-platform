name: Temporary Settings Lint Cleanup

on:
  pull_request:

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.pull_request.head.ref == 'feat/269-operator-safe-settings'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feat/269-operator-safe-settings

      - name: Use the clock icon for local time preferences
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/components/settings/settings-workspace.tsx")
          text = path.read_text()
          old = 'id="local-preferences-heading"\n            icon={SlidersHorizontal}'
          new = 'id="local-preferences-heading"\n            icon={Clock3}'
          if old not in text:
              raise SystemExit("Settings preference heading marker not found")
          path.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/temporary-settings-lint-cleanup.yml

      - name: Commit focused cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/settings/settings-workspace.tsx .github/workflows/temporary-settings-lint-cleanup.yml
          git commit -m "fix(settings): use local preference icon"
          git push origin HEAD:feat/269-operator-safe-settings
