name: Patch Dynamic Security stderr policy

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/patch-dynsec-stderr-policy.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Classify only explicit broker errors as failures
        run: |
          python - <<'PY'
          from pathlib import Path

          old = '''ctrl() {
            CONTROL_STDOUT="$(mktemp)"
            CONTROL_STDERR="$(mktemp)"
            status=0
            mosquitto_ctrl -o "$CONTROL_OPTIONS" dynsec "$@" \\
              >"$CONTROL_STDOUT" 2>"$CONTROL_STDERR" || status=$?

            if [ "$status" -ne 0 ] || [ -s "$CONTROL_STDERR" ]; then
              cat "$CONTROL_STDERR" >&2
              rm -f "$CONTROL_STDOUT" "$CONTROL_STDERR"
              CONTROL_STDOUT=""
              CONTROL_STDERR=""
              if [ "$status" -eq 0 ]; then
                return 77
              fi
              return "$status"
            fi

            cat "$CONTROL_STDOUT"
            rm -f "$CONTROL_STDOUT" "$CONTROL_STDERR"
            CONTROL_STDOUT=""
            CONTROL_STDERR=""
          }
          '''
          new = '''ctrl() {
            CONTROL_STDOUT="$(mktemp)"
            CONTROL_STDERR="$(mktemp)"
            status=0
            mosquitto_ctrl -o "$CONTROL_OPTIONS" dynsec "$@" \\
              >"$CONTROL_STDOUT" 2>"$CONTROL_STDERR" || status=$?

            if [ "$status" -ne 0 ]; then
              cat "$CONTROL_STDERR" >&2
              rm -f "$CONTROL_STDOUT" "$CONTROL_STDERR"
              CONTROL_STDOUT=""
              CONTROL_STDERR=""
              return "$status"
            fi

            if [ -s "$CONTROL_STDERR" ]; then
              if grep -Eiq \\
                '(^|[^[:alpha:]])(error|failed|failure|unable|refused|certificate|verification|tls)([^[:alpha:]]|$)' \\
                "$CONTROL_STDERR"; then
                cat "$CONTROL_STDERR" >&2
                rm -f "$CONTROL_STDOUT" "$CONTROL_STDERR"
                CONTROL_STDOUT=""
                CONTROL_STDERR=""
                return 77
              fi
              cat "$CONTROL_STDERR" >&2
            fi

            cat "$CONTROL_STDOUT"
            rm -f "$CONTROL_STDOUT" "$CONTROL_STDERR"
            CONTROL_STDOUT=""
            CONTROL_STDERR=""
          }
          '''

          script_paths = (
              Path("infrastructure/mqtt/dynamic-security/dynsec-admin.sh"),
              Path("services/telemetry-service/bin/nexolab-dynsec-admin"),
          )
          for path in script_paths:
              source = path.read_text(encoding="utf-8")
              if source.count(old) != 1:
                  raise SystemExit(f"dynsec ctrl anchor not found in {path}")
              path.write_text(source.replace(old, new, 1), encoding="utf-8")

          adapter_path = Path(
              "services/telemetry-service/app/nodes/broker_adapter.py"
          )
          adapter = adapter_path.read_text(encoding="utf-8")
          adapter = adapter.replace(
              "{64, 65, 66, 67, 68, 69, 70, 71, 72, 73, 74, 75, 76}",
              "{64, 65, 66, 67, 68, 69, 70, 71, 72, 73, 74, 75, 76, 77}",
              1,
          )
          adapter_path.write_text(adapter, encoding="utf-8")
          PY
          chmod 0755 \
            infrastructure/mqtt/dynamic-security/dynsec-admin.sh \
            services/telemetry-service/bin/nexolab-dynsec-admin

      - name: Add stderr classification regression tests
        run: |
          cat >> services/telemetry-service/tests/test_node_broker_adapter_tls.py <<'PY'


          def run_admin_with_diagnostic(
              tmp_path: Path,
              diagnostic: str,
          ) -> subprocess.CompletedProcess[str]:
              tmp_path.mkdir(parents=True, exist_ok=True)
              root = Path(__file__).resolve().parents[3]
              script = root / "infrastructure/mqtt/dynamic-security/dynsec-admin.sh"
              fake_bin = tmp_path / "bin"
              fake_bin.mkdir()
              fake_ctrl = fake_bin / "mosquitto_ctrl"
              fake_ctrl.write_text(
                  "#!/bin/sh\n"
                  "printf '%s\\n' \"$CTRL_DIAGNOSTIC\" >&2\n"
                  "exit 0\n",
                  encoding="utf-8",
              )
              fake_ctrl.chmod(0o700)
              password = write_file(tmp_path / "admin-password", "admin-secret")
              environment = os.environ.copy()
              environment.update(
                  {
                      "PATH": f"{fake_bin}:{environment['PATH']}",
                      "CTRL_DIAGNOSTIC": diagnostic,
                      "NEXOLAB_MQTT_ADMIN_PASSWORD_FILE": str(password),
                  }
              )
              return subprocess.run(
                  [str(script), "list-clients"],
                  check=False,
                  capture_output=True,
                  text=True,
                  env=environment,
              )


          def test_admin_script_allows_non_error_cli_warning(tmp_path: Path) -> None:
              result = run_admin_with_diagnostic(
                  tmp_path,
                  "Warning: client session closed cleanly.",
              )

              assert result.returncode == 0
              assert "Warning" in result.stderr


          def test_admin_script_rejects_tls_diagnostic_even_on_zero_exit(
              tmp_path: Path,
          ) -> None:
              result = run_admin_with_diagnostic(
                  tmp_path,
                  "Error: A TLS certificate verification failure occurred.",
              )

              assert result.returncode == 77
              assert "TLS certificate verification" in result.stderr
          PY

      - name: Validate stderr policy
        working-directory: services/telemetry-service
        run: |
          python -m pip install -r requirements-dev.txt
          python -m compileall -q app tests
          sh -n ../../infrastructure/mqtt/dynamic-security/dynsec-admin.sh
          sh -n bin/nexolab-dynsec-admin
          cmp ../../infrastructure/mqtt/dynamic-security/dynsec-admin.sh \
            bin/nexolab-dynsec-admin
          python -m pytest -q \
            tests/test_node_broker_adapter.py \
            tests/test_node_broker_adapter_tls.py

      - name: Commit stderr policy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            infrastructure/mqtt/dynamic-security/dynsec-admin.sh \
            services/telemetry-service/bin/nexolab-dynsec-admin \
            services/telemetry-service/app/nodes/broker_adapter.py \
            services/telemetry-service/tests/test_node_broker_adapter_tls.py
          git commit -m "fix: classify broker admin stderr without rejecting warnings"
          git push origin "HEAD:${{ github.head_ref }}"
