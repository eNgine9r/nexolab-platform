name: Node Broker Sync Wiring

on:
  push:
    branches: [feat/m6-node-broker-sync]
    paths:
      - ".github/workflows/node-broker-sync-wiring.yml"
      - ".github/node-broker-sync-trigger"

permissions:
  contents: write

concurrency:
  group: node-broker-sync-wiring-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/m6-node-broker-sync
          fetch-depth: 0

      - name: Apply checked lifecycle wiring
        run: |
          python - <<'PY'
          from pathlib import Path

          def swap(path: str, source: str, target: str, label: str) -> None:
              file = Path(path)
              content = file.read_text()
              if target in content:
                  return
              count = content.count(source)
              if count != 1:
                  raise SystemExit(f"{label}: expected one anchor, found {count}")
              file.write_text(content.replace(source, target, 1))

          swap(
              "services/telemetry-service/app/model_registry.py",
              "    from app.nodes import models as _node_models\n",
              "    from app.nodes import broker_models as _broker_models\n    from app.nodes import models as _node_models\n",
              "broker model import",
          )
          swap(
              "services/telemetry-service/app/model_registry.py",
              "    assert _node_models.CentralNode.__tablename__ == \"central_nodes\"\n",
              "    assert _broker_models.CentralNodeBrokerCommand.__tablename__ == (\n        \"central_node_broker_commands\"\n    )\n    assert _node_models.CentralNode.__tablename__ == \"central_nodes\"\n",
              "broker model assertion",
          )

          repository = "services/telemetry-service/app/nodes/repository.py"
          swap(
              repository,
              "from app.db import Database\n",
              "from app.db import Database\nfrom app.nodes.broker_models import CentralNodeBrokerCommand\nfrom app.nodes.broker_repository import BrokerCommandOutbox\n",
              "repository broker imports",
          )
          swap(
              repository,
              "        security_repository: SecurityRepository | None = None,\n        organization_id: str | None = None,\n",
              "        security_repository: SecurityRepository | None = None,\n        broker_outbox: BrokerCommandOutbox | None = None,\n        organization_id: str | None = None,\n",
              "repository constructor argument",
          )
          swap(
              repository,
              "        self._security_repository = security_repository\n        self._organization_id = organization_id\n",
              "        self._security_repository = security_repository\n        self._broker_outbox = broker_outbox\n        self._organization_id = organization_id\n",
              "repository constructor storage",
          )
          swap(
              repository,
              "            security_repository=self._security_repository,\n            organization_id=normalized,\n",
              "            security_repository=self._security_repository,\n            broker_outbox=self._broker_outbox,\n            organization_id=normalized,\n",
              "repository scoped propagation",
