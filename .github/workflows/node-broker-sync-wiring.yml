          swap(
              repository,
              "    def current_credential(self, node_id: str) -> CentralNodeCredential | None:\n",
              '''    def latest_broker_command(self, node_id: str) -> CentralNodeBrokerCommand | None:
              if self._broker_outbox is None:
                  return None
