                              credential=credential,
                              secret=secret,
                              command_key=f"rotate:{credential.id}",
                              actor_subject=command.actor_subject,
                              reason=command.reason,
                          )
                      self._audit(
          '''.replace("                      ", "                    "),
              "rotation outbox enqueue",
          )
          swap(
              repository,
              '                            "previous_credentials_revoked": len(active),\n                        },\n                    )\n',
              '                            "previous_credentials_revoked": len(active),\n                            "broker_sync_state": (\n                                None if broker_command is None else broker_command.state\n                            ),\n                        },\n                    )\n',
              "rotation audit sync state",
          )
          swap(
              repository,
              "                session.flush()\n                self._audit(\n                    session,\n                    node=node,\n",
              '''                session.flush()
                  broker_command = None
                  if self._broker_outbox is not None:
                      broker_command = self._broker_outbox.enqueue_enabled_state(
                          session,
                          node=node,
                          enabled=target is NodeState.ACTIVE,
                          command_key=f"state:{node.id}:{target.value}:{now.isoformat()}",
                          actor_subject=actor,
                          reason=normalized_reason,
                      )
                  self._audit(
                      session,
                      node=node,
          '''.replace("                  ", "                "),
              "state outbox enqueue",
          )
          swap(
              repository,
              '                        "state_reason": node.state_reason,\n                    },\n                )\n',
              '                        "state_reason": node.state_reason,\n                        "broker_sync_state": (\n                            None if broker_command is None else broker_command.state\n                        ),\n                    },\n                )\n',
              "state audit sync state",
          )

          config = "services/telemetry-service/app/config.py"
          swap(
              config,
              "    mqtt_qos: int = Field(default=1, ge=0, le=2)\n\n    ingestion_queue_maxsize",
              '''    mqtt_qos: int = Field(default=1, ge=0, le=2)

              broker_control_enabled: bool = False
              broker_control_encryption_key_file: str | None = None
              broker_control_mqtt_host: str | None = None
              broker_control_mqtt_port: int = Field(default=1883, ge=1, le=65535)
              broker_control_mqtt_username: str | None = None
              broker_control_mqtt_password_file: str | None = None
              broker_control_mqtt_client_id: str = "nexolab-broker-control"
