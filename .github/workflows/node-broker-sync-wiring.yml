              "        if self.mqtt_auth_required and not has_username:\n            raise ValueError(\n                \"MQTT credentials are required when MQTT_AUTH_REQUIRED=true\"\n            )\n        return self\n",
              '''        if self.mqtt_auth_required and not has_username:
                  raise ValueError(
