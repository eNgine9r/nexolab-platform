              if self.broker_control_retry_max_seconds < self.broker_control_retry_initial_seconds:
                  raise ValueError(
                      "BROKER_CONTROL_RETRY_MAX_SECONDS must be >= BROKER_CONTROL_RETRY_INITIAL_SECONDS"
                  )
              return self
          '''.replace("              ", "        "),
              "broker settings validation",
          )

          main = "services/telemetry-service/app/main.py"
          swap(
              main,
              "from app.nodes.api import create_node_router\n",
              '''from app.nodes.api import create_node_router
              from app.nodes.broker_adapter import MosquittoDynamicSecurityAdapter
              from app.nodes.broker_crypto import BrokerCommandCipher
              from app.nodes.broker_repository import BrokerCommandOutbox
              from app.nodes.broker_worker import BrokerControlWorker
          '''.replace("              ", ""),
              "main broker imports",
          )
          swap(
              main,
              "    security_repository = SecurityRepository(database)\n    node_repository = NodeRepository(\n        database,\n        security_repository=security_repository,\n    )\n",
              '''    security_repository = SecurityRepository(database)
              broker_outbox: BrokerCommandOutbox | None = None
              broker_control_worker: BrokerControlWorker | None = None
              if resolved.broker_control_enabled:
                  cipher = BrokerCommandCipher.from_file(
                      resolved.broker_control_encryption_key_file or ""
                  )
                  broker_outbox = BrokerCommandOutbox(
                      database,
                      cipher,
                      max_attempts=resolved.broker_control_max_attempts,
                  )
                  broker_adapter = MosquittoDynamicSecurityAdapter(
                      host=resolved.broker_control_mqtt_host or resolved.mqtt_host,
                      port=resolved.broker_control_mqtt_port,
                      username=resolved.broker_control_mqtt_username or "",
                      password_file=resolved.broker_control_mqtt_password_file or "",
                      client_id=resolved.broker_control_mqtt_client_id,
                      timeout_seconds=resolved.broker_control_command_timeout_seconds,
                  )
                  broker_control_worker = BrokerControlWorker(
                      outbox=broker_outbox,
                      adapter=broker_adapter,
                      poll_interval_seconds=resolved.broker_control_poll_interval_seconds,
                      lease_seconds=resolved.broker_control_lease_seconds,
                      retry_initial_seconds=resolved.broker_control_retry_initial_seconds,
                      retry_max_seconds=resolved.broker_control_retry_max_seconds,
                  )
              node_repository = NodeRepository(
                  database,
                  security_repository=security_repository,
                  broker_outbox=broker_outbox,
              )
          '''.replace("              ", "    "),
              "main broker construction",
          )
          swap(
              main,
              "        live_hub.start(asyncio.get_running_loop())\n        ingestor.start()\n",
              "        live_hub.start(asyncio.get_running_loop())\n        ingestor.start()\n        if broker_control_worker is not None:\n            broker_control_worker.start()\n",
              "main worker start",
          )
          swap(
              main,
              "            if mqtt_consumer is not None:\n                mqtt_consumer.stop()\n            await asyncio.to_thread(ingestor.stop)\n",
              "            if mqtt_consumer is not None:\n                mqtt_consumer.stop()\n            if broker_control_worker is not None:\n                await asyncio.to_thread(broker_control_worker.stop)\n            await asyncio.to_thread(ingestor.stop)\n",
              "main worker stop",
          )
          swap(
              main,
              "    app.state.node_repository = node_repository\n",
              "    app.state.node_repository = node_repository\n    app.state.broker_outbox = broker_outbox\n    app.state.broker_control_worker = broker_control_worker\n",
              "main state exposure",
          )

          schemas = "services/telemetry-service/app/nodes/schemas.py"
          swap(
              schemas,
              "class NodeRead(BaseModel):\n",
              '''class NodeBrokerSyncRead(BaseModel):
                  model_config = ConfigDict(from_attributes=True)

                  id: str
                  command_type: str
                  state: str
                  attempts: int
                  max_attempts: int
                  available_at: datetime
                  applied_at: datetime | None
                  last_error_code: str | None
                  last_error_summary: str | None
                  created_at: datetime
                  updated_at: datetime


              class NodeRead(BaseModel):
          '''.replace("              ", ""),
              "broker sync schema",
          )
          swap(
              schemas,
              "    current_credential: NodeCredentialRead | None = None\n",
              "    current_credential: NodeCredentialRead | None = None\n    broker_sync: NodeBrokerSyncRead | None = None\n",
              "node broker sync field",
          )

          api = "services/telemetry-service/app/nodes/api.py"
          swap(
              api,
              "    NodeCredentialRead,\n    NodeRead,\n",
              "    NodeBrokerSyncRead,\n    NodeCredentialRead,\n    NodeRead,\n",
              "api broker schema import",
          )
          swap(
              api,
              "            response = _provision_response(stored)\n",
              "            response = _provision_response(repository.for_organization(\n                authorized.principal.organization_id\n            ), stored)\n",
              "provision response repository",
          )
          swap(
              api,
              "            response = _rotation_response(stored)\n",
              "            response = _rotation_response(repository.for_organization(\n                authorized.principal.organization_id\n            ), stored)\n",
              "rotation response repository",
          )
          swap(
              api,
              "def _node_read(repository: NodeRepository, node: CentralNode) -> NodeRead:\n    credential = repository.current_credential(node.node_id)\n",
              "def _node_read(repository: NodeRepository, node: CentralNode) -> NodeRead:\n    credential = repository.current_credential(node.node_id)\n    broker_command = repository.latest_broker_command(node.node_id)\n",
              "node read broker query",
          )
          swap(
              api,
              "            exclude={\"current_credential\"}\n",
              "            exclude={\"current_credential\", \"broker_sync\"}\n",
              "node read model exclusion",
          )
          swap(
              api,
              "        current_credential=(\n            None\n            if credential is None\n            else NodeCredentialRead.model_validate(credential)\n        ),\n    )\n",
              "        current_credential=(\n            None\n            if credential is None\n            else NodeCredentialRead.model_validate(credential)\n        ),\n        broker_sync=(\n            None\n            if broker_command is None\n            else NodeBrokerSyncRead.model_validate(broker_command)\n        ),\n    )\n",
              "node read broker field",
          )
          swap(
              api,
              "def _provision_response(stored: ProvisionedNode) -> ProvisionNodeResponse:\n",
              "def _provision_response(\n    repository: NodeRepository, stored: ProvisionedNode\n) -> ProvisionNodeResponse:\n",
              "provision response signature",
          )
          swap(
              api,
              "        node=NodeRead(\n            **NodeRead.model_validate(stored.node).model_dump(\n                exclude={\"current_credential\"}\n            ),\n            current_credential=credential,\n        ),\n",
              "        node=_node_read(repository, stored.node),\n",
              "provision response node",
          )
          swap(
              api,
              "def _rotation_response(stored: RotatedNodeCredential) -> RotateNodeCredentialResponse:\n",
              "def _rotation_response(\n    repository: NodeRepository, stored: RotatedNodeCredential\n) -> RotateNodeCredentialResponse:\n",
              "rotation response signature",
          )
          swap(
              api,
              "        node=NodeRead(\n            **NodeRead.model_validate(stored.node).model_dump(\n                exclude={\"current_credential\"}\n            ),\n            current_credential=credential,\n        ),\n",
              "        node=_node_read(repository, stored.node),\n",
              "rotation response node",
          )

          compose = "infrastructure/compose/compose.central-mqtt-security.yaml"
          swap(
              compose,
              "      MQTT_CLIENT_ID: ${MQTT_INGESTION_CLIENT_ID:-nexolab-central-ingestion}\n",
              '''      MQTT_CLIENT_ID: ${MQTT_INGESTION_CLIENT_ID:-nexolab-central-ingestion}
                    BROKER_CONTROL_ENABLED: "true"
                    BROKER_CONTROL_ENCRYPTION_KEY_FILE: /run/secrets/nexolab/broker-control-key
                    BROKER_CONTROL_MQTT_HOST: mqtt
                    BROKER_CONTROL_MQTT_PORT: 1883
                    BROKER_CONTROL_MQTT_USERNAME: ${MQTT_ADMIN_USERNAME:?MQTT_ADMIN_USERNAME is required}
                    BROKER_CONTROL_MQTT_PASSWORD_FILE: /run/secrets/nexolab/admin-password
                    BROKER_CONTROL_MQTT_CLIENT_ID: nexolab-central-broker-control
          '''.replace("                    ", "      "),
              "secure compose broker control",
          )

          tests = Path("services/telemetry-service/tests/test_node_broker_control.py")
          if not tests.exists():
              tests.write_text('''from __future__ import annotations

          import base64
          from datetime import UTC, datetime, timedelta
          from pathlib import Path

          import pytest
          from sqlalchemy import select
          from sqlalchemy.orm import Session

          from app.db import Database
          from app.model_registry import register_models
          from app.nodes.broker_adapter import BrokerControlUnavailableError
          from app.nodes.broker_crypto import (
              BrokerCommandCipher,
              BrokerCommandDecryptionError,
          )
          from app.nodes.broker_models import CentralNodeBrokerCommand
          from app.nodes.broker_repository import BrokerCommandOutbox
          from app.nodes.broker_worker import BrokerControlWorker
          from app.nodes.domain import ProvisionNodeCommand, RotateNodeCredentialCommand
          from app.nodes.repository import NodeRepository
          from app.security.authorization import Role
          from app.security.models import SecurityOrganization


          ORGANIZATION_ID = "00000000-0000-0000-0000-000000000001"
          ROLES = frozenset({Role.LABORATORY_MANAGER})


          def cipher(byte: int = 7) -> BrokerCommandCipher:
              return BrokerCommandCipher(bytes([byte]) * 32)


          def build(tmp_path: Path, *, command_cipher: BrokerCommandCipher | None = None):
              register_models()
              database = Database(f"sqlite:///{tmp_path / 'broker-control.db'}")
              database.create_schema()
              with Session(database.engine) as session:
                  session.add(
                      SecurityOrganization(id=ORGANIZATION_ID, slug="org-a", name="Org A")
                  )
                  session.commit()
              outbox = BrokerCommandOutbox(database, command_cipher or cipher(), max_attempts=3)
              repository = NodeRepository(database, broker_outbox=outbox)
              return repository.for_organization(ORGANIZATION_ID), outbox, database


          def provision(repository: NodeRepository):
              return repository.provision(
                  ProvisionNodeCommand(
                      node_id="edge-01",
                      display_name="Edge 01",
                      idempotency_key="provision-edge-01",
                      actor_subject="manager-a",
                  ),
                  actor_identity_id=None,
                  actor_roles=ROLES,
              )


          def rows(database: Database) -> list[CentralNodeBrokerCommand]:
              with Session(database.engine, expire_on_commit=False) as session:
                  result = list(
                      session.scalars(
                          select(CentralNodeBrokerCommand).order_by(
                              CentralNodeBrokerCommand.created_at
                          )
                      )
                  )
                  for row in result:
                      session.expunge(row)
                  return result


          def test_lifecycle_creates_encrypted_idempotent_commands(tmp_path: Path) -> None:
              repository, outbox, database = build(tmp_path)
              first = provision(repository)
              replay = provision(repository)
              assert first.secret is not None
              assert replay.replayed is True
              assert len(rows(database)) == 1
              command = rows(database)[0]
              assert command.command_type == "upsert_credential"
              assert command.secret_ciphertext is not None
              assert first.secret not in command.secret_ciphertext
              assert outbox.decrypt_secret(command) == first.secret

              repository.activate(
                  "edge-01",
                  actor_subject="manager-a",
                  actor_identity_id=None,
                  actor_roles=ROLES,
                  reason="approved",
              )
              rotated = repository.rotate_credential(
                  RotateNodeCredentialCommand(
                      node_id="edge-01",
                      idempotency_key="rotate-edge-01",
                      actor_subject="manager-a",
                      reason="scheduled rotation",
                  ),
                  actor_identity_id=None,
                  actor_roles=ROLES,
              )
              repository.suspend(
                  "edge-01",
                  actor_subject="manager-a",
                  actor_identity_id=None,
                  actor_roles=ROLES,
                  reason="maintenance",
              )
              repository.suspend(
                  "edge-01",
                  actor_subject="manager-a",
                  actor_identity_id=None,
                  actor_roles=ROLES,
                  reason="maintenance replay",
              )
              commands = rows(database)
              assert [row.command_type for row in commands] == [
                  "upsert_credential",
                  "enable_client",
                  "upsert_credential",
                  "disable_client",
              ]
              serialized = " ".join(
                  str(value)
                  for row in commands
                  for value in row.__dict__.values()
              )
              assert first.secret not in serialized
              assert rotated.secret not in serialized
              database.dispose()


          def test_wrong_key_and_corrupted_ciphertext_fail_closed(tmp_path: Path) -> None:
              repository, outbox, database = build(tmp_path)
              provision(repository)
              command = rows(database)[0]
              wrong = BrokerCommandOutbox(database, cipher(8), max_attempts=3)
              with pytest.raises(BrokerCommandDecryptionError):
                  wrong.decrypt_secret(command)
              with Session(database.engine) as session:
                  stored = session.get(CentralNodeBrokerCommand, command.id)
                  assert stored is not None
                  stored.secret_ciphertext = base64.urlsafe_b64encode(b"corrupted").decode()
                  session.commit()
              corrupted = rows(database)[0]
              with pytest.raises(BrokerCommandDecryptionError):
                  outbox.decrypt_secret(corrupted)
              database.dispose()


          class RecordingAdapter:
              def __init__(self, failures: int = 0) -> None:
                  self.failures = failures
                  self.applied: list[tuple[str, str | None]] = []

              def apply(self, command: CentralNodeBrokerCommand, *, secret: str | None) -> None:
                  if self.failures:
                      self.failures -= 1
                      raise BrokerControlUnavailableError("broker unavailable")
                  self.applied.append((command.command_type, secret))


          def test_worker_retries_and_restart_resumes_pending_command(tmp_path: Path) -> None:
              repository, outbox, database = build(tmp_path)
              stored = provision(repository)
              adapter = RecordingAdapter(failures=1)
              worker = BrokerControlWorker(
                  outbox=outbox,
                  adapter=adapter,
                  retry_initial_seconds=1,
                  retry_max_seconds=2,
              )
              now = datetime(2026, 7, 27, 12, 0, tzinfo=UTC)
              assert worker.process_once(observed_at=now) is True
              command = rows(database)[0]
              assert command.state == "retrying"
              assert command.attempts == 1

              restarted_outbox = BrokerCommandOutbox(database, cipher(), max_attempts=3)
              restarted_worker = BrokerControlWorker(
                  outbox=restarted_outbox,
                  adapter=adapter,
                  retry_initial_seconds=1,
                  retry_max_seconds=2,
              )
              assert restarted_worker.process_once(
                  observed_at=now + timedelta(seconds=2)
              ) is True
              command = rows(database)[0]
              assert command.state == "applied"
              assert command.attempts == 2
              assert adapter.applied == [("upsert_credential", stored.secret)]
              database.dispose()
          '''.replace("          ", ""))
          PY

      - name: Install backend dependencies
        working-directory: services/telemetry-service
        run: python -m pip install -r requirements-dev.txt

      - name: Verify lifecycle wiring
        working-directory: services/telemetry-service
        run: |
          python -m compileall -q app tests migrations
          pytest -q \
            tests/test_node_broker_control.py \
            tests/test_node_repository.py \
            tests/test_mqtt_credentials.py
          alembic upgrade head --sql >/tmp/node-broker-sync-migration.sql

      - name: Commit verified product changes
        run: |
          git config user.name "github-actions[bot]"
