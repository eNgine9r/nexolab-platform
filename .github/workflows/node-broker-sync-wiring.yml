              "provision audit sync state",
          )
          swap(
              repository,
              "                    session.add(credential)\n                    node.updated_at = now\n                    session.flush()\n                    self._audit(\n",
              '''                    session.add(credential)
                      node.updated_at = now
                      session.flush()
                      broker_command = None
                      if self._broker_outbox is not None:
                          broker_command = self._broker_outbox.enqueue_upsert(
                              session,
