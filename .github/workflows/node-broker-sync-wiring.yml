              return self._broker_outbox.latest_for_node(
                  organization_id=self._scope(),
                  node_record_id=node.id,
              )

              def current_credential(self, node_id: str) -> CentralNodeCredential | None:
          '''.replace("              ", "    "),
              "repository broker query",
          )
          swap(
              repository,
              "                    session.add_all([node, credential])\n                    session.flush()\n                    self._audit(\n",
