                  self.broker_control_mqtt_password_file
                  and self.broker_control_mqtt_password_file.strip()
              )
              if broker_has_username != broker_has_password:
                  raise ValueError(
                      "BROKER_CONTROL_MQTT_USERNAME and BROKER_CONTROL_MQTT_PASSWORD_FILE "
