name: Offline Bundle

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/offline-bundle.yml"
      - "infrastructure/compose/**"
      - "infrastructure/offline/**"
      - "scripts/build-offline-bundle.sh"
      - "scripts/generate-offline-bundle-manifest.py"
      - "scripts/install-offline-bundle.sh"
      - "scripts/offline-bundle-smoke.sh"
      - "scripts/verify-offline-bundle.py"
      - "scripts/verify-offline-volume-preservation.sh"
      - "docs/operations/offline-installation.md"
      - "services/device-agent/**"
      - "services/telemetry-service/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - "public/**"
      - "src/**"
  workflow_dispatch:
    inputs:
      platform:
        description: Target offline bundle platform
        required: true
        default: linux/arm64
        type: choice
        options:
          - linux/amd64
          - linux/arm64
      runtime_source_ref:
        description: Git ref whose exact tree supplies runtime images and schema
        required: true
        default: main
        type: string
      dashboard_origin:
        description: Public LOCAL_LAN dashboard origin compiled into the bundle
        required: true
        type: string
      api_base_url:
        description: Public LOCAL_LAN API base URL compiled into the bundle
        required: true
        type: string
      websocket_url:
        description: Public LOCAL_LAN telemetry WebSocket URL compiled into the bundle
        required: true
        type: string
      auth_provider:
        description: Offline dashboard authentication provider
        required: true
        default: local
        type: choice
        options:
          - local
          - disabled

concurrency:
  group: offline-bundle-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CI_ROOT: .ci/offline-bundle
  CENTRAL_ENV: .ci/offline-bundle/central.env
  EDGE_ENV: .ci/offline-bundle/edge.env

jobs:
  disconnected-acceptance:
    name: Build, load and prove disconnected runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout exact tooling commit
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Resolve bounded build contract
        id: contract
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_PLATFORM: ${{ inputs.platform }}
          DISPATCH_RUNTIME_SOURCE_REF: ${{ inputs.runtime_source_ref }}
          DISPATCH_DASHBOARD_ORIGIN: ${{ inputs.dashboard_origin }}
          DISPATCH_API_BASE_URL: ${{ inputs.api_base_url }}
          DISPATCH_WEBSOCKET_URL: ${{ inputs.websocket_url }}
          DISPATCH_AUTH_PROVIDER: ${{ inputs.auth_provider }}
        run: |
          set -Eeuo pipefail
          tooling_sha="$(git rev-parse HEAD)"
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            platform="$DISPATCH_PLATFORM"
            runtime_source_ref="$DISPATCH_RUNTIME_SOURCE_REF"
            dashboard_origin="$DISPATCH_DASHBOARD_ORIGIN"
            api_base_url="$DISPATCH_API_BASE_URL"
            websocket_url="$DISPATCH_WEBSOCKET_URL"
            auth_provider="$DISPATCH_AUTH_PROVIDER"
          else
            platform="linux/amd64"
            runtime_source_ref="$tooling_sha"
            dashboard_origin="http://127.0.0.1:3000"
            api_base_url="http://127.0.0.1:8082"
            websocket_url="ws://127.0.0.1:8082/api/v1/telemetry/live"
            auth_provider="disabled"
          fi

          case "$platform" in
            linux/amd64|linux/arm64) ;;
            *) echo "Unsupported offline bundle platform: $platform" >&2; exit 2 ;;
          esac
          case "$auth_provider" in
            local|disabled) ;;
            *) echo "Unsupported offline auth provider: $auth_provider" >&2; exit 2 ;;
          esac
          runtime_source_sha="$(git rev-parse --verify "${runtime_source_ref}^{commit}")" || {
            echo "Runtime source ref cannot be resolved: $runtime_source_ref" >&2
            exit 2
          }
          git merge-base --is-ancestor "$runtime_source_sha" "$tooling_sha" || {
            echo "Runtime source must be an ancestor of the reviewed tooling commit" >&2
            exit 2
          }
          python3 - "$dashboard_origin" "$api_base_url" "$websocket_url" <<'PYURL'
          import sys
          from ipaddress import ip_address
          from urllib.parse import urlparse

          expected = (
              ("dashboard_origin", {"http", "https"}),
              ("api_base_url", {"http", "https"}),
              ("websocket_url", {"ws", "wss"}),
          )
          parsed_urls = {}
          canonical_urls = {}
          default_ports = {"http": 80, "https": 443, "ws": 80, "wss": 443}
          for (name, schemes), raw in zip(expected, sys.argv[1:], strict=True):
              if any(char.isspace() for char in raw) or any(ord(char) < 32 for char in raw):
                  raise SystemExit(f"{name} must be a single-line URL without whitespace")
              parsed = urlparse(raw)
              try:
                  port = parsed.port
              except ValueError as exc:
                  raise SystemExit(f"{name} has an invalid port: {exc}") from exc
              if parsed.scheme not in schemes or not parsed.hostname or parsed.username or parsed.password or parsed.fragment:
                  raise SystemExit(f"{name} is not a valid bounded public runtime URL")
              host = parsed.hostname.lower()
              if host.endswith("."):
                  raise SystemExit(f"{name} must not use a trailing-dot hostname")
              try:
                  parsed_address = ip_address(host)
              except ValueError:
                  try:
                      browser_host = host.encode("idna").decode("ascii").lower()
                  except UnicodeError as exc:
                      raise SystemExit(f"{name} hostname is not browser-canonical: {exc}") from exc
                  if browser_host != host:
                      raise SystemExit(f"{name} hostname must use browser-canonical ASCII serialization: {browser_host}")
              else:
                  browser_host = parsed_address.compressed.lower()
                  if browser_host != host:
                      raise SystemExit(f"{name} IP host must use canonical browser serialization: {browser_host}")
              host = browser_host
              authority_host = f"[{host}]" if ":" in host else host
              authority = authority_host
              if port is not None and port != default_ports[parsed.scheme]:
                  authority = f"{authority_host}:{port}"
              if name in {"dashboard_origin", "api_base_url"}:
                  if parsed.path or parsed.params or parsed.query:
                      raise SystemExit(f"{name} must be a canonical origin without path, parameters or query")
                  canonical = f"{parsed.scheme}://{authority}"
              else:
                  if parsed.params or parsed.query or parsed.path != "/api/v1/telemetry/live":
                      raise SystemExit("websocket_url must use the canonical /api/v1/telemetry/live path without parameters or query")
                  canonical = f"{parsed.scheme}://{authority}/api/v1/telemetry/live"
              if raw != canonical:
                  raise SystemExit(f"{name} must use canonical browser serialization: {canonical}")
              parsed_urls[name] = parsed
              canonical_urls[name] = canonical

          dashboard = parsed_urls["dashboard_origin"]
          api = parsed_urls["api_base_url"]
          websocket = parsed_urls["websocket_url"]
          hosts = {item.hostname.lower() for item in parsed_urls.values()}
          if len(hosts) != 1:
              raise SystemExit("Dashboard, API and WebSocket URLs must use the same LOCAL_LAN host")

          local_host = dashboard.hostname.lower().rstrip(".")
          try:
              address = ip_address(local_host)
          except ValueError:
              numeric_ipv4_alias = (
                  local_host.isdigit()
                  or (
                      local_host.startswith("0x")
                      and len(local_host) > 2
                      and all(char in "0123456789abcdef" for char in local_host[2:])
                  )
              )
              if numeric_ipv4_alias:
                  raise SystemExit("Runtime URLs must not use browser-recognized numeric IPv4 aliases")
              local_dns = (
                  "." not in local_host
                  or local_host.endswith(".local")
                  or local_host.endswith(".lan")
                  or local_host.endswith(".home.arpa")
              )
              if not local_dns:
                  raise SystemExit("Runtime URLs must use a LOCAL_LAN hostname, not a public DNS name")
          else:
              if address.is_global or address.is_unspecified or address.is_multicast:
                  raise SystemExit("Runtime URLs must use a non-global LOCAL_LAN IP address")

          if api.scheme != dashboard.scheme:
              raise SystemExit("Dashboard and API URLs must use the same HTTP security scheme")
          expected_ws_scheme = "wss" if dashboard.scheme == "https" else "ws"
          if websocket.scheme != expected_ws_scheme:
              raise SystemExit(f"WebSocket scheme must be {expected_ws_scheme} for {dashboard.scheme} Dashboard/API URLs")
          PYURL

          arch="${platform#linux/}"
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            version="recovery-${runtime_source_sha:0:12}-tooling-${tooling_sha:0:12}"
            artifact_name="nexolab-offline-${arch}-runtime-${runtime_source_sha:0:12}-tooling-${tooling_sha:0:12}"
          else
            version="ci-${tooling_sha:0:12}"
            artifact_name="nexolab-offline-amd64-${tooling_sha}"
          fi
          local_auth=false
          [[ "$auth_provider" == "local" ]] && local_auth=true

          {
            echo "tooling_sha=$tooling_sha"
            echo "runtime_source_sha=$runtime_source_sha"
            echo "platform=$platform"
            echo "arch=$arch"
            echo "version=$version"
            echo "artifact_name=$artifact_name"
            echo "dashboard_origin=$dashboard_origin"
            echo "api_base_url=$api_base_url"
            echo "websocket_url=$websocket_url"
            echo "auth_provider=$auth_provider"
            echo "local_auth=$local_auth"
          } >> "$GITHUB_OUTPUT"

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Setup QEMU for ARM64 runtime proof
        if: ${{ steps.contract.outputs.platform == 'linux/arm64' }}
        uses: docker/setup-qemu-action@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Prepare isolated validation configuration
        shell: bash
        env:
          DASHBOARD_ORIGIN: ${{ steps.contract.outputs.dashboard_origin }}
          LOCAL_AUTH: ${{ steps.contract.outputs.local_auth }}
        run: |
          set -Eeuo pipefail
          mkdir -p "$CI_ROOT" "$CI_ROOT/evidence" "$CI_ROOT/clean-host"
          auth_mode=disabled
          private_key_file=
          public_key_file=
          if [[ "$LOCAL_AUTH" == "true" ]]; then
            auth_dir="$RUNNER_TEMP/nexolab-offline-local-auth"
            mkdir -p "$auth_dir"
            private_key_file="$auth_dir/private.pem"
            public_key_file="$auth_dir/public.pem"
            password_file="$auth_dir/operator-password"
            openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out "$private_key_file" >/dev/null 2>&1
            openssl pkey -in "$private_key_file" -pubout -out "$public_key_file" >/dev/null 2>&1
            openssl rand -hex 24 > "$password_file"
            chmod 0400 "$private_key_file" "$password_file"
            chmod 0444 "$public_key_file"
            sudo chown 10001:10001 "$private_key_file" "$public_key_file" "$password_file"
            auth_mode=jwt
          fi
          cat > "$CENTRAL_ENV" <<EOF
          COMPOSE_PROJECT_NAME=nexolab-offline-central-ci
          CENTRAL_RESOURCE_PREFIX=nexolab-offline-central-ci
          CENTRAL_BIND_ADDRESS=127.0.0.1
          CENTRAL_API_PORT=8082
          CENTRAL_MQTT_PORT=1884
          CENTRAL_OBJECT_STORAGE_PORT=9000
          CENTRAL_OBJECT_STORAGE_CONSOLE_PORT=9001
          DASHBOARD_BIND_ADDRESS=127.0.0.1
          DASHBOARD_PORT=3000
          POSTGRES_DB=nexolab
          POSTGRES_USER=nexolab
          POSTGRES_PASSWORD=ci-postgres-offline-password-0123456789
          MINIO_ROOT_USER=nexolab-ci-storage
          MINIO_ROOT_PASSWORD=ci-minio-offline-password-0123456789
          OBJECT_STORAGE_BUCKET=nexolab-equipment-images
          OBJECT_STORAGE_PUBLIC_ENDPOINT_URL=http://127.0.0.1:9000
          MQTT_TOPIC=nexolab/telemetry
          MQTT_CLIENT_ID=nexolab-offline-ci-ingestion
          CORS_ALLOWED_ORIGINS=$DASHBOARD_ORIGIN
          CORS_ALLOW_CREDENTIALS=false
          AUTH_MODE=$auth_mode
          AUTH_DEFAULT_ORGANIZATION_ID=00000000-0000-0000-0000-000000000001
          AUTH_JWT_PUBLIC_KEY=
          AUTH_JWT_JWKS_URL=
          AUTH_LOCAL_PRIVATE_KEY_HOST_FILE=$private_key_file
          AUTH_LOCAL_PUBLIC_KEY_HOST_FILE=$public_key_file
          AUTH_LOCAL_ISSUER=urn:nexolab:offline-bundle-ci
          AUTH_LOCAL_AUDIENCE=nexolab-api
          EOF
          cat > "$EDGE_ENV" <<'EOF'
          COMPOSE_PROJECT_NAME=nexolab-offline-edge-ci
          NEXOLAB_NODE_ID=edge-offline-ci
          DEVICE_MODE=simulator
          MQTT_TOPIC=nexolab/telemetry
          SAMPLE_INTERVAL_SECONDS=1
          LOG_LEVEL=INFO
          DEVICE_AGENT_IMAGE=offline-placeholder
          EOF

      - name: Validate scripts and offline Compose contract
        shell: bash
        env:
          LOCAL_AUTH: ${{ steps.contract.outputs.local_auth }}
        run: |
          set -Eeuo pipefail
          bash -n \
            scripts/build-offline-bundle.sh \
            scripts/install-offline-bundle.sh \
            scripts/offline-bundle-smoke.sh \
            scripts/verify-offline-volume-preservation.sh
          python -m py_compile \
            scripts/generate-offline-bundle-manifest.py \
            scripts/verify-offline-bundle.py
          python -m unittest tests.test_ci_offline_bundle_workflow_contract -v

          export OFFLINE_DASHBOARD_IMAGE=nexolab/dashboard:contract
          export OFFLINE_TELEMETRY_IMAGE=nexolab/telemetry-service:contract
          export OFFLINE_DEVICE_AGENT_IMAGE=nexolab/device-agent:contract
          export OFFLINE_MQTT_IMAGE=eclipse-mosquitto:2.0.22
          export OFFLINE_POSTGRES_IMAGE=postgres:16-alpine
          export OFFLINE_MINIO_IMAGE=minio/minio:RELEASE.2025-09-07T16-13-09Z
          export OFFLINE_MINIO_CLIENT_IMAGE=minio/mc:RELEASE.2025-08-13T08-35-41Z

          central=(docker compose \
            --env-file "$CENTRAL_ENV" \
            -f infrastructure/compose/compose.central.yaml \
            -f infrastructure/offline/compose.central.offline.yaml)
          if [[ "$LOCAL_AUTH" == "true" ]]; then
            central+=( -f infrastructure/compose/compose.local-auth.yaml )
          fi
          "${central[@]}" config --format json > "$CI_ROOT/evidence/central-compose.json"
          docker compose \
            --env-file "$EDGE_ENV" \
            -f infrastructure/compose/compose.edge.yaml \
            -f infrastructure/offline/compose.edge.offline.yaml \
            config --format json > "$CI_ROOT/evidence/edge-compose.json"

          python - "$CI_ROOT/evidence/central-compose.json" "$CI_ROOT/evidence/edge-compose.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          for path in map(Path, sys.argv[1:]):
              payload = json.loads(path.read_text(encoding="utf-8"))
              for name, service in payload["services"].items():
                  if service.get("build") is not None:
                      raise SystemExit(f"Offline service still has a build contract: {path}:{name}")
                  if service.get("pull_policy") != "never":
                      raise SystemExit(f"Offline service does not use pull_policy=never: {path}:{name}")
          PY

          ! grep -R --line-number --fixed-strings "docker compose down -v" \
            scripts/install-offline-bundle.sh \
            scripts/offline-bundle-smoke.sh \
            scripts/verify-offline-volume-preservation.sh

      - name: Build selected offline bundle on connected builder
        id: bundle
        shell: bash
        env:
          VERSION: ${{ steps.contract.outputs.version }}
          PLATFORM: ${{ steps.contract.outputs.platform }}
          ARCH: ${{ steps.contract.outputs.arch }}
          RUNTIME_SOURCE_SHA: ${{ steps.contract.outputs.runtime_source_sha }}
          TOOLING_SHA: ${{ steps.contract.outputs.tooling_sha }}
          DASHBOARD_ORIGIN: ${{ steps.contract.outputs.dashboard_origin }}
          API_BASE_URL: ${{ steps.contract.outputs.api_base_url }}
          WEBSOCKET_URL: ${{ steps.contract.outputs.websocket_url }}
          AUTH_PROVIDER: ${{ steps.contract.outputs.auth_provider }}
        run: |
          set -Eeuo pipefail
          ./scripts/build-offline-bundle.sh \
            --version "$VERSION" \
            --platform "$PLATFORM" \
            --runtime-source-ref "$RUNTIME_SOURCE_SHA" \
            --dashboard-origin "$DASHBOARD_ORIGIN" \
            --api-base-url "$API_BASE_URL" \
            --websocket-url "$WEBSOCKET_URL" \
            --auth-provider "$AUTH_PROVIDER" \
            --output "$PWD/dist/offline"
          archive="$PWD/dist/offline/nexolab-offline-${VERSION}-${ARCH}.tar.gz"
          test -f "$archive"
          test -f "${archive}.sha256"
          (
            cd "$(dirname "$archive")"
            sha256sum --check "$(basename "${archive}.sha256")"
          )
          echo "runtime_source_sha=$RUNTIME_SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "tooling_sha=$TOOLING_SHA" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "arch=$ARCH" >> "$GITHUB_OUTPUT"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Simulate clean transferred host and remove runtime images
        id: clean_host
        shell: bash
        run: |
          set -Eeuo pipefail
          archive="${{ steps.bundle.outputs.archive }}"
          version="${{ steps.bundle.outputs.version }}"
          arch="${{ steps.bundle.outputs.arch }}"
          staging="$PWD/dist/offline/nexolab-offline-${version}-${arch}"
          rm -rf "$staging" "$CI_ROOT/clean-host"/*
          tar --extract --gzip --file "$archive" --directory "$CI_ROOT/clean-host"
          bundle_root="$PWD/$CI_ROOT/clean-host/nexolab-offline-${version}-${arch}"
          test -d "$bundle_root"
          python "$bundle_root/scripts/verify-offline-bundle.py" "$bundle_root"

          mapfile -t runtime_images < <(
            python - "$bundle_root/manifest.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          manifest = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          for image in manifest["images"]:
              print(image["reference"])
          PY
          )
          test "${#runtime_images[@]}" -eq 7
          docker image rm --force "${runtime_images[@]}"
          for image in "${runtime_images[@]}"; do
            if docker image inspect "$image" >/dev/null 2>&1; then
              echo "Runtime image remained before docker load: $image" >&2
              exit 1
            fi
          done
          echo "bundle_root=$bundle_root" >> "$GITHUB_OUTPUT"

      - name: Block container egress for disconnected runtime proof
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo iptables -N NEXOLAB_OFFLINE 2>/dev/null || true
          sudo iptables -F NEXOLAB_OFFLINE
          sudo iptables -C DOCKER-USER -j NEXOLAB_OFFLINE 2>/dev/null \
            || sudo iptables -I DOCKER-USER 1 -j NEXOLAB_OFFLINE
          sudo iptables -A NEXOLAB_OFFLINE -d 10.0.0.0/8 -j RETURN
          sudo iptables -A NEXOLAB_OFFLINE -d 172.16.0.0/12 -j RETURN
          sudo iptables -A NEXOLAB_OFFLINE -d 192.168.0.0/16 -j RETURN
          sudo iptables -A NEXOLAB_OFFLINE -m conntrack --ctstate ESTABLISHED,RELATED -j RETURN
          sudo iptables -A NEXOLAB_OFFLINE -j REJECT
          sudo iptables-save > "$CI_ROOT/evidence/iptables-disconnected.rules"

      - name: Load archive and start disconnected stack with pull disabled
        shell: bash
        env:
          LOCAL_AUTH: ${{ steps.contract.outputs.local_auth }}
        run: |
          set -Eeuo pipefail
          bundle_root="${{ steps.clean_host.outputs.bundle_root }}"
          install_args=(
            --central-env "$PWD/$CENTRAL_ENV"
            --edge-env "$PWD/$EDGE_ENV"
          )
          if [[ "$LOCAL_AUTH" == "true" ]]; then
            install_args+=(--local-auth)
          fi
          bash "$bundle_root/scripts/install-offline-bundle.sh" "${install_args[@]}"

          eval "$(python "$bundle_root/scripts/verify-offline-bundle.py" \
            "$bundle_root" --check-loaded-images --emit-shell-env)"
          export OFFLINE_DASHBOARD_IMAGE OFFLINE_TELEMETRY_IMAGE OFFLINE_DEVICE_AGENT_IMAGE
          export OFFLINE_MQTT_IMAGE OFFLINE_POSTGRES_IMAGE OFFLINE_MINIO_IMAGE OFFLINE_MINIO_CLIENT_IMAGE

          central=(docker compose --env-file "$PWD/$CENTRAL_ENV" \
            -f "$bundle_root/deploy/compose/compose.central.yaml" \
            -f "$bundle_root/deploy/offline/compose.central.offline.yaml")
          if [[ "$LOCAL_AUTH" == "true" ]]; then
            central+=( -f "$bundle_root/deploy/compose/compose.local-auth.yaml" )
          fi
          dashboard_id="$("${central[@]}" ps -q dashboard)"
          network="$(docker inspect "$dashboard_id" --format '{{range $name, $_ := .NetworkSettings.Networks}}{{$name}}{{end}}')"
          docker run --rm --pull never --network "$network" "$OFFLINE_DASHBOARD_IMAGE" \
            node -e "fetch('https://example.com').then(()=>process.exit(1)).catch(()=>process.exit(0))"

      - name: Prove update and rollback preserve persistent data
        shell: bash
        env:
          LOCAL_AUTH: ${{ steps.contract.outputs.local_auth }}
        run: |
          set -Eeuo pipefail
          preservation_args=(
            --bundle-root "${{ steps.clean_host.outputs.bundle_root }}"
            --central-env "$PWD/$CENTRAL_ENV"
            --edge-env "$PWD/$EDGE_ENV"
            --evidence-dir "$PWD/$CI_ROOT/evidence"
          )
          if [[ "$LOCAL_AUTH" == "true" ]]; then
            preservation_args+=(--local-auth)
          fi
          bash scripts/verify-offline-volume-preservation.sh "${preservation_args[@]}"

      - name: Prove local authentication session lifecycle
        if: ${{ steps.contract.outputs.local_auth == 'true' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          bundle_root="${{ steps.clean_host.outputs.bundle_root }}"
          auth_dir="$RUNNER_TEMP/nexolab-offline-local-auth"
          password_file="$auth_dir/operator-password"
          test -s "$password_file"

          eval "$(python "$bundle_root/scripts/verify-offline-bundle.py" \
            "$bundle_root" --check-loaded-images --emit-shell-env)"
          export OFFLINE_DASHBOARD_IMAGE OFFLINE_TELEMETRY_IMAGE OFFLINE_DEVICE_AGENT_IMAGE
          export OFFLINE_MQTT_IMAGE OFFLINE_POSTGRES_IMAGE OFFLINE_MINIO_IMAGE OFFLINE_MINIO_CLIENT_IMAGE

          central=(docker compose --env-file "$PWD/$CENTRAL_ENV" \
            -f "$bundle_root/deploy/compose/compose.central.yaml" \
            -f "$bundle_root/deploy/offline/compose.central.offline.yaml" \
            -f "$bundle_root/deploy/compose/compose.local-auth.yaml")

          "${central[@]}" run --rm --no-deps \
            -v "$password_file:/run/operator-password:ro" \
            telemetry-service \
            python -m app.security.local_cli create-account \
            --username offline-bundle-admin \
            --password-file /run/operator-password \
            --display-name "Offline Bundle Administrator" \
            --organization-id 00000000-0000-0000-0000-000000000001 \
            --organization-slug nexolab-offline-bundle \
            --organization-name "NEXOLAB Offline Bundle Acceptance" \
            --role administrator

          python3 - "$password_file" "$CI_ROOT/evidence/local-auth-session.json" <<'PYAUTH'
          import json
          import sys
          import urllib.error
          import urllib.request
          from pathlib import Path

          password = Path(sys.argv[1]).read_text(encoding="utf-8").strip()
          evidence_path = Path(sys.argv[2])
          base = "http://127.0.0.1:8082"
          organization_id = "00000000-0000-0000-0000-000000000001"

          def request(method, path, payload=None, token=None, expected=(200,)):
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              headers = {"Content-Type": "application/json"}
              if token is not None:
                  headers["Authorization"] = f"Bearer {token}"
                  headers["X-Organization-ID"] = organization_id
              req = urllib.request.Request(base + path, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=10) as response:
                      status = response.status
                      body = response.read()
              except urllib.error.HTTPError as exc:
                  status = exc.code
                  body = exc.read()
              if status not in expected:
                  raise SystemExit(f"{method} {path} returned unexpected HTTP {status}")
              return status, (json.loads(body) if body else None)

          _, login = request(
              "POST",
              "/api/v1/auth/local/login",
              {"username": "offline-bundle-admin", "password": password},
          )
          access = login["access_token"]
          initial_refresh = login["refresh_token"]

          _, session = request("GET", "/api/v1/auth/session", token=access)
          memberships = session.get("memberships", [])
          if not memberships or "administrator" not in memberships[0].get("roles", []):
              raise SystemExit("Local-auth session did not preserve administrator RBAC")

          _, refreshed = request(
              "POST",
              "/api/v1/auth/local/refresh",
              {"refresh_token": initial_refresh},
          )
          if refreshed["refresh_token"] == initial_refresh:
              raise SystemExit("Local-auth refresh token did not rotate")

          request(
              "POST",
              "/api/v1/auth/local/refresh",
              {"refresh_token": initial_refresh},
              expected=(401,),
          )
          request(
              "POST",
              "/api/v1/auth/local/logout",
              {"refresh_token": refreshed["refresh_token"]},
              expected=(204,),
          )
          request(
              "GET",
              "/api/v1/auth/session",
              token=refreshed["access_token"],
              expected=(401,),
          )

          evidence_path.write_text(
              json.dumps(
                  {
                      "account_provisioned": True,
                      "login": "success",
                      "administrator_rbac": True,
                      "refresh_rotated": True,
                      "refresh_replay_rejected": True,
                      "logout": "success",
                      "revoked_session_rejected": True,
                  },
                  sort_keys=True,
              )
              + "\n",
              encoding="utf-8",
          )
          PYAUTH

      - name: Capture final disconnected evidence
        if: always()
        shell: bash
        env:
          LOCAL_AUTH: ${{ steps.contract.outputs.local_auth }}
          RUNTIME_SOURCE_SHA: ${{ steps.contract.outputs.runtime_source_sha }}
          TOOLING_SHA: ${{ steps.contract.outputs.tooling_sha }}
        run: |
          set +e
          bundle_root="${{ steps.clean_host.outputs.bundle_root }}"
          if [[ -n "$bundle_root" && -d "$bundle_root" ]]; then
            eval "$(python "$bundle_root/scripts/verify-offline-bundle.py" \
              "$bundle_root" --emit-shell-env 2>/dev/null)"
            export OFFLINE_DASHBOARD_IMAGE OFFLINE_TELEMETRY_IMAGE OFFLINE_DEVICE_AGENT_IMAGE
            export OFFLINE_MQTT_IMAGE OFFLINE_POSTGRES_IMAGE OFFLINE_MINIO_IMAGE OFFLINE_MINIO_CLIENT_IMAGE
            central=(docker compose --env-file "$PWD/$CENTRAL_ENV" \
              -f "$bundle_root/deploy/compose/compose.central.yaml" \
              -f "$bundle_root/deploy/offline/compose.central.offline.yaml")
            if [[ "$LOCAL_AUTH" == "true" ]]; then
              central+=( -f "$bundle_root/deploy/compose/compose.local-auth.yaml" )
            fi
            "${central[@]}" ps --format json > "$CI_ROOT/evidence/central-final-ps.json"
            docker compose --env-file "$PWD/$EDGE_ENV" \
              -f "$bundle_root/deploy/compose/compose.edge.yaml" \
              -f "$bundle_root/deploy/offline/compose.edge.offline.yaml" \
              ps --format json > "$CI_ROOT/evidence/edge-final-ps.json"
            cp "$bundle_root/manifest.json" "$CI_ROOT/evidence/manifest.json"
            cp "$bundle_root/SHA256SUMS" "$CI_ROOT/evidence/SHA256SUMS"
          fi
          printf '%s\n' "$RUNTIME_SOURCE_SHA" > "$CI_ROOT/evidence/runtime-source-head.txt"
          printf '%s\n' "$TOOLING_SHA" > "$CI_ROOT/evidence/tooling-head.txt"
          docker image ls --digests > "$CI_ROOT/evidence/docker-images.txt"
          docker volume ls > "$CI_ROOT/evidence/docker-volumes.txt"

      - name: Stop validation containers without deleting volumes
        if: always()
        shell: bash
        env:
          LOCAL_AUTH: ${{ steps.contract.outputs.local_auth }}
        run: |
          set +e
          bundle_root="${{ steps.clean_host.outputs.bundle_root }}"
          if [[ -n "$bundle_root" && -d "$bundle_root" ]]; then
            eval "$(python "$bundle_root/scripts/verify-offline-bundle.py" \
              "$bundle_root" --emit-shell-env 2>/dev/null)"
            export OFFLINE_DASHBOARD_IMAGE OFFLINE_TELEMETRY_IMAGE OFFLINE_DEVICE_AGENT_IMAGE
            export OFFLINE_MQTT_IMAGE OFFLINE_POSTGRES_IMAGE OFFLINE_MINIO_IMAGE OFFLINE_MINIO_CLIENT_IMAGE
            docker compose --env-file "$PWD/$EDGE_ENV" \
              -f "$bundle_root/deploy/compose/compose.edge.yaml" \
              -f "$bundle_root/deploy/offline/compose.edge.offline.yaml" down --remove-orphans
            central=(docker compose --env-file "$PWD/$CENTRAL_ENV" \
              -f "$bundle_root/deploy/compose/compose.central.yaml" \
              -f "$bundle_root/deploy/offline/compose.central.offline.yaml")
            if [[ "$LOCAL_AUTH" == "true" ]]; then
              central+=( -f "$bundle_root/deploy/compose/compose.local-auth.yaml" )
            fi
            "${central[@]}" down --remove-orphans
          fi

      - name: Upload accepted offline bundle and verification evidence
        if: ${{ success() }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.contract.outputs.artifact_name }}
          path: |
            dist/offline/*.tar.gz
            dist/offline/*.tar.gz.sha256
            .ci/offline-bundle/evidence
          if-no-files-found: error
          retention-days: 3

      - name: Upload failed validation diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.contract.outputs.artifact_name || 'nexolab-offline-validation' }}-failed-diagnostics
          path: .ci/offline-bundle/evidence
          if-no-files-found: warn
          retention-days: 3
