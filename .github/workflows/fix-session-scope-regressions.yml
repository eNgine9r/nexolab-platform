name: Fix session scope regressions

on:
  push:
    branches: [feat/organization-scoped-test-sessions]

permissions:
  contents: write

concurrency:
  group: fix-session-scope-regressions
  cancel-in-progress: false

jobs:
  fix:
    if: "${{ !contains(github.event.head_commit.message, 'fix: scope session create idempotency') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/organization-scoped-test-sessions

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Apply fixes
        run: python .github/scripts/fix-session-scope-regressions.py

      - name: Remove temporary automation
        run: |
          rm .github/scripts/fix-session-scope-regressions.py
          rm .github/workflows/fix-session-scope-regressions.yml

      - name: Install backend dependencies
        working-directory: services/telemetry-service
        run: python -m pip install -r requirements-dev.txt

      - name: Run focused regressions
        working-directory: services/telemetry-service
        run: |
          python -m compileall -q app tests
          python -m pytest -q \
            tests/test_session_organization_scope.py \
            tests/test_session_api_organization_scope.py

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: scope session create idempotency"
          git push origin HEAD:feat/organization-scoped-test-sessions
