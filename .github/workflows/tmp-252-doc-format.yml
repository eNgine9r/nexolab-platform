name: Temporary Issue 252 Document Formatter

on:
  push:
    branches:
      - maint/252-lint-staged-17
    paths:
      - .github/workflows/tmp-252-doc-format.yml
      - docs/maintenance/lint-staged-17-migration.md

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          package-manager-cache: false
          node-version-file: .nvmrc
      - run: npm install --no-audit
        env:
          HUSKY: "0"
      - name: Format evidence document
        run: npx prettier --write docs/maintenance/lint-staged-17-migration.md
      - uses: actions/upload-artifact@v7
        with:
          name: issue-252-formatted-document
          path: docs/maintenance/lint-staged-17-migration.md
          if-no-files-found: error
          retention-days: 1
