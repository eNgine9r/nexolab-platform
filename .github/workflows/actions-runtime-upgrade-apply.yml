name: Apply Actions Runtime Upgrade

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/actions-runtime-upgrade-apply.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.number == 236 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'chore/235-actions-runtime-upgrade'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact controlled branch head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Generate inventory and apply allowlisted upgrades
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --disable-pip-version-check pyyaml==6.0.2
          python - <<'PY'
          from __future__ import annotations

          from pathlib import Path
          from typing import Any
          import yaml

          root = Path('.github/workflows')
          helper = root / 'actions-runtime-upgrade-apply.yml'
          inventory_path = Path('docs/maintenance/github-actions-runtime-inventory.md')

          def as_list(value: Any) -> list[str]:
              if value is None:
                  return []
              if isinstance(value, dict):
                  return [str(key) for key in value]
              if isinstance(value, list):
                  return [str(item) for item in value]
              return [str(value)]

          def compact_permissions(value: Any) -> str:
              if value is None:
                  return 'default'
              if isinstance(value, str):
                  return value
              if isinstance(value, dict):
                  return ', '.join(f'{key}:{val}' for key, val in sorted(value.items()))
              return str(value)

          def action_summary(step: dict[str, Any], family: str) -> str:
              usage = str(step.get('uses', ''))
              with_block = step.get('with') or {}
              if family == 'checkout':
                  ref = with_block.get('ref', 'event default')
                  depth = with_block.get('fetch-depth', '1 default')
                  credentials = with_block.get('persist-credentials', 'true default')
                  repository = with_block.get('repository', 'current repository')
                  return (
                      f'`{usage}`; repo={repository}; ref={ref}; '
                      f'fetch-depth={depth}; persist-credentials={credentials}'
                  )
              version = with_block.get('node-version')
              version_file = with_block.get('node-version-file')
              source = f'node={version}' if version is not None else f'file={version_file}'
              cache = with_block.get('cache', 'none')
              dependency = with_block.get('cache-dependency-path', 'package-lock default')
              return f'`{usage}`; {source}; cache={cache}; lockfile={dependency}'

          rows: list[dict[str, str]] = []
          checkout_count = 0
          setup_node_count = 0
          changed_files: list[str] = []

          for path in sorted(root.glob('*.yml')):
              if path == helper:
                  continue
              text = path.read_text(encoding='utf-8')
              if 'actions/checkout@' not in text and 'actions/setup-node@' not in text:
                  continue

              original = text
              text = text.replace('actions/checkout@v4', 'actions/checkout@v6')
              text = text.replace('actions/setup-node@v4', 'actions/setup-node@v6')
              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed_files.append(path.as_posix())

              payload = yaml.load(text, Loader=yaml.BaseLoader)
              triggers = as_list(payload.get('on'))
              top_permissions = compact_permissions(payload.get('permissions'))
              jobs = payload.get('jobs') or {}

              checkout: list[str] = []
              setup_node: list[str] = []
              job_permissions: list[str] = []
              runner_labels: list[str] = []
              for job_name, job in jobs.items():
                  if not isinstance(job, dict):
                      continue
                  runner = job.get('runs-on')
                  if runner is not None:
                      runner_labels.append(str(runner))
                  if 'permissions' in job:
                      job_permissions.append(
                          f'{job_name}={compact_permissions(job.get("permissions"))}'
                      )
                  for step in job.get('steps') or []:
                      if not isinstance(step, dict):
                          continue
                      usage = str(step.get('uses', ''))
                      if usage.startswith('actions/checkout@'):
                          checkout.append(action_summary(step, 'checkout'))
                      if usage.startswith('actions/setup-node@'):
                          setup_node.append(action_summary(step, 'setup-node'))

              checkout_count += len(checkout)
              setup_node_count += len(setup_node)

              trust_parts: list[str] = []
              if 'pull_request_target' in triggers:
                  trust_parts.append('elevated PR target')
              if 'workflow_run' in triggers:
                  trust_parts.append('post-workflow elevated context')
              if 'pull_request' in triggers:
                  trust_parts.append('untrusted PR code / declared token permissions')
              if 'push' in triggers:
                  trust_parts.append('trusted repository push')
              if 'workflow_dispatch' in triggers:
                  trust_parts.append('manual trusted dispatch')
              if not trust_parts:
                  trust_parts.append('other')

              permission_parts = [f'top={top_permissions}']
              permission_parts.extend(job_permissions)
              rows.append(
                  {
                      'workflow': path.name,
                      'triggers': ', '.join(f'`{item}`' for item in triggers),
                      'trust': '; '.join(trust_parts),
                      'permissions': '<br>'.join(permission_parts),
                      'checkout': '<br>'.join(checkout) if checkout else '—',
                      'setup_node': '<br>'.join(setup_node) if setup_node else '—',
                      'runners': ', '.join(sorted(set(runner_labels))),
                  }
              )

          if len(rows) != 26:
              raise SystemExit(f'Expected 26 workflow files, found {len(rows)}')
          if checkout_count != 35:
              raise SystemExit(f'Expected 35 checkout usages, found {checkout_count}')
          if setup_node_count != 15:
              raise SystemExit(f'Expected 15 setup-node usages, found {setup_node_count}')

          all_text = '\n'.join(
              path.read_text(encoding='utf-8')
              for path in sorted(root.glob('*.yml'))
              if path != helper
          )
          if 'actions/checkout@v4' in all_text or 'actions/setup-node@v4' in all_text:
              raise SystemExit('Legacy action major remains')
          if 'pull_request_target:' in all_text or 'workflow_run:' in all_text:
              raise SystemExit('Unexpected elevated trigger discovered')

          header = '''# GitHub Actions runtime inventory

Issue: #235  
Parent: #205  
Audited baseline: `ab3c95809dc349a6b45c079ad4614758173a1e0e`  
Target actions: `actions/checkout@v6`, `actions/setup-node@v6`

## Decision

- `actions/checkout@v6` is the current supported major and runs on the Node.js 24 action runtime.
- `actions/setup-node@v6` is the current supported major and runs on the Node.js 24 action runtime.
- All affected jobs use GitHub-hosted `ubuntu-latest` or `ubuntu-24.04`; no self-hosted runner is in scope.
- The repository contains no `pull_request_target` or `workflow_run` trigger in the affected workflow set.
- Existing workflow permissions, refs, fetch depth, credential persistence and Node/cache choices are preserved.
- `package.json` has no `packageManager` field, so setup-node automatic package-manager caching is not silently enabled where `cache` is omitted.

## Inventory summary

- workflow files with checkout/setup-node: **26**;
- checkout usages: **35**;
- setup-node usages: **15**;
- explicit full-history checkout: `rs485-evidence.yml` (`fetch-depth: 0`);
- explicit exact PR-head checkout: `offline-auth-acceptance.yml` and `offline-bundle.yml`;
- elevated publish permissions remain isolated to trusted `push` jobs in container/image publishing workflows;
- no permission broadening is part of this Work Package.

## Complete workflow inventory

| Workflow | Triggers | Trust context | Permissions | Runner | Checkout | Setup Node |
|---|---|---|---|---|---|---|
'''
          table_lines = []
          for row in rows:
              table_lines.append(
                  '| {workflow} | {triggers} | {trust} | {permissions} | {runners} | {checkout} | {setup_node} |'.format(**row)
              )

          footer = '''

## Compatibility and rollback

### Compatibility

- GitHub-hosted runners satisfy the Node.js 24 action-runtime requirement.
- Existing Node application versions remain unchanged: workflows continue to use `.nvmrc`, Node 22 or Node 24 exactly as before.
- Existing npm cache declarations remain unchanged. Workflows without `cache: npm` continue without an explicit setup-node cache.
- `checkout@v6` stores persisted credentials outside the repository working tree while preserving the existing default `persist-credentials: true` behavior.

### Rollback

A focused revert of the upgrade commit restores:

```text
actions/checkout@v6   -> actions/checkout@v4
actions/setup-node@v6 -> actions/setup-node@v4
```

No product source, package manifest, lockfile, secret, deployment or hardware change is required for rollback.

## Required verification

- repository-wide formatting, ESLint, strict TypeScript, full Vitest and production build;
- Security Browser Acceptance;
- Refrigeration Browser Acceptance;
- Disaster Recovery Browser;
- Offline Bundle;
- exact-head review-thread and submitted-review audit.
'''
          inventory_path.write_text(
              header + '\n'.join(table_lines) + footer,
              encoding='utf-8',
          )

          print(f'workflow_files={len(rows)}')
          print(f'checkout_usages={checkout_count}')
          print(f'setup_node_usages={setup_node_count}')
          print('changed_files:')
          for item in changed_files:
              print(item)
          PY

          rm .github/workflows/actions-runtime-upgrade-apply.yml

          git diff --check
          grep -R --line-number 'actions/checkout@v4\|actions/setup-node@v4' \
            .github/workflows && exit 1 || true
          test "$(grep -Roh 'actions/checkout@v6' .github/workflows | wc -l)" -eq 35
          test "$(grep -Roh 'actions/setup-node@v6' .github/workflows | wc -l)" -eq 15

      - name: Commit controlled branch changes
        shell: bash
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows docs/maintenance/github-actions-runtime-inventory.md
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'ci: upgrade checkout and setup-node runtimes'
          git push origin "HEAD:$BRANCH"
