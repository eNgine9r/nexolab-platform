name: Patch DR Application Hook

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/patch-dr-application-hook.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m7-disaster-recovery-gate
          fetch-depth: 0

      - name: Wire restored application verification
        run: |
          file=scripts/run-disaster-recovery-acceptance.sh
          test "$(grep -c "'degC', 'good', 'dr-acceptance'" "$file")" -eq 2
          sed -i "s/'degC', 'good', 'dr-acceptance'/'degC', 'valid', 'dr-acceptance'/g" "$file"

          test "$(grep -c 'source-mqtt restore-mqtt >"$EVIDENCE_DIR/services.log"' "$file")" -eq 1
          sed -i 's/source-mqtt restore-mqtt >"$EVIDENCE_DIR\/services.log"/source-mqtt restore-mqtt restore-telemetry-service >"$EVIDENCE_DIR\/services.log"/' "$file"

          test "$(grep -c '^MQTT_CLIENT_COUNT=' "$file")" -eq 1
          sed -i '/^MQTT_CLIENT_COUNT=/a\
          \
          bash "$ROOT_DIR/scripts/verify-restored-platform.sh" \\
            "$PROJECT_NAME" "$COMPOSE_FILE" "$EVIDENCE_DIR"' "$file"

          test "$(grep -c 'Disaster-recovery component acceptance passed' "$file")" -eq 1
          sed -i 's/Disaster-recovery component acceptance passed/Disaster-recovery platform acceptance passed/' "$file"

      - name: Validate scripts
        run: |
          bash -n scripts/run-disaster-recovery-acceptance.sh
          bash -n scripts/verify-restored-platform.sh
          grep -q 'verify-restored-platform.sh' scripts/run-disaster-recovery-acceptance.sh
          test "$(grep -c "'degC', 'valid', 'dr-acceptance'" scripts/run-disaster-recovery-acceptance.sh)" -eq 2

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/run-disaster-recovery-acceptance.sh
          git commit -m "feat: run application verification after fresh restore"
          git push origin HEAD:feat/m7-disaster-recovery-gate
