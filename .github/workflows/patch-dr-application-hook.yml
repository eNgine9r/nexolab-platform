name: Patch DR Application Hook

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/patch-dr-application-hook.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m7-disaster-recovery-gate
          fetch-depth: 0

      - name: Wire restored application verification
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/run-disaster-recovery-acceptance.sh")
          content = path.read_text(encoding="utf-8")
          replacements = [
              (
                  "'degC', 'good', 'dr-acceptance'",
                  "'degC', 'valid', 'dr-acceptance'",
                  2,
              ),
              (
                  'source-mqtt restore-mqtt >"$EVIDENCE_DIR/services.log" 2>&1 || true',
                  'source-mqtt restore-mqtt restore-telemetry-service >"$EVIDENCE_DIR/services.log" 2>&1 || true',
                  1,
              ),
              (
                  'echo "Disaster-recovery component acceptance passed."',
                  'echo "Disaster-recovery platform acceptance passed."',
                  1,
              ),
          ]
          for old, new, expected in replacements:
              count = content.count(old)
              if count != expected:
                  raise SystemExit(f"Expected {expected} occurrences of {old!r}, found {count}")
              content = content.replace(old, new)

          anchor = 'MQTT_CLIENT_COUNT="$(compose exec -T restore-mqtt /usr/local/bin/nexolab-dynsec-admin list-clients | sed \'/^[[:space:]]*$/d\' | wc -l | tr -d \' \')"\n'
          hook = (
              anchor
              + '\nbash "$ROOT_DIR/scripts/verify-restored-platform.sh" \\\n'
              + '  "$PROJECT_NAME" "$COMPOSE_FILE" "$EVIDENCE_DIR"\n'
          )
          count = content.count(anchor)
          if count != 1:
              raise SystemExit(f"Expected one application hook anchor, found {count}")
          content = content.replace(anchor, hook)
          path.write_text(content, encoding="utf-8")
          PY

      - name: Validate scripts
        run: |
          bash -n scripts/run-disaster-recovery-acceptance.sh
          bash -n scripts/verify-restored-platform.sh
          grep -q 'verify-restored-platform.sh' scripts/run-disaster-recovery-acceptance.sh
          test "$(grep -Fc "'degC', 'valid', 'dr-acceptance'" scripts/run-disaster-recovery-acceptance.sh)" -eq 2

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/run-disaster-recovery-acceptance.sh
          git commit -m "feat: run application verification after fresh restore"
          git push origin HEAD:feat/m7-disaster-recovery-gate
