name: Format dependency policy once

on:
  push:
    branches:
      - chore/328-dependency-update-policy
    paths:
      - .github/workflows/format-dependency-policy-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dependency policy branch
        uses: actions/checkout@v6
        with:
          ref: chore/328-dependency-update-policy
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          package-manager-cache: false
          node-version-file: .nvmrc

      - name: Install dependencies
        env:
          HUSKY: 0
        run: npm install --no-audit

      - name: Format policy and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          npx prettier --write docs/maintenance/dependency-update-policy.md
          rm .github/workflows/format-dependency-policy-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/maintenance/dependency-update-policy.md .github/workflows/format-dependency-policy-once.yml
          if git diff --cached --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git commit -m "style(deps): format dependency policy"
          git push origin HEAD:chore/328-dependency-update-policy
