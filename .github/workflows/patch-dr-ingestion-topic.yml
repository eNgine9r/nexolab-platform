name: Patch DR Ingestion Topic

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/patch-dr-ingestion-topic.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m7-disaster-recovery-gate
          fetch-depth: 0

      - name: Align restored ingestion topic with recovered ACL
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("infrastructure/compose/compose.disaster-recovery.yaml")
          content = path.read_text(encoding="utf-8")
          old = '      MQTT_NODE_REGISTRY_ENFORCED: "false"\n      MQTT_NODE_TOPIC_FILTER: nexolab/v1/+/+/telemetry'
          new = '      MQTT_NODE_REGISTRY_ENFORCED: "false"\n      MQTT_TOPIC: nexolab/v1/+/+/telemetry\n      MQTT_NODE_TOPIC_FILTER: nexolab/v1/+/+/telemetry'
          if content.count(old) != 1:
              raise SystemExit("Expected restored MQTT topic anchor exactly once")
          path.write_text(content.replace(old, new), encoding="utf-8")
          PY

      - name: Validate Compose
        run: |
          DR_POSTGRES_PASSWORD=validation \
          DR_MINIO_ROOT_USER=validation \
          DR_MINIO_ROOT_PASSWORD=validation \
          DR_MQTT_ADMIN_USERNAME=validation \
          DR_SECRETS_DIR=/tmp/nexolab-dr-secrets \
          DR_WORK_DIR=/tmp/nexolab-dr-work \
            docker compose \
              -f infrastructure/compose/compose.disaster-recovery.yaml \
              config --quiet

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add infrastructure/compose/compose.disaster-recovery.yaml
          git commit -m "fix: align restored ingestion topic with recovered ACL"
          git push origin HEAD:feat/m7-disaster-recovery-gate
