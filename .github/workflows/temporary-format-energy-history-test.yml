name: Temporary Format Energy History Test

on:
  push:
    branches:
      - feat/261-energy-monitoring-page
    paths:
      - .github/workflows/temporary-format-energy-history-test.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feat/261-energy-monitoring-page
          persist-credentials: true

      - name: Setup exact Node baseline
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install dependencies
        env:
          HUSKY: 0
        run: npm install --no-audit --no-fund

      - name: Format exact test
        run: |
          npx prettier --write src/features/energy/energy-history.test.ts
          npx prettier --check src/features/energy/energy-history.test.ts

      - name: Commit exact formatting
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --name-only)" = "src/features/energy/energy-history.test.ts"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/features/energy/energy-history.test.ts
          git commit -m 'style(energy): apply repository formatting [skip ci]'
          git push origin HEAD:feat/261-energy-monitoring-page
