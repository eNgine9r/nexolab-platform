name: Telegram Gateway

on:
  pull_request:
    branches: [main]
    paths:
      - "services/telegram-gateway/**"
      - "infrastructure/compose/compose.telegram.yaml"
      - "infrastructure/compose/telegram.env.example"
      - ".github/workflows/telegram-gateway.yml"
      - "scripts/classify-ci-impact.py"
      - "tests/test_ci_change_impact.py"
      - "tests/test_ci_risk_aware_verification.py"
  push:
    branches: [main]
    paths:
      - "services/telegram-gateway/**"
      - "infrastructure/compose/compose.telegram.yaml"
      - "infrastructure/compose/telegram.env.example"
      - ".github/workflows/telegram-gateway.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: telegram-gateway-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Gateway tests and offline runtime
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/telegram-gateway/requirements-dev.txt

      - name: Install gateway test dependencies
        run: python -m pip install -r services/telegram-gateway/requirements-dev.txt

      - name: Compile gateway
        run: python -m compileall -q services/telegram-gateway/app services/telegram-gateway/tests

      - name: Run focused gateway tests
        working-directory: services/telegram-gateway
        run: pytest -q -p no:cacheprovider
      - name: Build runtime image
        run: docker build -t nexolab-telegram-gateway:ci services/telegram-gateway

      - name: Prove disabled gateway works disconnected
        shell: bash
        run: |
          set -euo pipefail
          name="nexolab-telegram-gateway-ci-$GITHUB_RUN_ID"
          trap 'docker rm -f "$name" >/dev/null 2>&1 || true' EXIT
          docker run -d --name "$name" --network none nexolab-telegram-gateway:ci >/dev/null
          for _ in $(seq 1 30); do
            health="$(docker inspect -f '{{.State.Health.Status}}' "$name")"
            [[ "$health" == "healthy" ]] && exit 0
            [[ "$health" == "unhealthy" ]] && break
            sleep 1
          done
          docker logs "$name"
          exit 1

      - name: Validate optional Compose overlay
        shell: bash
        env:
          POSTGRES_PASSWORD: ci-only
          MINIO_ROOT_USER: ci-only
          MINIO_ROOT_PASSWORD: ci-only
        run: |
          set -euo pipefail
          docker compose \
            -f infrastructure/compose/compose.central.yaml \
            -f infrastructure/compose/compose.telegram.yaml \
            --profile telegram config --format json >/tmp/nexolab-telegram-compose.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          config = json.loads(Path('/tmp/nexolab-telegram-compose.json').read_text())
          service = config['services']['telegram-gateway']
          assert service.get('profiles') == ['telegram']
          assert not service.get('ports')
          assert service['environment']['TELEGRAM_ENABLED'] == 'false'
          secrets = [v for v in service.get('volumes', []) if v.get('target') == '/run/secrets/telegram']
          assert len(secrets) == 1 and secrets[0].get('read_only') is True
          PY
