name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Apply final alerts lifecycle locator fix
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Scope lifecycle status assertions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("e2e/alerts.production.e2e.ts")
          content = path.read_text()
          replacements = {
              'await expect(page.getByText("Підтверджена")).toBeVisible();':
                  'await expect(page.getByTestId("alert-detail").getByText("Підтверджена")).toBeVisible();',
              'await expect(page.getByText("Закрита")).toBeVisible();':
                  'await expect(page.getByTestId("alert-detail").getByText("Закрита")).toBeVisible();',
          }
          for old, new in replacements.items():
              if content.count(old) != 1:
                  raise SystemExit(f"expected one lifecycle status assertion: {old}")
              content = content.replace(old, new)
          path.write_text(content)
          PY

      - name: Commit verified locator fix
        if: github.event_name == 'pull_request'
        run: |
          git config user.name "nexolab-ci"
          git config user.email "nexolab-ci@users.noreply.github.com"
          git add --update
          git commit -m "test(alerts): scope lifecycle status assertions"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
