name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout Pull Request head branch
        if: github.event_name == 'pull_request'
        shell: bash
        run: git checkout -B "$GITHUB_HEAD_REF" "origin/$GITHUB_HEAD_REF"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        env:
          HUSKY: 0
        run: npm install --no-audit

      - name: Format changed files exactly once
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail

          base_sha="${{ github.event.pull_request.base.sha }}"
          head_sha="${{ github.event.pull_request.head.sha }}"

          mapfile -d '' format_files < <(
            git diff --name-only --diff-filter=ACMRT -z "$base_sha" "$head_sha" -- \
              '*.cjs' '*.css' '*.html' '*.js' '*.json' '*.jsx' '*.md' '*.mdx' \
              '*.mjs' '*.scss' '*.ts' '*.tsx' '*.yaml' '*.yml'
          )

          if (( ${#format_files[@]} == 0 )); then
            echo "No changed files require Prettier formatting."
            exit 0
          fi

          npm exec prettier -- --write "${format_files[@]}"

          if git diff --quiet -- "${format_files[@]}"; then
            echo "Changed files already match Prettier."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${format_files[@]}"
          git commit -m "style: format development standard files"
          git push origin "HEAD:$GITHUB_HEAD_REF"

      - name: Check formatting for changed files
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
            head_sha="HEAD"
          else
            base_sha="${{ github.event.before }}"
            head_sha="${{ github.sha }}"
          fi

          if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]]; then
            base_sha="$(git rev-parse "${head_sha}^")"
          fi

          mapfile -d '' format_files < <(
            git diff --name-only --diff-filter=ACMRT -z "$base_sha" "$head_sha" -- \
              '*.cjs' '*.css' '*.html' '*.js' '*.json' '*.jsx' '*.md' '*.mdx' \
              '*.mjs' '*.scss' '*.ts' '*.tsx' '*.yaml' '*.yml'
          )

          if (( ${#format_files[@]} == 0 )); then
            echo "No changed files require Prettier validation."
            exit 0
          fi

          npm exec prettier -- --check "${format_files[@]}"

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build
