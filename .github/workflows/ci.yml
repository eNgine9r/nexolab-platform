name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wp198-promql-fix-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fix-spool-promql:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'feat/198-durable-central-ingestion'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/198-durable-central-ingestion
          fetch-depth: 0

      - name: Correct PromQL and policy expectation
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          rules_path = Path(
              'infrastructure/observability/prometheus/rules/nexolab-ingestion-spool.yml'
          )
          rules = rules_path.read_text(encoding='utf-8')
          combined = '''\n      - record: nexolab:ingestion_spool_utilization_ratio\n        expr: max(nexolab:ingestion_spool_record_utilization_ratio, nexolab:ingestion_spool_byte_utilization_ratio)\n'''
          if combined not in rules:
              raise SystemExit('combined utilization rule anchor not found')
          rules = rules.replace(combined, '', 1)
          rules = rules.replace(
              'expr: nexolab:ingestion_spool_utilization_ratio > 0.70',
              'expr: nexolab:ingestion_spool_record_utilization_ratio > 0.70 or nexolab:ingestion_spool_byte_utilization_ratio > 0.70',
              1,
          )
          rules = rules.replace(
              'expr: nexolab:ingestion_spool_utilization_ratio > 0.90',
              'expr: nexolab:ingestion_spool_record_utilization_ratio > 0.90 or nexolab:ingestion_spool_byte_utilization_ratio > 0.90',
              1,
          )
          rules_path.write_text(rules, encoding='utf-8')

          test_path = Path('tests/test_observability_policy.py')
          tests = test_path.read_text(encoding='utf-8')
          expected = '''        "nexolab:ingestion_spool_byte_utilization_ratio",\n        "nexolab:ingestion_spool_utilization_ratio",\n'''
          replacement = '''        "nexolab:ingestion_spool_byte_utilization_ratio",\n'''
          if expected not in tests:
              raise SystemExit('recording rule expectation anchor not found')
          test_path.write_text(tests.replace(expected, replacement, 1), encoding='utf-8')
          PY

      - name: Format and restore CI
        env:
          HUSKY: 0
        run: |
          set -euo pipefail
          npm install --no-audit
          npm exec prettier -- --write \
            infrastructure/observability/prometheus/rules/nexolab-ingestion-spool.yml
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml

      - name: Commit valid spool PromQL
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/ci.yml \
            infrastructure/observability/prometheus/rules/nexolab-ingestion-spool.yml \
            tests/test_observability_policy.py
          git commit -m "fix(observability): use valid spool utilization PromQL"
          git push origin HEAD:feat/198-durable-central-ingestion
