name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate standalone Raspberry Pi runtime contracts
        shell: bash
        run: bash scripts/tests/standalone-offline-runtime-contract.sh

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          package-manager-cache: false
          node-version-file: .nvmrc

      - name: Verify exact Node baseline
        shell: bash
        run: |
          set -euo pipefail
          expected="v$(tr -d '[:space:]' < .nvmrc)"
          actual="$(node --version)"
          if [[ "$actual" != "$expected" ]]; then
            printf 'Expected Node %s from .nvmrc, got %s\n' "$expected" "$actual" >&2
            exit 1
          fi
          printf 'Verified Node baseline: %s\n' "$actual"
          printf 'npm version: %s\n' "$(npm --version)"

      - name: Install dependencies
        env:
          HUSKY: 0
        run: npm install --no-audit

      - name: Capture exact formatted acquisition spec
        run: npx prettier --write e2e/telemetry-acquisition-invariant.production.e2e.ts

      - name: Upload exact formatted acquisition spec
        uses: actions/upload-artifact@v7
        with:
          name: exact-prettier-output-${{ github.sha }}
          path: e2e/telemetry-acquisition-invariant.production.e2e.ts
          if-no-files-found: error
          retention-days: 1

      - name: Check repository formatting
        shell: bash
        run: |
          set -euo pipefail
          npm run format:check 2>&1 | tee prettier-diagnostics.txt

      - name: Upload formatting diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: prettier-diagnostics-${{ github.sha }}
          path: prettier-diagnostics.txt
          if-no-files-found: error
          retention-days: 3

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build
