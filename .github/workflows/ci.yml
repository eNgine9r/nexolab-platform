name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        env:
          HUSKY: 0
        run: npm install --no-audit

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        id: lint
        continue-on-error: true
        run: npm run lint > lint.log 2>&1

      - name: Upload lint diagnostics
        if: steps.lint.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: security-lint-diagnostics-${{ github.run_id }}
          path: lint.log
          retention-days: 1

      - name: Stop on lint failure
        if: steps.lint.outcome == 'failure'
        run: |
          cat lint.log
          exit 1

      - name: Typecheck
        if: steps.lint.outcome == 'success'
        run: npm run typecheck

      - name: Test
        if: steps.lint.outcome == 'success'
        run: npm test

      - name: Build
        if: steps.lint.outcome == 'success'
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build
