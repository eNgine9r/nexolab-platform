name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        env:
          HUSKY: 0
        run: npm install --no-audit

      - name: Check formatting for changed files
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
            head_sha="${{ github.event.pull_request.head.sha }}"
          else
            base_sha="${{ github.event.before }}"
            head_sha="${{ github.sha }}"
          fi

          if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]]; then
            base_sha="$(git rev-parse "${head_sha}^")"
          fi

          mapfile -d '' format_files < <(
            git diff --name-only --diff-filter=ACMRT -z "$base_sha" "$head_sha" -- \
              '*.cjs' '*.css' '*.html' '*.js' '*.json' '*.jsx' '*.md' '*.mdx' \
              '*.mjs' '*.scss' '*.ts' '*.tsx' '*.yaml' '*.yml'
          )

          if (( ${#format_files[@]} == 0 )); then
            echo "No changed files require Prettier validation." | tee prettier-diagnostics.txt
            exit 0
          fi

          printf 'Checking formatting for %s changed file(s).\n' "${#format_files[@]}" \
            | tee prettier-diagnostics.txt
          npm exec prettier -- --check "${format_files[@]}" \
            2>&1 | tee -a prettier-diagnostics.txt

      - name: Upload formatting diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: prettier-diagnostics-${{ github.sha }}
          path: prettier-diagnostics.txt
          if-no-files-found: error
          retention-days: 3

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build
