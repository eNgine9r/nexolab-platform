name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        env:
          HUSKY: 0
        run: npm install --no-audit

      - name: Apply exact changed-file formatting and restore CI
        shell: bash
        run: |
          set -euo pipefail

          base_sha="${{ github.event.pull_request.base.sha }}"
          head_sha="$(git rev-parse HEAD)"

          mapfile -d '' format_files < <(
            git diff --name-only --diff-filter=ACMRT -z "$base_sha" "$head_sha" -- \
              '*.cjs' '*.css' '*.html' '*.js' '*.json' '*.jsx' '*.md' '*.mdx' \
              '*.mjs' '*.scss' '*.ts' '*.tsx' '*.yaml' '*.yml'
          )

          npm exec prettier -- --write "${format_files[@]}"
          git checkout "$base_sha" -- .github/workflows/ci.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${format_files[@]}" .github/workflows/ci.yml

          if git diff --cached --quiet; then
            echo "No formatter commit required."
            exit 0
          fi

          git commit -m "style: apply changed-file formatting for #183"
          git push origin "HEAD:${{ github.head_ref }}"
