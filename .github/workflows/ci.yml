name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wp198-observability-fix-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  finalize-spool-observability-policy:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'feat/198-durable-central-ingestion'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/198-durable-central-ingestion
          fetch-depth: 0

      - name: Update inhibition acceptance
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/test_observability_policy.py')
          text = path.read_text(encoding='utf-8')
          anchor = '''        ("NexolabIngestionQueuePressureCritical", "NexolabIngestionQueuePressureWarning"),\n        ("NexolabIngestionLagCritical", "NexolabIngestionLagWarning"),'''
          replacement = '''        ("NexolabIngestionQueuePressureCritical", "NexolabIngestionQueuePressureWarning"),\n        (\n            "NexolabIngestionSpoolUtilizationCritical",\n            "NexolabIngestionSpoolUtilizationWarning",\n        ),\n        ("NexolabIngestionLagCritical", "NexolabIngestionLagWarning"),'''
          if anchor not in text:
              raise SystemExit('inhibition allow-list anchor not found')
          path.write_text(text.replace(anchor, replacement, 1), encoding='utf-8')
          PY

      - name: Apply repository formatting
        env:
          HUSKY: 0
        run: |
          set -euo pipefail
          npm install --no-audit
          npm exec prettier -- --write \
            .project/BLOCKERS.md \
            infrastructure/observability/alertmanager/alertmanager.yml \
            infrastructure/observability/prometheus/rules/nexolab-ingestion-spool.yml
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml

      - name: Commit corrected policy
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/ci.yml \
            .project/BLOCKERS.md \
            infrastructure/observability/alertmanager/alertmanager.yml \
            infrastructure/observability/prometheus/rules/nexolab-ingestion-spool.yml \
            tests/test_observability_policy.py
          git commit -m "test(observability): accept spool alert inhibition"
          git push origin HEAD:feat/198-durable-central-ingestion
