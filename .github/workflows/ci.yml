name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        env:
          HUSKY: 0
        run: npm install --no-audit

      - name: Capture formatted files
        run: |
          npm run format
          git diff --name-only --diff-filter=ACMRT > /tmp/prettier-files.txt
          if [[ -s /tmp/prettier-files.txt ]]; then
            tar -czf /tmp/prettier-files.tar.gz -T /tmp/prettier-files.txt
          else
            tar -czf /tmp/prettier-files.tar.gz --files-from /dev/null
          fi

      - name: Upload formatter diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: prettier-formatted-files
          path: /tmp/prettier-files.tar.gz
          if-no-files-found: error
          retention-days: 3

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build
