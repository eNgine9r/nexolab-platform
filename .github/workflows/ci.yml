name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate standalone Raspberry Pi runtime contracts
        shell: bash
        run: bash scripts/tests/standalone-offline-runtime-contract.sh

      - name: Validate ADR registry
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate-adr-registry.py
          python3 -m unittest discover \
            -s tests \
            -p 'test_adr_registry.py' \
            -v

      - name: Validate dependency update policy
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate-dependency-policy.py
          python3 -m unittest discover \
            -s tests \
            -p 'test_dependency_policy.py' \
            -v

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          package-manager-cache: false
          node-version-file: .nvmrc

      - name: Verify exact Node baseline
        shell: bash
        run: |
          set -euo pipefail
          expected="v$(tr -d '[:space:]' < .nvmrc)"
          actual="$(node --version)"
          if [[ "$actual" != "$expected" ]]; then
            printf 'Expected Node %s from .nvmrc, got %s\n' "$expected" "$actual" >&2
            exit 1
          fi
          printf 'Verified Node baseline: %s\n' "$actual"
          printf 'npm version: %s\n' "$(npm --version)"

      - name: Install dependencies
        env:
          HUSKY: 0
        run: npm install --no-audit

      - name: Check repository formatting
        shell: bash
        run: |
          set -euo pipefail
          npm run format:check 2>&1 | tee prettier-diagnostics.txt

      - name: Upload formatting diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: prettier-diagnostics-${{ github.sha }}
          path: prettier-diagnostics.txt
          if-no-files-found: error
          retention-days: 3

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build

  recovery_frontend_artifact:
    name: Raspberry Pi live frontend recovery artifact
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'fix/626-atomic-pi-deploy' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout exact PR head with base history
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          package-manager-cache: false
          node-version-file: .nvmrc

      - name: Prove frontend product source matches PR base
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet "${{ github.event.pull_request.base.sha }}" -- \
            package.json package-lock.json next.config.ts src

      - name: Record recovery artifact provenance
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee frontend-source-sha.txt
          sha256sum package.json package-lock.json | tee frontend-package-sha256.txt
          cat > frontend-runtime-contract.txt <<'EOF'
          runtime_mode=live
          api_base_url=http://172.18.48.34:8082
          websocket_url=ws://172.18.48.34:8082/api/v1/telemetry/live
          auth_provider=local
          organization_id=00000000-0000-0000-0000-000000000001
          EOF

      - name: Install dependencies
        env:
          HUSKY: "0"
        run: npm ci --no-audit --no-fund

      - name: Build LOCAL_LAN live frontend
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_NEXOLAB_DATA_MODE: live
          NEXT_PUBLIC_NEXOLAB_API_BASE_URL: http://172.18.48.34:8082
          NEXT_PUBLIC_NEXOLAB_WEBSOCKET_URL: ws://172.18.48.34:8082/api/v1/telemetry/live
          NEXT_PUBLIC_NEXOLAB_AUTH_PROVIDER: local
          NEXT_PUBLIC_NEXOLAB_ORGANIZATION_ID: 00000000-0000-0000-0000-000000000001
        run: npm run build

      - name: Verify recovery artifact contract
        shell: bash
        run: |
          set -euo pipefail
          source scripts/lib/raspberry-pi-frontend-release.sh
          nexolab_frontend_verify_public_contract \
            . live \
            http://172.18.48.34:8082 \
            ws://172.18.48.34:8082/api/v1/telemetry/live \
            local \
            00000000-0000-0000-0000-000000000001 \
            frontend-public-contract.txt
          ! grep -Fq 'Demo mode' .next/server/app/index.html
          ! grep -Fq 'demo preview' .next/server/app/index.html
          ! grep -Fq 'Node registry доступний лише в live mode' .next/server/app/nodes.html
          ! grep -Fq 'Енергомоніторинг доступний лише в live mode' .next/server/app/energy.html

      - name: Reject native binaries in portable recovery .next artifact
        shell: bash
        run: |
          set -euo pipefail
          if find .next -type f -print0 | xargs -0 file | grep -Eq 'ELF|Mach-O|PE32'; then
            echo 'Native binary found in .next; recovery artifact is not architecture-portable.' >&2
            exit 1
          fi

      - name: Generate recovery artifact integrity manifest
        shell: bash
        run: |
          set -euo pipefail
          {
            find .next -type f -print0 | sort -z | xargs -0 sha256sum
            sha256sum \
              package.json \
              package-lock.json \
              frontend-source-sha.txt \
              frontend-package-sha256.txt \
              frontend-runtime-contract.txt
          } > frontend-artifact-sha256.txt

      - name: Upload Raspberry Pi recovery frontend artifact
        uses: actions/upload-artifact@v7
        with:
          name: nexolab-frontend-recovery-${{ github.event.pull_request.head.sha }}
          path: |
            .next
            package.json
            package-lock.json
            frontend-source-sha.txt
            frontend-package-sha256.txt
            frontend-runtime-contract.txt
            frontend-public-contract.txt
            frontend-artifact-sha256.txt
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
