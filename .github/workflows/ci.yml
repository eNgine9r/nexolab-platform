name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        env:
          HUSKY: 0
        run: npm install --no-audit

      - name: Apply verified alerts fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path_name: str, old: str, new: str) -> None:
              path = Path(path_name)
              content = path.read_text()
              if content.count(old) != 1:
                  raise SystemExit(f"expected exactly one literal match in {path_name}: {old!r}")
              path.write_text(content.replace(old, new))

          def regex_once(path_name: str, pattern: str, replacement: str) -> None:
              path = Path(path_name)
              content = path.read_text()
              updated, count = re.subn(pattern, replacement, content, count=1, flags=re.MULTILINE | re.DOTALL)
              if count != 1:
                  raise SystemExit(f"expected exactly one regex match in {path_name}: {pattern!r}")
              path.write_text(updated)

          runner = "scripts/run-alerts-browser-acceptance.sh"
          regex_once(
              runner,
              r'^MANAGER_ROLE_ID=.*\nVIEWER_ROLE_ID=.*\n',
              "",
          )
          regex_once(
              runner,
              r'^INSERT INTO security_organizations .*?^ON CONFLICT \(membership_id, role_id\) DO NOTHING;',
              """INSERT INTO security_organizations (id, slug, name, is_active)
          VALUES
            ('$ORGANIZATION_A', 'alerts-org-a', 'Alerts Acceptance Organization A', true),
            ('$ORGANIZATION_B', 'alerts-org-b', 'Alerts Acceptance Organization B', true)
          ON CONFLICT (id) DO UPDATE SET name = EXCLUDED.name, is_active = true;

          INSERT INTO security_identities (id, provider, subject, email, display_name, is_active)
          VALUES
            ('$MANAGER_A_ID', '$JWT_PROVIDER', '$MANAGER_A_SUBJECT', 'manager-a-alerts@nexolab.local', 'Manager A Alerts', true),
            ('$MANAGER_B_ID', '$JWT_PROVIDER', '$MANAGER_B_SUBJECT', 'manager-b-alerts@nexolab.local', 'Manager B Alerts', true),
            ('$VIEWER_A_ID', '$JWT_PROVIDER', '$VIEWER_A_SUBJECT', 'viewer-a-alerts@nexolab.local', 'Viewer A Alerts', true)
          ON CONFLICT (provider, subject) DO UPDATE
          SET email = EXCLUDED.email, display_name = EXCLUDED.display_name, is_active = true;

          INSERT INTO security_organization_memberships (id, organization_id, identity_id, is_active)
          VALUES
            ('$MANAGER_A_MEMBERSHIP', '$ORGANIZATION_A', '$MANAGER_A_ID', true),
            ('$MANAGER_B_MEMBERSHIP', '$ORGANIZATION_B', '$MANAGER_B_ID', true),
            ('$VIEWER_A_MEMBERSHIP', '$ORGANIZATION_A', '$VIEWER_A_ID', true)
          ON CONFLICT (organization_id, identity_id) DO UPDATE SET is_active = true;

          INSERT INTO security_membership_roles (membership_id, role, assigned_by)
          VALUES
            ('$MANAGER_A_MEMBERSHIP', 'laboratory_manager', 'alerts-acceptance-seed'),
            ('$MANAGER_B_MEMBERSHIP', 'laboratory_manager', 'alerts-acceptance-seed'),
            ('$VIEWER_A_MEMBERSHIP', 'viewer', 'alerts-acceptance-seed')
          ON CONFLICT (membership_id, role) DO NOTHING;""",
          )

          workspace = "src/components/alerts/alerts-workspace.tsx"
          replace_once(
              workspace,
              "    void load(controller.signal);",
              "    const initial = window.setTimeout(() => void load(controller.signal), 0);",
          )
          replace_once(
              workspace,
              "      controller.abort();\n      window.clearInterval(refresh);",
              "      controller.abort();\n      window.clearTimeout(initial);\n      window.clearInterval(refresh);",
          )
          regex_once(
              workspace,
              r'^  useEffect\(\(\) => \{\n    if \(!selectedId\) \{.*?^  \}, \[selectedId, selected\?\.lock_version\]\);',
              """  useEffect(() => {
            if (!selectedId) return;
            const controller = new AbortController();
            const initial = window.setTimeout(() => {
              setDetailLoading(true);
              void createAlertApiClient()
                .listTransitions(selectedId, controller.signal)
                .then((page) => {
                  if (!controller.signal.aborted) setTransitions(page.items);
                })
                .catch((nextError) => {
                  if (!controller.signal.aborted) {
                    setActionError(
                      nextError instanceof Error ? nextError : new Error("Не вдалося завантажити історію тривоги."),
                    );
                  }
                })
                .finally(() => {
                  if (!controller.signal.aborted) setDetailLoading(false);
                });
            }, 0);
            return () => {
              controller.abort();
              window.clearTimeout(initial);
            };
          }, [selectedId, selected?.lock_version]);""",
          )

          panel = "src/components/dashboard/alarms-panel.tsx"
          replace_once(panel, '  samples: _samples = [],\n', "")
          replace_once(
              panel,
              "    void loadAlerts(controller.signal);",
              "    const initial = window.setTimeout(() => void loadAlerts(controller.signal), 0);",
          )
          replace_once(
              panel,
              "      controller.abort();\n      window.clearInterval(refresh);",
              "      controller.abort();\n      window.clearTimeout(initial);\n      window.clearInterval(refresh);",
          )
          PY

      - name: Apply formatter
        run: npm run format

      - name: Commit verified fixes
        if: github.event_name == 'pull_request'
        run: |
          git config user.name "nexolab-ci"
          git config user.email "nexolab-ci@users.noreply.github.com"
          git add --update
          git commit -m "fix(alerts): align security seed and React effects"
          git push origin "HEAD:${GITHUB_HEAD_REF}"

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck
