name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wp198-prettier-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  format-wp198-docs:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'feat/198-durable-central-ingestion'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/198-durable-central-ingestion
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        env:
          HUSKY: 0
        run: npm install --no-audit

      - name: Apply repository Prettier and restore CI
        run: |
          set -euo pipefail
          npm exec prettier -- --write \
            .project/BLOCKERS.md \
            docs/architecture.md \
            docs/operations/telemetry-backend-runbook.md
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml

      - name: Commit canonical formatting
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/ci.yml \
            .project/BLOCKERS.md \
            docs/architecture.md \
            docs/operations/telemetry-backend-runbook.md
          if git diff --cached --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git commit -m "style: format durable ingestion documentation"
          git push origin HEAD:feat/198-durable-central-ingestion
