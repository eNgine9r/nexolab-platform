name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-session-scope-fix:
    name: Apply session scope fix
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.ref == 'feat/organization-scoped-test-sessions' &&
      !contains(github.event.pull_request.title, '[scope-fix-applied]')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: feat/organization-scoped-test-sessions
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Apply regression fixes
        run: python .github/scripts/fix-session-scope-regressions.py

      - name: Remove temporary automation and restore CI
        run: |
          rm .github/scripts/fix-session-scope-regressions.py
          rm .github/workflows/fix-session-scope-regressions.yml
          git checkout origin/main -- .github/workflows/ci.yml

      - name: Install backend dependencies
        working-directory: services/telemetry-service
        run: python -m pip install -r requirements-dev.txt

      - name: Run focused regressions
        working-directory: services/telemetry-service
        run: |
          python -m compileall -q app tests
          python -m pytest -q \
            tests/test_session_organization_scope.py \
            tests/test_session_api_organization_scope.py

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: scope session create idempotency"
          git push origin HEAD:feat/organization-scoped-test-sessions

  quality:
    name: Quality and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        env:
          HUSKY: 0
        run: npm install --no-audit

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build
