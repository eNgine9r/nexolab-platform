name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fix-test-sessions-evidence:
    name: Fix test sessions evidence query
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.ref == 'feat/organization-scoped-test-sessions'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: feat/organization-scoped-test-sessions
          fetch-depth: 0

      - name: Correct telemetry context evidence column
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/run-test-sessions-browser-acceptance.sh')
          text = path.read_text()
          old = 'SELECT event_id, session_id, stage_id, binding_id, captured_at\nFROM telemetry_session_contexts'
          new = 'SELECT telemetry_event_id, session_id, stage_id, binding_id, captured_at\nFROM telemetry_session_contexts'
          if old not in text:
              raise SystemExit('telemetry evidence query anchor not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Restore standard CI
        run: git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml

      - name: Commit evidence fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci.yml scripts/run-test-sessions-browser-acceptance.sh
          git diff --cached --check
          git commit -m "fix: correct test sessions evidence query"
          git push origin HEAD:feat/organization-scoped-test-sessions

  quality:
    name: Quality and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        env:
          HUSKY: 0
        run: npm install --no-audit

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build
