name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Capture marker diagnostics
        run: |
          python3 - <<'PY' > /tmp/alerts-patch-markers.txt
          from pathlib import Path

          runner = Path("scripts/run-alerts-browser-acceptance.sh").read_text()
          print("runner_start", runner.find("INSERT INTO security_organizations"))
          print("runner_end_role_id", runner.find("ON CONFLICT (membership_id, role_id) DO NOTHING;"))
          print("runner_end_role", runner.find("ON CONFLICT (membership_id, role) DO NOTHING;"))
          print("manager_role_constant", runner.find("MANAGER_ROLE_ID="))

          workspace = Path("src/components/alerts/alerts-workspace.tsx").read_text()
          print("workspace_load", workspace.find("    void load(controller.signal);"))
          print("workspace_cleanup", workspace.find("      controller.abort();\n      window.clearInterval(refresh);"))
          print("detail_start_block", workspace.find("  useEffect(() => {\n    if (!selectedId) {"))
          print("detail_start_single", workspace.find("  useEffect(() => {\n    if (!selectedId) return;"))
          print("detail_end", workspace.find("  }, [selectedId, selected?.lock_version]);"))

          panel = Path("src/components/dashboard/alarms-panel.tsx").read_text()
          print("panel_samples", panel.find("  samples: _samples = [],"))
          print("panel_load", panel.find("    void loadAlerts(controller.signal);"))
          print("panel_cleanup", panel.find("      controller.abort();\n      window.clearInterval(refresh);"))
          PY

      - name: Upload marker diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: alerts-patch-markers
          path: /tmp/alerts-patch-markers.txt
          if-no-files-found: error
          retention-days: 3
