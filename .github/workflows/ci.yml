name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Apply alerts acceptance type contract fix
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Add rule identifier to acceptance response type
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("e2e/alerts.production.e2e.ts")
          content = path.read_text()
          old = "interface AlertResponse {\n  id: string;\n  organization_id: string;\n"
          new = "interface AlertResponse {\n  id: string;\n  organization_id: string;\n  rule_id: string;\n"
          if content.count(old) != 1:
              raise SystemExit("expected one AlertResponse interface marker")
          path.write_text(content.replace(old, new))
          PY

      - name: Commit verified type fix
        if: github.event_name == 'pull_request'
        run: |
          git config user.name "nexolab-ci"
          git config user.email "nexolab-ci@users.noreply.github.com"
          git add --update
          git commit -m "test(alerts): type organization-scoped rule ids"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
