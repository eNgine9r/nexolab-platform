name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  finalize-test-sessions-acceptance:
    name: Finalize test sessions acceptance
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.ref == 'feat/organization-scoped-test-sessions'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: feat/organization-scoped-test-sessions
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Apply audit-role fix
        run: python3 .github/scripts/fix-session-acceptance-audit-role.py

      - name: Install dependencies
        env:
          HUSKY: 0
        run: npm install --no-audit

      - name: Format acceptance TypeScript
        run: npx prettier --write e2e/test-sessions.production.e2e.ts

      - name: Restore standard CI and remove temporary automation
        run: |
          rm .github/scripts/fix-session-acceptance-audit-role.py
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          git checkout -- package-lock.json 2>/dev/null || rm -f package-lock.json

      - name: Commit finalized acceptance
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/ci.yml \
            .github/scripts/fix-session-acceptance-audit-role.py \
            e2e/test-sessions.production.e2e.ts \
            scripts/run-test-sessions-browser-acceptance.sh
          git diff --cached --check
          git commit -m "fix: finalize test sessions acceptance"
          git push origin HEAD:feat/organization-scoped-test-sessions

  quality:
    name: Quality and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        env:
          HUSKY: 0
        run: npm install --no-audit

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build
