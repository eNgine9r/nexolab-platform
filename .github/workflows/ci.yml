name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cleanup-session-scope-delivery:
    name: Cleanup session scope delivery
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.ref == 'feat/organization-scoped-test-sessions'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: feat/organization-scoped-test-sessions
          fetch-depth: 0

      - name: Remove generated files and restore standard CI
        run: |
          find services/telemetry-service -type f -name '*.pyc' -delete
          find services/telemetry-service -type d -name '__pycache__' -empty -delete
          rm -f .github/scripts/fix-session-scope-regressions.py
          rm -f .github/workflows/fix-session-scope-regressions.yml
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml

      - name: Commit clean tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git diff --cached --check
          git commit -m "chore: remove generated session scope artifacts"
          git push origin HEAD:feat/organization-scoped-test-sessions

  quality:
    name: Quality and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        env:
          HUSKY: 0
        run: npm install --no-audit

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build
