name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/auth-rbac-audit

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        env:
          HUSKY: 0
        run: npm install --no-audit

      - name: Format branch
        id: format
        continue-on-error: true
        run: npm run format > formatter.log 2>&1

      - name: Upload formatter diagnostics
        if: steps.format.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: auth-formatter-diagnostics-${{ github.run_id }}
          path: formatter.log
          retention-days: 1

      - name: Stop on formatter failure
        if: steps.format.outcome == 'failure'
        run: |
          tail -n 60 formatter.log
          exit 1

      - name: Commit formatting
        if: steps.format.outcome == 'success'
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add --all
            git commit -m "chore: format auth branch"
            git push origin HEAD:feat/auth-rbac-audit
          fi

      - name: Lint
        if: steps.format.outcome == 'success'
        run: npm run lint

      - name: Typecheck
        if: steps.format.outcome == 'success'
        run: npm run typecheck

      - name: Test
        if: steps.format.outcome == 'success'
        run: npm test

      - name: Build
        if: steps.format.outcome == 'success'
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build
