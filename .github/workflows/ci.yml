name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        env:
          HUSKY: 0
        run: npm install --no-audit

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Capture typecheck diagnostics
        run: npm run typecheck > /tmp/alerts-typecheck.log 2>&1 || true

      - name: Upload typecheck diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: alerts-typecheck-diagnostics
          path: /tmp/alerts-typecheck.log
          if-no-files-found: error
          retention-days: 3

      - name: Display typecheck diagnostics
        run: cat /tmp/alerts-typecheck.log
