name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate standalone Raspberry Pi runtime contracts
        shell: bash
        run: bash scripts/tests/standalone-offline-runtime-contract.sh

      - name: Validate ADR registry
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate-adr-registry.py
          python3 -m unittest discover \
            -s tests \
            -p 'test_adr_registry.py' \
            -v

      - name: Validate dependency update policy
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate-dependency-policy.py
          python3 -m unittest discover \
            -s tests \
            -p 'test_dependency_policy.py' \
            -v

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          package-manager-cache: false
          node-version-file: .nvmrc

      - name: Verify exact Node baseline
        shell: bash
        run: |
          set -euo pipefail
          expected="v$(tr -d '[:space:]' < .nvmrc)"
          actual="$(node --version)"
          if [[ "$actual" != "$expected" ]]; then
            printf 'Expected Node %s from .nvmrc, got %s\n' "$expected" "$actual" >&2
            exit 1
          fi
          printf 'Verified Node baseline: %s\n' "$actual"
          printf 'npm version: %s\n' "$(npm --version)"

      - name: Install dependencies
        env:
          HUSKY: 0
        run: npm install --no-audit

      - name: Print exact VersionScreen Prettier diff
        shell: bash
        run: |
          set -euo pipefail
          npx prettier --write src/components/settings/version-screen.tsx
          git diff -- src/components/settings/version-screen.tsx
          exit 1

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build
