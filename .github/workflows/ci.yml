name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: Change impact
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      classes: ${{ steps.impact.outputs.classes }}
      state_only: ${{ steps.impact.outputs.state_only }}
      docs_only: ${{ steps.impact.outputs.docs_only }}
      needs_full_quality: ${{ steps.impact.outputs.needs_full_quality }}
      fail_closed: ${{ steps.impact.outputs.fail_closed }}
      required_external_workflows: ${{ steps.impact.outputs.required_external_workflows }}

    steps:
      - name: Checkout with history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve changed files
        id: changed
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
            head="$PR_HEAD_SHA"
          elif [[ "$EVENT_NAME" == "push" && -n "$PUSH_BEFORE_SHA" && ! "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
            base="$PUSH_BEFORE_SHA"
            head="$CURRENT_SHA"
          else
            # Manual/ambiguous execution is intentionally broad. Treating the CI
            # workflow itself as changed makes classification fail-safe.
            printf '%s\n' '.github/workflows/ci.yml' > changed-files.txt
            printf 'base=%s\nhead=%s\n' "" "$CURRENT_SHA" >> "$GITHUB_OUTPUT"
            cat changed-files.txt
            exit 0
          fi

          git diff --name-only "$base" "$head" -- > changed-files.txt
          printf 'base=%s\nhead=%s\n' "$base" "$head" >> "$GITHUB_OUTPUT"
          printf '%s\n' 'Changed files:'
          cat changed-files.txt

      - name: Classify change impact
        id: impact
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/classify-ci-impact.py \
            --files-file changed-files.txt \
            --github-output "$GITHUB_OUTPUT"

  state_integrity:
    name: State integrity
    needs: classify
    if: ${{ needs.classify.outputs.state_only == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout with history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate canonical project state
        shell: bash
        run: python3 scripts/validate-project-state.py

      - name: Validate exact state-only diff
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
            head="$PR_HEAD_SHA"
          elif [[ "$EVENT_NAME" == "push" && -n "$PUSH_BEFORE_SHA" && ! "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
            base="$PUSH_BEFORE_SHA"
            head="$CURRENT_SHA"
          else
            printf '%s\n' 'State-only lane is not valid for an ambiguous/manual change set.' >&2
            exit 1
          fi

          git diff --check "$base" "$head"
          git diff --name-only "$base" "$head" -- > changed-files.txt
          python3 scripts/classify-ci-impact.py --files-file changed-files.txt > impact.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path('impact.json').read_text(encoding='utf-8'))
          if result.get('classes') != ['state_only'] or result.get('needs_full_quality'):
              raise SystemExit(f"Expected exact state_only classification, got {result}")
          print('Exact state-only diff verified without Node dependency installation.')
          PY

  quality:
    name: Quality and build
    needs: classify
    if: ${{ needs.classify.outputs.needs_full_quality == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate CI change-impact policy
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover \
            -s tests \
            -p 'test_ci_*.py' \
            -v
          python3 scripts/validate-project-state.py

      - name: Validate recovery runtime tooling
        if: ${{ contains(fromJSON(needs.classify.outputs.classes), 'deployment_runtime') }}
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
            head="$PR_HEAD_SHA"
          elif [[ "$EVENT_NAME" == "push" && -n "$PUSH_BEFORE_SHA" && ! "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
            base="$PUSH_BEFORE_SHA"
            head="$CURRENT_SHA"
          else
            base=""
            head=""
          fi

          if [[ -n "$base" && -n "$head" ]] && \
             git diff --name-only "$base" "$head" -- | grep -Eq '^scripts/.*recovery.*'; then
            mapfile -t recovery_tests < <(find scripts/tests -maxdepth 1 -type f -name 'test_*recovery*.py' -print | sort)
            if (( ${#recovery_tests[@]} == 0 )); then
              printf '%s\n' 'Recovery tooling changed but no recovery regression test module exists.' >&2
              exit 1
            fi
            python3 -m unittest discover \
              -s scripts/tests \
              -p 'test_*recovery*.py' \
              -v
          fi

      - name: Validate standalone Raspberry Pi runtime contracts
        shell: bash
        run: bash scripts/tests/standalone-offline-runtime-contract.sh

      - name: Validate ADR registry
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate-adr-registry.py
          python3 -m unittest discover \
            -s tests \
            -p 'test_adr_registry.py' \
            -v

      - name: Validate dependency update policy
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate-dependency-policy.py
          python3 -m unittest discover \
            -s tests \
            -p 'test_dependency_policy.py' \
            -v

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          cache: npm
          cache-dependency-path: package-lock.json
          node-version-file: .nvmrc

      - name: Verify exact Node baseline
        shell: bash
        run: |
          set -euo pipefail
          expected="v$(tr -d '[:space:]' < .nvmrc)"
          actual="$(node --version)"
          if [[ "$actual" != "$expected" ]]; then
            printf 'Expected Node %s from .nvmrc, got %s\n' "$expected" "$actual" >&2
            exit 1
          fi
          printf 'Verified Node baseline: %s\n' "$actual"
          printf 'npm version: %s\n' "$(npm --version)"

      - name: Install dependencies deterministically
        env:
          HUSKY: 0
        run: npm ci --no-audit --fund=false

      - name: Check repository formatting
        shell: bash
        run: |
          set -euo pipefail
          npm run format:check 2>&1 | tee prettier-diagnostics.txt

      - name: Upload formatting diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: prettier-diagnostics-${{ github.sha }}
          path: prettier-diagnostics.txt
          if-no-files-found: error
          retention-days: 3

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build

  merge_gate:
    name: NEXOLAB Merge Gate
    if: ${{ always() }}
    needs: [classify, state_integrity, quality]
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Enforce required Core verification lane
        shell: bash
        env:
          IMPACT_CLASSES: ${{ needs.classify.outputs.classes }}
          STATE_ONLY: ${{ needs.classify.outputs.state_only }}
          NEEDS_FULL_QUALITY: ${{ needs.classify.outputs.needs_full_quality }}
          FAIL_CLOSED: ${{ needs.classify.outputs.fail_closed }}
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          STATE_RESULT: ${{ needs.state_integrity.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os

          classes = os.environ.get('IMPACT_CLASSES', '')
          state_only = os.environ.get('STATE_ONLY') == 'true'
          needs_full = os.environ.get('NEEDS_FULL_QUALITY') == 'true'
          fail_closed = os.environ.get('FAIL_CLOSED') == 'true'
          classify_result = os.environ.get('CLASSIFY_RESULT', '')
          state_result = os.environ.get('STATE_RESULT', '')
          quality_result = os.environ.get('QUALITY_RESULT', '')

          print(f'Impact classes: {classes}')
          print(f'Classifier: {classify_result}; state: {state_result}; quality: {quality_result}')
          print(f'Fail-closed classification: {fail_closed}')

          if classify_result != 'success':
              raise SystemExit('Change-impact classification did not succeed.')

          if state_only:
              if needs_full:
                  raise SystemExit('Invalid policy: state_only cannot also require full quality.')
              if state_result != 'success':
                  raise SystemExit('State-only change did not pass State integrity.')
              if quality_result not in {'skipped', ''}:
                  raise SystemExit(f'Unexpected full quality result for state-only change: {quality_result}')
              print('Core gate PASS: exact state-only fast lane is GREEN.')
          else:
              if not needs_full:
                  raise SystemExit('Non-state change attempted to bypass full quality verification.')
              if quality_result != 'success':
                  raise SystemExit('Required Quality and build lane is not GREEN.')
              print('Core gate PASS: required full quality lane is GREEN.')
          PY

      - name: Checkout exact PR head for merge-gate scripts
        if: ${{ github.event_name == 'pull_request' && needs.classify.outputs.state_only != 'true' }}
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Aggregate all external exact-head PR workflows
        if: ${{ github.event_name == 'pull_request' && needs.classify.outputs.state_only != 'true' }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REQUIRED_EXTERNAL_WORKFLOWS: ${{ needs.classify.outputs.required_external_workflows }}
        run: |
          set -euo pipefail
          python3 scripts/verify-pr-workflow-matrix.py \
            --head-sha "$PR_HEAD_SHA" \
            --required-workflows-json "$REQUIRED_EXTERNAL_WORKFLOWS" \
            --timeout-seconds 1800 \
            --poll-seconds 10 \
            --stable-rounds 2

      - name: Record merge-gate success
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' 'NEXOLAB Merge Gate PASS for the exact required verification surface.'

  recovery_frontend_artifact:
    name: Raspberry Pi live frontend recovery artifact
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'fix/626-atomic-pi-deploy' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout exact PR head with base history
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove frontend product source matches PR base
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet "${{ github.event.pull_request.base.sha }}" -- \
            package.json package-lock.json next.config.ts src

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build self-contained ARM64 frontend runtime artifact
        shell: bash
        run: |
          set -euo pipefail
          scripts/build-frontend-release-artifact.sh \
            --platform linux/arm64 \
            --api-base-url http://172.18.48.34:8082 \
            --websocket-url ws://172.18.48.34:8082/api/v1/telemetry/live \
            --auth-provider local \
            --organization-id 00000000-0000-0000-0000-000000000001 \
            --output "${{ runner.temp }}/nexolab-frontend-recovery"

      - name: Upload Raspberry Pi recovery frontend artifact
        uses: actions/upload-artifact@v7
        with:
          name: nexolab-frontend-recovery-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/nexolab-frontend-recovery
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
