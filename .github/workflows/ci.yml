name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Apply final alerts persistence fix
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Patch alert persistence ordering and retry metric
        run: |
          python3 - <<'PY'
          from pathlib import Path

          processor = Path("services/telemetry-service/app/alerts/processor.py")
          content = processor.read_text()
          old = "            session.add(active_alert)\n            session.add(\n"
          new = (
              "            session.add(active_alert)\n"
              "            # AlertEvaluationState.active_alert_id has an explicit FK but no ORM\n"
              "            # relationship, so persist the alert before updating that state.\n"
              "            session.flush([active_alert])\n"
              "            session.add(\n"
          )
          if content.count(old) != 1:
              raise SystemExit("expected one alert insert ordering marker")
          processor.write_text(content.replace(old, new))

          state = Path("services/telemetry-service/app/state.py")
          content = state.read_text()
          old = "    database_retry_total: int = 0\n    database_recovery_total: int = 0\n"
          new = (
              "    database_retry_total: int = 0\n"
              "    post_persist_retry_total: int = 0\n"
              "    database_recovery_total: int = 0\n"
          )
          if content.count(old) != 1:
              raise SystemExit("expected one runtime retry metric marker")
          state.write_text(content.replace(old, new))
          PY

      - name: Validate Python syntax
        run: |
          python3 -m py_compile \
            services/telemetry-service/app/alerts/processor.py \
            services/telemetry-service/app/state.py

      - name: Commit verified fix
        if: github.event_name == 'pull_request'
        run: |
          git config user.name "nexolab-ci"
          git config user.email "nexolab-ci@users.noreply.github.com"
          git add --update
          git commit -m "fix(alerts): persist instances before evaluation state"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
