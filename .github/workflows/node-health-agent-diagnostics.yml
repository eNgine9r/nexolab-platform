name: Node Health Agent Diagnostics

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/node-health-agent-diagnostics.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Execute checked patch blocks
        run: |
          python - <<'PY'
          import re
          import textwrap
          from pathlib import Path

          workflow = Path(".github/workflows/node-health-agent-wiring.yml").read_text()
          blocks = re.findall(r"python - <<'PY'\n(.*?)\n\s+PY", workflow, flags=re.DOTALL)
          if len(blocks) != 4:
              raise SystemExit(f"expected four checked patch blocks, found {len(blocks)}")
          for index, block in enumerate(blocks, start=1):
              exec(textwrap.dedent(block), {"__name__": f"patch_{index}"})
          PY

      - name: Run diagnostics
        continue-on-error: true
        run: |
          set -o pipefail
          python -m compileall -q services/device-agent 2>&1 | tee node-health-compile.log
          PYTHONPATH=services/device-agent python -m unittest discover -s services/device-agent/tests -v 2>&1 | tee node-health-tests.log

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: node-health-agent-diagnostics
          path: |
            node-health-compile.log
            node-health-tests.log
            services/device-agent/main.py
          retention-days: 7
