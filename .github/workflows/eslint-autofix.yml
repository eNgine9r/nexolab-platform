name: ESLint Diagnostics

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: eslint-diagnostics-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  eslint-diagnostics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        env:
          HUSKY: 0
        run: npm install --no-audit

      - name: Capture ESLint diagnostics
        run: |
          set +e
          npm run lint > /tmp/nexolab-eslint.log 2>&1
          status=$?
          cat /tmp/nexolab-eslint.log
          echo "ESLINT_STATUS=$status" >> "$GITHUB_ENV"
          exit 0

      - name: Upload ESLint diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: rendered-reports-eslint-diagnostics
          path: /tmp/nexolab-eslint.log
          retention-days: 1

      - name: Preserve lint result
        run: exit "$ESLINT_STATUS"
