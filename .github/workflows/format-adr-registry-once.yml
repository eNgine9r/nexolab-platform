name: Format ADR registry once

on:
  push:
    branches:
      - docs/300-canonical-adr-registry
    paths:
      - ".github/workflows/format-adr-registry-once.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout ADR branch
        uses: actions/checkout@v6
        with:
          ref: docs/300-canonical-adr-registry
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          package-manager-cache: false
          node-version-file: .nvmrc

      - name: Install dependencies
        env:
          HUSKY: 0
        run: npm install --no-audit

      - name: Format ADR registry
        run: npx prettier --write docs/adr/README.md

      - name: Remove temporary workflow and publish
        run: |
          rm .github/workflows/format-adr-registry-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/adr/README.md .github/workflows/format-adr-registry-once.yml
          git commit -m "style(adr): format canonical registry"
          git push origin HEAD:docs/300-canonical-adr-registry
