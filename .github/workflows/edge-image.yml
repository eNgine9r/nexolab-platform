name: Edge image

on:
  push:
    branches: [main]
    tags: ["edge-v*"]
    paths:
      - "config/edge/*-register-map.yaml"
      - "config/edge/rs485-device-registry.yaml"
      - "services/device-agent/**"
      - "infrastructure/compose/compose.edge-secure.yaml"
      - "infrastructure/compose/.env.edge-secure.example"
      - ".github/workflows/edge-image.yml"
  pull_request:
    branches: [main]
    paths:
      - "config/edge/*-register-map.yaml"
      - "config/edge/rs485-device-registry.yaml"
      - "services/device-agent/**"
      - "infrastructure/compose/compose.edge-secure.yaml"
      - "infrastructure/compose/.env.edge-secure.example"
      - ".github/workflows/edge-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: edge-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install device-agent dependencies
        run: python -m pip install -r services/device-agent/requirements.txt

      - name: Compile device-agent
        run: python -m compileall -q services/device-agent

      - name: Validate RS-485 registry and register maps
        run: |
          python -m pip install 'PyYAML==6.0.3'
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import yaml

          root = Path('.')
          config_dir = root / 'config' / 'edge'
          maps = {}
          for path in sorted(config_dir.glob('*-register-map.yaml')):
              payload = yaml.safe_load(path.read_text(encoding='utf-8'))
              if not isinstance(payload, dict):
                  raise SystemExit(f'{path}: expected mapping document')
              for key in ('schema_version', 'source', 'serial', 'read_policy'):
                  if key not in payload:
                      raise SystemExit(f'{path}: missing {key}')
              function_code = payload['read_policy'].get('function')
              if function_code not in (3, 4):
                  raise SystemExit(f'{path}: unsupported read function {function_code!r}')
              maps[path.as_posix()] = payload

          registry_path = config_dir / 'rs485-device-registry.yaml'
          registry = yaml.safe_load(registry_path.read_text(encoding='utf-8'))
          if not isinstance(registry, dict):
              raise SystemExit(f'{registry_path}: expected mapping document')
          stable_parent = PurePosixPath('/dev/serial/by-id')

          def is_stable_serial_adapter(value):
              if not isinstance(value, str) or not value:
                  return False
              candidate = PurePosixPath(value)
              return (
                  str(candidate) == value
                  and candidate.parent == stable_parent
                  and candidate.name not in ('', '.', '..')
                  and '..' not in candidate.parts
              )

          bus = registry.get('bus')
          if not isinstance(bus, dict):
              raise SystemExit(f'{registry_path}: bus must be a mapping')
          bus_port = bus.get('port')
          if not is_stable_serial_adapter(bus_port):
              raise SystemExit(
                  f'{registry_path}: bus.port must use a direct stable /dev/serial/by-id/ path'
              )
          profiles = registry.get('profiles')
          if not isinstance(profiles, list):
              raise SystemExit(f'{registry_path}: profiles must be a list')
          for profile in profiles:
              if not isinstance(profile, dict):
                  raise SystemExit(f'{registry_path}: profile must be a mapping')
              dedicated_adapter = profile.get('dedicated_adapter')
              if dedicated_adapter is not None and not is_stable_serial_adapter(dedicated_adapter):
                  raise SystemExit(
                      f'{registry_path}: dedicated_adapter must use a direct stable /dev/serial/by-id/ path'
                  )
              register_map = profile.get('register_map')
              if register_map is None:
                  continue
              if register_map not in maps:
                  raise SystemExit(
                      f'{registry_path}: missing referenced register map {register_map}'
                  )
          PY

      - name: Test device-agent
        env:
          PYTHONPATH: services/device-agent
        run: python -m unittest discover -s services/device-agent/tests -v

      - name: Validate secure edge Compose contract
        run: |
          docker compose \
            --env-file infrastructure/compose/.env.edge-secure.example \
            -f infrastructure/compose/compose.edge-secure.yaml \
            config --quiet
          grep -Fq 'MQTT_AUTH_REQUIRED: "true"' \
            infrastructure/compose/compose.edge-secure.yaml
          grep -Fq 'MQTT_TLS_REQUIRED: "true"' \
            infrastructure/compose/compose.edge-secure.yaml
          grep -Fq 'MQTT_TLS_CA_FILE:' \
            infrastructure/compose/compose.edge-secure.yaml
          ! grep -ER 'tls_insecure_set|CERT_NONE|MQTT_TLS_INSECURE' \
            services/device-agent infrastructure/compose/compose.edge-secure.yaml
          ! grep -E '^(MQTT_PASSWORD|PASSWORD)=' \
            infrastructure/compose/.env.edge-secure.example

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/engine9r/nexolab-device-agent
          tags: |
            type=raw,value=edge,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Build and optionally publish multi-platform image
        uses: docker/build-push-action@v7
        with:
          context: services/device-agent
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
