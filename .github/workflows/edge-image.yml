name: Edge image

on:
  push:
    branches: [main]
    tags: ["edge-v*"]
    paths:
      - "services/device-agent/**"
      - "infrastructure/compose/compose.edge-secure.yaml"
      - "infrastructure/compose/.env.edge-secure.example"
      - ".github/workflows/edge-image.yml"
  pull_request:
    branches: [main]
    paths:
      - "services/device-agent/**"
      - "infrastructure/compose/compose.edge-secure.yaml"
      - "infrastructure/compose/.env.edge-secure.example"
      - ".github/workflows/edge-image.yml"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: edge-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Apply canonical simulator patch
        if: github.event_name == 'pull_request'
        run: |
          python - <<'PY'
          from pathlib import Path

          main_path = Path("services/device-agent/main.py")
          source = main_path.read_text(encoding="utf-8")
          simulator_anchor = '                        source="simulator",\n'
          simulator_identity = (
              '                        equipment_id=f"SIM-{self.settings.node_id}",\n'
              '                        channel_id="ambient-temperature",\n'
          )
          if 'channel_id="ambient-temperature"' not in source:
              if source.count(simulator_anchor) != 1:
                  raise SystemExit("expected exactly one simulator source anchor")
              source = source.replace(
                  simulator_anchor,
                  simulator_anchor + simulator_identity,
                  1,
              )
              main_path.write_text(source, encoding="utf-8")

          script_path = Path("scripts/run-device-agent-fleet-acceptance.sh")
          script = script_path.read_text(encoding="utf-8")
          cleanup_cursor = """SELECT node_id, stream, last_sequence
          FROM central_node_ingress_cursors
          WHERE node_id IN ('edge-01', 'edge-02')
          ORDER BY node_id, stream;
          """
          cleanup_cursor_join = """SELECT n.node_id, c.stream, c.last_sequence
          FROM central_node_ingress_cursors c
          JOIN central_nodes n ON n.id = c.node_record_id
          WHERE n.node_id IN ('edge-01', 'edge-02')
          ORDER BY n.node_id, c.stream;
          """
          if cleanup_cursor in script:
              script = script.replace(cleanup_cursor, cleanup_cursor_join, 1)
          elif cleanup_cursor_join not in script:
              raise SystemExit("fleet cleanup cursor query was not recognized")

          invariant_cursor = """  FROM central_node_ingress_cursors
            WHERE node_id IN ('edge-01', 'edge-02')
              AND stream = 'telemetry'
              AND last_sequence <= 0;
          """
          invariant_cursor_join = """  FROM central_node_ingress_cursors c
            JOIN central_nodes n ON n.id = c.node_record_id
            WHERE n.node_id IN ('edge-01', 'edge-02')
              AND c.stream = 'telemetry'
              AND c.last_sequence <= 0;
          """
          if invariant_cursor in script:
              script = script.replace(invariant_cursor, invariant_cursor_join, 1)
          elif invariant_cursor_join not in script:
              raise SystemExit("fleet invariant cursor query was not recognized")
          script_path.write_text(script, encoding="utf-8")
          PY
          cat > services/device-agent/tests/test_simulator_contract.py <<'PY'
          from __future__ import annotations

          import os
          import unittest
          from unittest.mock import patch

          from main import DeviceAgent, Settings


          class SimulatorTelemetryContractTests(unittest.TestCase):
              def test_simulator_emits_canonical_asset_identity(self) -> None:
                  with patch.dict(
                      os.environ,
                      {
                          "NEXOLAB_NODE_ID": "edge-01",
                          "DEVICE_MODE": "simulator",
                      },
                      clear=True,
                  ):
                      settings = Settings.from_env()

                  agent = object.__new__(DeviceAgent)
                  agent.settings = settings
                  records, error = DeviceAgent.sample_batch(agent)

                  self.assertIsNone(error)
                  self.assertEqual(len(records), 1)
                  self.assertEqual(records[0].equipment_id, "SIM-edge-01")
                  self.assertEqual(records[0].channel_id, "ambient-temperature")
                  self.assertEqual(records[0].quality, "valid")


          if __name__ == "__main__":
              unittest.main()
          PY
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add services/device-agent/main.py \
              services/device-agent/tests/test_simulator_contract.py \
              scripts/run-device-agent-fleet-acceptance.sh
            git commit -m "fix: align simulator telemetry with canonical contract"
            git push origin "HEAD:${{ github.head_ref }}"
          fi

      - name: Install device-agent dependencies
        run: python -m pip install -r services/device-agent/requirements.txt

      - name: Compile device-agent
        run: python -m compileall -q services/device-agent

      - name: Test device-agent
        env:
          PYTHONPATH: services/device-agent
        run: python -m unittest discover -s services/device-agent/tests -v

      - name: Validate secure edge Compose contract
        run: |
          docker compose \
            --env-file infrastructure/compose/.env.edge-secure.example \
            -f infrastructure/compose/compose.edge-secure.yaml \
            config --quiet
          grep -Fq 'MQTT_AUTH_REQUIRED: "true"' \
            infrastructure/compose/compose.edge-secure.yaml
          ! grep -E '^(MQTT_PASSWORD|PASSWORD)=' \
            infrastructure/compose/.env.edge-secure.example

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/engine9r/nexolab-device-agent
          tags: |
            type=raw,value=edge,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Build and optionally publish multi-platform image
        uses: docker/build-push-action@v6
        with:
          context: services/device-agent
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
