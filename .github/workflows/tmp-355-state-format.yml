name: Temporary Issue 355 State Formatter

on:
  push:
    branches:
      - fix/355-live-dashboard-channel-inventory
    paths:
      - .github/workflows/tmp-355-state-format.yml
      - .project/ACTIVE_SPRINT.json
      - .project/CURRENT_STATE.md
      - .project/LAST_CHECKPOINT.json

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          package-manager-cache: false
          node-version-file: .nvmrc
      - run: npm install --no-audit
        env:
          HUSKY: "0"
      - name: Format state checkpoint
        run: >-
          npx prettier --write
          .project/ACTIVE_SPRINT.json
          .project/CURRENT_STATE.md
          .project/LAST_CHECKPOINT.json
      - uses: actions/upload-artifact@v7
        with:
          name: issue-355-formatted-state
          path: |
            .project/ACTIVE_SPRINT.json
            .project/CURRENT_STATE.md
            .project/LAST_CHECKPOINT.json
          if-no-files-found: error
          retention-days: 1
