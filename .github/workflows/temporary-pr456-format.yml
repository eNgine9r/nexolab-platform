name: Temporary PR456 Format Artifact

on:
  push:
    branches: [feat/453-equipment-centric-multi-axis-charts]

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          package-manager-cache: false
          node-version-file: .nvmrc

      - name: Install dependencies
        env:
          HUSKY: 0
        run: npm install --no-audit

      - name: Format focused PR files
        run: >-
          npx prettier --write
          e2e/equipment-multi-axis-chart.production.e2e.ts
          src/features/charts/units.test.ts
          src/features/live-dashboards/chart.test.ts

      - name: Upload formatted sources
        uses: actions/upload-artifact@v7
        with:
          name: pr456-formatted-sources-${{ github.sha }}
          path: |
            e2e/equipment-multi-axis-chart.production.e2e.ts
            src/features/charts/units.test.ts
            src/features/live-dashboards/chart.test.ts
          if-no-files-found: error
          retention-days: 1
