name: Node Broker Sync PR Wiring

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/node-broker-sync-pr-wiring.yml"
      - ".github/workflows/node-broker-sync-wiring.yml"
      - ".github/node-broker-sync-trigger"

permissions:
  contents: write

concurrency:
  group: node-broker-sync-pr-wiring-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wire:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Extract and run checked patch
        id: patch
        continue-on-error: true
        run: |
          awk '
            /python - <<.PY./ {capture=1; next}
            capture && /^          PY$/ {exit}
            capture {sub(/^          /, ""); print}
          ' .github/workflows/node-broker-sync-wiring.yml \
            > /tmp/node-broker-sync-wiring.py
          test -s /tmp/node-broker-sync-wiring.py
          python - <<'PY'
          from pathlib import Path

          path = Path("/tmp/node-broker-sync-wiring.py")
          content = path.read_text()
          source = '    if count != 1:\n        raise SystemExit(f"{label}: expected one anchor, found {count}")\n'
          target = (
              '    expected_counts = {\n'
              '        "node read model exclusion": 3,\n'
              '        "provision response node": 2,\n'
              '    }\n'
              '    expected = expected_counts.get(label, 1)\n'
              '    if count != expected:\n'
              '        raise SystemExit(\n'
              '            f"{label}: expected {expected} anchor(s), found {count}"\n'
              '        )\n'
          )
          if content.count(source) != 1:
              raise SystemExit("patch guard anchor was not found exactly once")
          path.write_text(content.replace(source, target, 1))
          PY
          set +e
          python /tmp/node-broker-sync-wiring.py \
            > /tmp/node-broker-sync-patch.log 2>&1
          status=$?
          set -e
          printf '%s\n' "$status" > /tmp/node-broker-sync-patch.status
          cat /tmp/node-broker-sync-patch.log
          exit "$status"

      - name: Upload patch diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: node-broker-sync-patch-diagnostics
          path: |
            /tmp/node-broker-sync-patch.log
            /tmp/node-broker-sync-patch.status
            /tmp/node-broker-sync-wiring.py
          if-no-files-found: error
          retention-days: 7

      - name: Stop after patch failure
        if: steps.patch.outcome == 'failure'
        run: exit 1

      - name: Install backend dependencies
        if: steps.patch.outcome == 'success'
        working-directory: services/telemetry-service
        run: python -m pip install -r requirements-dev.txt

      - name: Verify lifecycle wiring
        id: verify
        if: steps.patch.outcome == 'success'
        continue-on-error: true
        working-directory: services/telemetry-service
        run: |
          set +e
          {
            python -m compileall -q app tests migrations
            compile_status=$?
            if [[ $compile_status -ne 0 ]]; then exit "$compile_status"; fi
            pytest -q \
              tests/test_node_broker_control.py \
              tests/test_node_repository.py \
              tests/test_mqtt_credentials.py
            pytest_status=$?
            if [[ $pytest_status -ne 0 ]]; then exit "$pytest_status"; fi
            alembic upgrade head --sql >/tmp/node-broker-sync-migration.sql
          } > /tmp/node-broker-sync-verification.log 2>&1
          status=$?
          set -e
          printf '%s\n' "$status" > /tmp/node-broker-sync-verification.status
          cat /tmp/node-broker-sync-verification.log
          exit "$status"

      - name: Upload verification diagnostics
        if: always() && steps.patch.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: node-broker-sync-verification-diagnostics
          path: |
            /tmp/node-broker-sync-verification.log
            /tmp/node-broker-sync-verification.status
            /tmp/node-broker-sync-migration.sql
          if-no-files-found: warn
          retention-days: 7

      - name: Stop after verification failure
        if: steps.patch.outcome == 'success' && steps.verify.outcome == 'failure'
        run: exit 1

      - name: Commit verified product changes
        if: steps.patch.outcome == 'success' && steps.verify.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            services/telemetry-service/app/model_registry.py \
            services/telemetry-service/app/nodes/repository.py \
            services/telemetry-service/app/config.py \
            services/telemetry-service/app/main.py \
            services/telemetry-service/app/nodes/schemas.py \
            services/telemetry-service/app/nodes/api.py \
            services/telemetry-service/tests/test_node_broker_control.py \
            infrastructure/compose/compose.central-mqtt-security.yaml
          git diff --cached --quiet && exit 0
          git -c core.hooksPath=/dev/null commit -m "feat(nodes): synchronize registry lifecycle with broker outbox"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
