name: Temporary Equipment Registry Type Fix

on:
  push:
    branches:
      - feat/267-equipment-metrology-registry
    paths:
      - ".github/workflows/temporary-equipment-registry-type-fix.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feat/267-equipment-metrology-registry
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Apply strict TypeScript fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          details = Path("src/components/equipment/equipment-asset-details.tsx")
          text = details.read_text()
          start = text.index("function detailsFor(")
          end = text.index("\nexport function categoryLabel", start)
          replacement = '''function detailsFor(asset: EquipmentRegistryAsset): Array<{ label: string; value: string }> {
            const common = [
              { label: "Категорія", value: categoryLabel(asset.category) },
              { label: "Ідентифікатор", value: asset.primaryIdentifier },
              { label: "Кліматична камера", value: asset.chamberLabel ?? "Не прив’язано" },
              { label: "Розташування", value: asset.locationLabel ?? "Не задано" },
            ];

            if (asset.category === "refrigeration-equipment") {
              const item = asset.source;
              return [
                ...common,
                { label: "Тип", value: item.type },
                { label: "Виробник", value: item.manufacturer },
                { label: "Модель", value: item.model },
                { label: "Серійний номер", value: item.serialNumber },
                { label: "Температурний клас", value: item.temperatureClass },
                { label: "Lifecycle", value: statusLabel(item.lifecycleStatus) },
                { label: "Технічний стан", value: statusLabel(item.status) },
                { label: "Встановлено", value: formatDate(item.installedAt) },
                { label: "Останній сервіс", value: formatDate(item.servicedAt) },
                { label: "Датчики", value: `${item.onlineSensors} онлайн із ${item.totalSensors}` },
                { label: "Активні тривоги", value: String(item.activeAlarms) },
                { label: "Останній зв’язок", value: formatDateTime(item.lastSeenAt) },
                { label: "Версія паспорта", value: `v${item.version}` },
              ];
            }

            if (asset.category === "physical-sensor") {
              const item = asset.source;
              return [
                ...common,
                { label: "Inventory number", value: item.inventoryNumber },
                { label: "Серійний номер", value: item.serialNumber ?? "Не задано" },
                { label: "Позиція сенсора", value: item.sensorPosition },
                { label: "Калібрування", value: calibrationLabel(item.calibrationStatus) },
                { label: "Catalog status", value: statusLabel(item.status) },
                { label: "Канал", value: asset.channel.displayName },
                { label: "Channel id", value: asset.channel.channelId },
                { label: "Source channel", value: asset.channel.sourceChannelId },
                { label: "Параметр", value: `${asset.channel.metricType} · ${asset.channel.unit}` },
                { label: "Контролер", value: asset.controller?.displayName ?? "Не визначено" },
                {
                  label: "Підключення контролера",
                  value: statusLabel(asset.controller?.connectionStatus ?? "unknown"),
                },
              ];
            }

            const item = asset.source;
            return [
              ...common,
              { label: "Business key", value: item.businessKey },
              { label: "Виробник", value: item.manufacturer },
              { label: "Модель", value: item.model },
              { label: "Modbus unit id", value: String(item.unitId) },
              { label: "Позначення", value: item.designation ?? "Не задано" },
              { label: "Підключення", value: statusLabel(item.connectionStatus) },
              { label: "Catalog status", value: statusLabel(item.status) },
              {
                label: "Вимірювані параметри",
                value:
                  item.measuredParameters.length > 0
                    ? item.measuredParameters
                        .map((parameter) => `${parameter.metric} · ${parameter.unit}`)
                        .join(", ")
                    : "Не задано",
              },
            ];
          }
          '''
          details.write_text(text[:start] + replacement + text[end:])

          hook = Path("src/hooks/use-equipment-registry.ts")
          text = hook.read_text()
          old = "createEquipmentRegistryRuntime({ organizationId })"
          new = "createEquipmentRegistryRuntime({ organizationId: organizationId ?? undefined })"
          if old not in text:
              raise SystemExit("runtime organization pattern not found")
          hook.write_text(text.replace(old, new))

          test = Path("src/features/equipment/asset-registry.test.ts")
          text = test.read_text()
          old = "let resolveCatalog: ((value: ClimateChamberEquipment) => void) | null = null;"
          new = "let resolveCatalog!: (value: ClimateChamberEquipment) => void;"
          if old not in text:
              raise SystemExit("deferred resolver declaration not found")
          text = text.replace(old, new)
          old = "resolveCatalog?.(emptyCatalog(chamberTwo));"
          new = "resolveCatalog(emptyCatalog(chamberTwo));"
          if old not in text:
              raise SystemExit("deferred resolver call not found")
          test.write_text(text.replace(old, new))
          PY
          npm ci --ignore-scripts
          npx prettier --write \
            src/components/equipment/equipment-asset-details.tsx \
            src/hooks/use-equipment-registry.ts \
            src/features/equipment/asset-registry.test.ts
          rm .github/workflows/temporary-equipment-registry-type-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/components/equipment/equipment-asset-details.tsx \
            src/hooks/use-equipment-registry.ts \
            src/features/equipment/asset-registry.test.ts \
            .github/workflows/temporary-equipment-registry-type-fix.yml
          git commit -m "fix(equipment): satisfy strict registry types"
          git push origin HEAD:feat/267-equipment-metrology-registry
