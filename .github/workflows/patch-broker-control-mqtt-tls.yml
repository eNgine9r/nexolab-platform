name: Wire broker control MQTT TLS

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/patch-broker-control-mqtt-tls.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Wire TLS through adapter and application bootstrap
        run: |
          python - <<'PY'
          from pathlib import Path

          adapter_path = Path("services/telemetry-service/app/nodes/broker_adapter.py")
          adapter = adapter_path.read_text(encoding="utf-8")
          import_anchor = "from app.nodes.broker_models import CentralNodeBrokerCommand\n"
          tls_import = "from app.mqtt_tls import MQTTTLSConfig\n"
          if tls_import not in adapter:
              if adapter.count(import_anchor) != 1:
                  raise SystemExit("broker adapter TLS import anchor not found")
              adapter = adapter.replace(import_anchor, tls_import + import_anchor, 1)

          signature_anchor = "        timeout_seconds: float,\n    ) -> None:\n"
          signature_replacement = (
              "        timeout_seconds: float,\n"
              "        tls_config: MQTTTLSConfig | None = None,\n"
              "    ) -> None:\n"
          )
          if "tls_config: MQTTTLSConfig | None" not in adapter:
              if adapter.count(signature_anchor) != 1:
                  raise SystemExit("broker adapter TLS signature anchor not found")
              adapter = adapter.replace(signature_anchor, signature_replacement, 1)

          environment_anchor = '''        self._environment = {
              "NEXOLAB_MQTT_BROKER_HOST": broker_host,
              "NEXOLAB_MQTT_BROKER_PORT": str(broker_port),
              "NEXOLAB_MQTT_ADMIN_USERNAME": _required(admin_username, "admin username"),
              "NEXOLAB_MQTT_ADMIN_CLIENT_ID": _required(
                  admin_client_id,
                  "admin client ID",
              ),
              "NEXOLAB_MQTT_ADMIN_PASSWORD_FILE": str(password_path),
          }
          '''
          environment_replacement = environment_anchor + '''        self._tls_config = tls_config or MQTTTLSConfig(enabled=False)
          self._environment["NEXOLAB_MQTT_TLS_REQUIRED"] = (
              "true" if self._tls_config.enabled else "false"
          )
          if self._tls_config.enabled:
              if self._tls_config.ca_file is None:
                  raise BrokerControlAdapterError(
                      "broker_admin_tls_invalid",
                      "broker administrator TLS CA is unavailable",
                      retryable=False,
                  )
              self._environment["NEXOLAB_MQTT_TLS_CA_FILE"] = str(
                  self._tls_config.ca_file
              )
              if (
                  self._tls_config.client_certificate_file is not None
                  and self._tls_config.client_key_file is not None
              ):
                  self._environment["NEXOLAB_MQTT_TLS_CERT_FILE"] = str(
                      self._tls_config.client_certificate_file
                  )
                  self._environment["NEXOLAB_MQTT_TLS_KEY_FILE"] = str(
                      self._tls_config.client_key_file
                  )
          '''
          if "NEXOLAB_MQTT_TLS_REQUIRED" not in adapter:
              if adapter.count(environment_anchor) != 1:
                  raise SystemExit("broker adapter environment anchor not found")
              adapter = adapter.replace(
                  environment_anchor,
                  environment_replacement,
                  1,
              )

          permanent_anchor = "            permanent = result.returncode in {64, 65, 66, 67, 68, 69, 70, 71}\n"
          permanent_replacement = (
              "            permanent = result.returncode in "
              "{64, 65, 66, 67, 68, 69, 70, 71, 72, 73, 74, 75, 76}\n"
          )
          if "71, 72, 73, 74, 75, 76" not in adapter:
              if adapter.count(permanent_anchor) != 1:
                  raise SystemExit("broker adapter permanent-code anchor not found")
              adapter = adapter.replace(permanent_anchor, permanent_replacement, 1)
          adapter_path.write_text(adapter, encoding="utf-8")

          main_path = Path("services/telemetry-service/app/main.py")
          main = main_path.read_text(encoding="utf-8")
          main_import_anchor = "from app.mqtt_consumer import MqttConsumer\n"
          if "from app.mqtt_tls import MQTTTLSConfig\n" not in main:
              if main.count(main_import_anchor) != 1:
                  raise SystemExit("application MQTT TLS import anchor not found")
              main = main.replace(
                  main_import_anchor,
                  main_import_anchor + "from app.mqtt_tls import MQTTTLSConfig\n",
                  1,
              )

          adapter_call_anchor = '''        admin_password_file=settings.broker_control_admin_password_file or "",
              timeout_seconds=settings.broker_control_command_timeout_seconds,
          )
          '''
          adapter_call_replacement = '''        admin_password_file=settings.broker_control_admin_password_file or "",
              timeout_seconds=settings.broker_control_command_timeout_seconds,
              tls_config=MQTTTLSConfig.from_settings(settings),
          )
          '''
          if "tls_config=MQTTTLSConfig.from_settings(settings)" not in main:
              if main.count(adapter_call_anchor) != 1:
                  raise SystemExit("application broker TLS call anchor not found")
              main = main.replace(
                  adapter_call_anchor,
                  adapter_call_replacement,
                  1,
              )
          main_path.write_text(main, encoding="utf-8")
          PY
      - name: Wire TLS options into hardened admin script
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("infrastructure/mqtt/dynamic-security/dynsec-admin.sh")
          source = path.read_text(encoding="utf-8")

          variables_anchor = 'ADMIN_PASSWORD_FILE="${NEXOLAB_MQTT_ADMIN_PASSWORD_FILE:-/run/secrets/mqtt_admin_password}"\n'
          variables_block = variables_anchor + '''TLS_REQUIRED="${NEXOLAB_MQTT_TLS_REQUIRED:-false}"
          TLS_CA_FILE="${NEXOLAB_MQTT_TLS_CA_FILE:-}"
          TLS_CERT_FILE="${NEXOLAB_MQTT_TLS_CERT_FILE:-}"
          TLS_KEY_FILE="${NEXOLAB_MQTT_TLS_KEY_FILE:-}"
          TLS_ENABLED=false
          '''
          if "NEXOLAB_MQTT_TLS_REQUIRED" not in source:
              if source.count(variables_anchor) != 1:
                  raise SystemExit("dynsec TLS variable anchor not found")
              source = source.replace(variables_anchor, variables_block, 1)

          function_anchor = '''prepare_control_options() {
          '''
          function_block = '''prepare_tls_options() {
            case "$TLS_REQUIRED" in
              1|true|TRUE|yes|YES|on|ON)
                TLS_ENABLED=true
                ;;
              0|false|FALSE|no|NO|off|OFF)
                if [ -n "$TLS_CA_FILE$TLS_CERT_FILE$TLS_KEY_FILE" ]; then
                  echo "TLS files require NEXOLAB_MQTT_TLS_REQUIRED=true." >&2
                  exit 72
                fi
                TLS_ENABLED=false
                return
                ;;
              *)
                echo "NEXOLAB_MQTT_TLS_REQUIRED must be true or false." >&2
                exit 72
                ;;
            esac

            if [ -z "$TLS_CA_FILE" ] || [ ! -r "$TLS_CA_FILE" ]; then
              echo "TLS CA file is required and must be readable." >&2
              exit 73
            fi
            if [ -n "$TLS_CERT_FILE" ] && [ -z "$TLS_KEY_FILE" ]; then
              echo "TLS client certificate and key must be configured together." >&2
              exit 74
            fi
            if [ -z "$TLS_CERT_FILE" ] && [ -n "$TLS_KEY_FILE" ]; then
              echo "TLS client certificate and key must be configured together." >&2
              exit 74
            fi
            if [ -n "$TLS_CERT_FILE" ]; then
              if [ ! -r "$TLS_CERT_FILE" ]; then
                echo "TLS client certificate file is not readable." >&2
                exit 75
              fi
              if [ ! -r "$TLS_KEY_FILE" ]; then
                echo "TLS client key file is not readable." >&2
                exit 76
              fi
            fi
          }

          prepare_control_options() {
          '''
          if "prepare_tls_options()" not in source:
              if source.count(function_anchor) != 1:
                  raise SystemExit("dynsec TLS function anchor not found")
              source = source.replace(function_anchor, function_block, 1)

          prepare_anchor = '''  required_value "$ADMIN_USERNAME" "Admin username"
            required_value "$ADMIN_CLIENT_ID" "Admin client ID"
            admin_password="$(read_secret "$ADMIN_PASSWORD_FILE")"
          '''
          prepare_replacement = '''  required_value "$ADMIN_USERNAME" "Admin username"
            required_value "$ADMIN_CLIENT_ID" "Admin client ID"
            prepare_tls_options
            admin_password="$(read_secret "$ADMIN_PASSWORD_FILE")"
          '''
          if "    prepare_tls_options\n" not in source:
              if source.count(prepare_anchor) != 1:
                  raise SystemExit("dynsec TLS prepare anchor not found")
              source = source.replace(prepare_anchor, prepare_replacement, 1)

          options_anchor = '''    printf '%s\n' "-P $admin_password"
              printf '%s\n' "--quiet"
          '''
          options_replacement = '''    printf '%s\n' "-P $admin_password"
              if [ "$TLS_ENABLED" = "true" ]; then
                printf '%s\n' "--cafile $TLS_CA_FILE"
                printf '%s\n' "--tls-version tlsv1.2"
                if [ -n "$TLS_CERT_FILE" ]; then
                  printf '%s\n' "--cert $TLS_CERT_FILE"
                  printf '%s\n' "--key $TLS_KEY_FILE"
                fi
              fi
              printf '%s\n' "--quiet"
          '''
          if '"--cafile $TLS_CA_FILE"' not in source:
              if source.count(options_anchor) != 1:
                  raise SystemExit("dynsec TLS options anchor not found")
              source = source.replace(options_anchor, options_replacement, 1)

          if "--insecure" in source:
              raise SystemExit("insecure TLS option is forbidden")
          path.write_text(source, encoding="utf-8")
          Path("services/telemetry-service/bin/nexolab-dynsec-admin").write_text(
              source,
              encoding="utf-8",
          )
          PY
          chmod 0755 \
            infrastructure/mqtt/dynamic-security/dynsec-admin.sh \
            services/telemetry-service/bin/nexolab-dynsec-admin
      - name: Add broker-control TLS tests
        run: |
          cat > services/telemetry-service/tests/test_node_broker_adapter_tls.py <<'PY'
          from __future__ import annotations

          import os
          import subprocess
          from pathlib import Path

          from app.mqtt_tls import MQTTTLSConfig
          from app.nodes.broker_adapter import DynamicSecurityAdminAdapter


          def write_file(path: Path, content: str) -> Path:
              path.write_text(content, encoding="utf-8")
              path.chmod(0o600)
              return path


          def test_adapter_exports_only_verified_tls_paths(tmp_path: Path) -> None:
              executable = tmp_path / "admin"
              executable.write_text("#!/bin/sh\nexit 0\n", encoding="utf-8")
              executable.chmod(0o700)
              admin_password = write_file(tmp_path / "admin-password", "secret")
              ca_file = write_file(tmp_path / "ca.pem", "ca")
              certificate_file = write_file(tmp_path / "client.pem", "certificate")
              key_file = write_file(tmp_path / "client.key", "private-key")

              adapter = DynamicSecurityAdminAdapter(
                  executable=str(executable),
                  broker_host="mqtt.nexolab.internal",
                  broker_port=8883,
                  admin_username="admin",
                  admin_client_id="broker-control",
                  admin_password_file=str(admin_password),
                  timeout_seconds=2,
                  tls_config=MQTTTLSConfig(
                      enabled=True,
                      ca_file=ca_file,
                      client_certificate_file=certificate_file,
                      client_key_file=key_file,
                  ),
              )

              assert adapter._environment["NEXOLAB_MQTT_TLS_REQUIRED"] == "true"
              assert adapter._environment["NEXOLAB_MQTT_TLS_CA_FILE"] == str(ca_file)
              assert adapter._environment["NEXOLAB_MQTT_TLS_CERT_FILE"] == str(
                  certificate_file
              )
              assert adapter._environment["NEXOLAB_MQTT_TLS_KEY_FILE"] == str(key_file)
              assert "insecure" not in " ".join(adapter._environment).lower()


          def test_admin_script_builds_tls_options_without_insecure_bypass(
              tmp_path: Path,
          ) -> None:
              script = (
                  Path(__file__).resolve().parents[2]
                  / "infrastructure"
                  / "mqtt"
                  / "dynamic-security"
                  / "dynsec-admin.sh"
              )
              fake_bin = tmp_path / "bin"
              fake_bin.mkdir()
              captured = tmp_path / "captured-options"
              fake_ctrl = fake_bin / "mosquitto_ctrl"
              fake_ctrl.write_text(
                  "#!/bin/sh\n"
                  "test \"$1\" = -o\n"
                  "cp \"$2\" \"$CAPTURED_OPTIONS\"\n"
                  "exit 0\n",
                  encoding="utf-8",
              )
              fake_ctrl.chmod(0o700)
              admin_password = write_file(tmp_path / "admin-password", "secret")
              ca_file = write_file(tmp_path / "ca.pem", "ca")
              certificate_file = write_file(tmp_path / "client.pem", "certificate")
              key_file = write_file(tmp_path / "client.key", "private-key")
              environment = os.environ.copy()
              environment.update(
                  {
                      "PATH": f"{fake_bin}:{environment['PATH']}",
                      "CAPTURED_OPTIONS": str(captured),
                      "NEXOLAB_MQTT_ADMIN_PASSWORD_FILE": str(admin_password),
                      "NEXOLAB_MQTT_TLS_REQUIRED": "true",
                      "NEXOLAB_MQTT_TLS_CA_FILE": str(ca_file),
                      "NEXOLAB_MQTT_TLS_CERT_FILE": str(certificate_file),
                      "NEXOLAB_MQTT_TLS_KEY_FILE": str(key_file),
                  }
              )

              subprocess.run(
                  [str(script), "list-clients"],
                  check=True,
                  env=environment,
                  capture_output=True,
                  text=True,
              )

              options = captured.read_text(encoding="utf-8")
              assert f"--cafile {ca_file}" in options
              assert "--tls-version tlsv1.2" in options
              assert f"--cert {certificate_file}" in options
              assert f"--key {key_file}" in options
              assert "--insecure" not in options
          PY
      - name: Validate broker-control TLS wiring
        run: |
          sh -n infrastructure/mqtt/dynamic-security/dynsec-admin.sh
          sh -n services/telemetry-service/bin/nexolab-dynsec-admin
          cmp -s \
            infrastructure/mqtt/dynamic-security/dynsec-admin.sh \
            services/telemetry-service/bin/nexolab-dynsec-admin
          ! grep -R -- '--insecure' \
            infrastructure/mqtt/dynamic-security/dynsec-admin.sh \
            services/telemetry-service/app \
            services/telemetry-service/bin
          cd services/telemetry-service
          python -m pip install -r requirements-dev.txt
          python -m compileall -q app tests
          python -m pytest -q \
            tests/test_mqtt_tls.py \
            tests/test_mqtt_tls_integration.py \
            tests/test_node_broker_adapter.py \
            tests/test_node_broker_adapter_tls.py
      - name: Commit broker-control TLS wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            infrastructure/mqtt/dynamic-security/dynsec-admin.sh \
            services/telemetry-service/bin/nexolab-dynsec-admin \
            services/telemetry-service/app/main.py \
            services/telemetry-service/app/nodes/broker_adapter.py \
            services/telemetry-service/tests/test_node_broker_adapter_tls.py
          git commit -m "feat: enforce TLS for broker control administration"
          git push origin "HEAD:${{ github.head_ref }}"
