name: Container Policy Diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/container-policy-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  telemetry-service:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build telemetry-service image
        uses: docker/build-push-action@v6
        with:
          context: services/telemetry-service
          file: services/telemetry-service/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: local/nexolab-telemetry-service:${{ github.sha }}
          cache-from: type=gha,scope=supply-chain-telemetry-service
      - name: Generate raw Trivy JSON
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: image
          image-ref: local/nexolab-telemetry-service:${{ github.sha }}
          format: json
          output: telemetry-service.trivy.json
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "0"
      - name: Capture policy output
        id: policy
        shell: bash
        run: |
          set +e
          python scripts/evaluate-container-vulnerabilities.py \
            --image-id telemetry-service \
            --report telemetry-service.trivy.json \
            > telemetry-policy.txt 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          cat telemetry-policy.txt
          exit 0
      - name: Upload policy diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: telemetry-policy-diagnostic
          path: |
            telemetry-service.trivy.json
            telemetry-policy.txt
          if-no-files-found: error
          retention-days: 3
      - name: Preserve policy result
        run: exit "${{ steps.policy.outputs.status }}"
