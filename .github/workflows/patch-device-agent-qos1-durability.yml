name: Patch Device Agent QoS1 durability

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/patch-device-agent-qos1-durability.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Make telemetry outbox durable before publish
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("services/device-agent/main.py")
          source = path.read_text(encoding="utf-8")
          start = source.index("    def publish_or_queue(self, record: TelemetryRecord) -> bool:\n")
          end = source.index("    def run(self) -> None:\n", start)
          replacement = '''    def publish_or_queue(self, record: TelemetryRecord) -> bool:
              payload_data = asdict(record)
              if self.settings.organization_id is not None:
                  payload_data["node_sequence"] = self.queue.next_sequence("telemetry")
              payload = json.dumps(
                  payload_data, separators=(",", ":"), ensure_ascii=False
              )
              topic = self.settings.resolved_telemetry_topic

              # Persist before touching the network. A successful ``publish()`` return
              # only means Paho accepted the message locally; durability starts only
              # after the QoS 1 acknowledgement is observed and the queued row is
              # deleted. This also preserves FIFO ordering across reconnects.
              self.queue.enqueue(topic, payload, record.event_id)
              if not self.state.mqtt_connected:
                  return False
              return self.flush_queue()

              def flush_queue(self) -> bool:
              if not self.state.mqtt_connected:
                  return False

              for record_id, topic, payload in self.queue.oldest():
                  try:
                      result = self.client.publish(topic, payload, qos=1)
                      result.wait_for_publish(timeout=5)
                  except (RuntimeError, ValueError, OSError) as exc:
                      LOG.warning("MQTT queue flush deferred: %s", exc)
                      return False

                  if result.rc != mqtt.MQTT_ERR_SUCCESS:
                      LOG.warning(
                          "MQTT queue flush deferred: publish rc=%s",
                          result.rc,
                      )
                      return False
                  if not result.is_published():
                      LOG.warning(
                          "MQTT queue flush deferred: QoS 1 acknowledgement timed out"
                      )
                      return False

                  self.queue.delete(record_id)
                  self.state.update(
                      last_publish_at=datetime.now(timezone.utc).isoformat(),
                  )
              return True

          '''
          # Build exact four-space method indentation independently of YAML heredoc.
          normalized = []
          for raw_line in replacement.splitlines():
              line = raw_line[4:] if raw_line.startswith("    ") else raw_line
              normalized.append(line)
          block = "\n".join(normalized) + "\n"
          block = block.replace("\n        def flush_queue", "\n    def flush_queue", 1)
          path.write_text(source[:start] + block + source[end:], encoding="utf-8")
          PY

      - name: Add QoS1 acknowledgement regression tests
        run: |
          cat > services/device-agent/tests/test_mqtt_backlog_order.py <<'PY'
          from __future__ import annotations

          import json
          import os
          import tempfile
          import unittest
          from pathlib import Path
          from unittest.mock import Mock, patch

          from main import AgentState, DeviceAgent, OfflineQueue, Settings, TelemetryRecord


          ORGANIZATION_ID = "00000000-0000-0000-0000-000000000001"


          class MQTTBacklogOrderingTests(unittest.TestCase):
              @staticmethod
              def settings(database_path: Path | None = None) -> Settings:
                  environment = {
                      "NEXOLAB_NODE_ID": "edge-01",
                      "NEXOLAB_ORGANIZATION_ID": ORGANIZATION_ID,
                  }
                  if database_path is not None:
                      environment["DATABASE_PATH"] = str(database_path)
                  with patch.dict(os.environ, environment, clear=True):
                      return Settings.from_env()

              @staticmethod
              def record(event_id: str) -> TelemetryRecord:
                  return TelemetryRecord(
                      event_id=event_id,
                      node_id="edge-01",
                      captured_at="2026-07-27T00:00:00+00:00",
                      metric="temperature.air",
                      value=4.2,
                      unit="degC",
                      quality="valid",
                      source="simulator",
                  )

              @staticmethod
              def publish_result(*, acknowledged: bool, rc: int = 0) -> Mock:
                  result = Mock(rc=rc)
                  result.is_published.return_value = acknowledged
                  return result

              def make_agent(self) -> tuple[DeviceAgent, tempfile.TemporaryDirectory[str]]:
                  temporary_directory = tempfile.TemporaryDirectory()
                  self.addCleanup(temporary_directory.cleanup)
                  database_path = Path(temporary_directory.name) / "edge.db"
                  agent = object.__new__(DeviceAgent)
                  agent.settings = self.settings(database_path)
                  agent.state = AgentState()
                  agent.client = Mock()
                  agent.queue = OfflineQueue(database_path)
                  return agent, temporary_directory

              def test_record_is_persisted_before_network_publish(self) -> None:
                  agent, _ = self.make_agent()
                  agent.state.update(mqtt_connected=True)
                  result = self.publish_result(acknowledged=True)

                  def publish_after_durable_enqueue(*_args, **_kwargs):
                      self.assertEqual(agent.queue.size(), 1)
                      return result

                  agent.client.publish.side_effect = publish_after_durable_enqueue

                  published = DeviceAgent.publish_or_queue(agent, self.record("event-1"))

                  self.assertTrue(published)
                  self.assertEqual(agent.queue.size(), 0)
                  result.wait_for_publish.assert_called_once_with(timeout=5)
                  result.is_published.assert_called_once_with()

              def test_unacknowledged_qos1_publish_remains_in_outbox(self) -> None:
                  agent, _ = self.make_agent()
                  agent.state.update(mqtt_connected=True)
                  result = self.publish_result(acknowledged=False)
                  agent.client.publish.return_value = result

                  published = DeviceAgent.publish_or_queue(agent, self.record("event-1"))

                  self.assertFalse(published)
                  self.assertEqual(agent.queue.size(), 1)
                  rows = agent.queue.oldest()
                  self.assertEqual(len(rows), 1)
                  self.assertEqual(json.loads(rows[0][2])["node_sequence"], 1)

              def test_disconnected_sample_is_persisted_without_publish(self) -> None:
                  agent, _ = self.make_agent()
                  agent.state.update(mqtt_connected=False)

                  published = DeviceAgent.publish_or_queue(agent, self.record("event-1"))

                  self.assertFalse(published)
                  self.assertEqual(agent.queue.size(), 1)
                  agent.client.publish.assert_not_called()

              def test_flush_uses_sqlite_order_without_resequencing(self) -> None:
                  agent = object.__new__(DeviceAgent)
                  agent.state = AgentState()
                  agent.state.update(mqtt_connected=True)
                  agent.client = Mock()
                  agent.queue = Mock()
                  agent.queue.oldest.return_value = [
                      (11, "topic", '{"node_sequence":11}'),
                      (12, "topic", '{"node_sequence":12}'),
                  ]
                  agent.client.publish.side_effect = [
                      self.publish_result(acknowledged=True),
                      self.publish_result(acknowledged=True),
                  ]

                  self.assertTrue(DeviceAgent.flush_queue(agent))

                  payloads = [call.args[1] for call in agent.client.publish.call_args_list]
                  self.assertEqual(
                      [json.loads(payload)["node_sequence"] for payload in payloads],
                      [11, 12],
                  )
                  self.assertEqual(
                      [call.args[0] for call in agent.queue.delete.call_args_list],
                      [11, 12],
                  )

              def test_flush_stops_without_deleting_unacknowledged_row(self) -> None:
                  agent = object.__new__(DeviceAgent)
                  agent.state = AgentState()
                  agent.state.update(mqtt_connected=True)
                  agent.client = Mock()
                  agent.queue = Mock()
                  agent.queue.oldest.return_value = [
                      (11, "topic", '{"node_sequence":11}'),
                      (12, "topic", '{"node_sequence":12}'),
                  ]
                  agent.client.publish.return_value = self.publish_result(
                      acknowledged=False
                  )

                  self.assertFalse(DeviceAgent.flush_queue(agent))
                  agent.queue.delete.assert_not_called()
                  self.assertEqual(agent.client.publish.call_count, 1)


          if __name__ == "__main__":
              unittest.main()
          PY

      - name: Validate Device Agent durability
        run: |
          python -m pip install -r services/device-agent/requirements.txt
          python -m compileall -q services/device-agent
          PYTHONPATH=services/device-agent \
            python -m unittest discover -s services/device-agent/tests -v

      - name: Commit Device Agent durability fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            services/device-agent/main.py \
            services/device-agent/tests/test_mqtt_backlog_order.py
          git commit -m "fix: retain QoS1 telemetry until broker acknowledgement"
          git push origin "HEAD:${{ github.head_ref }}"
