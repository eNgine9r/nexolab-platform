name: Temporary Prettier Output

on:
  push:
    branches:
      - feat/283-acquisition-instrumentation

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          package-manager-cache: false
          node-version-file: .nvmrc
      - run: npm install --no-audit --no-fund
        env:
          HUSKY: "0"
      - run: npx prettier --write e2e/telemetry-acquisition-invariant.production.e2e.ts
      - uses: actions/upload-artifact@v7
        with:
          name: exact-prettier-output
          path: e2e/telemetry-acquisition-invariant.production.e2e.ts
          retention-days: 1
