name: Issue 357 Main Wiring Fix

on:
  push:
    branches:
      - fix/357-structural-snapshot-acceptance
    paths:
      - .github/workflows/issue-357-main-wiring-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/357-structural-snapshot-acceptance
          fetch-depth: 0
      - name: Wire canonical channel repository
        shell: bash
        run: >-
          python3 -c "from pathlib import Path; p=Path('services/telemetry-service/app/main.py'); s=p.read_text(); a='from app.refrigeration.repository import PostgresRefrigerationLayoutRepository\n'; i='from app.refrigeration.sensor_configuration_repository import PostgresSensorConfigurationRepository\n'; s=s if i in s else s.replace(a,a+i); a='    equipment_lifecycle_repository = PostgresEquipmentLifecycleRepository(database)\n'; i='    sensor_configuration_repository = PostgresSensorConfigurationRepository(database)\n'; s=s if i in s else s.replace(a,a+i); a='    app.state.equipment_lifecycle_repository = equipment_lifecycle_repository\n'; i='    app.state.sensor_configuration_repository = sensor_configuration_repository\n'; s=s if i in s else s.replace(a,a+i); a='            refrigeration_equipment_repository,\n            equipment_lifecycle_repository,\n            refrigeration_repository,\n'; r='            refrigeration_equipment_repository,\n            equipment_lifecycle_repository,\n            sensor_configuration_repository,\n            refrigeration_repository,\n'; assert a in s; p.write_text(s.replace(a,r,1))"
      - name: Remove helper workflow
        run: rm .github/workflows/issue-357-main-wiring-fix.yml
      - name: Compile and commit
        run: |
          python -m compileall -q services/telemetry-service/app/main.py services/telemetry-service/app/refrigeration/structural_api.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/telemetry-service/app/main.py .github/workflows/issue-357-main-wiring-fix.yml
          git commit -m "fix(refrigeration): wire canonical structural channel repository"
          git push origin HEAD:fix/357-structural-snapshot-acceptance
