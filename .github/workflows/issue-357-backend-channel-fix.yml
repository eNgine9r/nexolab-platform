name: Issue 357 Backend Channel Fix

on:
  push:
    branches:
      - fix/357-structural-snapshot-acceptance
    paths:
      - .github/workflows/issue-357-backend-channel-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/357-structural-snapshot-acceptance
          fetch-depth: 0
      - name: Apply canonical chamber channel composition
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          structural = Path('services/telemetry-service/app/refrigeration/structural_api.py')
          text = structural.read_text()
          text = text.replace(
              'from app.refrigeration.repository import (\n    LayoutRepositoryError,\n    PostgresRefrigerationLayoutRepository,\n)\n',
              'from app.refrigeration.repository import (\n    LayoutRepositoryError,\n    PostgresRefrigerationLayoutRepository,\n)\nfrom app.refrigeration.sensor_configuration_repository import (\n    PostgresSensorConfigurationRepository,\n)\n',
          )
          text = text.replace(
              '    lifecycle_repository: PostgresEquipmentLifecycleRepository,\n    layout_repository: PostgresRefrigerationLayoutRepository,\n',
              '    lifecycle_repository: PostgresEquipmentLifecycleRepository,\n    sensor_configuration_repository: PostgresSensorConfigurationRepository,\n    layout_repository: PostgresRefrigerationLayoutRepository,\n',
          )
          old = '''            _, available_channels = lifecycle_repository.list_available_sensors(
                equipment_id,
                organization_id=organization_id,
            )'''
          new = '''            if equipment.climate_chamber_id is not None:
                _, available_channels = (
                    sensor_configuration_repository.list_climate_chamber_channels(
                        equipment.climate_chamber_id,
                        organization_id=organization_id,
                    )
                )
            elif equipment.node_id is not None:
                _, available_channels = lifecycle_repository.list_available_sensors(
                    equipment_id,
                    organization_id=organization_id,
                )
            else:
                available_channels = []'''
          if old not in text:
              raise SystemExit('structural channel block not found')
          structural.write_text(text.replace(old, new))

          main = Path('services/telemetry-service/app/main.py')
          text = main.read_text()
          import_anchor = 'from app.refrigeration.repository import PostgresRefrigerationLayoutRepository\n'
          import_line = 'from app.refrigeration.sensor_configuration_repository import PostgresSensorConfigurationRepository\n'
          if import_line not in text:
              text = text.replace(import_anchor, import_anchor + import_line)
          init_anchor = '    equipment_lifecycle_repository = PostgresEquipmentLifecycleRepository(database)\n'
          init_line = '    sensor_configuration_repository = PostgresSensorConfigurationRepository(database)\n'
          if init_line not in text:
              text = text.replace(init_anchor, init_anchor + init_line)
          state_anchor = '    app.state.equipment_lifecycle_repository = equipment_lifecycle_repository\n'
          state_line = '    app.state.sensor_configuration_repository = sensor_configuration_repository\n'
          if state_line not in text:
              text = text.replace(state_anchor, state_anchor + state_line)
          call_anchor = '            refrigeration_equipment_repository,\n            equipment_lifecycle_repository,\n            refrigeration_repository,\n'
          call_replacement = '            refrigeration_equipment_repository,\n            equipment_lifecycle_repository,\n            sensor_configuration_repository,\n            refrigeration_repository,\n'
          if call_anchor not in text:
              raise SystemExit('structural router wiring block not found')
          main.write_text(text.replace(call_anchor, call_replacement, 1))

          application = Path('services/telemetry-service/app/application.py')
          text = application.read_text()
          old_init = '''    sensor_configuration_repository = PostgresSensorConfigurationRepository(
        app.state.database,
        climate_catalog_repository=climate_catalog_repository,
    )'''
          new_init = '''    sensor_configuration_repository = PostgresSensorConfigurationRepository(
        app.state.database,
        climate_catalog_repository=climate_catalog_repository,
    )'''
          application.write_text(text.replace(old_init, new_init))

          Path('.github/workflows/issue-357-backend-channel-fix.yml').unlink()
          PY
      - name: Compile and commit focused backend fix
        shell: bash
        run: |
          python -m compileall -q \
            services/telemetry-service/app/main.py \
            services/telemetry-service/app/application.py \
            services/telemetry-service/app/refrigeration/structural_api.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            services/telemetry-service/app/main.py \
            services/telemetry-service/app/application.py \
            services/telemetry-service/app/refrigeration/structural_api.py \
            .github/workflows/issue-357-backend-channel-fix.yml
          git commit -m "fix(refrigeration): compose structural channels from chamber catalog"
          git push origin HEAD:fix/357-structural-snapshot-acceptance
