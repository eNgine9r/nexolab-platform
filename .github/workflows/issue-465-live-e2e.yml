name: Issue 465 Live Dashboard selector acceptance patch

on:
  push:
    branches:
      - feat/465-live-dashboard-telemetry-selector
    paths:
      - .github/workflows/issue-465-live-e2e.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/465-live-dashboard-telemetry-selector
          fetch-depth: 0
      - name: Patch production acceptance
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("e2e/live.production.e2e.ts")
          text = path.read_text()
          old = '''    const catalogCard = page.locator("article").filter({ hasText: noSampleChannelId });
              await expect(catalogCard).toContainText("Якість: Невідомі");
              await expect(catalogCard).toContainText("Тривога: немає");
              await catalogCard.getByRole("button", { name: "Додати", exact: true }).click();
              await expect(page.getByText("1 / 64 вибрано", { exact: true })).toBeVisible();
              await expect(page.getByText(`${noSampleChannelId} додано.`, { exact: true })).toBeVisible();
          '''
          new = '''    const selectorSearch = page.getByRole("searchbox", { name: "Пошук" });
              await selectorSearch.fill(noSampleChannelId);
              const pointRow = page.getByRole("treeitem").filter({ hasText: noSampleChannelId });
              await expect(pointRow).toHaveCount(1);
              await expect(pointRow).toHaveAttribute("aria-checked", "false");

              // Draft selector changes are session-local until Confirm.
              await pointRow.click();
              await expect(pointRow).toHaveAttribute("aria-checked", "true");
              await page.getByRole("button", { name: "Скасувати", exact: true }).click();
              await expect(page.getByText("Непідтверджені зміни селектора скасовано.", { exact: true })).toBeVisible();
              await expect(page.getByTestId("telemetry-selection-count")).toContainText("0 / 64");

              await selectorSearch.fill(noSampleChannelId);
              await pointRow.click();
              await page.getByRole("button", { name: "Підтвердити вибір", exact: true }).click();
              await expect(
                page.getByText("Підтверджений вибір застосовано до чернетки Dashboard.", { exact: true }),
              ).toBeVisible();
              await expect(page.getByTestId("telemetry-selection-count")).toContainText("1 / 64");
              await expect(page.getByText("1 / 64 вибрано", { exact: true })).toBeVisible();

              for (const width of [360, 1440, 1920]) {
                await page.setViewportSize({ width, height: 900 });
                await expect
                  .poll(() =>
                    page.evaluate(
                      () => document.documentElement.scrollWidth <= document.documentElement.clientWidth,
                    ),
                  )
                  .toBe(true);
              }
          '''
          if old not in text:
              raise SystemExit("old Live Dashboard flat-picker acceptance block not found")
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Install dependencies
        run: npm ci
      - name: Format and lint production acceptance
        run: |
          npx prettier --write e2e/live.production.e2e.ts
          npx eslint e2e/live.production.e2e.ts
          npm run typecheck
      - name: Publish and self-delete
        shell: bash
        run: |
          rm .github/workflows/issue-465-live-e2e.yml
          git config user.name "nexolab-automation"
          git config user.email "actions@users.noreply.github.com"
          git add e2e/live.production.e2e.ts .github/workflows/issue-465-live-e2e.yml
          git diff --cached --check
          git commit -m "test: cover Live Dashboard telemetry selector (#465)"
          git push origin HEAD:feat/465-live-dashboard-telemetry-selector
