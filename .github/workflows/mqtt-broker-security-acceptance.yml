name: MQTT Broker Security Acceptance

on:
  push:
    branches: [main]
    paths:
      - "infrastructure/mqtt/dynamic-security/**"
      - "infrastructure/compose/compose.mqtt-security-acceptance.yaml"
      - "infrastructure/compose/compose.central-mqtt-security.yaml"
      - "infrastructure/compose/compose.edge-central-bridge.yaml"
      - "infrastructure/compose/compose.edge-central-security.yaml"
      - "services/telemetry-service/app/config.py"
      - "services/telemetry-service/app/mqtt_consumer.py"
      - "services/telemetry-service/tests/test_mqtt_credentials.py"
      - "scripts/run-mqtt-broker-security-acceptance.sh"
      - ".github/workflows/mqtt-broker-security-acceptance.yml"
  pull_request:
    branches: [main]
    paths:
      - "infrastructure/mqtt/dynamic-security/**"
      - "infrastructure/compose/compose.mqtt-security-acceptance.yaml"
      - "infrastructure/compose/compose.central-mqtt-security.yaml"
      - "infrastructure/compose/compose.edge-central-bridge.yaml"
      - "infrastructure/compose/compose.edge-central-security.yaml"
      - "services/telemetry-service/app/config.py"
      - "services/telemetry-service/app/mqtt_consumer.py"
      - "services/telemetry-service/tests/test_mqtt_credentials.py"
      - "scripts/run-mqtt-broker-security-acceptance.sh"
      - ".github/workflows/mqtt-broker-security-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mqtt-broker-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    name: Dynamic Security black-box gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate scripts and Compose contracts
        env:
          NEXOLAB_MQTT_ADMIN_USERNAME: validation-admin
          NEXOLAB_MQTT_SECURITY_SECRETS_DIR: /tmp/nexolab-mqtt-security-validation
          POSTGRES_PASSWORD: validation-postgres
          MINIO_ROOT_USER: validation-minio
          MINIO_ROOT_PASSWORD: validation-minio-password
          MQTT_ADMIN_USERNAME: validation-admin
          MQTT_SECURITY_SECRETS_DIR: /tmp/nexolab-mqtt-security-validation
          CENTRAL_MQTT_HOST: central.example.invalid
          NEXOLAB_ORGANIZATION_ID: 00000000-0000-0000-0000-000000000001
          NEXOLAB_NODE_ID: edge-01
          CENTRAL_BRIDGE_CLIENT_ID: nexolab-00000000-0000-0000-0000-000000000001-edge-01
          CENTRAL_MQTT_USERNAME: node:00000000-0000-0000-0000-000000000001:edge-01
          MQTT_NODE_SECRETS_DIR: /tmp/nexolab-mqtt-node-validation
        run: |
          bash -n infrastructure/mqtt/dynamic-security/entrypoint.sh
          bash -n infrastructure/mqtt/dynamic-security/dynsec-admin.sh
          bash -n scripts/run-mqtt-broker-security-acceptance.sh
          docker compose \
            -f infrastructure/compose/compose.mqtt-security-acceptance.yaml \
            config --quiet
          docker compose \
            -f infrastructure/compose/compose.central.yaml \
            -f infrastructure/compose/compose.central-mqtt-security.yaml \
            config --quiet
          docker compose \
            -f infrastructure/compose/compose.edge.yaml \
            -f infrastructure/compose/compose.edge-central-bridge.yaml \
            -f infrastructure/compose/compose.edge-central-security.yaml \
            config --quiet

      - name: Run broker authentication and ACL acceptance
        run: |
          set -o pipefail
          bash scripts/run-mqtt-broker-security-acceptance.sh \
            2>&1 | tee /tmp/mqtt-broker-security-acceptance.log

      - name: Collect acceptance diagnostics
        if: always()
        run: |
          mkdir -p test-results-mqtt-security
          if [[ -f /tmp/mqtt-broker-security-acceptance.log ]]; then
            cp /tmp/mqtt-broker-security-acceptance.log \
              test-results-mqtt-security/acceptance.log
          fi

      - name: Upload security evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mqtt-broker-security-evidence
          path: test-results-mqtt-security
          if-no-files-found: warn
          retention-days: 14

  multiarch-image:
    name: Dynamic Security image amd64 + arm64
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build both production architectures
        uses: docker/build-push-action@v7
        with:
          context: infrastructure/mqtt/dynamic-security
          platforms: linux/amd64,linux/arm64
          push: false
          outputs: type=cacheonly
