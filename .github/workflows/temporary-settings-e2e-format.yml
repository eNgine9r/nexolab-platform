name: Temporary Settings E2E Format

on:
  pull_request:

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.ref == 'feat/269-operator-safe-settings'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feat/269-operator-safe-settings

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install dependencies
        env:
          HUSKY: 0
        run: npm install --no-audit --no-fund

      - name: Format Settings acceptance and remove workflow
        run: |
          npx prettier --write e2e/settings.production.e2e.ts
          rm .github/workflows/temporary-settings-e2e-format.yml

      - name: Commit focused formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/settings.production.e2e.ts .github/workflows/temporary-settings-e2e-format.yml
          git commit -m "style(settings): format browser acceptance"
          git push origin HEAD:feat/269-operator-safe-settings
