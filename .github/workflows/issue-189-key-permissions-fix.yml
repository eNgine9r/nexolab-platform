name: Issue 189 Runtime Key Permissions Fix

on:
  push:
    branches:
      - feat/189-recovery-acceptance
    paths:
      - ".github/workflows/issue-189-key-permissions-fix.yml"
      - "scripts/issue-189-key-permissions-fix.py"

permissions:
  contents: write

concurrency:
  group: issue-189-key-permissions-fix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/189-recovery-acceptance
          fetch-depth: 0

      - name: Apply deterministic runtime key correction
        run: python scripts/issue-189-key-permissions-fix.py

      - name: Validate correction
        run: |
          bash -n scripts/run-disaster-recovery-acceptance.sh
          DR_POSTGRES_PASSWORD=validation \
          DR_MINIO_ROOT_USER=validation \
          DR_MINIO_ROOT_PASSWORD=validation \
          DR_MQTT_ADMIN_USERNAME=validation \
          DR_SECRETS_DIR=/tmp/nexolab-dr-secrets \
          DR_SOURCE_LOCAL_AUTH_DIR=/tmp/nexolab-dr-source-local-auth \
          DR_RESTORE_LOCAL_AUTH_DIR=/tmp/nexolab-dr-restore-local-auth \
          DR_WORK_DIR=/tmp/nexolab-dr-work \
            docker compose \
              -f infrastructure/compose/compose.disaster-recovery.yaml \
              -f infrastructure/compose/compose.disaster-recovery-local-auth.yaml \
              config --quiet
          grep -Fq 'chmod 0400 /run/local-auth/private.pem' scripts/run-disaster-recovery-acceptance.sh

      - name: Commit runtime key correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            infrastructure/compose/compose.disaster-recovery-local-auth.yaml \
            scripts/run-disaster-recovery-acceptance.sh
          git commit -m "fix(recovery): prepare non-root auth key copies"
          git push origin HEAD:feat/189-recovery-acceptance
