name: PR 174 restore label fix

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/pr174-restore-label-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.number == 174
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Preserve restore accessible-name contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/components/refrigeration/refrigeration-layout-workspace.tsx")
          text = path.read_text(encoding="utf-8")
          old = '                aria-label={`Відновити ревізію r${revision.revision}`}\n'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"expected one restore aria-label, found {count}")
          path.write_text(text.replace(old, "", 1), encoding="utf-8")
          PY
          git diff --check

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/refrigeration/refrigeration-layout-workspace.tsx
          git commit -m "test: preserve restore button accessible name"
          git push origin HEAD:${{ github.head_ref }}
