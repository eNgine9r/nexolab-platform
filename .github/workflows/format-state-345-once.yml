name: Format dependency lane state once

on:
  push:
    branches:
      - docs/345-reconcile-dependency-lanes
    paths:
      - .github/workflows/format-state-345-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: docs/345-reconcile-dependency-lanes
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          package-manager-cache: false
          node-version-file: .nvmrc
      - env:
          HUSKY: 0
        run: npm install --no-audit
      - shell: bash
        run: |
          set -euo pipefail
          npx prettier --write \
            .project/CURRENT_STATE.md \
            .project/ACTIVE_SPRINT.json \
            .project/BLOCKERS.md \
            .project/LAST_CHECKPOINT.json
          rm .github/workflows/format-state-345-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .project .github/workflows/format-state-345-once.yml
          git commit -m "style(state): format dependency lane checkpoint"
          git push origin HEAD:docs/345-reconcile-dependency-lanes
