name: Central Tailscale Contract

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/central-tailscale-contract.yml"
      - ".dockerignore"
      - "Dockerfile.dashboard"
      - "docs/operations/central-tailscale-tls-acceptance.md"
      - "e2e/refrigeration-layout.remote.e2e.ts"
      - "infrastructure/compose/.env.central.example"
      - "infrastructure/compose/.env.remote-acceptance.example"
      - "infrastructure/compose/collect-remote-acceptance-evidence.sh"
      - "infrastructure/compose/compose.central-dashboard.yaml"
      - "infrastructure/compose/compose.central.yaml"
      - "infrastructure/compose/tailscale-serve-central.sh"
      - "next.config.ts"
      - "package.json"
      - "playwright.remote.config.ts"
      - "scripts/run-refrigeration-remote-acceptance.sh"
      - "services/telemetry-service/app/operator_api.py"
      - "services/telemetry-service/app/operator_identity.py"
      - "services/telemetry-service/app/refrigeration/api.py"
      - "services/telemetry-service/tests/test_operator_api.py"
      - "services/telemetry-service/tests/test_operator_identity.py"
      - "services/telemetry-service/tests/test_refrigeration_tailscale_identity.py"
      - "src/components/operator/operator-session-banner.tsx"
      - "src/data/refrigeration.ts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Tailscale TLS deployment contract
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Validate shell syntax
        run: |
          bash -n infrastructure/compose/tailscale-serve-central.sh
          bash -n infrastructure/compose/collect-remote-acceptance-evidence.sh
          bash -n scripts/run-refrigeration-remote-acceptance.sh

      - name: Validate production Compose model
        env:
          CENTRAL_BIND_ADDRESS: 127.0.0.1
          CENTRAL_DASHBOARD_PORT: "3000"
          CENTRAL_API_PORT: "8082"
          CENTRAL_MQTT_PORT: "1884"
          CENTRAL_OBJECT_STORAGE_PORT: "9000"
          CENTRAL_OBJECT_STORAGE_CONSOLE_PORT: "9001"
          POSTGRES_DB: nexolab
          POSTGRES_USER: nexolab
          POSTGRES_PASSWORD: contract-postgres-password
          MINIO_ROOT_USER: nexolab-storage
          MINIO_ROOT_PASSWORD: contract-minio-password
          OBJECT_STORAGE_BUCKET: nexolab-equipment-images
          OBJECT_STORAGE_PUBLIC_ENDPOINT_URL: https://nexolab-central.example.ts.net:9443
          CORS_ALLOWED_ORIGINS: https://nexolab-central.example.ts.net
          OPERATOR_IDENTITY_MODE: tailscale_serve
          NEXT_PUBLIC_NEXOLAB_API_BASE_URL: https://nexolab-central.example.ts.net:8443
          NEXT_PUBLIC_NEXOLAB_WEBSOCKET_URL: wss://nexolab-central.example.ts.net:8443/api/v1/telemetry/live
          NEXT_PUBLIC_NEXOLAB_ACCEPTANCE_EQUIPMENT_ENABLED: "true"
        run: |
          docker compose \
            -f infrastructure/compose/compose.central.yaml \
            -f infrastructure/compose/compose.central-dashboard.yaml \
            config --quiet
          docker compose \
            -f infrastructure/compose/compose.central.yaml \
            -f infrastructure/compose/compose.central-dashboard.yaml \
            config > /tmp/central-resolved.yaml
          if grep -Eq 'published:.*5432|target: 5432' /tmp/central-resolved.yaml; then
            echo "PostgreSQL must not be published to the host" >&2
            exit 1
          fi

      - name: Build standalone dashboard image
        run: |
          docker build \
            --file Dockerfile.dashboard \
            --build-arg NEXT_PUBLIC_NEXOLAB_DATA_MODE=live \
            --build-arg NEXT_PUBLIC_NEXOLAB_API_BASE_URL=https://nexolab-central.example.ts.net:8443 \
            --build-arg NEXT_PUBLIC_NEXOLAB_WEBSOCKET_URL=wss://nexolab-central.example.ts.net:8443/api/v1/telemetry/live \
            --build-arg NEXT_PUBLIC_NEXOLAB_ACCEPTANCE_EQUIPMENT_ENABLED=true \
            --tag nexolab-dashboard:tailscale-contract \
            .
