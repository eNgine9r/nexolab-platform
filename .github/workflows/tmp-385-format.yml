name: Temporary Issue 385 formatter

on:
  push:
    branches:
      - feat/385-local-user-permissions

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/385-local-user-permissions
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          check-latest: false
          package-manager-cache: false
      - run: npm install --no-audit
        env:
          HUSKY: "0"
      - name: Format Issue 385 frontend files
        run: |
          npx prettier --write \
            src/components/settings/users-screen.tsx \
            src/features/security/local-user-admin.ts \
            src/features/security/security-session.ts
      - name: Commit formatting only
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/components/settings/users-screen.tsx \
            src/features/security/local-user-admin.ts \
            src/features/security/security-session.ts
          git commit -m "style: format Issue 385 frontend files"
          git push origin HEAD:feat/385-local-user-permissions
