name: Reports Service Hardening

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/reports-service-hardening.yml"
      - "services/telemetry-service/app/reports/service.py"

permissions:
  contents: write

concurrency:
  group: reports-service-hardening-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harden:
    name: Normalize persisted report timestamps
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Patch persisted timestamp normalization
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("services/telemetry-service/app/reports/service.py")
          content = path.read_text()

          replacements = {
              "generated_at = _aware_utc(self._clock())":
                  "generated_at = _strict_utc(self._clock())",
              "source_bytes = canonical_json_bytes(source)":
                  "source = _normalize_persisted_datetimes(source)\n                source_bytes = canonical_json_bytes(source)",
              "source_started_at=_aware_utc(test_session.started_at)":
                  "source_started_at=_persisted_utc(test_session.started_at)",
              "source_ended_at=_aware_utc(test_session.completed_at)":
                  "source_ended_at=_persisted_utc(test_session.completed_at)",
              "occurred_at=transition.occurred_at,":
                  "occurred_at=_persisted_utc(transition.occurred_at),",
          }
          for old, new in replacements.items():
              if old in content:
                  content = content.replace(old, new)
              elif new not in content:
                  raise SystemExit(f"missing report service marker: {old}")

          rows_pattern = re.compile(
              r"        return \[\n"
              r"            TelemetryEvidenceRow\(\*\*dict\(row\)\)\n"
              r"            for row in database_session\.execute\(statement\)\.mappings\(\)\n"
              r"        \]"
          )
          new_rows = '''        return [
              TelemetryEvidenceRow(
                  event_id=str(row["event_id"]),
                  captured_at=_persisted_utc(row["captured_at"]),
                  node_id=str(row["node_id"]),
                  equipment_id=str(row["equipment_id"]),
                  channel_id=str(row["channel_id"]),
                  metric=str(row["metric"]),
                  value=row["value"],
                  unit=str(row["unit"]),
                  quality=str(row["quality"]),
                  alarm=(str(row["alarm"]) if row["alarm"] is not None else None),
                  source=str(row["source"]),
                  session_id=str(row["session_id"]),
                  stage_id=(
                      str(row["stage_id"]) if row["stage_id"] is not None else None
                  ),
                  binding_id=str(row["binding_id"]),
                  config_snapshot_id=str(row["config_snapshot_id"]),
              )
              for row in database_session.execute(statement).mappings()
          ]'''
          content, row_count = rows_pattern.subn(new_rows, content, count=1)
          if row_count == 0 and new_rows not in content:
              raise SystemExit("missing telemetry evidence row marker")

          helper_pattern = re.compile(
              r"def _aware_utc\(value: datetime\) -> datetime:\n"
              r"    if value\.tzinfo is None or value\.utcoffset\(\) is None:\n"
              r"        raise ValueError\(\"datetime values must be timezone-aware\"\)\n"
              r"    return value\.astimezone\(UTC\)\n?\Z"
          )
          new_helper = '''def _strict_utc(value: datetime) -> datetime:
              if value.tzinfo is None or value.utcoffset() is None:
                  raise ValueError("datetime values must be timezone-aware")
              return value.astimezone(UTC)


          def _persisted_utc(value: datetime) -> datetime:
              if value.tzinfo is None or value.utcoffset() is None:
                  return value.replace(tzinfo=UTC)
              return value.astimezone(UTC)


          def _normalize_persisted_datetimes(value: Any) -> Any:
              if isinstance(value, datetime):
                  return _persisted_utc(value)
              if isinstance(value, dict):
                  return {
                      key: _normalize_persisted_datetimes(item)
                      for key, item in value.items()
                  }
              if isinstance(value, list):
                  return [_normalize_persisted_datetimes(item) for item in value]
              if isinstance(value, tuple):
                  return tuple(_normalize_persisted_datetimes(item) for item in value)
              return value
          '''
          content, helper_count = helper_pattern.subn(new_helper, content, count=1)
          if helper_count == 0 and "def _persisted_utc" not in content:
              raise SystemExit("missing UTC helper marker")

          old_scope = ".where(AlertInstance.session_id == test_session.id)"
          new_scope = '''.where(
                      AlertInstance.session_id == test_session.id,
                      AlertInstance.organization_id == test_session.organization_id,
                  )'''
          if old_scope in content:
              if content.count(old_scope) != 2:
                  raise SystemExit("unexpected alert source scope count")
              content = content.replace(old_scope, new_scope)
          elif content.count(new_scope) != 2:
              raise SystemExit("missing organization-scoped alert source marker")

          path.write_text(content)
          PY

      - name: Validate Python syntax
        run: python3 -m py_compile services/telemetry-service/app/reports/service.py

      - name: Commit verified hardening
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "nexolab-ci"
          git config user.email "nexolab-ci@users.noreply.github.com"
          git add services/telemetry-service/app/reports/service.py
          git commit -m "fix(reports): normalize persisted UTC timestamps"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
