name: Temporary Energy History Format Artifact

on:
  push:
    branches:
      - feat/261-energy-monitoring-page
    paths:
      - .github/workflows/temporary-energy-history-format-artifact.yml

permissions:
  contents: read

jobs:
  format-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/261-energy-monitoring-page
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install dependencies
        env:
          HUSKY: 0
        run: npm install --no-audit --no-fund
      - name: Format exact file
        run: npx prettier --write src/features/energy/energy-history.ts
      - name: Upload exact formatted source
        uses: actions/upload-artifact@v7
        with:
          name: energy-history-formatted
          path: src/features/energy/energy-history.ts
          if-no-files-found: error
          retention-days: 1
