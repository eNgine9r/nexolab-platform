name: Temporary Equipment Registry E2E Formatter

on:
  push:
    branches:
      - feat/267-equipment-metrology-registry
    paths:
      - "e2e/equipment-registry.production.e2e.ts"
      - ".github/workflows/temporary-equipment-registry-e2e-formatter.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feat/267-equipment-metrology-registry
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Format focused E2E and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npx prettier --write e2e/equipment-registry.production.e2e.ts
          rm .github/workflows/temporary-equipment-registry-e2e-formatter.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            e2e/equipment-registry.production.e2e.ts \
            .github/workflows/temporary-equipment-registry-e2e-formatter.yml
          git commit -m "style(equipment): format registry browser acceptance"
          git push origin HEAD:feat/267-equipment-metrology-registry
