name: Temporary Issue 316 Formatter

on:
  push:
    branches:
      - fix/316-complete-telemetry-acceptance
    paths:
      - e2e/telemetry-navigation.production.e2e.ts
      - src/lib/telemetry/live-adapter.ts
      - src/lib/telemetry/request-coordinator.ts
      - src/lib/telemetry/route-persistent-client.test.ts
      - src/lib/telemetry/route-persistent-client.ts
      - .github/workflows/temp-316-format.yml

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Format Issue 316 source
        run: >-
          npx prettier --write
          e2e/telemetry-navigation.production.e2e.ts
          src/lib/telemetry/live-adapter.ts
          src/lib/telemetry/request-coordinator.ts
          src/lib/telemetry/route-persistent-client.test.ts
          src/lib/telemetry/route-persistent-client.ts

      - name: Upload formatted source
        uses: actions/upload-artifact@v4
        with:
          name: issue-316-formatted-source-${{ github.sha }}
          path: |
            e2e/telemetry-navigation.production.e2e.ts
            src/lib/telemetry/live-adapter.ts
            src/lib/telemetry/request-coordinator.ts
            src/lib/telemetry/route-persistent-client.test.ts
            src/lib/telemetry/route-persistent-client.ts
          if-no-files-found: error
          retention-days: 1
