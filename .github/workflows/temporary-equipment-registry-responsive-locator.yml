name: Temporary Equipment Registry Responsive Locator

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/temporary-equipment-registry-responsive-locator.yml"

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'feat/267-equipment-metrology-registry'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feat/267-equipment-metrology-registry
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Scope responsive identifier assertion and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("e2e/equipment-registry.production.e2e.ts")
          text = path.read_text()
          old = '        await expect(page.getByText(identifier, { exact: true })).toBeVisible();'
          new = '        await expect(page.getByText(identifier, { exact: true }).first()).toBeVisible();'
          if text.count(old) != 1:
              raise SystemExit(f"responsive identifier assertion matches={text.count(old)}")
          path.write_text(text.replace(old, new, 1))
          PY
          npm ci --ignore-scripts
          npx prettier --write e2e/equipment-registry.production.e2e.ts
          rm .github/workflows/temporary-equipment-registry-responsive-locator.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            e2e/equipment-registry.production.e2e.ts \
            .github/workflows/temporary-equipment-registry-responsive-locator.yml
          git commit -m "test(equipment): scope responsive asset locator"
          git push origin HEAD:feat/267-equipment-metrology-registry
