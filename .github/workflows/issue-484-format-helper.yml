name: Issue 484 Format Helper

on:
  push:
    branches:
      - fix/484-energy-history-warm-route-cache

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: fix/484-energy-history-warm-route-cache
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install dependencies
        env:
          HUSKY: "0"
        run: npm install --no-audit

      - name: Format Issue 484 files
        run: |
          npx prettier --write \
            src/hooks/use-energy-telemetry.ts \
            src/hooks/use-energy-telemetry.test.ts

      - name: Commit exact formatter output
        run: |
          if git diff --quiet -- \
            src/hooks/use-energy-telemetry.ts \
            src/hooks/use-energy-telemetry.test.ts; then
            echo "Formatting already clean."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/hooks/use-energy-telemetry.ts \
            src/hooks/use-energy-telemetry.test.ts
          git commit -m "style: apply exact Prettier output"
          git push origin HEAD:fix/484-energy-history-warm-route-cache
