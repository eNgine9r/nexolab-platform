name: Device Agent pyasn1 diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - "services/device-agent/**"
      - ".github/workflows/device-agent-pyasn1-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: device-agent-pyasn1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  inspect-runtime-image:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'fix/208-device-agent-pyasn1-cve'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Build Device Agent image
        run: docker build --progress=plain -t nexolab-device-agent:pyasn1-diagnostic services/device-agent

      - name: Inspect Python import boundary
        run: |
          set -euo pipefail
          docker run --rm nexolab-device-agent:pyasn1-diagnostic \
            -c 'import sys; print("sys_path=" + repr(sys.path)); import importlib.util; print("pyasn1_spec=" + repr(importlib.util.find_spec("pyasn1")))'
          if docker run --rm nexolab-device-agent:pyasn1-diagnostic \
            -c 'import importlib.metadata; print(importlib.metadata.version("pyasn1"))'; then
            echo "pyasn1 is visible to Python package metadata"
          else
            echo "pyasn1 is not visible to the Device Agent Python runtime"
          fi

      - name: Enumerate root filesystem package evidence
        run: |
          set -euo pipefail
          container_id="$(docker create nexolab-device-agent:pyasn1-diagnostic)"
          trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT
          docker export "$container_id" -o /tmp/device-agent-rootfs.tar
          python - <<'PY'
          from __future__ import annotations

          import re
          import tarfile
          import zipfile
          from io import BytesIO

          archive_path = "/tmp/device-agent-rootfs.tar"
          with tarfile.open(archive_path, "r") as archive:
              names = archive.getnames()
              candidates = [name for name in names if "pyasn1" in name.lower()]
              print("=== PYASN1 PATHS ===")
              for name in sorted(candidates)[:500]:
                  print(name)
              if not candidates:
                  print("<none>")

              print("=== DPKG STATUS STANZAS ===")
              found_stanza = False
              for name in names:
                  normalized = name.rstrip("/")
                  if not (
                      normalized in {"var/lib/dpkg/status", "var/lib/dpkg/status-old"}
                      or normalized.startswith("var/lib/dpkg/status.d/")
                  ):
                      continue
                  extracted = archive.extractfile(archive.getmember(name))
                  if extracted is None:
                      continue
                  text = extracted.read().decode("utf-8", errors="replace")
                  for stanza in re.split(r"\n\s*\n", text):
                      if "pyasn1" in stanza.lower():
                          found_stanza = True
                          print(f"--- {name} ---")
                          print(stanza.strip())
              if not found_stanza:
                  print("<none>")

              print("=== NESTED ARCHIVE MATCHES ===")
              nested_found = False
              for name in names:
                  if not name.lower().endswith((".zip", ".whl", ".egg")):
                      continue
                  extracted = archive.extractfile(archive.getmember(name))
                  if extracted is None:
                      continue
                  payload = extracted.read()
                  try:
                      with zipfile.ZipFile(BytesIO(payload)) as nested:
                          matches = [
                              member
                              for member in nested.namelist()
                              if "pyasn1" in member.lower()
                          ]
                  except zipfile.BadZipFile:
                      continue
                  if matches:
                      nested_found = True
                      print(f"--- {name} ---")
                      for match in matches[:200]:
                          print(match)
              if not nested_found:
                  print("<none>")
          PY

      - name: Generate exact Trivy JSON
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: image
          image-ref: nexolab-device-agent:pyasn1-diagnostic
          format: json
          output: /tmp/device-agent.trivy.json
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "0"

      - name: Print Trivy pyasn1 evidence
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          report = json.loads(
              Path("/tmp/device-agent.trivy.json").read_text(encoding="utf-8")
          )
          matches = []
          for result in report.get("Results") or []:
              for vulnerability in result.get("Vulnerabilities") or []:
                  if "pyasn1" not in str(vulnerability.get("PkgName", "")).lower():
                      continue
                  matches.append(
                      {
                          "Target": result.get("Target"),
                          "Class": result.get("Class"),
                          "Type": result.get("Type"),
                          "PkgName": vulnerability.get("PkgName"),
                          "PkgPath": vulnerability.get("PkgPath"),
                          "InstalledVersion": vulnerability.get("InstalledVersion"),
                          "FixedVersion": vulnerability.get("FixedVersion"),
                          "VulnerabilityID": vulnerability.get("VulnerabilityID"),
                          "Severity": vulnerability.get("Severity"),
                          "Layer": vulnerability.get("Layer"),
                          "DataSource": vulnerability.get("DataSource"),
                      }
                  )
          print(json.dumps(matches, indent=2, sort_keys=True))
          if not matches:
              print("Trivy reported no pyasn1 vulnerability for this exact image.")
          PY

      - name: Inspect image ancestry
        run: |
          docker image inspect nexolab-device-agent:pyasn1-diagnostic \
            --format '{{json .Config.Env}}'
          docker history --no-trunc nexolab-device-agent:pyasn1-diagnostic
