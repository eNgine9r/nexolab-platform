name: Device Agent pyasn1 diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - "services/device-agent/**"
      - ".github/workflows/device-agent-pyasn1-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CACHED_IMAGE: local/nexolab-device-agent:cached-diagnostic
  PULLED_IMAGE: local/nexolab-device-agent:pulled-diagnostic

concurrency:
  group: device-agent-pyasn1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compare-build-provenance:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'fix/208-device-agent-pyasn1-cve'
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Reproduce current supply-chain cached build
        uses: docker/build-push-action@v6
        with:
          context: services/device-agent
          file: services/device-agent/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.CACHED_IMAGE }}
          cache-from: type=gha,scope=supply-chain-device-agent

      - name: Build with fresh base resolution
        uses: docker/build-push-action@v6
        with:
          context: services/device-agent
          file: services/device-agent/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          pull: true
          tags: ${{ env.PULLED_IMAGE }}
          cache-from: type=gha,scope=supply-chain-device-agent

      - name: Compare image digests and Python boundary
        run: |
          set -euo pipefail
          for image in "$CACHED_IMAGE" "$PULLED_IMAGE"; do
            echo "=== $image ==="
            docker image inspect "$image" --format 'id={{.Id}} created={{.Created}}'
            docker run --rm "$image" \
              -c 'import importlib.util,sys; print("pyasn1_spec=" + repr(importlib.util.find_spec("pyasn1"))); print("sys_path=" + repr(sys.path))'
          done

      - name: Scan cached build with exact Trivy action
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: image
          image-ref: ${{ env.CACHED_IMAGE }}
          format: json
          output: /tmp/cached.trivy.json
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "0"

      - name: Scan pulled build with exact Trivy action
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: image
          image-ref: ${{ env.PULLED_IMAGE }}
          format: json
          output: /tmp/pulled.trivy.json
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "0"

      - name: Compare Trivy pyasn1 evidence
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          def matches(path: str) -> list[dict[str, object]]:
              report = json.loads(Path(path).read_text(encoding="utf-8"))
              found = []
              for result in report.get("Results") or []:
                  for vulnerability in result.get("Vulnerabilities") or []:
                      if "pyasn1" not in str(vulnerability.get("PkgName", "")).lower():
                          continue
                      found.append(
                          {
                              "Target": result.get("Target"),
                              "Class": result.get("Class"),
                              "Type": result.get("Type"),
                              "PkgName": vulnerability.get("PkgName"),
                              "PkgPath": vulnerability.get("PkgPath"),
                              "InstalledVersion": vulnerability.get("InstalledVersion"),
                              "FixedVersion": vulnerability.get("FixedVersion"),
                              "VulnerabilityID": vulnerability.get("VulnerabilityID"),
                              "Severity": vulnerability.get("Severity"),
                              "Layer": vulnerability.get("Layer"),
                          }
                      )
              return found

          cached = matches("/tmp/cached.trivy.json")
          pulled = matches("/tmp/pulled.trivy.json")
          print("=== CACHED BUILD ===")
          print(json.dumps(cached, indent=2, sort_keys=True))
          print("=== PULLED BUILD ===")
          print(json.dumps(pulled, indent=2, sort_keys=True))
          PY

      - name: Export cached rootfs when findings differ
        run: |
          set -euo pipefail
          for variant in cached pulled; do
            image_var="${variant^^}_IMAGE"
            image="${!image_var}"
            container_id="$(docker create "$image")"
            docker export "$container_id" -o "/tmp/$variant-rootfs.tar"
            docker rm -f "$container_id" >/dev/null
            echo "=== $variant pyasn1 paths ==="
            tar -tf "/tmp/$variant-rootfs.tar" | grep -i pyasn1 || true
          done
