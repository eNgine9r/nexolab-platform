name: Temporary Format Equipment Layouts Shared Total

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/temporary-format-equipment-layouts-shared-total.yml"

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'feat/267-equipment-metrology-registry'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feat/267-equipment-metrology-registry
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Format shared-total acceptance and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npx prettier --write e2e/equipment-layouts.production.e2e.ts
          rm .github/workflows/temporary-format-equipment-layouts-shared-total.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            e2e/equipment-layouts.production.e2e.ts \
            .github/workflows/temporary-format-equipment-layouts-shared-total.yml
          git commit -m "test(layouts): format shared equipment total"
          git push origin HEAD:feat/267-equipment-metrology-registry
