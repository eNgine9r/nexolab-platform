name: Temporary Issue 252 Lockfile and Acceptance

on:
  push:
    branches:
      - maint/252-lint-staged-17
    paths:
      - .github/workflows/tmp-252-lint-staged.yml
      - package.json
      - scripts/tests/lint-staged-v17.mjs
      - docs/maintenance/lint-staged-17-migration.md

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: maint/252-lint-staged-17
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          package-manager-cache: false
          node-version-file: .nvmrc
      - name: Verify exact Node baseline
        run: |
          set -euo pipefail
          expected="v$(tr -d '[:space:]' < .nvmrc)"
          actual="$(node --version)"
          test "$actual" = "$expected"
          printf 'Verified Node baseline: %s\n' "$actual"
          git --version
      - name: Install lint-staged 17 and regenerate lockfile
        run: npm install --no-audit
        env:
          HUSKY: "0"
      - name: Verify resolved dependency
        run: |
          set -euo pipefail
          npm ls lint-staged --depth=0
          node -e 'const p=require("./node_modules/lint-staged/package.json"); if(p.version!=="17.3.0") process.exit(1)'
      - name: Format permanent migration files
        run: >-
          npx prettier --write
          package.json
          scripts/tests/lint-staged-v17.mjs
          docs/maintenance/lint-staged-17-migration.md
      - name: Run focused lint-staged acceptance
        run: node scripts/tests/lint-staged-v17.mjs | tee /tmp/lint-staged-v17-evidence.json
      - name: Run repository quality gates
        run: |
          set -euo pipefail
          npm run format:check
          npm run lint
          npm run typecheck
          npm test
          npm run build
      - name: Audit generated diff
        run: |
          set -euo pipefail
          while IFS= read -r path; do
            case "$path" in
              package.json|package-lock.json|scripts/tests/lint-staged-v17.mjs|docs/maintenance/lint-staged-17-migration.md)
                ;;
              *)
                printf 'Unexpected generated file: %s\n' "$path" >&2
                exit 1
                ;;
            esac
          done < <(git diff --name-only)
      - uses: actions/upload-artifact@v7
        with:
          name: issue-252-lint-staged-17-files
          path: |
            package.json
            package-lock.json
            scripts/tests/lint-staged-v17.mjs
            docs/maintenance/lint-staged-17-migration.md
            /tmp/lint-staged-v17-evidence.json
          if-no-files-found: error
          retention-days: 1
      - name: Commit verified permanent files and remove temporary workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json scripts/tests/lint-staged-v17.mjs docs/maintenance/lint-staged-17-migration.md
          git rm .github/workflows/tmp-252-lint-staged.yml
          git commit -m "chore(lint-staged): migrate pre-commit checks to 17.3.0"
          git push origin HEAD:maint/252-lint-staged-17
