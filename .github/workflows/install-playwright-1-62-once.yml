name: Install Playwright 1.62 once

on:
  push:
    branches:
      - maint/254-playwright-1-62
    paths:
      - .github/workflows/install-playwright-1-62-once.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v6
        with:
          ref: maint/254-playwright-1-62
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          package-manager-cache: false
          node-version-file: .nvmrc

      - name: Verify exact baseline
        shell: bash
        run: |
          set -euo pipefail
          expected="v$(tr -d '[:space:]' < .nvmrc)"
          test "$(node --version)" = "$expected"
          test "$(node -p 'require("./package.json").devDependencies["@playwright/test"]')" = "1.55.0"
          cp package-lock.json /tmp/package-lock.before.json
          printf 'Node: %s\n' "$(node --version)"
          printf 'npm: %s\n' "$(npm --version)"

      - name: Install current dependency graph
        env:
          HUSKY: 0
        run: npm install --no-audit

      - name: Capture Playwright 1.55 discovery contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/validate-playwright-migration.py
          python3 scripts/validate-playwright-migration.py \
            --expected-version 1.55.0 \
            --output /tmp/playwright-before.json

      - name: Install exact Playwright 1.62 closure
        env:
          HUSKY: 0
        run: npm install --save-dev --save-exact @playwright/test@1.62.0 --no-audit

      - name: Compare Playwright discovery contract
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate-playwright-migration.py \
            --expected-version 1.62.0 \
            --output /tmp/playwright-after.json \
            --compare /tmp/playwright-before.json

      - name: Install and inventory Chromium
        shell: bash
        run: |
          set -euo pipefail
          npx playwright install --with-deps chromium
          npx playwright --version | tee /tmp/playwright-version.txt
          npx playwright install --list | tee /tmp/playwright-browsers.txt

      - name: Write migration evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          before_lock = json.loads(Path('/tmp/package-lock.before.json').read_text(encoding='utf-8'))
          after_lock = json.loads(Path('package-lock.json').read_text(encoding='utf-8'))
          before_contract = json.loads(Path('/tmp/playwright-before.json').read_text(encoding='utf-8'))
          after_contract = json.loads(Path('/tmp/playwright-after.json').read_text(encoding='utf-8'))
          playwright_package = json.loads(Path('node_modules/@playwright/test/package.json').read_text(encoding='utf-8'))
          browser_inventory = Path('/tmp/playwright-browsers.txt').read_text(encoding='utf-8').strip()

          def versions(lock: dict[str, object]) -> dict[str, str]:
              packages = lock.get('packages', {})
              assert isinstance(packages, dict)
              result: dict[str, str] = {}
              for path, metadata in packages.items():
                  if not isinstance(path, str) or not path.startswith('node_modules/'):
                      continue
                  if not isinstance(metadata, dict):
                      continue
                  version = metadata.get('version')
                  if isinstance(version, str):
                      result[path.removeprefix('node_modules/')] = version
              return result

          old_versions = versions(before_lock)
          new_versions = versions(after_lock)
          changes: list[tuple[str, str, str]] = []
          for name in sorted(set(old_versions) | set(new_versions)):
              old = old_versions.get(name, 'absent')
              new = new_versions.get(name, 'absent')
              if old != new:
                  changes.append((name, old, new))

          config_rows = []
          for before_item, after_item in zip(before_contract['configs'], after_contract['configs'], strict=True):
              assert before_item['config'] == after_item['config']
              assert before_item['tests'] == after_item['tests']
              config_rows.append(
                  (
                      before_item['config'],
                      before_item['test_count'],
                      before_item['file_count'],
                      before_item['sha256'] == after_item['sha256'],
                  )
              )

          lines = [
              '# Playwright 1.62 migration evidence',
              '',
              '## Scope',
              '',
              'Issue #254 updates only the direct `@playwright/test` development dependency and its deterministic npm lockfile closure. Product behavior, browser selectors, runtime dependencies, Node, jsdom, TypeScript, React and production code are unchanged.',
              '',
              '## Runtime compatibility',
              '',
              f'- Repository Node baseline: `{Path(".nvmrc").read_text(encoding="utf-8").strip()}`.',
              f'- Installed Playwright: `{playwright_package["version"]}`.',
              f'- Playwright package engine requirement: `{json.dumps(playwright_package.get("engines", {}), sort_keys=True)}`.',
              '- Installation, config loading and test discovery ran on the exact repository Node baseline.',
              '',
              '## Official compatibility review',
              '',
              '- Playwright 1.57 changed the bundled Chromium distribution to Chrome for Testing.',
              '- Playwright 1.58 removed `_react`, `_vue`, `:light` selectors and `browserType.launch({ devtools })`.',
              '- The deterministic validator scans all Playwright configs and E2E TypeScript files for those removed APIs.',
              '- No removed API was found, so no selector or product-test rewrite was required.',
              '',
              '## Config and discovery preservation',
              '',
              f'- Configs compared: `{after_contract["config_count"]}`.',
              f'- Discovered tests compared: `{after_contract["total_discovered_tests"]}`.',
              '- Every config file hash, test title, test count and test-file count is identical before and after migration.',
              '',
              '| Config | Tests | Files | Config unchanged |',
              '| --- | ---: | ---: | :---: |',
          ]
          lines.extend(
              f'| `{config}` | {test_count} | {file_count} | {"yes" if unchanged else "no"} |'
              for config, test_count, file_count, unchanged in config_rows
          )
          lines.extend([
              '',
              '## Deterministic lockfile changes',
              '',
              '| Package | Before | After |',
              '| --- | --- | --- |',
          ])
          lines.extend(f'| `{name}` | `{old}` | `{new}` |' for name, old, new in changes)
          lines.extend([
              '',
              '## Browser installation evidence',
              '',
              'The exact branch installed Chromium with `npx playwright install --with-deps chromium`.',
              '',
              '```text',
              browser_inventory,
              '```',
              '',
              'Existing configs continue to retain screenshots, traces, videos, HTML reporters, result directories, timeouts and single-worker behavior because no config file changed.',
              '',
              '## Runtime and offline impact',
              '',
              '`@playwright/test` remains development-only. Browser binaries are CI/development artifacts and are not part of NEXOLAB production containers or the offline runtime bundle. No mandatory network request, CDN, telemetry service or production external API was added.',
              '',
              '## Rollback',
              '',
              'Revert the focused Issue #254 squash merge, or restore the previous `package.json` and `package-lock.json`, run `npm install --no-audit`, remove cached Playwright browsers with `npx playwright uninstall --all`, reinstall the prior Chromium revision with `npx playwright install --with-deps chromium`, then rerun CI, every browser acceptance workflow and Offline Bundle. No database, persistent-volume, Raspberry Pi or hardware rollback is involved.',
              '',
          ])
          Path('docs/maintenance/playwright-1.62-migration.md').write_text('\n'.join(lines), encoding='utf-8')
          PY

      - name: Remove temporary workflow and publish
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/install-playwright-1-62-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            package.json \
            package-lock.json \
            docs/maintenance/playwright-1.62-migration.md \
            .github/workflows/install-playwright-1-62-once.yml
          git commit -m "chore(playwright): install exact 1.62 closure"
          git push origin HEAD:maint/254-playwright-1-62
