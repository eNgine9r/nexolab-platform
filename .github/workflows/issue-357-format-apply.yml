name: Issue 357 Format Apply

on:
  push:
    branches:
      - fix/357-structural-snapshot-acceptance
    paths:
      - .github/workflows/issue-357-format-apply.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/357-structural-snapshot-acceptance
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install deterministic dependencies
        env:
          HUSKY: "0"
        run: npm install --no-audit
      - name: Format focused Issue 357 files
        run: |
          npx prettier --write \
            src/features/refrigeration/structural-snapshot-repository.ts \
            src/features/refrigeration/structural-snapshot-repository.test.ts
          rm .github/workflows/issue-357-format-apply.yml
      - name: Commit focused formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/features/refrigeration/structural-snapshot-repository.ts \
            src/features/refrigeration/structural-snapshot-repository.test.ts \
            .github/workflows/issue-357-format-apply.yml
          git commit -m "style(refrigeration): format structural snapshot client"
          git push origin HEAD:fix/357-structural-snapshot-acceptance
