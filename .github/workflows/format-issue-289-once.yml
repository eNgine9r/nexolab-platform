name: Format Issue 289 once

on:
  push:
    paths:
      - ".github/workflows/format-issue-289-once.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: test/289-acquisition-scale-acceptance
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          package-manager-cache: false
          node-version-file: .nvmrc

      - name: Install dependencies
        env:
          HUSKY: 0
        run: npm install --no-audit

      - name: Apply exact repository formatting
        run: |
          npx prettier --write \
            docs/operations/acquisition-scale-acceptance.md \
            e2e/telemetry-acquisition-invariant.production.e2e.ts \
            .github/workflows/acquisition-scale-acceptance.yml

      - name: Remove temporary workflow and publish one commit
        run: |
          rm .github/workflows/format-issue-289-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/operations/acquisition-scale-acceptance.md \
            e2e/telemetry-acquisition-invariant.production.e2e.ts \
            .github/workflows/acquisition-scale-acceptance.yml \
            .github/workflows/format-issue-289-once.yml
          git commit -m "style(performance): format Issue 289 acceptance"
          git push origin HEAD:test/289-acquisition-scale-acceptance
