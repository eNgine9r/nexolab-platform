name: Apply session repository scope

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/scripts/apply-session-repository-scope.py"
      - ".github/scripts/apply-session-api-scope.py"
      - ".github/workflows/apply-session-repository-scope.yml"

permissions:
  contents: write

concurrency:
  group: apply-session-repository-scope-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Apply repository and API scope
        run: |
          python .github/scripts/apply-session-repository-scope.py
          python .github/scripts/apply-session-api-scope.py

      - name: Remove temporary automation
        run: |
          rm .github/scripts/apply-session-repository-scope.py
          rm .github/scripts/apply-session-api-scope.py
          rm .github/workflows/apply-session-repository-scope.yml

      - name: Install frontend dependencies
        env:
          HUSKY: 0
        run: npm install --no-audit

      - name: Format repository
        run: npm run format

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: scope session repository to organizations"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
