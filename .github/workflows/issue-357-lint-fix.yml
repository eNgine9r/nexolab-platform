name: Issue 357 Lint Fix

on:
  push:
    branches:
      - fix/357-structural-snapshot-acceptance
    paths:
      - .github/workflows/issue-357-lint-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/357-structural-snapshot-acceptance
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Apply focused hook dependency fix
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/components/refrigeration/refrigeration-detail-screen.tsx')
          text = path.read_text()
          text = text.replace(
              '''        ]).then(([loadedBindings, availableChannels]) => ({
          equipment: equipmentRecord,
          bindings: loadedBindings,
          channels: availableChannels,
        }));''',
              '''        ]).then(([loadedBindings, availableChannels]) => ({
          equipment: null,
          bindings: loadedBindings,
          channels: availableChannels,
        }));''',
          )
          text = text.replace(
              '        setEquipmentRecord(loaded.equipment);\n        setBindings(loaded.bindings);',
              '        if (loaded.equipment) setEquipmentRecord(loaded.equipment);\n        setBindings(loaded.bindings);',
          )
          path.write_text(text)
          Path('.github/workflows/issue-357-lint-fix.yml').unlink()
          PY
      - name: Verify and commit focused fix
        env:
          HUSKY: "0"
        run: |
          npm install --no-audit
          npx prettier --write src/components/refrigeration/refrigeration-detail-screen.tsx
          npm run lint
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/refrigeration/refrigeration-detail-screen.tsx .github/workflows/issue-357-lint-fix.yml
          git commit -m "fix(refrigeration): stabilize snapshot reconciliation effect"
          git push origin HEAD:fix/357-structural-snapshot-acceptance
