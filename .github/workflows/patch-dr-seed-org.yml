name: Patch DR Seed Organization

on:
  push:
    branches:
      - feat/m7-disaster-recovery-gate
    paths:
      - ".github/workflows/patch-dr-seed-org.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m7-disaster-recovery-gate
          fetch-depth: 0

      - name: Use isolated organization fixture
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/run-disaster-recovery-acceptance.sh")
          content = path.read_text(encoding="utf-8")
          old = "00000000-0000-0000-0000-000000000001"
          new = "00000000-0000-0000-0000-000000000099"
          count = content.count(old)
          if count != 3:
              raise SystemExit(f"Expected exactly 3 organization fixture occurrences, found {count}")
          path.write_text(content.replace(old, new), encoding="utf-8")
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/run-disaster-recovery-acceptance.sh
          git commit -m "fix: isolate disaster recovery seed organization"
          git push origin HEAD:feat/m7-disaster-recovery-gate
