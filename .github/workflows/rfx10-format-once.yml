name: RFX10 Format Once

on:
  push:
    branches:
      - feat/1077-rfx10-circuit-config-workspace

permissions:
  contents: write

jobs:
  format:
    if: github.event.head_commit.message != 'chore(rfx10): apply prettier (#1077)'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feat/1077-rfx10-circuit-config-workspace
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        env:
          HUSKY: "0"
        run: npm ci --no-audit --fund=false

      - name: Format RFX-10 frontend files and remove helper
        run: |
          set -euo pipefail
          npx prettier --write             src/components/refrigeration/refrigeration-circuit-configuration-workspace.tsx             src/components/refrigeration/refrigeration-circuit-configuration-workspace.test.tsx             src/features/refrigeration/circuit-configuration-repository.ts             src/features/refrigeration/circuit-configuration-repository.test.ts
          git rm .github/workflows/rfx10-format-once.yml

      - name: Commit formatter output
        run: |
          set -euo pipefail
          git config user.name "nexolab-ci"
          git config user.email "nexolab-ci@users.noreply.github.com"
          git add             src/components/refrigeration/refrigeration-circuit-configuration-workspace.tsx             src/components/refrigeration/refrigeration-circuit-configuration-workspace.test.tsx             src/features/refrigeration/circuit-configuration-repository.ts             src/features/refrigeration/circuit-configuration-repository.test.ts             .github/workflows/rfx10-format-once.yml
          git commit -m "chore(rfx10): apply prettier (#1077)"
          git push origin HEAD:feat/1077-rfx10-circuit-config-workspace
