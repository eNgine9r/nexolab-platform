name: Chart Format Probe

on:
  push:
    branches:
      - fix/451-chart-integrity-alarm-provenance

permissions:
  contents: read

jobs:
  format-probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          check-latest: false
          package-manager-cache: false

      - name: Install dependencies
        env:
          HUSKY: 0
        run: npm install --no-audit

      - name: Format chart files
        run: |
          npx prettier --write \
            src/components/charts/chart-shell.tsx \
            src/features/charts/continuity.test.ts \
            src/features/charts/continuity.ts \
            src/features/charts/domain.ts \
            src/features/charts/echarts-adapter.ts \
            src/features/live/live-chart.test.ts \
            src/features/live/live-history.ts
          git diff --binary -- \
            src/components/charts/chart-shell.tsx \
            src/features/charts/continuity.test.ts \
            src/features/charts/continuity.ts \
            src/features/charts/domain.ts \
            src/features/charts/echarts-adapter.ts \
            src/features/live/live-chart.test.ts \
            src/features/live/live-history.ts > chart-prettier.patch
          test -s chart-prettier.patch

      - name: Upload formatter patch
        uses: actions/upload-artifact@v7
        with:
          name: chart-prettier-patch-${{ github.sha }}
          path: chart-prettier.patch
          if-no-files-found: error
          retention-days: 1
