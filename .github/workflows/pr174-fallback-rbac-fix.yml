name: PR 174 fallback RBAC fix

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/pr174-fallback-rbac-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.number == 174
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Enforce capabilities in legacy layout workspace
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          security = Path("src/components/refrigeration/security-aware-layout-workspace.tsx")
          text = security.read_text(encoding="utf-8")
          text = once(
              text,
              '''          repository={runtime.repository}\n        />\n''',
              '''          repository={runtime.repository}\n          canEditDraft={capabilities.canEdit}\n          canPublish={capabilities.canPublish}\n          canRestore={capabilities.canRestore}\n        />\n''',
              "fallback capabilities",
          )
          security.write_text(text, encoding="utf-8")

          workspace = Path("src/components/refrigeration/refrigeration-layout-workspace.tsx")
          text = workspace.read_text(encoding="utf-8")
          text = once(
              text,
              'const maxImageSizeBytes = 15 * 1024 * 1024;\n',
              'const maxImageSizeBytes = 1536 * 1024;\nconst imageLimitMessage =\n  "Розмір зображення перевищує допустимі 1,5 МБ. Стисніть файл або завантажте інше зображення.";\n',
              "workspace image limit",
          )
          text = once(
              text,
              '''  runtimeMode?: "demo" | "live";\n};\n''',
              '''  runtimeMode?: "demo" | "live";\n  canEditDraft?: boolean;\n  canPublish?: boolean;\n  canRestore?: boolean;\n};\n''',
              "workspace capability types",
          )
          text = once(
              text,
              '''  actorId: actorIdOverride,\n  runtimeMode,\n}: RefrigerationLayoutWorkspaceProps) {\n''',
              '''  actorId: actorIdOverride,\n  runtimeMode,\n  canEditDraft = true,\n  canPublish = true,\n  canRestore = true,\n}: RefrigerationLayoutWorkspaceProps) {\n''',
              "workspace capability defaults",
          )
          text = once(text, '    if (!repository || !draft) return;\n', '    if (!canEditDraft || !repository || !draft) return;\n', "attach guard")
          text = once(text, '    if (!file || !repository || !draft) return;\n', '    if (!canEditDraft || !file || !repository || !draft) return;\n', "photo guard")
          text = once(text, '      setErrorMessage("Розмір фото не повинен перевищувати 15 МБ.");\n', '      setErrorMessage(imageLimitMessage);\n', "workspace image error")
          text = once(text, '    if (!repository || !draft || actionState !== "idle") return;\n', '    if (!canPublish || !repository || !draft || actionState !== "idle") return;\n', "publish guard")
          text = once(text, '    if (!repository || !draft || actionState !== "idle") return;\n', '    if (!canRestore || !repository || !draft || actionState !== "idle") return;\n', "restore guard")
          text = once(text, '    if (!pendingImage || !draft || actionState !== "idle") return;\n', '    if (!canEditDraft || !pendingImage || !draft || actionState !== "idle") return;\n', "retry guard")
          text = once(
              text,
              '''          repository={repository}\n        />\n''',
              '''          repository={repository}\n          canEdit={canEditDraft}\n        />\n''',
              "editor capability",
          )
          text = once(
              text,
              '''          onRetry={() => void handleRetryImageAttachment()}\n        />\n''',
              '''          onRetry={() => void handleRetryImageAttachment()}\n          canEditDraft={canEditDraft}\n        />\n''',
              "photo capability",
          )
          text = once(
              text,
              '''          onPublish={() => void handlePublish()}\n        />\n''',
              '''          onPublish={() => void handlePublish()}\n          canPublish={canPublish}\n        />\n''',
              "publish capability",
          )
          text = once(
              text,
              '''          onRestore={(revision) => void handleRestore(revision)}\n        />\n''',
              '''          onRestore={(revision) => void handleRestore(revision)}\n          canRestore={canRestore}\n        />\n''',
              "restore capability",
          )
          text = once(
              text,
              '''  onRetry,\n}: {\n''',
              '''  onRetry,\n  canEditDraft,\n}: {\n''',
              "photo destructuring",
          )
          text = once(
              text,
              '''  onRetry: () => void;\n}) {\n''',
              '''  onRetry: () => void;\n  canEditDraft: boolean;\n}) {\n''',
              "photo prop type",
          )
          text = once(
              text,
              '          <p className="mt-1 text-[10px] text-slate-500">S3-compatible storage · JPEG/PNG/WebP · до 15 МБ</p>\n',
              '          <p className="mt-1 text-[10px] text-slate-500">S3-compatible storage · JPEG/PNG/WebP · максимум 1,5 МБ</p>\n',
              "photo copy",
          )
          text = once(
              text,
              '''      <input\n        ref={inputRef}\n        type="file"\n        accept="image/jpeg,image/png,image/webp"\n        className="sr-only"\n        aria-label="Вибрати production-фото обладнання"\n        onChange={onChange}\n      />\n''',
              '''      {canEditDraft ? (\n        <input\n          ref={inputRef}\n          type="file"\n          accept="image/jpeg,image/png,image/webp"\n          className="sr-only"\n          aria-label="Вибрати production-фото обладнання"\n          onChange={onChange}\n        />\n      ) : null}\n''',
              "photo input",
          )
          text = once(
              text,
              '''      <div className="mt-3 flex flex-wrap gap-2">\n        <button\n          type="button"\n          disabled={disabled}\n          onClick={onOpen}\n          className="inline-flex items-center gap-2 rounded-xl border border-cyan-400/20 bg-cyan-500/10 px-3 py-2 text-xs text-cyan-200 enabled:hover:bg-cyan-500/15 disabled:cursor-not-allowed disabled:opacity-40"\n        >\n          <UploadCloud className="h-3.5 w-3.5" />\n          {draft.image ? "Замінити фото" : "Завантажити фото"}\n        </button>\n        {pendingImage && actionState === "idle" ? (\n          <button\n            type="button"\n            onClick={onRetry}\n            className="inline-flex items-center gap-2 rounded-xl border border-amber-400/20 bg-amber-500/10 px-3 py-2 text-xs text-amber-200"\n          >\n            <RefreshCcw className="h-3.5 w-3.5" />\n            Повторити прив’язку\n          </button>\n        ) : null}\n      </div>\n''',
              '''      {canEditDraft ? (\n        <div className="mt-3 flex flex-wrap gap-2">\n          <button\n            type="button"\n            disabled={disabled}\n            onClick={onOpen}\n            className="inline-flex items-center gap-2 rounded-xl border border-cyan-400/20 bg-cyan-500/10 px-3 py-2 text-xs text-cyan-200 enabled:hover:bg-cyan-500/15 disabled:cursor-not-allowed disabled:opacity-40"\n          >\n            <UploadCloud className="h-3.5 w-3.5" />\n            {draft.image ? "Замінити фото" : "Завантажити фото"}\n          </button>\n          {pendingImage && actionState === "idle" ? (\n            <button\n              type="button"\n              onClick={onRetry}\n              className="inline-flex items-center gap-2 rounded-xl border border-amber-400/20 bg-amber-500/10 px-3 py-2 text-xs text-amber-200"\n            >\n              <RefreshCcw className="h-3.5 w-3.5" />\n              Повторити прив’язку\n            </button>\n          ) : null}\n        </div>\n      ) : null}\n''',
              "photo actions",
          )
          text = once(
              text,
              '''  onPublish,\n}: {\n''',
              '''  onPublish,\n  canPublish,\n}: {\n''',
              "publication destructuring",
          )
          text = once(
              text,
              '''  onPublish: () => void;\n}) {\n''',
              '''  onPublish: () => void;\n  canPublish: boolean;\n}) {\n''',
              "publication prop type",
          )
          text = once(
              text,
              '''      <button\n        type="button"\n        disabled={busy || mode === "edit" || !draft.imageId}\n        onClick={onPublish}\n        className="mt-3 inline-flex items-center gap-2 rounded-xl border border-emerald-400/25 bg-emerald-500/15 px-3 py-2 text-xs font-medium text-emerald-200 enabled:hover:bg-emerald-500/20 disabled:cursor-not-allowed disabled:opacity-40"\n      >\n        {busy ? <LoaderCircle className="h-3.5 w-3.5 animate-spin" /> : <Check className="h-3.5 w-3.5" />}\n        Опублікувати поточну чернетку\n      </button>\n''',
              '''      {canPublish ? (\n        <button\n          type="button"\n          aria-label="Опублікувати поточну чернетку"\n          disabled={busy || mode === "edit" || !draft.imageId}\n          onClick={onPublish}\n          className="mt-3 inline-flex items-center gap-2 rounded-xl border border-emerald-400/25 bg-emerald-500/15 px-3 py-2 text-xs font-medium text-emerald-200 enabled:hover:bg-emerald-500/20 disabled:cursor-not-allowed disabled:opacity-40"\n        >\n          {busy ? (\n            <LoaderCircle className="h-3.5 w-3.5 animate-spin" />\n          ) : (\n            <Check className="h-3.5 w-3.5" />\n          )}\n          Опублікувати поточну чернетку\n        </button>\n      ) : null}\n''',
              "publication action",
          )
          text = once(
              text,
              '''  onRestore,\n}: {\n''',
              '''  onRestore,\n  canRestore,\n}: {\n''',
              "history destructuring",
          )
          text = once(
              text,
              '''  onRestore: (revision: PublishedLayoutRevision) => void;\n}) {\n''',
              '''  onRestore: (revision: PublishedLayoutRevision) => void;\n  canRestore: boolean;\n}) {\n''',
              "history prop type",
          )
          text = once(
              text,
              '''              <button\n                type="button"\n                disabled={busy || mode === "edit"}\n                onClick={() => onRestore(revision)}\n                className="inline-flex items-center gap-1 rounded-lg border border-white/[0.08] px-2 py-1.5 text-[9px] text-slate-400 enabled:hover:bg-white/[0.05] enabled:hover:text-white disabled:opacity-35"\n              >\n                <RotateCcw className="h-3 w-3" />\n                Відновити\n              </button>\n''',
              '''              {canRestore ? (\n                <button\n                  type="button"\n                  aria-label={`Відновити ревізію r${revision.revision}`}\n                  disabled={busy || mode === "edit"}\n                  onClick={() => onRestore(revision)}\n                  className="inline-flex items-center gap-1 rounded-lg border border-white/[0.08] px-2 py-1.5 text-[9px] text-slate-400 enabled:hover:bg-white/[0.05] enabled:hover:text-white disabled:opacity-35"\n                >\n                  <RotateCcw className="h-3 w-3" />\n                  Відновити\n                </button>\n              ) : null}\n''',
              "history action",
          )
          workspace.write_text(text, encoding="utf-8")

          editor = Path("src/components/refrigeration/refrigeration-layout-editor.tsx")
          text = editor.read_text(encoding="utf-8")
          text = once(text, 'const maxImageSizeBytes = 15 * 1024 * 1024;\n', 'const maxImageSizeBytes = 1536 * 1024;\nconst imageLimitMessage =\n  "Розмір зображення перевищує допустимі 1,5 МБ. Стисніть файл або завантажте інше зображення.";\n', "editor image limit")
          text = once(text, '  repository?: RefrigerationLayoutRepository;\n};\n', '  repository?: RefrigerationLayoutRepository;\n  canEdit?: boolean;\n};\n', "editor capability type")
          text = once(text, '  repository,\n}: RefrigerationLayoutEditorProps) {\n', '  repository,\n  canEdit = true,\n}: RefrigerationLayoutEditorProps) {\n', "editor capability default")
          text = once(text, '  const handleRestoreRecovery = () => {\n    if (!recoveryDraft) return;\n', '  const handleRestoreRecovery = () => {\n    if (!canEdit || !recoveryDraft) return;\n', "recovery guard")
          text = once(text, '  const handleSave = async () => {\n    const activeRepository = repositoryRef.current;\n', '  const handleSave = async () => {\n    if (!canEdit) return;\n    const activeRepository = repositoryRef.current;\n', "editor save guard")
          text = once(text, '  const handleImageChange = (event: ChangeEvent<HTMLInputElement>) => {\n    const file = event.target.files?.[0];\n', '  const handleImageChange = (event: ChangeEvent<HTMLInputElement>) => {\n    if (!canEdit) return;\n    const file = event.target.files?.[0];\n', "editor image guard")
          text = once(text, '      setImageError("Розмір фото не повинен перевищувати 15 МБ.");\n', '      setImageError(imageLimitMessage);\n', "editor image error")
          text = once(text, '        {recoveryDraft ? (\n', '        {canEdit && recoveryDraft ? (\n', "recovery visibility")
          text = once(text, '            onCancel={handleCancel}\n          />\n', '            onCancel={handleCancel}\n            canEdit={canEdit}\n          />\n', "toolbar capability")
          text = once(text, '  onCancel,\n}: {\n', '  onCancel,\n  canEdit,\n}: {\n', "toolbar destructuring")
          text = once(text, '  onCancel: () => void;\n}) {\n  if (mode === "view") {\n', '  onCancel: () => void;\n  canEdit: boolean;\n}) {\n  if (mode === "view") {\n    if (!canEdit) return null;\n', "toolbar capability type")
          editor.write_text(text, encoding="utf-8")
          PY
          git diff --check

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/components/refrigeration/security-aware-layout-workspace.tsx \
            src/components/refrigeration/refrigeration-layout-workspace.tsx \
            src/components/refrigeration/refrigeration-layout-editor.tsx
          git commit -m "fix: enforce RBAC in fallback layout workspace"
          git push origin HEAD:${{ github.head_ref }}
