name: Issue 404 add cursor layout regression

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'feat/404-saved-live-dashboard-chart-system'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install dependencies
        env:
          HUSKY: 0
        run: npm install --no-audit

      - name: Add cursor layout regression
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("e2e/live.production.e2e.ts")
          text = path.read_text(encoding="utf-8")
          old = '''    const host = panel.getByTestId("chart-renderer-host");
              const box = await host.boundingBox();
              if (!box) throw new Error("Saved Dashboard chart host has no bounding box");
              await host.hover();
              await page.mouse.wheel(0, -500);
          '''
          new = '''    const host = panel.getByTestId("chart-renderer-host");
              await host.scrollIntoViewIfNeeded();
              const box = await host.boundingBox();
              if (!box) throw new Error("Saved Dashboard chart host has no bounding box");
              const cursorLayoutBefore = {
                y: box.y,
                height: box.height,
                scrollY: await page.evaluate(() => window.scrollY),
              };
              for (const xFraction of [0.68, 0.75, 0.83, 0.91]) {
                await page.mouse.move(box.x + box.width * xFraction, box.y + box.height * 0.5);
                await page.waitForTimeout(75);
                const cursorBox = await host.boundingBox();
                if (!cursorBox) throw new Error("Saved Dashboard chart host disappeared during cursor inspection");
                expect(Math.abs(cursorBox.y - cursorLayoutBefore.y)).toBeLessThanOrEqual(1);
                expect(Math.abs(cursorBox.height - cursorLayoutBefore.height)).toBeLessThanOrEqual(1);
                expect(await page.evaluate(() => window.scrollY)).toBe(cursorLayoutBefore.scrollY);
              }
              await page.mouse.wheel(0, -500);
          '''
          if old not in text:
              raise SystemExit("cursor interaction anchor not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          npx prettier --write e2e/live.production.e2e.ts

      - name: Commit regression
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/live.production.e2e.ts
          git diff --cached --quiet && {
            echo "No regression patch produced."
            exit 1
          }
          git commit -m "test(live-dashboards): prevent cursor layout shift regression"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
