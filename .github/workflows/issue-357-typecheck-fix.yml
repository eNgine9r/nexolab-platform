name: Issue 357 Typecheck Fix

on:
  push:
    branches:
      - fix/357-structural-snapshot-acceptance
    paths:
      - .github/workflows/issue-357-typecheck-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/357-structural-snapshot-acceptance
          fetch-depth: 0
      - name: Apply strict runtime contract fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          route = Path('src/components/refrigeration/refrigeration-equipment-route.tsx')
          text = route.read_text()
          old = '''    const request = structural
      ? structural.get(equipmentId)
      : repository!.get(equipmentId).then((loaded) => ({ equipment: loaded }));
    void request
      .then((loaded) => {
        if (!active) return;
        setEquipment(loaded.equipment);
        if ("layout" in loaded) setSnapshot(loaded);
        setError(null);
      })'''
          new = '''    const snapshotRequest: Promise<RefrigerationStructuralSnapshot | null> = structural
      ? structural.get(equipmentId)
      : Promise.resolve(null);
    const equipmentRequest = repository?.get(equipmentId) ?? Promise.resolve(null);
    void Promise.all([equipmentRequest, snapshotRequest])
      .then(([loadedEquipment, loadedSnapshot]) => {
        if (!active) return;
        setEquipment(loadedSnapshot?.equipment ?? loadedEquipment);
        if (loadedSnapshot) setSnapshot(loadedSnapshot);
        setError(null);
      })'''
          if old not in text:
              raise SystemExit('route request block not found')
          route.write_text(text.replace(old, new))

          test = Path('src/components/refrigeration/refrigeration-catalog-screen.test.tsx')
          text = test.read_text()
          anchor = '    sensorConfigurationRepository: lifecycleRepository,\n'
          replacement = anchor + '    structuralSnapshotRepository: null,\n'
          if replacement not in text:
              if anchor not in text:
                  raise SystemExit('runtime fixture anchor not found')
              text = text.replace(anchor, replacement, 1)
          test.write_text(text)

          Path('.github/workflows/issue-357-typecheck-fix.yml').unlink()
          PY
      - name: Format and commit focused type fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/components/refrigeration/refrigeration-equipment-route.tsx \
            src/components/refrigeration/refrigeration-catalog-screen.test.tsx \
            .github/workflows/issue-357-typecheck-fix.yml
          git commit -m "fix(refrigeration): preserve strict snapshot runtime contracts"
          git push origin HEAD:fix/357-structural-snapshot-acceptance
