name: Reports Browser Acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/reports-browser-acceptance.yml"
      - "e2e/reports.production.e2e.ts"
      - "playwright.reports.config.ts"
      - "scripts/run-reports-browser-acceptance.sh"
      - "package.json"
      - "package-lock.json"
      - "src/app/reports/**"
      - "src/components/reports/**"
      - "src/components/dashboard/sidebar.tsx"
      - "src/features/security/**"
      - "src/lib/reports/**"
      - "src/lib/sessions/**"
      - "services/telemetry-service/app/reports/**"
      - "services/telemetry-service/app/security/**"
      - "services/telemetry-service/app/sessions/**"
      - "services/telemetry-service/app/main.py"
      - "services/telemetry-service/app/model_registry.py"
      - "services/telemetry-service/migrations/versions/20260726_0012_add_test_reports.py"
      - "infrastructure/compose/compose.central.yaml"
      - "infrastructure/compose/compose.browser-acceptance.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reports-browser-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reports-browser-acceptance:
    name: Next.js + FastAPI + PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          package-manager-cache: false
          node-version-file: .nvmrc

      - name: Install frontend dependencies
        env:
          HUSKY: 0
        run: npm install --no-audit

      - name: Capture exact Prettier diff for touched Reports files
        run: |
          npx prettier --write \
            e2e/reports.production.e2e.ts \
            src/components/reports/report-telemetry-selector.tsx \
            src/components/reports/reports-workspace.tsx \
            src/lib/reports/api-client.test.ts \
            src/lib/reports/telemetry-selection.test.ts \
            src/lib/reports/telemetry-selection.ts
          git diff -- \
            e2e/reports.production.e2e.ts \
            src/components/reports/report-telemetry-selector.tsx \
            src/components/reports/reports-workspace.tsx \
            src/lib/reports/api-client.test.ts \
            src/lib/reports/telemetry-selection.test.ts \
            src/lib/reports/telemetry-selection.ts
          exit 1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run reports browser acceptance
        run: |
          chmod +x scripts/run-reports-browser-acceptance.sh
          scripts/run-reports-browser-acceptance.sh

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports-browser-acceptance-evidence
          path: |
            test-results-reports
            playwright-report-reports
            /tmp/nexolab-reports-acceptance-frontend.log
            /tmp/nexolab-reports-acceptance-services.log
          if-no-files-found: warn
          retention-days: 14
