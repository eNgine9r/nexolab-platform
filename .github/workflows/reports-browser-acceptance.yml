name: Reports Browser Acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/reports-browser-acceptance.yml"
      - "e2e/reports.production.e2e.ts"
      - "playwright.reports.config.ts"
      - "scripts/run-reports-browser-acceptance.sh"
      - "package.json"
      - "package-lock.json"
      - "src/app/reports/**"
      - "src/components/reports/**"
      - "src/components/dashboard/sidebar.tsx"
      - "src/features/security/**"
      - "src/lib/reports/**"
      - "src/lib/sessions/**"
      - "services/telemetry-service/app/reports/**"
      - "services/telemetry-service/app/security/**"
      - "services/telemetry-service/app/sessions/**"
      - "services/telemetry-service/app/main.py"
      - "services/telemetry-service/app/model_registry.py"
      - "services/telemetry-service/migrations/versions/20260726_0012_add_test_reports.py"
      - "infrastructure/compose/compose.central.yaml"
      - "infrastructure/compose/compose.browser-acceptance.yaml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reports-browser-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reports-browser-acceptance:
    name: Next.js + FastAPI + PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout PR branch for one-shot formatter
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          package-manager-cache: false
          node-version-file: .nvmrc

      - name: Install frontend dependencies
        env:
          HUSKY: 0
        run: npm install --no-audit

      - name: Apply exact Reports formatting to branch
        run: |
          set -euo pipefail
          npx prettier --write \
            e2e/reports.production.e2e.ts \
            src/components/reports/reports-workspace.tsx
          if git diff --quiet -- e2e/reports.production.e2e.ts src/components/reports/reports-workspace.tsx; then
            echo "Reports files already match repository formatting."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/reports.production.e2e.ts src/components/reports/reports-workspace.tsx
          git commit -m "style: apply exact Reports formatting"
          git push origin HEAD:${{ github.head_ref }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run reports browser acceptance
        run: |
          chmod +x scripts/run-reports-browser-acceptance.sh
          scripts/run-reports-browser-acceptance.sh

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports-browser-acceptance-evidence
          path: |
            test-results-reports
            playwright-report-reports
            /tmp/nexolab-reports-acceptance-frontend.log
            /tmp/nexolab-reports-acceptance-services.log
          if-no-files-found: warn
          retention-days: 14
