name: Temporary Final Energy Gap Fix

on:
  push:
    branches:
      - feat/261-energy-monitoring-page
    paths:
      - .github/workflows/temporary-final-energy-gap-fix.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/261-energy-monitoring-page
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install dependencies
        env:
          HUSKY: 0
        run: npm install --no-audit --no-fund
      - name: Wire history gap rendering and boundary evidence
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          workspace = Path("src/components/energy/energy-workspace.tsx")
          text = workspace.read_text()
          import_anchor = 'import type { EnergyHistoryRange, EnergyTelemetryModel } from "@/hooks/use-energy-telemetry";'
          import_replacement = 'import { buildEnergyHistoryPath } from "@/features/energy/energy-history-path";\n' + import_anchor
          if text.count(import_anchor) != 1:
              raise SystemExit("Expected one workspace import anchor")
          text = text.replace(import_anchor, import_replacement)

          old_points = 'points: Array<{ id: string; x: number; y: number; value: number }>;'
          new_points = 'points: Array<{ id: string; x: number; y: number; value: number; capturedAt: string }>;'
          if text.count(old_points) != 1:
              raise SystemExit("Expected one HistorySeries points type")
          text = text.replace(old_points, new_points)

          old_point = '''          id: sample.event_id,
          value: sample.value,
          x: 38 + ((Date.parse(sample.captured_at) - from) / timeSpan) * 712,
          y: 24 + (1 - (sample.value - minimum) / valueSpan) * 176,'''
          new_point = '''          id: sample.event_id,
          value: sample.value,
          capturedAt: sample.captured_at,
          x: 38 + ((Date.parse(sample.captured_at) - from) / timeSpan) * 712,
          y: 24 + (1 - (sample.value - minimum) / valueSpan) * 176,'''
          if text.count(old_point) != 1:
              raise SystemExit("Expected one history point mapping")
          text = text.replace(old_point, new_point)

          old_path = '''        path: points
          .map((point, index) => `${index === 0 ? "M" : "L"}${point.x.toFixed(2)} ${point.y.toFixed(2)}`)
          .join(" "),'''
          new_path = '''        path: buildEnergyHistoryPath(points),'''
          if text.count(old_path) != 1:
              raise SystemExit("Expected one inline history path builder")
          workspace.write_text(text.replace(old_path, new_path))

          test_path = Path("src/features/energy/energy-history.test.ts")
          test_text = test_path.read_text()
          old_cursor = 'to: new Date("2026-08-03T10:00:02.000Z"),'
          new_cursor = 'to: new Date("2026-08-03T10:00:02.001Z"),'
          if test_text.count(old_cursor) != 1:
              raise SystemExit("Expected one boundary cursor assertion")
          test_path.write_text(test_text.replace(old_cursor, new_cursor))
          PY
      - name: Format exact energy files
        run: |
          npx prettier --write \
            src/components/energy/energy-workspace.tsx \
            src/features/energy/energy-history.ts \
            src/features/energy/energy-history.test.ts \
            src/features/energy/energy-history-path.ts \
            src/features/energy/energy-history-path.test.ts
          npm run format:check
      - name: Commit exact corrections
        shell: bash
        run: |
          set -euo pipefail
          unexpected="$(git diff --name-only | grep -Ev '^(src/components/energy/energy-workspace.tsx|src/features/energy/energy-history(.test|-path|-path.test)?.ts)$' || true)"
          if [[ -n "$unexpected" ]]; then
            printf 'Unexpected files:\n%s\n' "$unexpected" >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/components/energy/energy-workspace.tsx \
            src/features/energy/energy-history.ts \
            src/features/energy/energy-history.test.ts \
            src/features/energy/energy-history-path.ts \
            src/features/energy/energy-history-path.test.ts
          git commit -m 'fix(energy): preserve boundaries and outage gaps [skip ci]'
          git push origin HEAD:feat/261-energy-monitoring-page
