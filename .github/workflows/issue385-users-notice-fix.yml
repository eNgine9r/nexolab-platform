name: Issue 385 UsersScreen notice fix

on:
  push:
    branches:
      - feat/385-local-user-permissions
    paths:
      - .github/workflows/issue385-users-notice-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/385-local-user-permissions
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Apply exact UsersScreen state fix
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("src/components/settings/users-screen.tsx")
          text = path.read_text(encoding="utf-8")

          old_effect = '''      setSelectedPermissions(selectedUser.grantedPermissions);\n      setResetPassword("");\n      setNotice(null);\n      setError(null);\n'''
          new_effect = '''      setSelectedPermissions(selectedUser.grantedPermissions);\n      setResetPassword("");\n'''
          if text.count(old_effect) != 1:
              raise SystemExit("expected selectedUser effect block was not found exactly once")
          text = text.replace(old_effect, new_effect, 1)

          old_select = '''                      onClick={() => setSelectedId(user.id)}\n'''
          new_select = '''                      onClick={() => {\n                        setSelectedId(user.id);\n                        setNotice(null);\n                        setError(null);\n                      }}\n'''
          if text.count(old_select) != 1:
              raise SystemExit("expected user selection handler was not found exactly once")
          text = text.replace(old_select, new_select, 1)
          path.write_text(text, encoding="utf-8")
          PY

          npm ci --no-audit --no-fund
          npx prettier --write src/components/settings/users-screen.tsx
          rm .github/workflows/issue385-users-notice-fix.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/settings/users-screen.tsx .github/workflows/issue385-users-notice-fix.yml
          git diff --cached --check
          git commit -m "fix(auth): preserve mutation feedback across user refresh"
          git push origin HEAD:feat/385-local-user-permissions
