name: Temporary Energy Final Review

on:
  push:
    branches:
      - feat/261-energy-monitoring-page
    paths:
      - .github/workflows/temporary-energy-final-review.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feat/261-energy-monitoring-page
          persist-credentials: true

      - name: Setup exact Node baseline
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install dependencies
        env:
          HUSKY: 0
        run: npm install --no-audit --no-fund

      - name: Advance rolling history by wall clock
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/hooks/use-energy-telemetry.ts")
          text = path.read_text()
          old = '''  useEffect(() => {
            const timer = window.setInterval(() => setClock(Date.now()), CLOCK_TICK_MS);
            return () => window.clearInterval(timer);
          }, []);'''.replace("            ", "")
          new = '''  useEffect(() => {
            const timer = window.setInterval(() => {
              const now = Date.now();
              setClock(now);

              const currentWindow = historyWindowRef.current;
              if (
                currentWindow === null ||
                historyKeyRef.current === null ||
                activeHistoryKeyRef.current !== historyKeyRef.current
              ) {
                return;
              }

              const currentTo = Date.parse(currentWindow.to);
              if (!Number.isFinite(currentTo) || now <= currentTo) return;

              const rangeMs = HISTORY_HOURS[historyRangeRef.current] * 60 * 60 * 1000;
              const nextWindow = {
                from: new Date(now - rangeMs).toISOString(),
                to: new Date(now).toISOString(),
              };
              historyWindowRef.current = nextWindow;
              setHistoryWindow(nextWindow);
              setHistorySamples((current) =>
                mergeEnergyHistoryTail(current, [], {
                  nodeId: ENERGY_NODE_ID,
                  metric: selectedMetricRef.current,
                  from: new Date(nextWindow.from),
                  to: new Date(nextWindow.to),
                }),
              );
            }, CLOCK_TICK_MS);
            return () => window.clearInterval(timer);
          }, []);'''.replace("            ", "")
          if text.count(old) != 1:
              raise SystemExit(f"Expected one clock effect, found {text.count(old)}")
          path.write_text(text.replace(old, new))
          PY

      - name: Format exact review files
        run: |
          npx prettier --write \
            src/features/energy/energy-history.ts \
            src/features/energy/energy-history.test.ts \
            src/hooks/use-energy-telemetry.ts
          npm run format:check

      - name: Commit review corrections
        shell: bash
        run: |
          set -euo pipefail
          unexpected="$(git diff --name-only | grep -Ev '^(src/features/energy/energy-history(.test)?.ts|src/hooks/use-energy-telemetry.ts)$' || true)"
          if [[ -n "$unexpected" ]]; then
            printf 'Unexpected final-review files:\n%s\n' "$unexpected" >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/features/energy/energy-history.ts \
            src/features/energy/energy-history.test.ts \
            src/hooks/use-energy-telemetry.ts
          git commit -m 'fix(energy): stabilize rolling history snapshot [skip ci]'
          git push origin HEAD:feat/261-energy-monitoring-page
