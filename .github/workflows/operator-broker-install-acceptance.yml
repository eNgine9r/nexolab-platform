name: Operator Broker install acceptance

# #1769: real systemd installation of the pinned Operator Broker on a disposable runner.
# The runner user (uid 1001) plays the development account; a separate sudo-capable
# owner account outside the socket group runs the installer, exactly like the Pi.

on:
  pull_request:
    paths:
      - docs/operations/operator-broker/**
      - docs/operations/storage/nexolab-storage-inventory.sh
      - docs/operations/network/wp2c-stage2-frontend.py
      - tests/test_ci_operator_broker.py
      - .github/workflows/operator-broker-install-acceptance.yml
  push:
    branches: [main]
    paths:
      - docs/operations/operator-broker/**
      - docs/operations/storage/nexolab-storage-inventory.sh
      - docs/operations/network/wp2c-stage2-frontend.py
      - .github/workflows/operator-broker-install-acceptance.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    name: Real systemd install, trust boundaries, NEXOLAB scope, rollback
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0 # the upgrade test installs the merged v1.1 from history first

      - name: Prepare accounts (runner = uid 1001 dev account, nxowner = owner outside the socket group)
        run: |
          set -euo pipefail
          test "$(id -u runner)" = 1001
          sudo groupadd --force nexolab-dev
          sudo usermod -aG nexolab-dev runner
          sudo useradd -m -s /bin/bash nxowner
          echo 'nxowner ALL=(ALL) NOPASSWD: ALL' | sudo tee /etc/sudoers.d/90-nxowner >/dev/null
          sudo chmod 0440 /etc/sudoers.d/90-nxowner
          if id -nG nxowner | tr ' ' '\n' | grep -qx nexolab-dev; then exit 1; fi
          # the deployment account of the pinned unit (NEXOLAB_OPERATOR_DEPLOY_USER=nexolab), docker group like the Pi
          sudo useradd -m -s /bin/bash nexolab
          sudo usermod -aG docker nexolab
          mkdir -p /tmp/payload
          cp docs/operations/operator-broker/{nexolab-operator-broker.py,nexolab-operator-broker.service,nexolab-operator-broker.socket,install-operator-broker.sh} /tmp/payload/
          cp docs/operations/storage/nexolab-storage-inventory.sh /tmp/payload/
          cp docs/operations/network/wp2c-stage2-frontend.py /tmp/payload/
          chmod 0444 /tmp/payload/*

      - name: Workloads (one NEXOLAB container that logs a secret, one foreign product)
        run: |
          set -euo pipefail
          docker run -d --name nexolab-central-probe-1 --label com.docker.compose.project=nexolab-central \
            busybox:1.37 sh -c 'echo "db password=hunter2-should-not-leak"; echo nexolab-ok; sleep 600'
          docker run -d --name sellora-backend-1 --label com.docker.compose.project=sellora \
            busybox:1.37 sh -c 'echo sellora-private; sleep 600'
          docker network create sellora_default >/dev/null

      - name: Tampered payload is refused before anything is installed
        run: |
          set -euo pipefail
          mkdir -p /tmp/tampered && cp /tmp/payload/* /tmp/tampered/ && chmod u+w /tmp/tampered/*
          echo '# tamper' >> /tmp/tampered/nexolab-operator-broker.py
          out=$(sudo -u nxowner -H NEXOLAB_OPERATOR_DEV_USER=runner bash /tmp/payload/install-operator-broker.sh install /tmp/tampered 2>&1) && rc=0 || rc=$?
          echo "$out"
          test "$rc" != 0
          grep -q "checksum mismatch nexolab-operator-broker.py" <<<"$out"
          test ! -e /usr/local/lib/nexolab-operator
          test ! -e /etc/systemd/system/nexolab-operator-broker.service
          test -z "$(sudo find /root -maxdepth 1 -name 'nexolab-operator-stage.*')"

      - name: Failure during installation rolls back and verifies the removal
        run: |
          set -euo pipefail
          sudo touch /var/log/nexolab-operator   # a file where the installer needs a directory
          out=$(sudo -u nxowner -H NEXOLAB_OPERATOR_DEV_USER=runner bash /tmp/payload/install-operator-broker.sh install /tmp/payload 2>&1) && rc=0 || rc=$?
          echo "$out"
          test "$rc" = 1
          grep -q "ROLLBACK_VERIFIED" <<<"$out"
          test ! -e /usr/local/lib/nexolab-operator
          if systemctl is-active --quiet nexolab-operator-broker.socket; then exit 1; fi
          test -z "$(sudo find /root -maxdepth 1 -name 'nexolab-operator-stage.*')"
          sudo rm -f /var/log/nexolab-operator

      - name: Install as the owner (owner refused at the socket file, root refused, dev allowed)
        run: |
          set -euo pipefail
          out=$(sudo -u nxowner -H NEXOLAB_OPERATOR_DEV_USER=runner bash /tmp/payload/install-operator-broker.sh install /tmp/payload 2>&1) || { echo "$out"; exit 1; }
          echo "$out"
          grep -q "owner nxowner (uid .*): DENIED_FS EACCES" <<<"$out"
          grep -q "^root: False unauthorized_peer" <<<"$out"
          grep -q "OPERATOR_BROKER_INSTALLED socket=enabled/active owner=refused root=refused dev=allowed audit=ok" <<<"$out"
          test -z "$(sudo find /root -maxdepth 1 -name 'nexolab-operator-stage.*')"
          test "$(stat -c '%U:%G %a' /run/nexolab-operator/broker.sock)" = "root:nexolab-dev 660"

      - name: Development account calls (fresh login with the group, dev-session sandbox)
        run: |
          set -euo pipefail
          call() {
            sudo systemd-run --quiet --wait --pipe --collect --uid=runner -p NoNewPrivileges=yes \
              -p PrivateDevices=yes -p ProtectSystem=strict -p InaccessiblePaths=-/run/docker.sock \
              /usr/bin/python3 -I "$GITHUB_WORKSPACE/docs/operations/operator-broker/nexolab-operator.py" --json "$@"
          }
          absent() { if grep -q -- "$1" <<<"$2"; then echo "LEAK: $1"; exit 1; fi; }
          call system.summary | python3 -c 'import json,sys; r=json.load(sys.stdin); assert r["ok"], r'
          containers=$(call docker.containers)
          grep -q nexolab-central-probe-1 <<<"$containers"
          absent sellora "$containers"
          absent sellora "$(call docker.networks)"
          absent sellora "$(call docker.images)"
          foreign=$(call docker.logs name=sellora-backend-1 || true)
          grep -q '"error": "unknown_container"' <<<"$foreign"
          absent sellora-private "$foreign"
          logs=$(call docker.logs name=nexolab-central-probe-1 lines=20)
          grep -q nexolab-ok <<<"$logs"
          absent hunter2 "$logs"
          # the dev account cannot read raw reports, approvals or write the broker
          for check in "-r /var/lib/nexolab-operator/reports" "-r /etc/nexolab-operator/approvals" \
                       "-w /usr/local/lib/nexolab-operator/nexolab-operator-broker.py"; do
            if sudo -u runner test $check; then echo "dev account can access: $check"; exit 1; fi
          done
          sudo -u runner test -r /var/log/nexolab-operator/audit.jsonl
          sudo python3 -I -B /usr/local/lib/nexolab-operator/nexolab-operator-broker.py verify-audit

      - name: v1.1 diagnostics and an owner-approved cleanup
        run: |
          set -euo pipefail
          absent() { if grep -q -- "$1" <<<"$2"; then echo "LEAK: $1"; exit 1; fi; }
          call() {
            sudo systemd-run --quiet --wait --pipe --collect --uid=runner -p NoNewPrivileges=yes \
              -p PrivateDevices=yes -p ProtectSystem=strict -p InaccessiblePaths=-/run/docker.sock \
              /usr/bin/python3 -I "$GITHUB_WORKSPACE/docs/operations/operator-broker/nexolab-operator.py" --json "$@"
          }
          call system.reset-reason | python3 -c 'import json,sys; r=json.load(sys.stdin); assert r["ok"], r'
          model=$(call docker.service-model)
          grep -q nexolab-central-probe-1 <<<"$model"
          absent sellora "$model"
          refused=$(call storage.cleanup-regenerable || true)
          grep -q '"error": "approval_required"' <<<"$refused"
          docker volume create nexolab-probe-volume >/dev/null
          volumes_before=$(docker volume ls -q | sort)
          approval=$(sudo python3 -I /usr/local/lib/nexolab-operator/nexolab-operator-broker.py approve \
            --op storage.cleanup-regenerable --ttl-minutes 10 --reason ci | python3 -c 'import json,sys; print(json.load(sys.stdin)["approval_id"])')
          result=$(call storage.cleanup-regenerable --approval "$approval")
          python3 -c 'import json,sys; r=json.loads(sys.argv[1]); assert r["ok"] and r["result"]["volumes_unchanged"], r' "$result"
          test "$(docker volume ls -q | sort)" = "$volumes_before"
          docker image inspect busybox:1.37 >/dev/null   # in-use image kept
          again=$(call storage.cleanup-regenerable --approval "$approval" || true)
          grep -q '"error": "approval_invalid"' <<<"$again"   # single use

      - name: v1.2 bound LAN frontend deployment and DR backup handlers
        run: |
          set -euo pipefail
          call() {
            sudo systemd-run --quiet --wait --pipe --collect --uid=runner -p NoNewPrivileges=yes \
              -p PrivateDevices=yes -p ProtectSystem=strict -p InaccessiblePaths=-/run/docker.sock \
              /usr/bin/python3 -I "$GITHUB_WORKSPACE/docs/operations/operator-broker/nexolab-operator.py" --json "$@"
          }
          approve() {
            sudo python3 -I /usr/local/lib/nexolab-operator/nexolab-operator-broker.py approve --op "$1" \
              --ttl-minutes 10 --reason ci "${@:2}" | python3 -c 'import json,sys; print(json.load(sys.stdin)["approval_id"])'
          }
          test "$(sudo stat -c '%U:%G %a' /var/lib/nexolab-operator-deploy)" = "root:nexolab 750"
          mkdir -p "$HOME/operator-inbox"
          printf 'not-a-real-release' > /tmp/release.zip
          sha=$(sha256sum /tmp/release.zip | cut -d' ' -f1)
          cp /tmp/release.zip "$HOME/operator-inbox/$sha.zip"
          src=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          ident=(expect_current_source=$src expect_current_build=ciBuildId01)
          refused=$(call deploy.lan-frontend phase=prepare artifact_sha256=$sha "${ident[@]}" || true)
          grep -q '"error": "approval_required"' <<<"$refused"
          id=$(approve deploy.lan-frontend --arg phase=prepare --arg artifact_sha256=$sha \
            --arg expect_current_source=$src --arg expect_current_build=ciBuildId01)
          other=$(call deploy.lan-frontend phase=execute artifact_sha256=$sha "${ident[@]}" --approval "$id" || true)
          grep -q '"error": "approval_mismatch"' <<<"$other"   # the approval binds the phase
          out=$(call deploy.lan-frontend phase=prepare artifact_sha256=$sha "${ident[@]}" --approval "$id")
          echo "$out" | head -c 4000
          # The pinned tool ran as the owner account (not root) on the verified copy, and stopped on this
          # runner because it is not the production node.
          python3 -c '
          import json, sys
          r = json.loads(sys.argv[1]); res = r["result"]; step = res["steps"][0]
          assert r["ok"] and res["ok"] is False and res["deploy_user"] == "nexolab", r
          assert step["step"] == "stage" and any(m.startswith("STOP WRONG_NODE") for m in step["markers"]), step
          assert "RUN_AS_OPERATOR_NONROOT" not in step["output"], step
          ' "$out"
          test "$(sudo stat -c '%U:%G %a' "/var/lib/nexolab-operator-deploy/$sha.zip")" = "root:nexolab 640"
          # bytes that do not match the approved hash are never handed to the tool
          bad=$(printf 'approved-bytes' | sha256sum | cut -d' ' -f1)
          printf 'swapped-by-dev' > "$HOME/operator-inbox/$bad.zip"
          id=$(approve deploy.lan-frontend --arg phase=prepare --arg artifact_sha256=$bad \
            --arg expect_current_source=$src --arg expect_current_build=ciBuildId01)
          swapped=$(call deploy.lan-frontend phase=prepare artifact_sha256=$bad "${ident[@]}" --approval "$id" || true)
          grep -q '"error": "approval_mismatch"' <<<"$swapped"
          sudo test ! -e "/var/lib/nexolab-operator-deploy/$bad.zip"
          # DR backup: read-only health; start refuses while the unit is not installed
          call backup.health | python3 -c 'import json,sys; r=json.load(sys.stdin); assert r["ok"] and r["result"]["units"]["nexolab-dr-backup.service"]["LoadState"] == "not-found", r'
          id=$(approve backup.start)
          start=$(call backup.start --approval "$id" || true)
          grep -q '"error": "precondition_failed"' <<<"$start"

      - name: v1.3 manifest-bound image removal and Wi-Fi refusals
        run: |
          set -euo pipefail
          call() {
            sudo systemd-run --quiet --wait --pipe --collect --uid=runner -p NoNewPrivileges=yes \
              -p PrivateDevices=yes -p ProtectSystem=strict -p InaccessiblePaths=-/run/docker.sock \
              /usr/bin/python3 -I "$GITHUB_WORKSPACE/docs/operations/operator-broker/nexolab-operator.py" --json "$@"
          }
          approve() {
            sudo python3 -I /usr/local/lib/nexolab-operator/nexolab-operator-broker.py approve --op "$1" \
              --ttl-minutes 10 --reason ci "${@:2}" | python3 -c 'import json,sys; print(json.load(sys.stdin)["approval_id"])'
          }
          docker pull -q alpine:3.22 >/dev/null
          docker tag alpine:3.22 nexolab/ci-old:issue-1
          docker tag busybox:1.37 nexolab/ci-used:issue-2   # used by the probe container
          old=$(docker image inspect --format '{{.Id}}' nexolab/ci-old:issue-1)
          used=$(docker image inspect --format '{{.Id}}' nexolab/ci-used:issue-2)
          volumes_before=$(docker volume ls -q | sort)
          printf '{"images": [{"ref": "nexolab/ci-old:issue-1", "id": "%s"}, {"ref": "nexolab/ci-used:issue-2", "id": "%s"}]}' "$old" "$used" > /tmp/manifest.json
          sha=$(sha256sum /tmp/manifest.json | cut -d' ' -f1)
          mkdir -p "$HOME/operator-inbox" && cp /tmp/manifest.json "$HOME/operator-inbox/$sha.json"
          id=$(approve storage.remove-images --arg manifest_sha256=$sha)
          out=$(call storage.remove-images manifest_sha256=$sha --approval "$id")
          echo "$out" | head -c 3000
          python3 -c '
          import json, sys
          r = json.loads(sys.argv[1]); st = {x["ref"]: x["status"] for x in r["result"]["results"]}
          assert r["ok"] and st == {"nexolab/ci-old:issue-1": "untagged", "nexolab/ci-used:issue-2": "skipped_in_use"}, r
          ' "$out"
          if docker image inspect nexolab/ci-old:issue-1 >/dev/null 2>&1; then exit 1; fi
          docker image inspect alpine:3.22 busybox:1.37 nexolab/ci-used:issue-2 >/dev/null
          test "$(docker volume ls -q | sort)" = "$volumes_before"
          # a protected ref in the manifest refuses the whole run
          docker tag alpine:3.22 nexolab/ci:recovery-protected-arm64
          printf '{"images": [{"ref": "nexolab/ci:recovery-protected-arm64", "id": "%s"}]}' "$old" > /tmp/p.json
          psha=$(sha256sum /tmp/p.json | cut -d' ' -f1); cp /tmp/p.json "$HOME/operator-inbox/$psha.json"
          id=$(approve storage.remove-images --arg manifest_sha256=$psha)
          refused=$(call storage.remove-images manifest_sha256=$psha --approval "$id" || true)
          grep -q '"error": "precondition_failed"' <<<"$refused"
          docker image inspect nexolab/ci:recovery-protected-arm64 >/dev/null
          # Wi-Fi ops fail closed on a host without that Wi-Fi profile; nothing is modified
          id=$(approve wifi.connect-test --arg profile=LAB-CI --arg mac=random)
          wifi=$(call wifi.connect-test profile=LAB-CI mac=random --approval "$id" || true)
          grep -q '"error": "precondition_failed"' <<<"$wifi"
          id=$(approve wifi.profile-remove --arg profile=LAB-CI)
          wifi=$(call wifi.profile-remove profile=LAB-CI --approval "$id" || true)
          grep -q '"error": "precondition_failed"' <<<"$wifi"

      - name: v1.4 root-side image reference evidence and removal guard
        run: |
          set -euo pipefail
          call() {
            sudo systemd-run --quiet --wait --pipe --collect --uid=runner -p NoNewPrivileges=yes \
              -p PrivateDevices=yes -p ProtectSystem=strict -p InaccessiblePaths=-/run/docker.sock \
              /usr/bin/python3 -I "$GITHUB_WORKSPACE/docs/operations/operator-broker/nexolab-operator.py" --json "$@"
          }
          approve() {
            sudo python3 -I /usr/local/lib/nexolab-operator/nexolab-operator-broker.py approve --op "$1" \
              --ttl-minutes 10 --reason ci "${@:2}" | python3 -c 'import json,sys; print(json.load(sys.stdin)["approval_id"])'
          }
          docker tag alpine:3.22 nexolab/ci-rollback:issue-9-arm64
          docker tag alpine:3.22 nexolab/ci-stale:issue-8-arm64
          rid=$(docker image inspect --format '{{.Id}}' nexolab/ci-rollback:issue-9-arm64)
          # a root-only release record (owner workspace) names it as the rollback release
          sudo install -d -o nexolab -g nexolab -m 0700 /home/nexolab/commander-workspaces/ci-release
          echo '{"frontend_rollback_release": "docker:nexolab/ci-rollback:issue-9-arm64"}' \
            | sudo -u nexolab tee /home/nexolab/commander-workspaces/ci-release/site-activation-report.json >/dev/null
          if sudo -u runner test -r /home/nexolab/commander-workspaces/ci-release/site-activation-report.json; then exit 1; fi
          printf '{"images": [{"ref": "nexolab/ci-rollback:issue-9-arm64", "id": "%s"}, {"ref": "nexolab/ci-stale:issue-8-arm64", "id": "%s"}]}' "$rid" "$rid" > /tmp/m4.json
          sha=$(sha256sum /tmp/m4.json | cut -d' ' -f1); cp /tmp/m4.json "$HOME/operator-inbox/$sha.json"
          evidence=$(call storage.image-references manifest_sha256=$sha)
          python3 -c '
          import json, sys
          r = json.loads(sys.argv[1]); res = r["result"]; by = {i["ref"]: i for i in res["images"]}
          assert r["ok"] and res["complete"], r
          rb = by["nexolab/ci-rollback:issue-9-arm64"]
          assert rb["rollback_references"] >= 1 and any("ci-release" in e["path"] for e in rb["evidence"]), rb
          ' "$evidence"
          id=$(approve storage.remove-images --arg manifest_sha256=$sha)
          out=$(call storage.remove-images manifest_sha256=$sha --approval "$id")
          echo "$out" | head -c 2000
          python3 -c '
          import json, sys
          r = json.loads(sys.argv[1]); st = {x["ref"]: x["status"] for x in r["result"]["results"]}
          assert st["nexolab/ci-rollback:issue-9-arm64"] == "skipped_protected_or_rollback_record", st
          assert st["nexolab/ci-stale:issue-8-arm64"] in ("untagged", "deleted"), st
          ' "$out"
          docker image inspect nexolab/ci-rollback:issue-9-arm64 >/dev/null

      - name: Stage 2 offline build pattern on real BuildKit (#1782)
        run: |
          set -euo pipefail
          docker tag busybox:1.37 node:ci-stage2-base
          python3 - <<'PY'
          import importlib.util, json, subprocess, sys, tempfile
          from pathlib import Path
          spec = importlib.util.spec_from_file_location("s2", "docs/operations/network/wp2c-stage2-frontend.py")
          s2 = importlib.util.module_from_spec(spec); sys.modules["s2"] = s2; spec.loader.exec_module(s2)
          base = json.loads(subprocess.check_output(["docker", "image", "inspect", "node:ci-stage2-base"]))[0]
          ref = s2.base_reference(base)
          assert ref == "node:ci-stage2-base", ref
          old = {"Config": {"Env": base["Config"].get("Env") or [], "WorkingDir": "/app", "Cmd": ["sh"], "Labels": {}}}
          def build(dockerfile: str, tag: str) -> subprocess.CompletedProcess:
              with tempfile.TemporaryDirectory() as ctx:
                  (Path(ctx) / "app").mkdir()
                  (Path(ctx) / "app" / "index.txt").write_text("ok\n")
                  (Path(ctx) / "Dockerfile").write_text(dockerfile)
                  tar = subprocess.Popen(["tar", "-C", ctx, "-cf", "-", "."], stdout=subprocess.PIPE)
                  res = subprocess.run(["docker", "build", "--no-cache", "--pull=false", "--network", "none", "--tag", tag, "-"],
                                       stdin=tar.stdout, capture_output=True)
                  tar.wait()
                  return res
          good = build(s2.dockerfile_for(old, ref, "0:0", "a" * 40), "nexolab/ci-stage2:fixed")
          assert good.returncode == 0, good.stderr.decode()[-2000:]
          new = json.loads(subprocess.check_output(["docker", "image", "inspect", "nexolab/ci-stage2:fixed"]))[0]
          layers = base["RootFS"]["Layers"]
          assert new["RootFS"]["Layers"][: len(layers)] == layers, "not on the proven base"
          # the 2026-11-26 site failure: BuildKit cannot build FROM a bare image ID
          bad = build("FROM " + base["Id"] + "\nCOPY app/ /app/\n", "nexolab/ci-stage2:by-id")
          assert bad.returncode != 0, "FROM <image id> unexpectedly worked"
          print("STAGE2_BUILD_PATTERN_OK", ref, new["Id"])
          PY

      - name: Upgrade from the merged v1.1 (failure restores v1.1), rollback and roll forward
        run: |
          set -euo pipefail
          call() {
            sudo systemd-run --quiet --wait --pipe --collect --uid=runner -p NoNewPrivileges=yes \
              -p PrivateDevices=yes -p ProtectSystem=strict -p InaccessiblePaths=-/run/docker.sock \
              /usr/bin/python3 -I "$GITHUB_WORKSPACE/docs/operations/operator-broker/nexolab-operator.py" --json "$@"
          }
          version() { call broker.list | python3 -c 'import json,sys; print(json.load(sys.stdin)["result"]["version"])'; }
          owner() { sudo -u nxowner -H NEXOLAB_OPERATOR_DEV_USER=runner "$@"; }
          broker_sha() { sudo sha256sum /usr/local/lib/nexolab-operator/nexolab-operator-broker.py | cut -d' ' -f1; }
          V11=d9c9c9fe   # main after #1773: the version installed on the Pi on 2026-11-26
          mkdir -p /tmp/payload-v11
          for f in nexolab-operator-broker.py nexolab-operator-broker.service nexolab-operator-broker.socket install-operator-broker.sh; do
            git show "$V11:docs/operations/operator-broker/$f" > "/tmp/payload-v11/$f"
          done
          git show "$V11:docs/operations/storage/nexolab-storage-inventory.sh" > /tmp/payload-v11/nexolab-storage-inventory.sh
          chmod 0444 /tmp/payload-v11/*
          out=$(owner bash /tmp/payload/install-operator-broker.sh uninstall 2>&1)
          grep -q OPERATOR_BROKER_REMOVED <<<"$out"
          out=$(owner bash /tmp/payload-v11/install-operator-broker.sh install /tmp/payload-v11 2>&1) || { echo "$out"; exit 1; }
          test "$(version)" = 1.1.0
          v11=$(broker_sha)

          # 1. a failure after the new version is installed restores v1.1 automatically
          out=$(sudo -u nxowner -H NEXOLAB_OPERATOR_DEV_USER=runner NEXOLAB_OPERATOR_TEST_FAULT=after-install \
            bash /tmp/payload/install-operator-broker.sh upgrade /tmp/payload 2>&1) && rc=0 || rc=$?
          echo "$out"
          test "$rc" = 3
          grep -q "OPERATOR_BROKER_UPGRADE_ROLLED_BACK version=1.1.0" <<<"$out"
          grep -q "ACCEPTANCE_OK version=1.1.0" <<<"$out"
          test "$(version)" = 1.1.0
          test "$(broker_sha)" = "$v11"
          sudo test ! -e /usr/local/lib/nexolab-operator/handlers/wp2c-stage2-frontend.py
          systemctl is-active --quiet nexolab-operator-broker.socket

          # 2. clean upgrade keeps v1.1 as the retained previous version
          out=$(owner bash /tmp/payload/install-operator-broker.sh upgrade /tmp/payload 2>&1) || { echo "$out"; exit 1; }
          grep -q "OPERATOR_BROKER_UPGRADED from=1.1.0 to=1.4.0" <<<"$out"
          test "$(version)" = 1.4.0
          test "$(sudo stat -c '%U:%G %a' /var/lib/nexolab-operator/previous)" = "root:root 700"

          # 3. explicit rollback to v1.1, then roll forward again
          out=$(owner bash /tmp/payload/install-operator-broker.sh rollback 2>&1) || { echo "$out"; exit 1; }
          grep -q "OPERATOR_BROKER_ROLLED_BACK from=1.4.0 to=1.1.0" <<<"$out"
          test "$(version)" = 1.1.0
          test "$(broker_sha)" = "$v11"
          out=$(owner bash /tmp/payload/install-operator-broker.sh rollback 2>&1) || { echo "$out"; exit 1; }
          grep -q "OPERATOR_BROKER_ROLLED_BACK from=1.1.0 to=1.4.0" <<<"$out"
          test "$(version)" = 1.4.0

          # 4. a tampered payload changes nothing
          out=$(owner bash /tmp/payload/install-operator-broker.sh upgrade /tmp/tampered 2>&1) && exit 1 || true
          grep -q "installed broker left unchanged" <<<"$out"
          test "$(version)" = 1.4.0
          sudo python3 -I -B /usr/local/lib/nexolab-operator/nexolab-operator-broker.py verify-audit | grep -q '"ok": true'

      - name: Owner cannot approve as non-root; uninstall removes everything and keeps evidence
        run: |
          set -euo pipefail
          if sudo -u nxowner python3 -I /usr/local/lib/nexolab-operator/nexolab-operator-broker.py approve --op service.recover; then exit 1; fi
          out=$(sudo -u nxowner -H bash /tmp/payload/install-operator-broker.sh uninstall 2>&1)
          echo "$out"
          grep -q ROLLBACK_VERIFIED <<<"$out"
          grep -q OPERATOR_BROKER_REMOVED <<<"$out"
          test ! -e /usr/local/lib/nexolab-operator
          test ! -S /run/nexolab-operator/broker.sock
          sudo test -s /var/log/nexolab-operator/audit.jsonl

      - name: Broker journal (diagnostics)
        if: always()
        run: sudo journalctl -u nexolab-operator-broker.service -u nexolab-operator-broker.socket --no-pager -n 80 || true
