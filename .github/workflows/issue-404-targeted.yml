name: Issue 404 targeted verification

on:
  push:
    branches:
      - feat/404-saved-live-dashboard-chart-system

permissions:
  contents: write

jobs:
  targeted:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/404-saved-live-dashboard-chart-system
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Correct deterministic event ids
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("e2e/live.production.e2e.ts")
          text = path.read_text()
          before = "    item.id || '-' || sample_index::text,\n"
          after = "    md5(item.id || ':' || sample_index::text),\n"
          if before not in text:
              raise SystemExit("Issue 404 event-id fixture anchor not found")
          path.write_text(text.replace(before, after, 1))
          PY
      - run: npm ci --no-audit
        env:
          HUSKY: 0
      - run: npx prettier --check e2e/live.production.e2e.ts
      - run: npm run typecheck
      - name: Commit fixture correction
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/live.production.e2e.ts
          git diff --cached --quiet && exit 0
          git commit -m "test(live-dashboards): fix chart fixture event ids"
          git push origin HEAD:feat/404-saved-live-dashboard-chart-system
