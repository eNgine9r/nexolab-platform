name: Temporary Prettier Diagnostic

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/temporary-prettier-diagnostic.yml"
      - "src/features/energy/energy-history-multiple-outages.test.ts"
  push:
    branches:
      - feat/261-energy-monitoring-page
    paths:
      - ".github/workflows/temporary-prettier-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format-target:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install dependencies
        run: npm install --no-audit
        env:
          HUSKY: "0"
      - name: Print canonical target
        shell: bash
        run: |
          set -euo pipefail
          target="src/features/energy/energy-history-multiple-outages.test.ts"
          npx prettier --write "$target"
          printf '%s\n' '---BEGIN_CANONICAL_FILE---'
          cat "$target"
          printf '%s\n' '---END_CANONICAL_FILE---'
          git diff --exit-code -- "$target" || true
