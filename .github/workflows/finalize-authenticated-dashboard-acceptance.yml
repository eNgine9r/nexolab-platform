name: Finalize authenticated dashboard acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/scripts/finalize-authenticated-dashboard-acceptance.py"
      - ".github/workflows/finalize-authenticated-dashboard-acceptance.yml"
      - ".github/workflows/authenticated-dashboard-acceptance.yml"
      - "docs/authenticated-live-telemetry.md"
      - "e2e/authenticated-dashboard.production.e2e.ts"
      - "package.json"
      - "playwright.dashboard.config.ts"
      - "scripts/run-authenticated-dashboard-acceptance.sh"

permissions:
  contents: write

concurrency:
  group: finalize-authenticated-dashboard-acceptance-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Apply final acceptance changes
        run: python .github/scripts/finalize-authenticated-dashboard-acceptance.py

      - name: Remove temporary automation
        run: |
          rm .github/scripts/finalize-authenticated-dashboard-acceptance.py
          rm .github/workflows/finalize-authenticated-dashboard-acceptance.yml

      - name: Install dependencies
        env:
          HUSKY: 0
        run: npm install --no-audit

      - name: Format repository
        run: npm run format

      - name: Commit final acceptance slice
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: finalize authenticated dashboard acceptance"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
