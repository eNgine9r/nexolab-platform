name: Finalize authenticated dashboard acceptance

on:
  push:
    branches: [feat/authenticated-live-dashboard]

permissions:
  contents: write

concurrency:
  group: finalize-authenticated-dashboard-acceptance
  cancel-in-progress: false

jobs:
  finalize:
    if: "${{ !contains(github.event.head_commit.message, 'test: finalize authenticated dashboard acceptance') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/authenticated-live-dashboard

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Apply final acceptance changes
        run: python .github/scripts/finalize-authenticated-dashboard-acceptance.py

      - name: Remove temporary automation
        run: |
          rm .github/scripts/finalize-authenticated-dashboard-acceptance.py
          rm .github/workflows/finalize-authenticated-dashboard-acceptance.yml

      - name: Install dependencies
        env:
          HUSKY: 0
        run: npm install --no-audit

      - name: Format repository
        run: npm run format

      - name: Commit final acceptance slice
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: finalize authenticated dashboard acceptance"
          git push origin HEAD:feat/authenticated-live-dashboard
