name: Temporary Layout Domain Formatter

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  format:
    name: Format layout catalog domain
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          package-manager-cache: false
          node-version-file: .nvmrc

      - name: Install dependencies
        env:
          HUSKY: 0
        run: npm install --no-audit

      - name: Format domain
        run: npx prettier --write src/features/equipment-layouts/layout-catalog.ts

      - name: Upload formatted domain
        uses: actions/upload-artifact@v7
        with:
          name: formatted-layout-domain-${{ github.sha }}
          path: src/features/equipment-layouts/layout-catalog.ts
          if-no-files-found: error
          retention-days: 1
