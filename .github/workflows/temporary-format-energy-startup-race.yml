name: Temporary Format Energy Startup Race

on:
  push:
    branches:
      - feat/261-energy-monitoring-page
    paths:
      - .github/workflows/temporary-format-energy-startup-race.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/261-energy-monitoring-page
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install dependencies
        env:
          HUSKY: 0
        run: npm install --no-audit --no-fund
      - name: Format exact files
        run: |
          npx prettier --write \
            src/hooks/use-energy-telemetry.ts \
            src/features/energy/energy-live-history.test.ts
          npx prettier --check \
            src/hooks/use-energy-telemetry.ts \
            src/features/energy/energy-live-history.test.ts
      - name: Commit exact formatting
        shell: bash
        run: |
          set -euo pipefail
          unexpected="$(git diff --name-only | grep -Ev '^(src/hooks/use-energy-telemetry.ts|src/features/energy/energy-live-history.test.ts)$' || true)"
          if [[ -n "$unexpected" ]]; then
            printf 'Unexpected files:\n%s\n' "$unexpected" >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/hooks/use-energy-telemetry.ts src/features/energy/energy-live-history.test.ts
          git commit -m 'style(energy): format startup race handling [skip ci]'
          git push origin HEAD:feat/261-energy-monitoring-page
