name: Camera Format Evidence

on:
  push:
    branches:
      - feat/273-local-cameras-workspace

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm install --no-audit
        env:
          HUSKY: "0"
      - run: npx prettier --write src/features/cameras/domain.ts src/components/cameras/cameras-workspace.tsx src/components/dashboard/cameras-panel.tsx
      - uses: actions/upload-artifact@v7
        with:
          name: camera-formatted-files
          path: |
            src/features/cameras/domain.ts
            src/components/cameras/cameras-workspace.tsx
            src/components/dashboard/cameras-panel.tsx
          retention-days: 1
