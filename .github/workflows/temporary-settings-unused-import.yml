name: Temporary Settings Unused Import

on:
  pull_request:

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.pull_request.head.ref == 'feat/269-operator-safe-settings'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feat/269-operator-safe-settings

      - name: Remove unused Settings icon import
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/components/settings/settings-workspace.tsx")
          text = path.read_text()
          marker = "  SlidersHorizontal,\n"
          if marker not in text:
              raise SystemExit("Unused icon import marker not found")
          path.write_text(text.replace(marker, "", 1))
          PY
          rm .github/workflows/temporary-settings-unused-import.yml

      - name: Commit focused cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/settings/settings-workspace.tsx .github/workflows/temporary-settings-unused-import.yml
          git commit -m "fix(settings): remove unused icon import"
          git push origin HEAD:feat/269-operator-safe-settings
