name: Issue 461 targeted verification

on:
  push:
    branches:
      - feat/461-hierarchical-telemetry-point-selector

permissions:
  contents: write

jobs:
  targeted:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/461-hierarchical-telemetry-point-selector
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          HUSKY: '0'

      - name: Format touched files
        run: npx prettier --write src/features/telemetry-selection src/components/telemetry-selection docs/architecture/telemetry-point-selector.md

      - name: Lint selector scope
        run: npx eslint src/features/telemetry-selection src/components/telemetry-selection --max-warnings=0

      - name: Run selector regressions
        run: npx vitest run src/features/telemetry-selection/hierarchy.test.ts src/components/telemetry-selection/telemetry-point-selector.test.tsx

      - name: Typecheck
        run: npm run typecheck

      - name: Publish normalized selector batch
        run: |
          rm .github/workflows/issue-461-targeted.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: verify hierarchical telemetry selector"
          git push origin HEAD:feat/461-hierarchical-telemetry-point-selector
