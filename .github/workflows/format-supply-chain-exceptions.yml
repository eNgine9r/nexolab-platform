name: Format Supply Chain Exceptions

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/format-supply-chain-exceptions.yml"
      - "security/vulnerability-exceptions.json"

permissions:
  contents: write

jobs:
  format:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write security/vulnerability-exceptions.json
      - name: Commit canonical formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add security/vulnerability-exceptions.json
          git commit -m "style: format vulnerability exceptions"
          git push origin "HEAD:${{ github.head_ref }}"
