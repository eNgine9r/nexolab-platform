name: Issue 404 format cursor fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.ref == 'feat/404-saved-live-dashboard-chart-system'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install dependencies
        env:
          HUSKY: 0
        run: npm install --no-audit

      - name: Format cursor fix
        run: npx prettier --write src/components/charts/chart-shell.tsx

      - name: Commit formatting
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/charts/chart-shell.tsx
          if git diff --cached --quiet; then
            echo "No formatter changes required."
            exit 0
          fi
          git commit -m "style(charts): apply repository formatting"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
