name: Temporary Issue 537 focused fixes

on:
  push:
    branches: [feat/537-energy-period-consumption]
    paths:
      - .github/workflows/fix-537-temp.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/537-energy-period-consumption
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm install --no-audit
        env:
          HUSKY: 0
      - name: Apply exact scoped replacements
        run: |
          python - <<'PY'
          from pathlib import Path

          panel = Path('src/components/energy/energy-consumption-panel.tsx')
          text = panel.read_text()
          text = text.replace('const timer = window.setTimeout(() => {', 'const timer = globalThis.setTimeout(() => {')
          text = text.replace('window.clearTimeout(timer);', 'globalThis.clearTimeout(timer);')
          panel.write_text(text)

          e2e = Path('e2e/energy.production.e2e.ts')
          text = e2e.read_text()
          old = 'await expect(page.getByText("24 год", { exact: true })).toHaveCount(4);'
          new = 'await expect(page.locator("summary").filter({ hasText: /^24 год$/ })).toHaveCount(4);'
          if old not in text:
              raise SystemExit('expected energy selector assertion not found')
          e2e.write_text(text.replace(old, new))
          PY
          npx prettier --write src/components/energy/energy-consumption-panel.tsx e2e/energy.production.e2e.ts
          git diff --check
      - name: Commit focused fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/energy/energy-consumption-panel.tsx e2e/energy.production.e2e.ts
          git commit -m "fix(energy): preserve bounded navigation reads"
          git push origin HEAD:feat/537-energy-period-consumption
