name: Prettier Documentation 193

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/prettier-docs-193.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@v4
        with:
          ref: chore/193-format-documentation
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply exact formatting scope
        shell: bash
        run: |
          set -Eeuo pipefail
          files=(
            docs/operations/capacity-release-gate.md
            docs/operations/observability.md
            docs/rs485/evidence-standard.md
          )
          npm exec prettier -- --write "${files[@]}"
          npm exec prettier -- --check "${files[@]}"

          mapfile -t changed < <(git diff --name-only)
          for path in "${changed[@]}"; do
            case "$path" in
              docs/operations/capacity-release-gate.md|docs/operations/observability.md|docs/rs485/evidence-standard.md)
                ;;
              *)
                echo "Unexpected formatted path: $path" >&2
                exit 1
                ;;
            esac
          done

          if [[ ${#changed[@]} -eq 0 ]]; then
            echo "Exact documentation scope is already Prettier-clean."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${files[@]}"
          git diff --cached --check
          git commit -m "style(docs): format historical documentation"
          git push origin HEAD:chore/193-format-documentation
