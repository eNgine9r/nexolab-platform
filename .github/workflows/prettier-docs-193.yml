name: Prettier Documentation 193

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/prettier-docs-193.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact feature head
        uses: actions/checkout@v4
        with:
          ref: chore/193-format-documentation
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate exact formatting patch
        shell: bash
        run: |
          set -Eeuo pipefail
          files=(
            docs/operations/capacity-release-gate.md
            docs/operations/observability.md
            docs/rs485/evidence-standard.md
          )
          mkdir -p prettier-docs-193/formatted
          npm exec prettier -- --version > prettier-docs-193/prettier-version.txt
          cp --parents "${files[@]}" prettier-docs-193/formatted
          npm exec prettier -- --write \
            prettier-docs-193/formatted/docs/operations/capacity-release-gate.md \
            prettier-docs-193/formatted/docs/operations/observability.md \
            prettier-docs-193/formatted/docs/rs485/evidence-standard.md
          npm exec prettier -- --check \
            prettier-docs-193/formatted/docs/operations/capacity-release-gate.md \
            prettier-docs-193/formatted/docs/operations/observability.md \
            prettier-docs-193/formatted/docs/rs485/evidence-standard.md
          diff -ruN \
            --label original \
            --label formatted \
            docs/operations/capacity-release-gate.md \
            prettier-docs-193/formatted/docs/operations/capacity-release-gate.md \
            > prettier-docs-193/capacity-release-gate.patch || test $? -eq 1
          diff -ruN \
            --label original \
            --label formatted \
            docs/operations/observability.md \
            prettier-docs-193/formatted/docs/operations/observability.md \
            > prettier-docs-193/observability.patch || test $? -eq 1
          diff -ruN \
            --label original \
            --label formatted \
            docs/rs485/evidence-standard.md \
            prettier-docs-193/formatted/docs/rs485/evidence-standard.md \
            > prettier-docs-193/evidence-standard.patch || test $? -eq 1
          sha256sum \
            prettier-docs-193/formatted/docs/operations/capacity-release-gate.md \
            prettier-docs-193/formatted/docs/operations/observability.md \
            prettier-docs-193/formatted/docs/rs485/evidence-standard.md \
            > prettier-docs-193/formatted.sha256

      - name: Upload formatting evidence
        uses: actions/upload-artifact@v4
        with:
          name: prettier-docs-193
          path: prettier-docs-193
          if-no-files-found: error
          retention-days: 14
