name: Temporary Issue 590 formatter evidence

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format-candidate:
    if: ${{ github.event.pull_request.number == 657 && github.head_ref == 'feat/590-settings-acquisition-cadence' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feat/590-settings-acquisition-cadence
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies deterministically
        env:
          HUSKY: 0
        run: npm ci --no-audit --fund=false

      - name: Stabilize locator and format exact files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("e2e/settings.production.e2e.ts")
          text = path.read_text(encoding="utf-8")
          needle = '      .filter({ hasText: "Family default · 60 с" })\n'
          count = text.count(needle)
          if count > 1:
              raise SystemExit(f"expected at most one stale-value locator filter, found {count}")
          if count == 1:
              path.write_text(text.replace(needle, "", 1), encoding="utf-8")
          PY

          npx prettier --write \
            e2e/settings.production.e2e.ts \
            src/app/api/device-agent/acquisition-cadence/route.test.ts \
            src/app/api/device-agent/acquisition-cadence/route.ts \
            src/components/settings/acquisition-cadence-panel.test.tsx \
            src/components/settings/acquisition-cadence-panel.tsx \
            src/features/acquisition/cadence-client.test.ts \
            src/features/acquisition/cadence-client.ts
          git diff --check

      - name: Commit exact formatted candidate
        shell: bash
        run: |
          set -euo pipefail
          git add \
            e2e/settings.production.e2e.ts \
            src/app/api/device-agent/acquisition-cadence/route.test.ts \
            src/app/api/device-agent/acquisition-cadence/route.ts \
            src/components/settings/acquisition-cadence-panel.test.tsx \
            src/components/settings/acquisition-cadence-panel.tsx \
            src/features/acquisition/cadence-client.test.ts \
            src/features/acquisition/cadence-client.ts
          if git diff --cached --quiet; then
            echo "Exact candidate already matches repository formatter."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(settings): stabilize cadence browser acceptance and format candidate"
          git push origin HEAD:feat/590-settings-acquisition-cadence
