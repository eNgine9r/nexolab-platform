name: Temporary Issue 590 formatter evidence

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  format-evidence:
    if: ${{ github.event.pull_request.number == 657 && github.head_ref == 'feat/590-settings-acquisition-cadence' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies deterministically
        env:
          HUSKY: 0
        run: npm ci --no-audit --fund=false

      - name: Stabilize locator and format exact files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("e2e/settings.production.e2e.ts")
          text = path.read_text(encoding="utf-8")
          old = '''    const xjpFamilyCard = cadence
            .locator("article")
            .filter({ hasText: "Dixell XJP60D" })
            .filter({ hasText: "Family default · 60 с" })
            .first();
          '''
          new = '''    const xjpFamilyCard = cadence
            .locator("article")
            .filter({ hasText: "Dixell XJP60D" })
            .first();
          '''
          if old not in text:
              raise SystemExit("expected stale-value locator block was not found exactly")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

          npx prettier --write \
            e2e/settings.production.e2e.ts \
            src/app/api/device-agent/acquisition-cadence/route.test.ts \
            src/app/api/device-agent/acquisition-cadence/route.ts \
            src/components/settings/acquisition-cadence-panel.test.tsx \
            src/components/settings/acquisition-cadence-panel.tsx \
            src/features/acquisition/cadence-client.test.ts \
            src/features/acquisition/cadence-client.ts
          git diff --check

      - name: Stage exact formatted evidence directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p issue-590-formatted-files
          cp --parents \
            e2e/settings.production.e2e.ts \
            src/app/api/device-agent/acquisition-cadence/route.test.ts \
            src/app/api/device-agent/acquisition-cadence/route.ts \
            src/components/settings/acquisition-cadence-panel.test.tsx \
            src/components/settings/acquisition-cadence-panel.tsx \
            src/features/acquisition/cadence-client.test.ts \
            src/features/acquisition/cadence-client.ts \
            issue-590-formatted-files/
          printf '%s\n' "${{ github.event.pull_request.head.sha }}" > issue-590-formatted-files/source-head.txt

      - name: Upload exact formatted files
        uses: actions/upload-artifact@v7
        with:
          name: issue-590-formatted-files-${{ github.event.pull_request.head.sha }}
          path: issue-590-formatted-files
          if-no-files-found: error
          retention-days: 1
