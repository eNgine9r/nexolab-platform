name: Apply secure device agent patch

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/export-device-agent-source.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Apply exact source patch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("services/device-agent/main.py")
          source = path.read_text(encoding="utf-8")

          source = source.replace(
              '''def mode_uses_le01mp(device_mode: str) -> bool:
              return device_mode in {"le01mp", "modbus"}


          ''',
              '''def mode_uses_le01mp(device_mode: str) -> bool:
              return device_mode in {"le01mp", "modbus"}


          def parse_bool(value: str, *, label: str) -> bool:
              normalized = value.strip().casefold()
              if normalized in {"1", "true", "yes", "on"}:
                  return True
              if normalized in {"0", "false", "no", "off"}:
                  return False
              raise ValueError(f"{label} must be true or false")


          def read_mounted_secret(path: Path, *, label: str) -> str:
              if not path.is_file() or not os.access(path, os.R_OK):
                  raise ValueError(f"{label} file is not readable")
              try:
                  value = path.read_text(encoding="utf-8").rstrip("\\r\\n")
              except (OSError, UnicodeError) as exc:
                  raise ValueError(f"{label} file could not be read") from exc
              if not value:
                  raise ValueError(f"{label} must not be empty")
              if any(
                  character.isspace()
                  or ord(character) < 33
                  or ord(character) == 127
                  for character in value
              ):
                  raise ValueError(
                      f"{label} must not contain whitespace or control characters"
                  )
              return value


          ''',
              1,
          )

          source = source.replace(
              '''    le01mp_unit_ids: tuple[int, ...]

              @classmethod
              def from_env(cls) -> "Settings":
                  settings = cls(
                      node_id=os.getenv("NEXOLAB_NODE_ID", "edge-01"),
                      organization_id=(
                          os.getenv("NEXOLAB_ORGANIZATION_ID", "").strip() or None
                      ),
                      mqtt_host=os.getenv("MQTT_HOST", "mqtt"),
                      mqtt_port=int(os.getenv("MQTT_PORT", "1883")),
                      mqtt_topic=os.getenv("MQTT_TOPIC", "nexolab/telemetry"),
          ''',
              '''    le01mp_unit_ids: tuple[int, ...]
              mqtt_auth_required: bool = False
              mqtt_username: str | None = None
              mqtt_client_id: str = ""
              mqtt_password_file: Path | None = None

              @classmethod
              def from_env(cls) -> "Settings":
                  node_id = os.getenv("NEXOLAB_NODE_ID", "edge-01").strip()
                  organization_id = (
                      os.getenv("NEXOLAB_ORGANIZATION_ID", "").strip() or None
                  )
                  mqtt_auth_required = parse_bool(
                      os.getenv("MQTT_AUTH_REQUIRED", "false"),
                      label="MQTT_AUTH_REQUIRED",
                  )
                  expected_username = (
                      f"node:{organization_id}:{node_id}"
                      if organization_id is not None
                      else None
                  )
                  expected_client_id = (
                      f"nexolab-{organization_id}-{node_id}"
                      if organization_id is not None
                      else node_id
                  )
                  mqtt_username = os.getenv("MQTT_USERNAME", "").strip() or (
                      expected_username if mqtt_auth_required else None
                  )
                  mqtt_client_id = os.getenv("MQTT_CLIENT_ID", "").strip() or (
                      expected_client_id if mqtt_auth_required else node_id
                  )
                  password_file_value = os.getenv("MQTT_PASSWORD_FILE", "").strip()
                  mqtt_password_file = (
                      Path(password_file_value) if password_file_value else None
                  )

                  settings = cls(
                      node_id=node_id,
                      organization_id=organization_id,
                      mqtt_host=os.getenv("MQTT_HOST", "mqtt"),
                      mqtt_port=int(os.getenv("MQTT_PORT", "1883")),
                      mqtt_topic=os.getenv("MQTT_TOPIC", "nexolab/telemetry"),
          ''',
              1,
          )

          source = source.replace(
              '''            le01mp_unit_ids=parse_unit_ids(
                          os.getenv("LE01MP_UNIT_IDS", ""),
                          label="LE-01MP",
                      ),
                  )
                  allowed_modes = {"simulator", "xjp60d", "le01mp", "modbus"}
          ''',
              '''            le01mp_unit_ids=parse_unit_ids(
                          os.getenv("LE01MP_UNIT_IDS", ""),
                          label="LE-01MP",
                      ),
                      mqtt_auth_required=mqtt_auth_required,
                      mqtt_username=mqtt_username,
                      mqtt_client_id=mqtt_client_id,
                      mqtt_password_file=mqtt_password_file,
                  )
                  allowed_modes = {"simulator", "xjp60d", "le01mp", "modbus"}
          ''',
              1,
          )

          source = source.replace(
              '''        if settings.health_interval_seconds <= 0:
                      raise ValueError("NODE_HEALTH_INTERVAL_SECONDS must be positive")
                  return settings

              @property
              def resolved_telemetry_topic(self) -> str:
          ''',
              '''        if settings.health_interval_seconds <= 0:
                      raise ValueError("NODE_HEALTH_INTERVAL_SECONDS must be positive")
                  if not settings.node_id or any(
                      character.isspace() for character in settings.node_id
                  ):
                      raise ValueError(
                          "NEXOLAB_NODE_ID must not be empty or contain whitespace"
                      )
                  if settings.mqtt_auth_required:
                      if settings.organization_id is None:
                          raise ValueError(
                              "NEXOLAB_ORGANIZATION_ID is required when "
                              "MQTT_AUTH_REQUIRED=true"
                          )
                      if settings.mqtt_username != settings.expected_mqtt_username:
                          raise ValueError(
                              "MQTT_USERNAME does not match the provisioned node identity"
                          )
                      if settings.mqtt_client_id != settings.expected_mqtt_client_id:
                          raise ValueError(
                              "MQTT_CLIENT_ID does not match the provisioned node identity"
                          )
                      if settings.mqtt_password_file is None:
                          raise ValueError(
                              "MQTT_PASSWORD_FILE is required when "
                              "MQTT_AUTH_REQUIRED=true"
                          )
                      read_mounted_secret(
                          settings.mqtt_password_file,
                          label="MQTT password",
                      )
                  elif (
                      settings.mqtt_username is not None
                      or settings.mqtt_password_file is not None
                  ):
                      raise ValueError(
                          "MQTT username/password require MQTT_AUTH_REQUIRED=true"
                      )
                  return settings

              @property
              def expected_mqtt_username(self) -> str | None:
                  if self.organization_id is None:
                      return None
                  return f"node:{self.organization_id}:{self.node_id}"

              @property
              def expected_mqtt_client_id(self) -> str:
                  if self.organization_id is None:
                      return self.node_id
                  return f"nexolab-{self.organization_id}-{self.node_id}"

              @property
              def resolved_telemetry_topic(self) -> str:
          ''',
              1,
          )

          source = source.replace(
              '''        self.client = mqtt.Client(
                      mqtt.CallbackAPIVersion.VERSION2,
                      client_id=settings.node_id,
                  )
                  self.client.enable_logger(LOG)
          ''',
              '''        self.client = mqtt.Client(
                      mqtt.CallbackAPIVersion.VERSION2,
                      client_id=settings.mqtt_client_id or settings.node_id,
                  )
                  if settings.mqtt_auth_required:
                      if (
                          settings.mqtt_username is None
                          or settings.mqtt_password_file is None
                      ):
                          raise RuntimeError("Secure MQTT settings were not validated")
                      mqtt_password = read_mounted_secret(
                          settings.mqtt_password_file,
                          label="MQTT password",
                      )
                      self.client.username_pw_set(
                          settings.mqtt_username,
                          mqtt_password,
                      )
                      del mqtt_password
                  self.client.enable_logger(LOG)
          ''',
              1,
          )

          if source == path.read_text(encoding="utf-8"):
              raise SystemExit("device-agent patch did not change source")
          path.write_text(source, encoding="utf-8")
          PY
      - name: Add focused secure MQTT tests
        run: |
          cat > services/device-agent/tests/test_secure_mqtt_auth.py <<'PY'
          from __future__ import annotations

          import json
          import os
          import tempfile
          import unittest
          from pathlib import Path
          from unittest.mock import Mock, patch

          from main import AgentState, DeviceAgent, Settings, read_mounted_secret


          ORGANIZATION_ID = "00000000-0000-0000-0000-000000000001"
          NODE_ID = "edge-01"
          USERNAME = f"node:{ORGANIZATION_ID}:{NODE_ID}"
          CLIENT_ID = f"nexolab-{ORGANIZATION_ID}-{NODE_ID}"
          PASSWORD = "nxl_edge_test_secret"


          class SecureMQTTSettingsTests(unittest.TestCase):
              def setUp(self) -> None:
                  self.temporary_directory = tempfile.TemporaryDirectory()
                  self.addCleanup(self.temporary_directory.cleanup)
                  self.password_file = Path(self.temporary_directory.name) / "password"
                  self.password_file.write_text(PASSWORD, encoding="utf-8")
                  self.password_file.chmod(0o600)

              def secure_environment(self) -> dict[str, str]:
                  return {
                      "NEXOLAB_NODE_ID": NODE_ID,
                      "NEXOLAB_ORGANIZATION_ID": ORGANIZATION_ID,
                      "MQTT_AUTH_REQUIRED": "true",
                      "MQTT_PASSWORD_FILE": str(self.password_file),
                      "DATABASE_PATH": str(
                          Path(self.temporary_directory.name) / "edge.db"
                      ),
                  }

              def test_secure_identity_is_derived_exactly(self) -> None:
                  with patch.dict(os.environ, self.secure_environment(), clear=True):
                      settings = Settings.from_env()

                  self.assertTrue(settings.mqtt_auth_required)
                  self.assertEqual(settings.mqtt_username, USERNAME)
                  self.assertEqual(settings.mqtt_client_id, CLIENT_ID)
                  self.assertEqual(settings.mqtt_password_file, self.password_file)
                  self.assertNotIn(PASSWORD, repr(settings))

              def test_secure_mode_requires_organization(self) -> None:
                  environment = self.secure_environment()
                  environment.pop("NEXOLAB_ORGANIZATION_ID")
                  with patch.dict(os.environ, environment, clear=True):
                      with self.assertRaisesRegex(
                          ValueError,
                          "NEXOLAB_ORGANIZATION_ID",
                      ):
                          Settings.from_env()

              def test_secure_mode_rejects_identity_drift(self) -> None:
                  for field, value, message in (
                      ("MQTT_USERNAME", "node:foreign:edge-01", "MQTT_USERNAME"),
                      ("MQTT_CLIENT_ID", "foreign-client", "MQTT_CLIENT_ID"),
                  ):
                      with self.subTest(field=field):
                          environment = self.secure_environment()
                          environment[field] = value
                          with patch.dict(os.environ, environment, clear=True):
                              with self.assertRaisesRegex(ValueError, message):
                                  Settings.from_env()

              def test_secure_mode_rejects_missing_or_invalid_secret(self) -> None:
                  environment = self.secure_environment()
                  environment["MQTT_PASSWORD_FILE"] = str(
                      Path(self.temporary_directory.name) / "missing"
                  )
                  with patch.dict(os.environ, environment, clear=True):
                      with self.assertRaisesRegex(ValueError, "not readable"):
                          Settings.from_env()

                  for value in ("", "contains whitespace", "bad\tsecret"):
                      with self.subTest(value=value):
                          self.password_file.write_text(value, encoding="utf-8")
                          with patch.dict(
                              os.environ,
                              self.secure_environment(),
                              clear=True,
                          ):
                              with self.assertRaises(ValueError):
                                  Settings.from_env()

              def test_unsecured_mode_preserves_legacy_client_id(self) -> None:
                  environment = {
                      "NEXOLAB_NODE_ID": NODE_ID,
                      "NEXOLAB_ORGANIZATION_ID": ORGANIZATION_ID,
                      "MQTT_AUTH_REQUIRED": "false",
                  }
                  with patch.dict(os.environ, environment, clear=True):
                      settings = Settings.from_env()

                  self.assertFalse(settings.mqtt_auth_required)
                  self.assertIsNone(settings.mqtt_username)
                  self.assertEqual(settings.mqtt_client_id, NODE_ID)

              def test_unsecured_mode_rejects_password_configuration(self) -> None:
                  environment = {
                      "MQTT_AUTH_REQUIRED": "false",
                      "MQTT_PASSWORD_FILE": str(self.password_file),
                  }
                  with patch.dict(os.environ, environment, clear=True):
                      with self.assertRaisesRegex(ValueError, "MQTT_AUTH_REQUIRED"):
                          Settings.from_env()

              def test_trailing_newline_is_not_part_of_secret(self) -> None:
                  self.password_file.write_text(PASSWORD + "\n", encoding="utf-8")
                  self.assertEqual(
                      read_mounted_secret(
                          self.password_file,
                          label="MQTT password",
                      ),
                      PASSWORD,
                  )

              @patch("main.NodeOperationalPublisher")
              @patch("main.mqtt.Client")
              def test_device_agent_configures_paho_without_health_disclosure(
                  self,
                  client_factory: Mock,
                  operational_factory: Mock,
              ) -> None:
                  with patch.dict(os.environ, self.secure_environment(), clear=True):
                      settings = Settings.from_env()

                  client = client_factory.return_value
                  agent = DeviceAgent(settings)

                  self.assertEqual(
                      client_factory.call_args.kwargs["client_id"],
                      CLIENT_ID,
                  )
                  client.username_pw_set.assert_called_once_with(USERNAME, PASSWORD)
                  snapshot = AgentState().snapshot(agent.queue.size(), settings)
                  serialized = json.dumps(snapshot, sort_keys=True)
                  self.assertNotIn(PASSWORD, serialized)
                  self.assertNotIn(USERNAME, serialized)
                  self.assertNotIn(str(self.password_file), serialized)
                  operational_factory.assert_called_once()


          if __name__ == "__main__":
              unittest.main()
          PY
      - name: Validate patched source
        run: |
          python -m pip install -r services/device-agent/requirements.txt
          python -m compileall -q services/device-agent
          PYTHONPATH=services/device-agent \
            python -m unittest discover -s services/device-agent/tests -v
      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/device-agent/main.py \
            services/device-agent/tests/test_secure_mqtt_auth.py
          git commit -m "feat: add secure device agent MQTT bootstrap"
          git push origin "HEAD:${{ github.head_ref }}"
