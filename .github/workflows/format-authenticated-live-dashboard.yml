name: Format authenticated live dashboard

on:
  push:
    branches: [feat/authenticated-live-dashboard]

permissions:
  contents: write

concurrency:
  group: format-authenticated-live-dashboard
  cancel-in-progress: false

jobs:
  format:
    if: "${{ !contains(github.event.head_commit.message, 'style: format authenticated live dashboard') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/authenticated-live-dashboard

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        env:
          HUSKY: 0
        run: npm install --no-audit

      - name: Format branch
        run: npm run format

      - name: Remove temporary formatter
        run: rm .github/workflows/format-authenticated-live-dashboard.yml

      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: format authenticated live dashboard"
          git push origin HEAD:feat/authenticated-live-dashboard
