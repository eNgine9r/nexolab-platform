name: Format Playwright migration once

on:
  push:
    branches:
      - maint/254-playwright-1-62
    paths:
      - .github/workflows/format-playwright-254-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: maint/254-playwright-1-62
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          package-manager-cache: false
          node-version-file: .nvmrc

      - env:
          HUSKY: 0
        run: npm install --no-audit

      - shell: bash
        run: |
          set -euo pipefail
          npx prettier --write \
            package.json \
            package-lock.json \
            docs/maintenance/playwright-1.62-migration.md
          rm .github/workflows/format-playwright-254-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            package.json \
            package-lock.json \
            docs/maintenance/playwright-1.62-migration.md \
            .github/workflows/format-playwright-254-once.yml
          git commit -m "style(playwright): apply repository formatting"
          git push origin HEAD:maint/254-playwright-1-62
