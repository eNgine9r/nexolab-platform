name: Issue 400 state refresh

on:
  push:
    branches:
      - feat/400-live-data-chart-system

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/400-live-data-chart-system
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm install --no-audit
        env:
          HUSKY: 0
      - name: Refresh canonical project state for Issue 400
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          main_sha = "61998415e334cb31555e54ae4013d938e7607b6e"
          software_sha = "fb6cec76397da1dc6baf2b21c668c6b99f282bb0"

          sprint_path = Path('.project/ACTIVE_SPRINT.json')
          sprint = json.loads(sprint_path.read_text())
          sprint['current_main_sha'] = main_sha
          sprint['current_main_sha_semantics'] = 'PR #401 post-#386 state reconciliation; Chart System foundation remains canonical and Issue #400 is the active production consumer'
          override = sprint.setdefault('product_owner_priority_override', {})
          override['active'] = True
          override['decision'] = 'Prioritize the Chart System track; Issue #400 is the sole active implementation lane and Issue #389 remains Ready but not selected.'
          override['selected_issue'] = 400
          for task in sprint.get('tasks', []):
              if task.get('issue') == 400:
                  task['pull_request'] = 402
                  task['status'] = 'in_progress_software_green_hardware_acceptance_pending'
                  task['priority'] = 'high'
                  task['depends_on'] = [386]
          sprint['active_work_package'] = {
              'issue': 400,
              'pull_request': 402,
              'title': 'Migrate Live Data to the canonical NEXOLAB Chart System',
              'status': 'software_green_exact_head_refresh_and_hardware_acceptance_pending',
              'priority': 'high',
              'assignee': 'eNgine9r',
              'selection_reason': 'Direct Product Owner priority keeps the Chart System lane selected; Issue #386 is merged and Issue #400 is the first production consumer.'
          }
          sprint['next_ready_work_package'] = {
              'issue': None,
              'title': 'Saved Live Dashboard canonical Chart System migration',
              'status': 'create_or_refine_after_issue_400_green_merge_and_ready_audit',
              'priority': 'high'
          }
          verification = sprint.setdefault('verification', {})
          verification['issue_400_baseline'] = f'origin/main {main_sha}'
          verification['issue_400_pull_request'] = 402
          verification['issue_400_pre_state_software_sha'] = software_sha
          verification['issue_400_pre_state_software_gates'] = 'format GREEN; lint GREEN; typecheck GREEN; 77 files / 344 tests GREEN; lint-staged compatibility GREEN; Next.js production build GREEN'
          verification['issue_400_pre_state_browser'] = 'Authenticated Dashboard GREEN including deterministic 8-channel Live Data Chart System flow; Acquisition Scale GREEN; Refrigeration Browser GREEN'
          verification['issue_400_route_topology'] = 'preserve Saved Live Dashboards; expose Live Data Explorer as sibling /live workspace; migrate Explorer renderer only'
          verification['issue_400_final_exact_head'] = 'pending after audit/state refresh; Offline Bundle required'
          runtime = sprint.setdefault('runtime_evidence', {})
          runtime['issue_400_external_egress_required'] = False
          runtime['issue_400_modbus_write'] = False
          runtime['issue_400_hardware_write'] = False
          runtime['issue_400_polling_change'] = False
          runtime['issue_400_raspberry_pi_baseline'] = 'main 61998415 deployed PASS; API/dashboard/Device Agent healthy; real telemetry advancing; physical_requests_total baseline sample 818'
          runtime['issue_400_physical_acquisition_invariant'] = 'pending frozen-candidate Raspberry Pi acceptance'
          sprint['next_selection_policy'] = 'Finish exact-head software/offline gates for PR #402, freeze the candidate, run controlled Raspberry Pi Live Data request-rate acceptance, then merge only while GREEN. After merge, audit/create the Saved Live Dashboard Chart System migration without changing #369 -> #366 -> #289 or #389.'
          sprint_path.write_text(json.dumps(sprint, ensure_ascii=False, indent=2) + '\n')

          current_path = Path('.project/CURRENT_STATE.md')
          current = current_path.read_text()
          current = current.replace(
              'Canonical repository baseline on `main`: `3b34ec321c2453778b20b6bf8e4cc232970e5e1e` — Issue #386 / PR #399 canonical Chart System foundation merge.',
              f'Canonical repository baseline on `main`: `{main_sha}` — PR #401 post-#386 state reconciliation; Chart System foundation remains canonical.'
          )
          current = current.replace(
              'Issue #400 is the next `status:ready` Chart Work Package: migrate Live Data to the canonical Chart System. Keep #389 Ready but not selected, and preserve #369 -> #366 -> #289 without product-scope changes. Raspberry Pi chart performance is verified; controlled physical Device Agent/Modbus request-rate acceptance remains for the production Live Data migration.',
              'Issue #400 / PR #402 is the sole active implementation lane. Software gates are GREEN on the pre-state implementation head and the deterministic authenticated browser acceptance proves the 8-channel canonical Live Data workspace. Run final exact-head CI/Offline Bundle after this state refresh, then freeze the candidate for controlled Raspberry Pi acquisition-invariant acceptance. Keep #389 Ready but not selected and preserve #369 -> #366 -> #289 without product-scope changes.'
          )
          marker = '## Active Work Package — Issue #400'
          if marker not in current:
              current += '\n' + '\n'.join([
                  marker,
                  '',
                  'Issue #400 / draft PR #402 migrates the Live Data Explorer to the canonical Chart System while preserving Saved Live Dashboards as a sibling `/live` workspace.',
                  '',
                  'Implemented and software-verified before this state refresh:',
                  '',
                  '- canonical ECharts renderer path replaces the Explorer route-local SVG chart;',
                  '- compatible-unit synchronized plot groups, shared cursor/x-domain, show/hide/solo and canonical time ranges;',
                  '- Live Follow, Pause View, Return to Live, zoom/pan/reset remain display-only;',
                  '- canonical evidence-preserving min/max reduction replaces last-point-per-bucket behavior;',
                  '- explicit source gaps and alarm transition evidence remain truthful;',
                  '- deterministic authenticated browser fixture selects 8 persisted channels (6 `degC`, 2 `V`) and verifies no public requests or acquisition mutation requests;',
                  '- sibling `Live Data -> Saved Dashboards -> Live Data` lifecycle retains at most one concurrent telemetry WebSocket;',
                  '- 360 / 1440 / 1920 browser widths have no page-level horizontal overflow;',
                  '- pre-state implementation head `fb6cec76397da1dc6baf2b21c668c6b99f282bb0`: format/lint/typecheck/build GREEN, 77 files / 344 tests GREEN, Authenticated Dashboard GREEN, Acquisition Scale GREEN, Refrigeration Browser GREEN.',
                  '',
                  'No REST/WebSocket schema, database, retention, polling, scheduler, registry, Device Agent, Modbus or hardware behavior changes are in scope.',
                  '',
                  'Physical acceptance remains pending on the controlled Raspberry Pi. Existing pre-candidate baseline on `main=61998415...` is healthy with real RS-485 telemetry advancing; a frozen exact candidate must prove chart interaction does not change physical request cadence.',
                  '',
              ])
          current_path.write_text(current)

          blockers_path = Path('.project/BLOCKERS.md')
          blockers = blockers_path.read_text()
          blockers = blockers.replace(
              'Issue #389 (administrator-only local NEXOLAB Version Management) remains `status:ready`, but is `ready_not_selected` while #386 is the sole active implementation task.',
              'Issue #389 (administrator-only local NEXOLAB Version Management) remains `status:ready`, but is `ready_not_selected` while #400 is the sole active implementation task.'
          )
          blockers = blockers.replace(
              '- Issue #400 is the selected next Ready Chart Work Package; no implementation Work Package is active during post-merge reconciliation.',
              '- Issue #400 / PR #402 is the selected active Chart Work Package; no parallel implementation lane is allowed.'
          )
          marker = '## Issue #400 — software GREEN, physical acceptance pending'
          if marker not in blockers:
              blockers += '\n' + '\n'.join([
                  marker,
                  '',
                  'There is no known software implementation blocker on the pre-state implementation head. Format, lint, typecheck, 77 files / 344 tests, production build, Authenticated Dashboard, Acquisition Scale and Refrigeration Browser gates are GREEN.',
                  '',
                  'The remaining hard acceptance dependency is physical evidence from the controlled Raspberry Pi after a final exact-head software/offline candidate is frozen:',
                  '',
                  '- equal-duration Device Agent request-rate baseline and chart-active observations;',
                  '- eight selected channels and active chart interactions;',
                  '- no scheduler/polling/registry change;',
                  '- no Modbus or hardware write;',
                  '- continued telemetry advancement and acceptable browser behavior.',
                  '',
                  'Do not claim production Live Data Raspberry Pi acquisition-invariant acceptance until that evidence is returned.',
                  '',
              ])
          blockers_path.write_text(blockers)

          checkpoint = {
              'schema_version': 1,
              'project': 'NEXOLAB',
              'profile': 'LOCAL_LAN',
              'sprint': 'ENGINEERING-HARDENING-1',
              'task': 'ISSUE-400-LIVE-DATA-CANONICAL-CHART-SYSTEM',
              'status': 'software_green_final_exact_head_and_hardware_acceptance_pending',
              'timestamp': '2026-08-11T17:36:00+03:00',
              'branch': 'feat/400-live-data-chart-system',
              'product_main_sha': main_sha,
              'pull_request': 402,
              'pre_state_software_sha': software_sha,
              'software_evidence': {
                  'quality_gates': 'format GREEN; lint GREEN; typecheck GREEN; 77 files / 344 tests GREEN; lint-staged compatibility GREEN; production build GREEN',
                  'authenticated_browser': 'GREEN including 8-channel Live Data Chart System and canonical acquisition-invariant flow',
                  'acquisition_scale': 'GREEN',
                  'refrigeration_browser': 'GREEN',
                  'final_exact_head_ci': 'pending after audit/state refresh',
                  'offline_bundle': 'required on final exact head'
              },
              'runtime_evidence': {
                  'public_runtime_requests_in_browser_fixture': 0,
                  'acquisition_mutation_requests_in_browser_fixture': 0,
                  'concurrent_live_workspace_websockets_max': 1,
                  'responsive_widths_verified': [360, 1440, 1920],
                  'modbus_write': 'none',
                  'hardware_write': 'none',
                  'polling_change': 'none'
              },
              'raspberry_pi_baseline': {
                  'deployed_main_sha': main_sha,
                  'deployment': 'PASS in lan mode',
                  'api': 'ready',
                  'dashboard': 'active',
                  'telemetry_service': 'healthy',
                  'device_agent': 'healthy',
                  'mqtt_connected': True,
                  'telemetry_advancing': True,
                  'poll_eligible_targets': 38,
                  'sampled_physical_requests_total': 818,
                  'sampled_success': 657,
                  'sampled_timeout': 161,
                  'sampled_retry_attempts_total': 161,
                  'candidate_physical_acceptance': 'pending'
              },
              'next_action': 'Obtain final exact-head CI including Offline Bundle, freeze the candidate, then run controlled Raspberry Pi 8-channel Live Data acquisition-invariant acceptance before merge.'
          }
          Path('.project/LAST_CHECKPOINT.json').write_text(json.dumps(checkpoint, ensure_ascii=False, indent=2) + '\n')
          PY
          npx prettier --write .project/ACTIVE_SPRINT.json .project/CURRENT_STATE.md .project/BLOCKERS.md .project/LAST_CHECKPOINT.json
          node -e "for (const p of ['.project/ACTIVE_SPRINT.json','.project/LAST_CHECKPOINT.json']) JSON.parse(require('fs').readFileSync(p,'utf8')); console.log('project JSON valid')"
      - name: Commit state refresh
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .project/ACTIVE_SPRINT.json .project/CURRENT_STATE.md .project/BLOCKERS.md .project/LAST_CHECKPOINT.json
          git diff --cached --quiet && exit 0
          git commit -m "chore(state): record Issue 400 software checkpoint"
          git push origin HEAD:feat/400-live-data-chart-system
