name: Issue 357 Browser Readiness Fix

on:
  push:
    branches:
      - fix/357-structural-snapshot-acceptance
    paths:
      - .github/workflows/issue-357-browser-readiness-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/357-structural-snapshot-acceptance
          fetch-depth: 0
      - name: Apply focused readiness patch
        run: python3 scripts/issue-357-fix-browser-readiness.py
      - name: Commit focused test hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/refrigeration-layout.production.e2e.ts scripts/issue-357-fix-browser-readiness.py .github/workflows/issue-357-browser-readiness-fix.yml
          git commit -m "test(refrigeration): assert route readiness without network idle"
          git push origin HEAD:fix/357-structural-snapshot-acceptance
