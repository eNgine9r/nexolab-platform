name: Issue 400 websocket acceptance fix

on:
  push:
    branches:
      - feat/400-live-data-chart-system

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/400-live-data-chart-system
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm install --no-audit
        env:
          HUSKY: 0
      - name: Replace full reload with sibling workspace lifecycle acceptance
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('e2e/live-chart-system.production.e2e.ts')
          text = path.read_text()
          start_marker = '    const explorerUrl = page.url();\n'
          end_marker = '    expect(runtime.publicRequests).toEqual([]);\n'
          start = text.find(start_marker)
          if start < 0:
              raise SystemExit('navigation start marker not found')
          end = text.find(end_marker, start)
          if end < 0:
              raise SystemExit('navigation end marker not found')
          end += len(end_marker)
          replacement = ''.join([
              '    await page.getByRole("button", { name: "Saved Dashboards", exact: true }).click();\n',
              '    await expect(page.getByRole("button", { name: "Saved Dashboards", exact: true })).toHaveAttribute(\n',
              '      "aria-current",\n',
              '      "page",\n',
              '    );\n',
              '    await page.getByRole("button", { name: "Live Data", exact: true }).click();\n',
              '    await expect(page.getByRole("heading", { name: "Live дані", exact: true })).toBeVisible();\n',
              '    await expect(page.getByRole("button", { name: "Live Data", exact: true })).toHaveAttribute(\n',
              '      "aria-current",\n',
              '      "page",\n',
              '    );\n',
              '    await expect.poll(() => runtime.sockets.active).toBeLessThanOrEqual(1);\n',
              '    expect(runtime.sockets.maximum).toBeLessThanOrEqual(1);\n',
              '    expect(runtime.acquisitionMutations).toEqual([]);\n',
              '    expect(runtime.publicRequests).toEqual([]);\n',
          ])
          path.write_text(text[:start] + replacement + text[end:])
          PY
          npx prettier --write e2e/live-chart-system.production.e2e.ts
      - name: Commit focused acceptance fix
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/live-chart-system.production.e2e.ts
          git diff --cached --quiet && exit 0
          git commit -m "test(live): verify concurrent workspace websocket lifecycle"
          git push origin HEAD:feat/400-live-data-chart-system
