name: Issue 189 Bundle Fixture Fix

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/issue-189-bundle-fixture-fix.yml"
      - "scripts/issue-189-overlay-fix.py"

permissions:
  contents: write

concurrency:
  group: issue-189-overlay-migration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/189-recovery-acceptance
          fetch-depth: 0

      - name: Apply isolated overlay migration
        run: python scripts/issue-189-overlay-fix.py

      - name: Validate base and overlay contracts
        run: |
          bash -n scripts/run-disaster-recovery-acceptance.sh
          bash -n scripts/verify-restored-platform.sh
          DR_POSTGRES_PASSWORD=validation \
          DR_MINIO_ROOT_USER=validation \
          DR_MINIO_ROOT_PASSWORD=validation \
          DR_MQTT_ADMIN_USERNAME=validation \
          DR_SECRETS_DIR=/tmp/nexolab-dr-secrets \
          DR_RESTORE_LOCAL_AUTH_DIR=/tmp/nexolab-dr-restore-local-auth \
          DR_WORK_DIR=/tmp/nexolab-dr-work \
            docker compose \
              -f infrastructure/compose/compose.disaster-recovery.yaml \
              -f infrastructure/compose/compose.disaster-recovery-local-auth.yaml \
              config --quiet
          DR_POSTGRES_PASSWORD=validation \
          DR_MINIO_ROOT_USER=validation \
          DR_MINIO_ROOT_PASSWORD=validation \
          DR_MQTT_ADMIN_USERNAME=validation \
          DR_SECRETS_DIR=/tmp/nexolab-dr-secrets \
          DR_WORK_DIR=/tmp/nexolab-dr-work \
            docker compose \
              -f infrastructure/compose/compose.disaster-recovery.yaml \
              config --quiet
          ! grep -q 'DR_RESTORE_LOCAL_AUTH_DIR' infrastructure/compose/compose.disaster-recovery.yaml
          ! grep -q '<"$TOKEN_FILE" <<' scripts/verify-restored-platform.sh

      - name: Commit isolated runtime correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            infrastructure/compose/compose.disaster-recovery.yaml \
            infrastructure/compose/compose.disaster-recovery-local-auth.yaml \
            scripts/run-disaster-recovery-acceptance.sh \
            scripts/verify-restored-platform.sh
          git commit -m "fix(recovery): isolate local auth restore overlay"
          git push origin HEAD:feat/189-recovery-acceptance
