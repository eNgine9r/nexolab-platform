name: Format Disaster Recovery

on:
  push:
    branches:
      - feat/m7-disaster-recovery-gate
    paths:
      - ".github/workflows/format-disaster-recovery.yml"
      - ".github/workflows/disaster-recovery-acceptance.yml"
      - "infrastructure/compose/compose.disaster-recovery.yaml"
      - "security/disaster-recovery-assets.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: format-disaster-recovery
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/m7-disaster-recovery-gate
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format disaster recovery files
        run: |
          npx prettier --write \
            .github/workflows/disaster-recovery-acceptance.yml \
            infrastructure/compose/compose.disaster-recovery.yaml \
            security/disaster-recovery-assets.json

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/disaster-recovery-acceptance.yml \
            infrastructure/compose/compose.disaster-recovery.yaml \
            security/disaster-recovery-assets.json
          git commit -m "style: format disaster recovery files"
          git push origin HEAD:feat/m7-disaster-recovery-gate
