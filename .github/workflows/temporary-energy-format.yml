name: Temporary Energy Formatter

on:
  push:
    branches:
      - feat/261-energy-monitoring-page
    paths:
      - .github/workflows/temporary-energy-format.yml
      - .project/ACTIVE_SPRINT.json
      - .project/LAST_CHECKPOINT.json
      - src/components/energy/energy-screen.tsx
      - src/components/energy/energy-workspace.tsx
      - src/features/energy/energy-telemetry.test.ts
      - src/features/energy/energy-telemetry.ts
      - src/hooks/use-energy-telemetry.ts

permissions:
  contents: write

concurrency:
  group: temporary-energy-format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feat/261-energy-monitoring-page
          persist-credentials: true

      - name: Setup exact Node baseline
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install repository dependencies
        env:
          HUSKY: 0
        run: npm install --no-audit --no-fund

      - name: Format exact files
        run: |
          npx prettier --write \
            .project/ACTIVE_SPRINT.json \
            .project/LAST_CHECKPOINT.json \
            src/components/energy/energy-screen.tsx \
            src/components/energy/energy-workspace.tsx \
            src/features/energy/energy-telemetry.test.ts \
            src/features/energy/energy-telemetry.ts \
            src/hooks/use-energy-telemetry.ts

      - name: Validate focused movement
        shell: bash
        run: |
          set -euo pipefail
          unexpected="$(git diff --name-only | grep -Ev '^(.project/(ACTIVE_SPRINT.json|LAST_CHECKPOINT.json)|src/components/energy/energy-(screen|workspace).tsx|src/features/energy/energy-telemetry(.test)?.ts|src/hooks/use-energy-telemetry.ts)$' || true)"
          if [[ -n "$unexpected" ]]; then
            printf 'Unexpected formatted files:\n%s\n' "$unexpected" >&2
            exit 1
          fi
          test -n "$(git diff --name-only)"
          npm run format:check

      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .project/ACTIVE_SPRINT.json \
            .project/LAST_CHECKPOINT.json \
            src/components/energy/energy-screen.tsx \
            src/components/energy/energy-workspace.tsx \
            src/features/energy/energy-telemetry.test.ts \
            src/features/energy/energy-telemetry.ts \
            src/hooks/use-energy-telemetry.ts
          git commit -m 'style(energy): apply repository formatting [skip ci]'
          git push origin HEAD:feat/261-energy-monitoring-page
