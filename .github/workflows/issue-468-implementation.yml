name: Issue 468 SQLite lock recovery implementation

on:
  push:
    branches:
      - fix/468-device-agent-sqlite-lock-recovery
    paths:
      - .github/workflows/issue-468-implementation.yml

permissions:
  contents: write

jobs:
  implement-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/468-device-agent-sqlite-lock-recovery
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Apply focused Issue 468 implementation
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/issue-468-patch.py
          rm .github/issue-468-patch.py .github/workflows/issue-468-implementation.yml
          git diff --check
          python3 -m compileall -q services/device-agent

      - name: Install Device Agent dependencies
        shell: bash
        run: python -m pip install -r services/device-agent/requirements.txt

      - name: Run focused Issue 468 regression tests
        shell: bash
        env:
          PYTHONPATH: services/device-agent
        run: |
          set -euo pipefail
          python -m unittest discover -s services/device-agent/tests -p 'test_sqlite_queue_recovery.py' -v
          python -m unittest discover -s services/device-agent/tests -p 'test_runtime_supervision.py' -v
          python -m unittest discover -s services/device-agent/tests -p 'test_adaptive_main.py' -v
          python -m unittest discover -s services/device-agent/tests -p 'test_mqtt_backlog_order.py' -v

      - name: Run full Device Agent suite
        shell: bash
        env:
          PYTHONPATH: services/device-agent
        run: python -m unittest discover -s services/device-agent/tests -p 'test_*.py' -v

      - name: Publish focused implementation and self-delete helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "nexolab-automation"
          git config user.email "actions@users.noreply.github.com"
          git add services/device-agent/main.py \
            services/device-agent/adaptive_main.py \
            services/device-agent/tests/test_adaptive_main.py \
            services/device-agent/tests/test_sqlite_queue_recovery.py \
            services/device-agent/tests/test_runtime_supervision.py \
            .github/issue-468-patch.py \
            .github/workflows/issue-468-implementation.yml
          git diff --cached --check
          git commit -m "fix: recover Device Agent from SQLite queue contention (#468)"
          git push origin HEAD:fix/468-device-agent-sqlite-lock-recovery
