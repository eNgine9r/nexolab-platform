name: Patch DR Archive Ownership

on:
  push:
    branches:
      - feat/m7-disaster-recovery-gate
    paths:
      - ".github/workflows/patch-dr-archive-ownership.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m7-disaster-recovery-gate
          fetch-depth: 0

      - name: Return archive ownership to host runner
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/run-disaster-recovery-acceptance.sh")
          content = path.read_text(encoding="utf-8")
          old = '''compose run --rm volume-helper \\
            "python /opt/nexolab/scripts/nexolab-volume-archive.py create --source /source-mqtt --output /work/payload/mqtt/mosquitto-data.tar"'''
          new = '''compose run --rm volume-helper \\
            "python /opt/nexolab/scripts/nexolab-volume-archive.py create --source /source-mqtt --output /work/payload/mqtt/mosquitto-data.tar && chown $(id -u):$(id -g) /work/payload/mqtt/mosquitto-data.tar && chmod 0600 /work/payload/mqtt/mosquitto-data.tar"'''
          if content.count(old) != 1:
              raise SystemExit("Expected MQTT archive command was not found exactly once")
          path.write_text(content.replace(old, new), encoding="utf-8")
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/run-disaster-recovery-acceptance.sh
          git commit -m "fix: return MQTT archive ownership to runner"
          git push origin HEAD:feat/m7-disaster-recovery-gate
