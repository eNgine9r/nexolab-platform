name: Issue 357 Effect Fix

on:
  push:
    branches:
      - fix/357-structural-snapshot-acceptance
    paths:
      - .github/workflows/issue-357-effect-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/357-structural-snapshot-acceptance
          fetch-depth: 0
      - name: Patch reconciliation closure
        shell: bash
        run: |
          python3 -c "from pathlib import Path; p=Path('src/components/refrigeration/refrigeration-detail-screen.tsx'); s=p.read_text(); s=s.replace('          equipment: equipmentRecord,\n          bindings: loadedBindings,', '          equipment: null,\n          bindings: loadedBindings,'); s=s.replace('        setEquipmentRecord(loaded.equipment);\n        setBindings(loaded.bindings);', '        if (loaded.equipment) setEquipmentRecord(loaded.equipment);\n        setBindings(loaded.bindings);'); p.write_text(s)"
          rm .github/workflows/issue-357-effect-fix.yml
      - name: Commit focused patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/refrigeration/refrigeration-detail-screen.tsx .github/workflows/issue-357-effect-fix.yml
          git commit -m "fix(refrigeration): stabilize snapshot reconciliation effect"
          git push origin HEAD:fix/357-structural-snapshot-acceptance
