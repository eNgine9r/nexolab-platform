name: Temporary Energy Node Scope

on:
  push:
    branches:
      - feat/261-energy-monitoring-page
    paths:
      - .github/workflows/temporary-energy-node-scope.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feat/261-energy-monitoring-page
          persist-credentials: true

      - name: Setup exact Node baseline
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install repository dependencies
        env:
          HUSKY: 0
        run: npm install --no-audit --no-fund

      - name: Apply production node scope
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          hook = Path("src/hooks/use-energy-telemetry.ts")
          text = hook.read_text()
          replacements = [
              (
                  'const DEFAULT_SCOPE = "__default_organization__";\n',
                  'const DEFAULT_SCOPE = "__default_organization__";\nconst ENERGY_NODE_ID =\n  process.env.NEXT_PUBLIC_NEXOLAB_ENERGY_NODE_ID?.trim() || "edge-01";\n',
              ),
              (
                  'const scopeKey = enabled ? (selectedOrganizationId ?? DEFAULT_SCOPE) : null;',
                  'const scopeKey = enabled\n    ? `${selectedOrganizationId ?? DEFAULT_SCOPE}:${ENERGY_NODE_ID}`\n    : null;',
              ),
              (
                  'const accepted = samples.filter(isEnergySample);',
                  'const accepted = samples.filter(\n        (sample) => sample.node_id === ENERGY_NODE_ID && isEnergySample(sample),\n      );',
              ),
              (
                  'subscription = adapter.subscribe(\n        {},',
                  'subscription = adapter.subscribe(\n        { node_id: ENERGY_NODE_ID },',
              ),
              (
                  '.latest({ limit: 1000 }, controller.signal)',
                  '.latest({ node_id: ENERGY_NODE_ID, limit: 1000 }, controller.signal)',
              ),
              (
                  '      {\n        metric: selectedMetric,\n        from,\n        to,\n      },',
                  '      {\n        nodeId: ENERGY_NODE_ID,\n        metric: selectedMetric,\n        from,\n        to,\n      },',
              ),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f"Expected one hook replacement, found {text.count(old)} for {old!r}")
              text = text.replace(old, new)
          hook.write_text(text)

          e2e = Path("e2e/energy.production.e2e.ts")
          e2e_text = e2e.read_text()
          if e2e_text.count('node_id: "edge-live-01"') != 1:
              raise SystemExit("Expected one energy E2E node identity")
          e2e.write_text(e2e_text.replace('node_id: "edge-live-01"', 'node_id: "edge-01"'))
          PY

      - name: Format and validate exact files
        run: |
          npx prettier --write \
            src/hooks/use-energy-telemetry.ts \
            src/features/energy/energy-history.ts \
            src/features/energy/energy-history.test.ts \
            e2e/energy.production.e2e.ts
          npm run format:check

      - name: Validate focused movement
        shell: bash
        run: |
          set -euo pipefail
          unexpected="$(git diff --name-only | grep -Ev '^(src/hooks/use-energy-telemetry.ts|src/features/energy/energy-history(.test)?.ts|e2e/energy.production.e2e.ts)$' || true)"
          if [[ -n "$unexpected" ]]; then
            printf 'Unexpected node-scope files:\n%s\n' "$unexpected" >&2
            exit 1
          fi
          test -n "$(git diff --name-only)"

      - name: Commit production node scope
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/hooks/use-energy-telemetry.ts \
            src/features/energy/energy-history.ts \
            src/features/energy/energy-history.test.ts \
            e2e/energy.production.e2e.ts
          git commit -m 'fix(energy): scope W1-W4 to production node [skip ci]'
          git push origin HEAD:feat/261-energy-monitoring-page
