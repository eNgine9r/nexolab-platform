name: Issue 400 browser test formatter

on:
  push:
    branches:
      - feat/400-live-data-chart-system

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/400-live-data-chart-system
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm install --no-audit
        env:
          HUSKY: 0
      - run: npx prettier --write e2e/live-chart-system.production.e2e.ts playwright.dashboard.config.ts
      - name: Commit focused formatting
        run: |
          set -euo pipefail
          if git diff --quiet -- e2e/live-chart-system.production.e2e.ts playwright.dashboard.config.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/live-chart-system.production.e2e.ts playwright.dashboard.config.ts
          git commit -m "style(live): format chart browser acceptance"
          git push origin HEAD:feat/400-live-data-chart-system
