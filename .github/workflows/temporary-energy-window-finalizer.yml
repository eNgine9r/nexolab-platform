name: Temporary Energy Window Finalizer

on:
  push:
    branches:
      - feat/261-energy-monitoring-page
    paths:
      - .github/workflows/temporary-energy-window-finalizer.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feat/261-energy-monitoring-page
          persist-credentials: true

      - name: Setup exact Node baseline
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install repository dependencies
        env:
          HUSKY: 0
        run: npm install --no-audit --no-fund

      - name: Scale chart against requested history window
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/components/energy/energy-workspace.tsx")
          text = path.read_text()

          replacements = [
              (
                  """  selectedUnitIds: readonly number[],\n): HistorySeries[] {""",
                  """  selectedUnitIds: readonly number[],\n  window: EnergyTelemetryModel[\"historyWindow\"],\n): HistorySeries[] {""",
              ),
              (
                  """  const timestamps = accepted.map((item) => Date.parse(item.sample.captured_at));\n  const values = accepted.map((item) => item.sample.value);\n  const from = Math.min(...timestamps);\n  const to = Math.max(...timestamps);\n  const minimum = Math.min(...values);""",
                  """  const timestamps = accepted.map((item) => Date.parse(item.sample.captured_at));\n  const values = accepted.map((item) => item.sample.value);\n  const requestedFrom = window ? Date.parse(window.from) : Number.NaN;\n  const requestedTo = window ? Date.parse(window.to) : Number.NaN;\n  const from = Number.isFinite(requestedFrom) ? requestedFrom : Math.min(...timestamps);\n  const to = Number.isFinite(requestedTo) ? requestedTo : Math.max(...timestamps);\n  const minimum = Math.min(...values);""",
              ),
              (
                  """    () => buildHistorySeries(telemetry.historySamples, telemetry.selectedMetric, selectedUnitIds),\n    [selectedUnitIds, telemetry.historySamples, telemetry.selectedMetric],""",
                  """    () =>\n      buildHistorySeries(\n        telemetry.historySamples,\n        telemetry.selectedMetric,\n        selectedUnitIds,\n        telemetry.historyWindow,\n      ),\n    [selectedUnitIds, telemetry.historySamples, telemetry.historyWindow, telemetry.selectedMetric],""",
              ),
          ]

          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f"Expected one exact workspace replacement, found {text.count(old)}")
              text = text.replace(old, new)

          path.write_text(text)
          PY

      - name: Format exact final files
        run: |
          npx prettier --write \
            src/components/energy/energy-workspace.tsx \
            src/features/energy/energy-telemetry.ts \
            src/features/energy/energy-telemetry.test.ts \
            src/hooks/use-energy-telemetry.ts
          npm run format:check

      - name: Validate focused movement
        shell: bash
        run: |
          set -euo pipefail
          unexpected="$(git diff --name-only | grep -Ev '^(src/components/energy/energy-workspace.tsx|src/features/energy/energy-telemetry(.test)?.ts|src/hooks/use-energy-telemetry.ts)$' || true)"
          if [[ -n "$unexpected" ]]; then
            printf 'Unexpected window-finalizer files:\n%s\n' "$unexpected" >&2
            exit 1
          fi
          test -n "$(git diff --name-only)"

      - name: Commit rolling-window fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/components/energy/energy-workspace.tsx \
            src/features/energy/energy-telemetry.ts \
            src/features/energy/energy-telemetry.test.ts \
            src/hooks/use-energy-telemetry.ts
          git commit -m 'fix(energy): keep rolling history accurate [skip ci]'
          git push origin HEAD:feat/261-energy-monitoring-page
