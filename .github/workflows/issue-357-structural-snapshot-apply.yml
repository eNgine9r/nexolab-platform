name: Issue 357 Structural Snapshot Apply

on:
  push:
    branches:
      - fix/357-structural-snapshot-acceptance
    paths:
      - .github/workflows/issue-357-structural-snapshot-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/357-structural-snapshot-acceptance
          fetch-depth: 0
      - name: Wire structural snapshot router
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('services/telemetry-service/app/main.py')
          text = path.read_text()
          import_anchor = 'from app.refrigeration.storage import S3ObjectStorage, UnavailableObjectStorage\n'
          import_line = 'from app.refrigeration.structural_api import create_refrigeration_structural_router\n'
          if import_line not in text:
              text = text.replace(import_anchor, import_anchor + import_line)

          include_anchor = '''    app.include_router(\n        create_refrigeration_router(\n'''
          include_block = '''    app.include_router(\n        create_refrigeration_structural_router(\n            refrigeration_equipment_repository,\n            equipment_lifecycle_repository,\n            refrigeration_repository,\n            object_storage,\n            signed_url_seconds=resolved.equipment_image_signed_url_seconds,\n            security_dependencies=security_dependencies,\n            default_organization_id=resolved.auth_default_organization_id,\n        )\n    )\n'''
          if include_block not in text:
              text = text.replace(include_anchor, include_block + include_anchor)
          path.write_text(text)

          Path('.github/workflows/issue-357-structural-snapshot-apply.yml').unlink()
          PY
      - name: Commit focused wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/telemetry-service/app/main.py .github/workflows/issue-357-structural-snapshot-apply.yml
          git commit -m "feat(refrigeration): wire structural snapshot router"
          git push origin HEAD:fix/357-structural-snapshot-acceptance
