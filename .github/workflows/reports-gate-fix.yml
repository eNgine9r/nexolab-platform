name: Reports Gate Fix

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/reports-gate-fix.yml"

permissions:
  contents: write

concurrency:
  group: reports-gate-fix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fix:
    name: Repair reports acceptance runtime
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        env:
          HUSKY: 0
        run: npm install --no-audit

      - name: Configure shared live WebSocket endpoint
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/run-reports-browser-acceptance.sh")
          content = path.read_text()
          marker = 'export NEXT_PUBLIC_NEXOLAB_API_BASE_URL="$API_BASE_URL"\n'
          addition = (
              marker
              + 'export NEXT_PUBLIC_NEXOLAB_WEBSOCKET_URL="ws://127.0.0.1:${API_PORT}/api/v1/telemetry/live"\n'
          )
          if addition not in content:
              if content.count(marker) != 1:
                  raise SystemExit("expected one reports API runtime marker")
              content = content.replace(marker, addition)
          path.write_text(content)
          PY

      - name: Apply repository formatting
        run: npm run format

      - name: Commit verified gate fix
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git diff --name-only
          git config user.name "nexolab-ci"
          git config user.email "nexolab-ci@users.noreply.github.com"
          git add --update
          git commit -m "fix(reports): configure production acceptance runtime"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
