name: Reports Parent Flush Patch

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/reports-parent-flush-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    name: Enforce report parent insert order
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Patch repository flush order
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("services/telemetry-service/app/reports/repository.py")
          content = path.read_text()
          old = """                session.add(report)\n                session.add_all(artifacts)\n                session.flush()\n"""
          new = """                session.add(report)\n                session.flush()\n                session.add_all(artifacts)\n                session.flush()\n"""
          if content.count(old) != 1:
              raise SystemExit("expected report/artifact flush block was not found exactly once")
          path.write_text(content.replace(old, new))
          PY

      - name: Commit patch
        run: |
          git config user.name "nexolab-ci"
          git config user.email "nexolab-ci@users.noreply.github.com"
          git add services/telemetry-service/app/reports/repository.py
          git commit -m "fix(reports): flush parent before immutable artifacts"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
