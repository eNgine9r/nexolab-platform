name: Temporary Equipment Layouts Source Formatter

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/apply-equipment-layouts-format-temp.yml"

permissions:
  contents: write

jobs:
  apply:
    name: Format focused catalog source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
      HUSKY: "0"
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          package-manager-cache: false
          node-version-file: .nvmrc

      - name: Format and commit focused source
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit
          npx prettier --write src/components/equipment-layouts/equipment-layouts-catalog.tsx
          rm .github/workflows/apply-equipment-layouts-format-temp.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/equipment-layouts/equipment-layouts-catalog.tsx \
            .github/workflows/apply-equipment-layouts-format-temp.yml
          git commit -m "style(layouts): format clear-filter fix"
          git push origin "HEAD:${HEAD_BRANCH}"
