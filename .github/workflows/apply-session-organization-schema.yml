name: Apply organization-scoped session schema

on:
  push:
    branches: [feat/organization-scoped-test-sessions]

permissions:
  contents: write

concurrency:
  group: apply-session-organization-schema
  cancel-in-progress: false

jobs:
  apply:
    if: "${{ !contains(github.event.head_commit.message, 'feat: scope sessions to organizations') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/organization-scoped-test-sessions

      - name: Apply schema changes
        run: python .github/scripts/apply-session-organization-schema.py

      - name: Remove temporary automation
        run: |
          rm .github/scripts/apply-session-organization-schema.py
          rm .github/workflows/apply-session-organization-schema.yml

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: scope sessions to organizations"
          git push origin HEAD:feat/organization-scoped-test-sessions
