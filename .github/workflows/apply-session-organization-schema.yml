name: Apply session organization schema

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/scripts/apply-session-organization-schema.py"
      - ".github/workflows/apply-session-organization-schema.yml"

permissions:
  contents: write

concurrency:
  group: apply-session-organization-schema-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Apply implementation
        run: python .github/scripts/apply-session-organization-schema.py

      - name: Remove temporary automation
        run: |
          rm .github/scripts/apply-session-organization-schema.py
          rm .github/workflows/apply-session-organization-schema.yml

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add session organization ownership schema"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
