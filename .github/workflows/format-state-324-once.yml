name: Format state 324 once

on:
  push:
    paths:
      - ".github/workflows/format-state-324-once.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout state branch
        uses: actions/checkout@v6
        with:
          ref: docs/324-acquisition-software-checkpoint
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          package-manager-cache: false
          node-version-file: .nvmrc

      - name: Install dependencies
        env:
          HUSKY: 0
        run: npm install --no-audit

      - name: Apply exact state formatting
        run: |
          npx prettier --write \
            .project/ACTIVE_SPRINT.json \
            .project/CURRENT_STATE.md

      - name: Remove temporary workflow and publish one commit
        run: |
          rm .github/workflows/format-state-324-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .project/ACTIVE_SPRINT.json \
            .project/CURRENT_STATE.md \
            .github/workflows/format-state-324-once.yml
          git commit -m "style(project): format acquisition checkpoint"
          git push origin HEAD:docs/324-acquisition-software-checkpoint
